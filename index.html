r);gap:10px;text-align:center;margin-top:20px}.day{padding:10px 4px;border:1px solid var(--line);border-radius:9px;font-size:12px}.day.today{border-color:var(--green);background:#eff5ec}.day strong{display:block;font-size:17px;margin:3px 0}.dots{font-size:15px;letter-spacing:3px;color:#c6cfc6}.dots .filled{color:var(--green)}.bar{height:6px;border-radius:5px;background:#e9eee7;overflow:hidden;margin-top:12px}.bar i{height:100%;background:#65a187;display:block}.subject{padding:15px 0;border-bottom:1px solid var(--line)}.subject:last-child{border-bottom:0}.empty{padding:30px 15px;text-align:center;color:var(--muted);font-size:13px;background:#f9faf6;border-radius:8px}.note{padding:13px 17px;background:#edf1e7;border-radius:8px;font-size:12px;color:#647564;margin-top:18px}.warning{background:#fff3e2;color:#8e602e}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}th{font-weight:500;color:var(--muted);background:#f6f8f3;white-space:nowrap}td,th{padding:13px 12px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}tr:hover td{background:#fafbf7}td select{min-width:90px;padding:5px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input{flex:1;min-width:160px}input,select,textarea{border:1px solid #d9e1d7;background:#fff;border-radius:7px;padding:9px 11px;color:var(--ink);max-width:100%}textarea{width:100%;min-height:110px;resize:vertical;line-height:1.7}label{font-size:13px;display:block;color:#53685b}label input,label select{width:100%;margin-top:5px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.form-grid.two{grid-template-columns:repeat(2,1fr)}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px;overflow:auto}.tabs button{white-space:nowrap}.tabs .active{background:var(--mint);border-color:#a7c4b1;color:var(--green)}.session-list{display:grid;gap:12px}.session-row{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px 21px;display:flex;gap:16px;align-items:center}.session-row .count{width:54px;color:var(--green);font-size:13px;background:var(--mint);padding:7px;border-radius:9px;text-align:center}.session-row>div:nth-child(2){flex:1}.session-row h3{margin:0 0 3px}.question{padding:20px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background:#fff}.question textarea{min-height:65px}.question .form-grid{margin-top:12px}.question .answer{font-size:13px;color:var(--muted);margin:8px 0}.question .row{align-items:flex-start}details{margin:12px 0}summary{cursor:pointer;color:var(--green);font-size:13px}.plain{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.8;max-height:500px;overflow:auto}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#183e32;color:#fff;padding:12px 23px;border-radius:9px;z-index:100;display:none;box-shadow:0 4px 20px #0002}.phase{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}.phase .bubble{width:33px;height:33px;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center;flex-shrink:0}.phase h3{margin-bottom:3px}.phase p{font-size:13px;color:var(--muted)}.summary-output{min-height:430px;background:#fafbf7;font-family:inherit}.right-tools{display:flex;gap:8px;align-items:center}.mobile-brand{display:none}dialog{border:0;border-radius:14px;width:540px;max-width:90vw;padding:27px;box-shadow:0 20px 100px #0003}dialog::backdrop{background:#102c2977}.danger-zone{margin-top:20px}button:disabled{opacity:.45;cursor:wait}footer{margin-top:25px;color:var(--muted);font-size:11px}.loading{padding:100px 20px;text-align:center}.accent{color:var(--green)}

.privacy-banner{background:#fff3e2;color:#825b30;padding:10px 18px;font-size:12px;border-radius:8px;margin:16px 0} </style></head><body>
<aside><div class="logo"><div class="mark">ϟ</div><div><b>전기기능사<br>합격하자</b></div></div><div class="eyebrow" style="margin:0 12px 10px">MY STUDY SPACE</div><nav class="nav" id="nav"></nav><div class="side-bottom"><div class="card" style="background:#f5f7ed;padding:13px"><b class="accent">2027년 1월을 향해</b><br>하루 두 번, 차근차근 쌓는 실력<br><span style="font-size:11px">시험일 미확정 · 개인 목표 일정</span></div><div class="avatar"><i>학</i><div><b style="color:var(--ink)">학습자</b><br>나만의 전기 학습실</div></div></div></aside>
<main><header><span>개인 학습실 <span style="padding:0 10px;color:#b4beb5">/</span> <span id="breadcrumb">오늘의 학습</span></span><div class="right-tools"><span id="clock"></span><span class="save-status" id="save-status">연결 중</span></div></header><div class="privacy-banner">브라우저 저장 버전 · 기기 간 자동 동기화 없음 · 이전 기록 불러오기: 학습 계획 → 백업 복원</div><div id="app"><div class="loading">학습 기록을 불러오는 중입니다…</div></div><footer>다산에듀 2026 속전속결 · 개인 학습 기록 | 자동 요약은 일반 텍스트로 생성됩니다.</footer></main><div id="toast" role="status"></div>
<dialog id="new-dialog"><form id="new-form"><h2>새 학습 회차</h2><div class="form-grid two"><label>학습 일차<input name="day" type="number" min="1" value="8" required></label><label>회차<select name="round"><option>1</option><option>2</option></select></label></div><label class="section-space">학습할 교재 단원<select name="unit" id="new-unit"></select></label><label class="section-space">주제<input name="title" placeholder="선택한 단원의 이름으로 기록합니다"></label><div class="row section-space"><button type="button" onclick="document.querySelector('dialog').close()">취소</button><button class="primary">회차 만들기</button></div></form></dialog>
<script>
let state,revision=0,page='home',current='s7-2',tab='concept',saving=false,dirty=false,pending=false;let subjectFilter='전체',searchText='';const $=s=>document.querySelector(s);const app=$('#app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());const uid=()=>crypto.randomUUID();
const navs=[['home','◉','오늘의 학습'],['curriculum','▤','교재 진도'],['sessions','▣','학습 기록'],['reviews','↻','오답 · 복습'],['summary','≡','노션용 요약'],['plan','▦','학습 계획']];
const unit=id=>state.units.find(u=>u.id===id);const session=()=>state.sessions.find(s=>s.id===current);const tag=(text,cls='')=>`<span class="tag ${cls}">${esc(text)}</span>`;const countLabel=(a,b)=>b?`${(a/b*100).toFixed(1)}%`:'미확인';
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.to);window.to=setTimeout(()=>$('#toast').style.display='none',3500)}
function setStatus(t,bad=false){$('#save-status').textContent=t;$('#save-status').style.color=bad?'var(--red)':'var(--green)'}
async function persist(){try{localStorage.setItem('electric-study-v1',JSON.stringify(state));dirty=false;setStatus('● 이 브라우저에 저장됨')}catch(e){dirty=true;setStatus('저장 실패 · JSON 백업 필요',true);toast('브라우저 저장 공간을 확인하세요.')}}
window.addEventListener('beforeunload',e=>{if(dirty||saving){e.preventDefault();e.returnValue=''}});
function go(p){page=p;searchText='';render();window.scrollTo(0,0)}
function openSession(id){current=id;tab='concept';page='editor';render();window.scrollTo(0,0)}
function head(k,title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}
function render(){if(!state)return;const side=document.querySelector('.side-bottom .card');if(side)side.innerHTML='<b class="accent">'+esc(goalLabel())+'</b><br>'+esc(routineLabel())+'<br><span style="font-size:11px">공식 시험일 '+esc(state.settings.examDate||'미확정')+'</span>';$('#nav').innerHTML=navs.map(([p,i,t])=>`<button class="${page===p||page==='editor'&&p==='sessions'?'active':''}" onclick="go('${p}')"><span>${i}</span>${t}</button>`).join('');$('#breadcrumb').textContent=page==='editor'?'회차 기록':navs.find(n=>n[0]===page)?.[2];({home:home,curriculum:curriculum,sessions:sessions,reviews:reviews,summary:summary,plan:plan,editor:editor})[page]();}
function metrics(){let c=0,t=0,sc=0,st=0,graded=0;for(const s of state.sessions){if(s.counts?.kind==='최초'){c+=s.counts.correct;t+=s.counts.total}if(s.supplement){sc+=s.supplement.correct;st+=s.supplement.total}for(const q of s.questions){if(q.result==='미채점')continue;graded++;if(q.kind==='보충'){st++;if(q.result==='정답')sc++}else{t++;if(q.result==='정답')c++}}}return{c,t,sc,st,graded}}
function allReviews(){const list=state.reviews.map(r=>({...r,type:'manual'}));for(const s of state.sessions)for(const q of s.questions)if(q.result==='오답')list.push({id:q.id,title:q.text,topic:q.topic||'미분류',priority:'높음',done:q.reviewDone,note:q.cause||'오답 원인 미기록',sid:s.id,type:'question',due:''});return list}
function next(){return [...state.sessions].filter(s=>s.status!=='완료'&&!s.isMock).sort((a,b)=>a.day-b.day||a.round-b.round)[0]}
function home(){const m=metrics(),n=next(),r=allReviews().filter(x=>!x.done),completed=state.sessions.filter(s=>s.status==='완료').length;const sunday=new Date(today()+'T12:00:00Z').getUTCDay()===0;
app.innerHTML=head('A LITTLE EVERY DAY','오늘도, 한 걸음 더.','교재의 순서와 나의 기록을 연결해 합격에 가까워집니다.',`<button class="primary" onclick="${sunday?'makeMock()':n?`openSession('${n.id}')`:'newSession()'}">${sunday?'일요일 미니시험':n?'이어서 학습하기 ↗':'새 회차 기록'}</button>`)+
`<div class="grid cols"><section class="card hero"><div class="row"><span class="eyebrow">${sunday?'SUNDAY REVIEW':'NEXT SESSION'}</span>${tag(n?`${n.day}일차 · ${n.round}회차`:'다음 범위 설정')}</div><h2>${sunday?'이번 주 배운 내용을 내 것으로.':esc(n?.title||'다음 학습을 준비하세요')}</h2><p class="muted">${n?esc(n.unitIds.map(id=>{let u=unit(id);return u?`${u.subject} · ${u.chapter} · ${u.section}`:'미확인'}).join(', ')):'교재 진도에서 다음 단원을 선택해주세요.'}</p><div class="hero-bottom"><div class="tags">${tag(n?rangeLabel(unit(n.unitIds[0])):'범위 미확인')}${tag('50~70분')}${tag('개념 → 예제 → 문제')}</div><button class="primary" onclick="${n?`openSession('${n.id}')`:'newSession()'}">학습실 열기 →</button></div></section><section class="card"><div class="eyebrow">STUDY GOAL</div><h2 style="margin-top:12px">매일 두 번의 작은 성취</h2><p class="muted">${esc(routineLabel())}<br>${esc(goalLabel())} 목표</p><div class="row section-space"><span class="muted">공식 시험일</span>${tag(state.settings.examDate||'미확정','warn')}</div><div class="note">7일차 2회차 템플릿 제공<br>이전 개인 기록은 학습 계획 → 백업 복원</div></section></div>
<div class="grid stats"><div class="card stat"><p class="muted">누적 최초 정답률</p><div class="number">${countLabel(m.c,m.t)}</div><p class="muted">확인된 ${m.c} / ${m.t}문항</p></div><div class="card stat"><p class="muted">보충 정답률</p><div class="number">${countLabel(m.sc,m.st)}</div><p class="muted">확인된 ${m.sc} / ${m.st}문항</p></div><div class="card stat"><p class="muted">기록된 완료 회차</p><div class="number">${completed}<small>회</small></div><p class="muted">누락 회차는 추정하지 않음</p></div><div class="card stat"><p class="muted">남은 복습</p><div class="number">${r.length}<small>항목</small></div><p class="muted">오늘 한 가지씩 확인하세요</p></div></div>
<div class="grid cols"><section class="card"><div class="row"><h2>우선 복습할 내용</h2><button class="small" onclick="go('reviews')">모두 보기 →</button></div>${reviewRows(r.slice(0,3))}<p class="muted" style="font-size:11px">우선순위: 기한 경과 → 높음 → 보통 → 낮음</p></section><section class="card"><h2>과목별 교재 진도</h2>${['전기이론','전기기기','전기설비'].map(sub=>{const us=state.units.filter(u=>u.subject===sub),done=us.filter(u=>u.concept==='완료').length;return `<div class="subject"><div class="row"><b>${sub}</b><span class="muted">개념 완료 ${done} / ${us.length}절</span></div><div class="bar"><i style="width:${done/us.length*100}%"></i></div></div>`}).join('')}<p class="muted" style="font-size:11px">회차 완료와 교재 절 전체 완료는 별도로 관리합니다.</p></section></div><section class="card section-space"><div class="row"><h2>이번 주의 학습 리듬</h2><span class="muted">하루 2회 · 일요일 복습</span></div>${weekView()}</section><div class="note">집계 기준: 복원한 백업의 확인된 최초 성적과 이 앱에서 채점한 문항. 보충 정답률은 별도 집계합니다. 미채점은 제외합니다.</div>`;}
function rangeLabel(u){return u?`인쇄 p.${u.start}${u.end?'~'+u.end:'부터 · 끝 미확인'}`:'페이지 미확인'}
function weekView(){const d=new Date(today()+'T12:00:00Z'),wd=d.getUTCDay(),mon=new Date(d);mon.setUTCDate(d.getUTCDate()-((wd+6)%7));return `<div class="week">${['월','화','수','목','금','토','일'].map((label,i)=>{const a=new Date(mon);a.setUTCDate(mon.getUTCDate()+i);const key=a.toISOString().slice(0,10),ss=state.sessions.filter(s=>s.date===key&&s.status==='완료'),n=ss.length;return `<div class="day ${key===today()?'today':''}">${label}<strong>${a.getUTCDate()}</strong>${i===6?'<span class="muted" style="font-size:10px">종합복습</span>':`<span class="dots"><span class="${n>0?'filled':''}">●</span><span class="${n>1?'filled':''}">●</span></span>`}</div>`}).join('')}</div>`}
function reviewRows(rs){const rank={높음:0,보통:1,낮음:2};rs.sort((a,b)=>(a.due&&a.due<today()?-1:0)-(b.due&&b.due<today()?-1:0)||(rank[a.priority]??1)-(rank[b.priority]??1));return rs.length?rs.map(r=>`<div class="review-item"><input aria-label="${esc(r.title)} 복습 완료" class="check" type="checkbox" ${r.done?'checked':''} onchange="reviewToggle('${r.id}',this.checked)"><div><div class="row">${tag(r.priority,r.priority==='높음'?'warn':'gray')}${r.due?`<span class="muted">${esc(r.due)}</span>`:''}</div><b>${esc(r.title)}</b><p>${esc(r.note)}</p>${r.source?`<a href="${esc(r.source)}" target="_blank" rel="noopener" style="font-size:11px">노션 근거 ↗</a>`:''}${r.sid?`<button class="small" onclick="openSession('${r.sid}')">해당 회차</button>`:''}</div></div>`).join(''):'<div class="empty">미완료 복습이 없습니다.</div>'}
function reviewToggle(id,val){const r=state.reviews.find(x=>x.id===id);if(r)r.done=val;else for(const s of state.sessions){const q=s.questions.find(x=>x.id===id);if(q)q.reviewDone=val}persist();render()}
function curriculum(){app.innerHTML=head('TEXTBOOK MAP','교재 진도','다산에듀 2026 속전속결 · 인쇄 페이지와 PDF 페이지를 구분합니다.')+`<div class="toolbar"><select onchange="subjectFilter=this.value;curriculum()">${['전체','전기이론','전기기기','전기설비'].map(x=>`<option ${x===subjectFilter?'selected':''}>${x}</option>`).join('')}</select><input placeholder="단원 검색" aria-label="단원 검색" value="${esc(searchText)}" oninput="searchText=this.value;unitTable()"></div><div class="card"><div id="unit-table"></div></div><div class="note">목차에서 확인한 시작 쪽만 표시합니다. 끝 쪽과 전수 풀이 여부는 근거가 없으면 ‘미확인’입니다. 교류회로 2·3절의 일부 글자는 PDF 텍스트 추출에서 확인되지 않아 ‘미확인’으로 보존했습니다.<br>교재1: 전기이론 / 교재2: 전기기기·전기설비. 출처 확인일 ${state.sourceChecked}.</div>`;unitTable();}
function unitTable(){const us=state.units.filter(u=>(subjectFilter==='전체'||u.subject===subjectFilter)&&[u.title,u.chapter].join(' ').includes(searchText));$('#unit-table').innerHTML=`<div class="table-wrap"><table><thead><tr><th>과목 / 장</th><th>절 · 단원</th><th>인쇄 페이지</th><th>개념 진도</th><th>필수문제</th><th>연결 기록</th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.subject)}<br><span class="muted">${esc(u.chapter)}</span></td><td>${esc(u.section)} ${esc(u.title)}<details><summary>대조 근거</summary><p class="muted">${esc(u.source)}</p><p class="muted">책 ${u.book} · 끝 페이지 ${u.end??'미확인'}<br>상태는 노션 대조 또는 사용자 직접 갱신</p></details></td><td>개념 ${u.start}쪽${u.end?'~'+u.end+'쪽':''}<br><span class="muted">문제 ${u.problem?u.problem+'쪽부터':'미확인'}</span></td><td><select aria-label="${esc(u.title)} 개념 진도" onchange="setUnit('${u.id}','concept',this.value)">${['미학습','부분학습','완료','미확인'].map(x=>`<option ${u.concept===x?'selected':''}>${x}</option>`).join('')}</select></td><td><select aria-label="${esc(u.title)} 필수문제 진도" onchange="setUnit('${u.id}','practice',this.value)">${['미확인','미완료','진행 중','완료'].map(x=>`<option ${u.practice===x?'selected':''}>${x}</option>`).join('')}</select></td><td>${state.sessions.filter(s=>s.unitIds.includes(u.id)).map(s=>`<button class="small" style="display:block;margin:4px 0" onclick="openSession('${s.id}')">${s.day}일차 ${s.round}회</button>`).join('')||'<span class="muted">없음</span>'}</td></tr>`).join('')}</tbody></table></div>`}
function setUnit(id,key,val){unit(id)[key]=val;persist();toast('교재 진도를 저장했습니다.')}
function sessions(){app.innerHTML=head('STUDY JOURNAL','학습 기록','개념부터 보충까지, 회차별로 쌓이는 나의 학습.',`<button class="primary" onclick="newSession()">+ 새 회차</button>`)+`<div class="session-list">${[...state.sessions].sort((a,b)=>b.day-a.day||b.round-a.round).map(s=>`<div class="session-row"><div class="count">${s.day}일차<br>${s.round}회차</div><div><h3>${esc(s.title)}</h3><span class="muted">${s.date||'날짜 미기록'} · ${s.questions.length}개 문항 ${s.counts?`· 노션 최초 ${s.counts.correct}/${s.counts.total}`:''}</span></div>${tag(s.status,s.status==='예정'?'gray':'')}<button onclick="openSession('${s.id}')">열기 →</button></div>`).join('')}</div>`}
function newSession(){const d=$('#new-dialog');$('#new-unit').innerHTML=state.units.map(u=>`<option value="${u.id}">${esc(u.subject+' / '+u.title)}</option>`).join('');$('#new-form').day.value=Math.max(7,...state.sessions.map(s=>s.day));const n=next();if(n)$('#new-form').day.value=n.day+1;d.showModal()}
$('#new-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),day=Number(f.get('day')),round=Number(f.get('round'));if(state.sessions.some(s=>s.day===day&&s.round===round&&!s.isMock)){toast('같은 일차·회차 기록이 있습니다. 기존 기록을 열어주세요.');return}const u=unit(f.get('unit'));const s={id:uid(),day,round,date:'',title:String(f.get('title')).trim()||u.title,unitIds:[u.id],status:'예정',concept:'',examples:'',notes:'',questions:[]};state.sessions.push(s);persist();$('#new-dialog').close();e.target.reset();openSession(s.id)};
function sf(key,val){const s=session();s[key]=val;persist()}
function editor(){const s=session();if(!s){go('sessions');return}const tabs=[['concept','개념 · 예제'],['questions','문제 · 채점'],['notes','회차 메모'],['source','노션 원문']];app.innerHTML=head('SESSION WORKSPACE',`${s.day}일차 · ${s.round}회차`,`교재 범위: ${s.unitIds.map(id=>{const u=unit(id);return u?u.title+' / '+rangeLabel(u):'미확인'}).map(esc).join(', ')}`,`<button onclick="go('sessions')">← 기록 목록</button>`)+`<div class="card">${s.historyImportVersion?`<div class="note">노션 기록 가져옴 · 최초 ${s.counts?s.counts.correct+'/'+s.counts.total:'미확인'} · 보충 ${s.supplement?s.supplement.correct+'/'+s.supplement.total:'미확인'}${s.finalCheck?' · 최종 확인 '+s.finalCheck.correct+'/'+s.finalCheck.total:''}<br>문항별 기존 답안·해설은 노션 원문 탭에 보존했습니다.</div>`:''}<div class="form-grid"><label>주제<input value="${esc(s.title)}" onchange="sf('title',this.value)"></label><label>학습일<input type="date" value="${esc(s.date)}" onchange="sf('date',this.value)"></label><label>회차 상태<select onchange="changeStatus(this.value)">${['예정','진행 중','완료'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="note">회차 완료만으로 교재의 개념·필수문제 진도를 완료 처리하지 않습니다. ‘교재 진도’에서 실제 완료 범위를 확인해주세요.</div></div><div class="tabs section-space">${tabs.map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';editor()">${t}</button>`).join('')}</div><div id="editor-body"></div>`;
const body=$('#editor-body');if(tab==='concept')body.innerHTML=`<section class="card"><h2>개념 학습</h2><textarea style="min-height:240px" aria-label="개념 학습" onchange="sf('concept',this.value)">${esc(s.concept)}</textarea><h2 class="section-space">계산 예제 · 풀이 과정</h2><textarea style="min-height:170px" aria-label="계산 예제" onchange="sf('examples',this.value)">${esc(s.examples)}</textarea><p class="muted">공식은 I = V/R, W = I²Rt처럼 일반 텍스트로 기록합니다.</p><div class="row section-space"><span class="muted">입력 후 항목을 벗어나면 자동 저장</span><button class="primary" onclick="tab='questions';editor()">연습문제 풀기 →</button></div></section>`;
if(tab==='questions')body.innerHTML=`<div class="row wrap" style="margin-bottom:15px"><p class="muted">제출 답안과 기준 답안이 있는 문항만 자동 채점합니다.</p><div class="right-tools"><button onclick="addQuestion()">+ 문항 추가</button><button class="primary" onclick="grade()">답안 제출 · 채점</button></div></div><div class="note warning" style="margin-bottom:18px">자동 채점은 공백·대소문자·일부 표기만 정규화한 일치 비교입니다. 단위·동의어·서술형의 의미 판정은 문항별 결과를 직접 수정하세요. 빈 답안은 미채점으로 유지됩니다.</div>${s.counts?`<div class="card" style="margin-bottom:18px">가져온 노션 최초 성적: ${s.counts.correct}/${s.counts.total} (${countLabel(s.counts.correct,s.counts.total)}) · 중복 집계 방지를 위해 기존 문항을 다시 입력하지 마세요.</div>`:''}${s.questions.length?s.questions.map((q,i)=>questionHtml(q,i)).join(''):'<div class="empty">문항을 추가해 연습문제와 답안을 기록하세요.</div>'}`;
if(tab==='notes')body.innerHTML=`<div class="card"><h2>학습 메모 · 다음 범위</h2>${s.preservedLocal?`<details><summary>가져오기 전 기존 기록 보기 (보존됨)</summary><pre class="plain">${esc(JSON.stringify(s.preservedLocal,null,2))}</pre></details>`:''}<textarea aria-label="회차 메모" onchange="sf('notes',this.value)">${esc(s.notes)}</textarea><div class="row section-space"><button onclick="current='${s.id}';go('summary')">노션용 요약 만들기</button><button onclick="addReview('${s.id}')">+ 복습 항목 등록</button></div></div>`;
if(tab==='source')body.innerHTML=s.source?`<div class="card"><div class="row"><h2>최초 가져온 노션 기록</h2><a href="${esc(s.source)}" target="_blank" rel="noopener">원문 열기 ↗</a></div><p class="muted">${state.sourceChecked} 기준 스냅샷 · 실시간 동기화가 아닙니다.</p><pre class="plain">${esc(s.sourceText)}</pre></div>`:'<div class="empty">이 앱에서 새로 만든 회차입니다. 노션용 요약을 복사해 기록할 수 있습니다.</div>';
}
function changeStatus(v){const s=session();if(v==='완료'&&s.questions.some(q=>q.result==='미채점')){toast('미채점 문항이 남아 있습니다. 채점 후 완료해주세요.');editor();return}s.status=v;if(v!=='예정'&&!s.date)s.date=today();persist();editor()}
function questionHtml(q,i){return `<div class="question"><div class="row"><div>${tag(q.kind)} ${tag(q.result,q.result==='오답'?'red':q.result==='미채점'?'gray':'')}</div><button class="small danger" onclick="removeQuestion('${q.id}')">삭제</button></div><label class="section-space">${i+1}. 문제<textarea onchange="qf('${q.id}','text',this.value)">${esc(q.text)}</textarea></label><div class="form-grid"><label>개념 태그 (반복 오답 집계)<input value="${esc(q.topic)}" onchange="qf('${q.id}','topic',this.value)"></label><label>문항 유형<select onchange="qf('${q.id}','kind',this.value)">${['연습','보충','복습','미니시험'].map(x=>`<option ${q.kind===x?'selected':''}>${x}</option>`).join('')}</select></label><label>채점 결과 (수정 가능)<select onchange="qf('${q.id}','result',this.value);editor()">${['미채점','정답','오답'].map(x=>`<option ${q.result===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label class="section-space">제출 답안<input style="width:100%" value="${esc(q.submitted)}" onchange="qf('${q.id}','submitted',this.value)" placeholder="답안을 입력하세요"></label><details><summary>기준 답안 · 해설 보기 / 편집</summary><label>기준 답안<input value="${esc(q.answer)}" onchange="qf('${q.id}','answer',this.value)"></label><label>해설<textarea onchange="qf('${q.id}','explanation',this.value)">${esc(q.explanation)}</textarea></label></details><label>오답 원인 · 개선 방법<textarea onchange="qf('${q.id}','cause',this.value)" placeholder="공식 기억 / 단위 변환 / 개념 혼동 / 계산 실수 등">${esc(q.cause)}</textarea></label>${q.result==='오답'?`<label><input type="checkbox" style="width:auto" ${q.reviewDone?'checked':''} onchange="qf('${q.id}','reviewDone',this.checked)"> 보충·복습 완료</label><button class="small" onclick="addSupplement('${q.id}')">이 개념 보충문제 추가</button>`:''}</div>`}
function qf(id,k,v){const q=session().questions.find(q=>q.id===id);q[k]=v;if(k==='submitted'||k==='answer'){q.result='미채점';q.reviewDone=false}persist()}
function normalize(v){return String(v).toLowerCase().replace(/제벡/g,'제베크').replace(/효과/g,'').replace(/[\s,]/g,'').replace(/[₀₁₂₃₄₅₆₇₈₉]/g,c=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(c));}
function grade(){const s=session();let n=0;for(const q of s.questions){if(!q.submitted.trim()||!q.answer.trim()){q.result='미채점';continue}q.result=normalize(q.submitted)===normalize(q.answer)?'정답':'오답';n++}if(n&&s.status==='예정'){s.status='진행 중';s.date=s.date||today()}persist();editor();toast(`${n}문항 채점 완료. 결과와 오답 원인을 확인하세요.`)}
function blankQuestion(kind='연습',topic=''){return{id:uid(),text:'',topic,kind,answer:'',submitted:'',result:'미채점',cause:'',explanation:'',reviewDone:false}}
function addQuestion(){session().questions.push(blankQuestion());persist();editor()}
function addSupplement(id){let q=session().questions.find(q=>q.id===id);session().questions.push(blankQuestion('보충',q.topic));persist();editor();toast('같은 개념의 보충 문항을 추가했습니다.')}
function removeQuestion(id){if(!confirm('이 문항과 채점 기록을 삭제할까요?'))return;session().questions=session().questions.filter(q=>q.id!==id);persist();editor()}
function reviews(){const rs=allReviews(),freq={};for(const s of state.sessions)for(const q of s.questions)if(q.result==='오답'){const k=q.topic||'미분류';freq[k]=(freq[k]||0)+1}app.innerHTML=head('REVIEW & RETENTION','틀린 이유를, 다음 정답으로.','반복 오답은 같은 개념 태그에서 오답이 2회 이상 발생한 경우입니다.',`<button class="primary" onclick="addReview()">+ 복습 등록</button>`)+`<div class="grid cols"><section class="card"><h2>미완료 복습 <span class="muted">${rs.filter(r=>!r.done).length}항목</span></h2>${reviewRows(rs.filter(r=>!r.done))}</section><section class="card"><h2>반복 오답 개념</h2>${Object.entries(freq).filter(([k,n])=>n>=2).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="subject row"><b>${esc(k)}</b>${tag(n+'회 오답','warn')}</div>`).join('')||'<div class="empty">새 기록에서 확인된 반복 오답이 없습니다.</div>'}<div class="note">이전 노션 원문에만 있는 오답은 자동으로 문항화하지 않았습니다. 아래 근거를 확인해 복습으로 등록할 수 있습니다.</div></section></div><section class="card section-space"><h2>완료한 복습</h2>${reviewRows(rs.filter(r=>r.done))}</section><section class="card section-space"><h2>이전 기록 복원</h2><p class="muted">공개 코드에는 개인 학습 이력이 없습니다. 학습 계획 화면에서 개인 JSON 백업을 복원하세요. 복원 데이터는 이 브라우저에만 저장됩니다.</p></section>`}
function addReview(sid){const title=prompt('복습할 내용을 입력하세요.');if(!title?.trim())return;const priority=prompt('우선순위: 높음 / 보통 / 낮음','높음');const due=prompt('복습 예정일 (YYYY-MM-DD, 비우면 미지정)','')||'';if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due)){toast('날짜 형식을 확인해주세요.');return}state.reviews.push({id:uid(),title:title.trim(),topic:'직접 등록',priority:['높음','보통','낮음'].includes(priority)?priority:'보통',done:false,due,note:sid?`${session().day}일차 ${session().round}회차에서 등록`:''});persist();render()}
function makeSummary(s){const us=s.unitIds.map(unit).filter(Boolean);const qs=s.questions,c=qs.filter(q=>q.result==='정답').length,t=qs.filter(q=>q.result!=='미채점').length;return [`전기기능사 필기 ${s.day}일차 ${s.round}회차`, `학습일: ${s.date||'미기록'}`,`주제: ${s.title}`,`상태: ${s.status}`,`목표: ${goalLabel()} (공식 시험일 ${state.settings.examDate||'미확정'})`,'','교재 및 진도',...us.map(u=>`${u.subject} / ${u.chapter} / ${u.section} ${u.title}\n개념: ${rangeLabel(u)} / 필수문제: ${u.problem?u.problem+'쪽부터':'미확인'}\n교재 진도: 개념 ${u.concept}, 필수문제 ${u.practice}`),'','개념 학습',s.concept||'미기록','','계산 예제',s.examples||'미기록','','채점 결과',s.counts?`노션 확인 성적 (${s.counts.kind}): ${s.counts.correct}/${s.counts.total}`:'',`이 앱에 기록한 채점: ${c}/${t} (${countLabel(c,t)}) · 미채점 ${qs.length-t}개`,'',...qs.map((q,i)=>`${i+1}. [${q.kind}] ${q.text}\n개념: ${q.topic||'미분류'}\n제출: ${q.submitted||'미제출'} / 기준 답안: ${q.answer||'미확인'} / 결과: ${q.result}\n해설: ${q.explanation||'미기록'}\n오답 원인: ${q.cause||'미기록'}\n복습: ${q.reviewDone?'완료':'미완료 또는 해당 없음'}`),'','미완료 복습',...allReviews().filter(r=>!r.done).map(r=>`[${r.priority}] ${r.title}${r.due?' / '+r.due:''}`),'','메모 및 다음 학습',s.notes||'미기록','',s.source?`원문: ${s.source}`:'','확인되지 않은 범위는 미확인으로 유지합니다.'].filter(x=>x!==null).join('\n')}

function goalLabel(){return state.settings.targetLabel||'2027년 1월 필기 합격'}

function mergeHistory(existing,incoming){
 const out=structuredClone(existing),key=s=>s.isMock?'mock:'+s.id:`${s.day}:${s.round}`;
 let added=0,updated=0;
 for(const incomingSession of incoming.sessions){
  const i=out.sessions.findIndex(s=>key(s)===key(incomingSession));
  if(i<0){out.sessions.push(structuredClone(incomingSession));added++;continue}
  const prior=out.sessions[i];
  if(incomingSession.historyImportVersion&&prior.historyImportVersion===incomingSession.historyImportVersion)continue;
  const record=structuredClone(incomingSession);
  const meaningful=(prior.questions||[]).filter(q=>String(q.submitted||'').trim()||q.result!=='미채점'||String(q.cause||'').trim());
  const incomingIds=new Set(record.questions.map(q=>q.id));
  for(const q of meaningful)if(!incomingIds.has(q.id))record.questions.push(structuredClone(q));
  const template=!prior.source&&!prior.date&&prior.status==='예정'&&meaningful.length===0;
  if(!template){record.preservedLocal=structuredClone(prior);record.notes+='\n\n가져오기 전 기록은 아래 보존 기록에서 확인할 수 있습니다. 기존 제출 답안은 문항 목록에 유지했습니다.';}
  record.id=prior.id;out.sessions[i]=record;updated++;
 }
 for(const u of incoming.units){const i=out.units.findIndex(v=>v.id===u.id);if(i<0)out.units.push(structuredClone(u));else{const prev=out.units[i];out.units[i]={...u,concept:prev.concept==='완료'?'완료':u.concept,practice:prev.practice==='완료'?'완료':u.practice};}}
 for(const r of incoming.reviews){const prev=out.reviews.find(x=>x.id===r.id);if(!prev)out.reviews.push(structuredClone(r));}
 out.settings={...out.settings,...incoming.settings,examDate:out.settings.examDate||incoming.settings.examDate||''};
 out.sourceChecked=incoming.sourceChecked;out.notionRoot=incoming.notionRoot||out.notionRoot;out.historyImport=incoming.historyImport||out.historyImport;
 return {state:out,added,updated};
}
async function restore(file){if(!file)return;try{const s=JSON.parse(await file.text());if(s.schema!==1||!Array.isArray(s.units)||!Array.isArray(s.sessions)||!Array.isArray(s.reviews)||!s.settings||s.sessions.some(x=>!x.id||!Array.isArray(x.questions)||!Array.isArray(x.unitIds))||s.units.some(u=>!u.id||!u.subject))throw Error('호환되는 학습 백업이 아닙니다.');const result=mergeHistory(state,s);if(!confirm(`학습 기록 ${result.added}회차 추가, ${result.updated}회차 갱신 예정입니다. 기존 제출 답안과 가져오기 전 기록은 보존합니다. 병합할까요?`))return;const rollback=JSON.stringify(state);try{localStorage.setItem('electric-study-before-import',rollback)}catch{download('study-before-import.json',rollback,'application/json')}state=result.state;await persist();render();toast(`기록 가져오기 완료: ${result.added}회차 추가, ${result.updated}회차 갱신`)}catch(e){toast(e.message)}}
