n\nI = 24/6 + 24/12\n\nI = 4 + 2 = 6A\n\n결과: 정답\n\n### 보충 3\n\n6Ω과 3Ω을 병렬로 연결했을 때 합성저항은?\n\n① 1Ω ② 2Ω ③ 3Ω ④ 9Ω\n\n정답: ②\n\n계산:\n\nR = (6 × 3)/(6 + 3) = 2Ω\n\n결과: 정답\n\n### 보충 4\n\n- 0V 전원에 2Ω과 8Ω을 직렬로 연결했다. 8Ω에 걸리는 전압은?\n\n① 4V ② 8V ③ 12V ④ 16V\n\n정답: ④\n\n계산:\n\nI = 20/(2 + 8) = 2A\n\nV = 2 × 8 = 16V\n\n결과: 정답\n\n### 보충 5\n\n한 접속점으로 10A가 들어오고, 3A와 4A가 나간다. 나머지 전류는?\n\n① 2A ② 3A ③ 4A ④ 7A\n\n정답: ②\n\n계산:\n\nI = 10 - 3 - 4 = 3A\n\n결과: 정답\n\n### 보충 6\n\n12V 전원에 2Ω과 4Ω을 직렬로 연결했다. 2Ω의 소비전력은?\n\n① 4W ② 8W ③ 12W ④ 16W\n\n정답: ②\n\n계산:\n\nI = 12/(2 + 4) = 2A\n\nP = 2² × 2 = 8W\n\n결과: 정답\n\n### 보충 7\n\n다음 설명 중 옳은 것은?\n\n① 직렬회로에서는 모든 저항에 동일한 전압이 걸린다.\n\n② 병렬회로에서는 모든 저항에 동일한 전류가 흐른다.\n\n③ 직렬회로에서는 같은 전류가 흐를 때 저항이 클수록 소비전력이 커진다.\n\n④ 병렬회로에서는 같은 전압이 걸릴 때 저항이 클수록 소비전력이 커진다.\n\n정답: ③\n\n해설:\n\n직렬회로는 전류가 같으므로 P = I²R에 따라 저항이 클수록 소비전력이 크다.\n\n결과: 정답\n\n### 보충 8 — 서술형\n\n12V 전원에 2Ω과 4Ω을 연결한다.\n\n- A회로: 직렬 연결\n- B회로: 병렬 연결\n\nA. 직렬회로의 전체 소비전력은?\n\n제출 답안: 24W\n\n정답: 24W\n\n계산:\n\nR = 2 + 4 = 6Ω\n\nP = 12²/6 = 24W\n\n결과: 정답\n\nB. 병렬회로의 전체 소비전력은?\n\n제출 답안: 105W\n\n정답: 108W\n\n계산:\n\n- Ω 전력 = 12²/2 = 72W\n\n4Ω 전력 = 12²/4 = 36W\n\n전체 전력 = 72 + 36 = 108W\n\n결과: 오답\n\nC. 어느 회로의 소비전력이 큰가?\n\n제출 답안: B회로\n\n정답: B회로\n\n결과: 정답\n\nD. 두 회로의 소비전력이 다른 이유는?\n\n제출 답안:\n\nA회로는 각 저항에 흐르는 전류가 동일하고, B회로는 각 저항에 걸리는 전압이 동일하기 때문이다.\n\n평가: 정답\n\n보충 설명:\n\n동일한 전압에서 합성저항이 작을수록 전체 소비전력이 커진다.\n\nA회로 합성저항 = 6Ω\n\nB회로 합성저항 = 4/3Ω\n\n따라서 B회로의 소비전력이 더 크다.\n\n※ 보충 8번은 A\\~D를 묶어 한 문제로 채점하였다.\n\n---\n\n# 8. 최종 확인문제\n\n총 2문제 / 2문제 정답\n\n### 확인 1\n\n12V 전원에 3Ω과 6Ω을 병렬 연결했다. 전체 소비전력은?\n\n① 24W ② 48W ③ 72W ④ 96W\n\n제출 답안: ③\n\n정답: ③ 72W\n\n계산:\n\n합성저항 = (3 × 6)/(3 + 6) = 2Ω\n\nP = 12²/2 = 72W\n\n결과: 정답\n\n### 확인 2\n\n12V 전원에 3Ω과 6Ω을 직렬 연결했다. 전체 소비전력은?\n\n① 8W ② 12W ③ 16W ④ 24W\n\n제출 답안: ③\n\n정답: ③ 16W\n\n계산:\n\n합성저항 = 3 + 6 = 9Ω\n\nP = 12²/9 = 16W\n\n결과: 정답\n\n---\n\n# 9. 오답노트\n\n## 오답 1. 기본문제 5.1\n\n문제:\n\n- Ω과 4Ω을 직렬 연결하고 12V를 가할 때 4Ω의 소비전력은?\n- 제출 답안: 24W\n- 정답: 16W\n\n### 오답 원인\n\n전체 소비전력과 특정 저항의 소비전력을 혼동하였다.\n\n### 올바른 개념\n\n전체 전류 = 12/(2 + 4) = 2A\n\n- Ω 소비전력 = 2² × 2 = 8W\n\n4Ω 소비전력 = 2² × 4 = 16W\n\n전체 소비전력 = 8 + 16 = 24W\n\n### 보충 결과\n\n보충 6번에서 개별 저항의 소비전력을 정확하게 계산하였다.\n\n판정: 개념 보완\n\n## 오답 2. 보충문제 8-B\n\n문제:\n\n12V 전원에 2Ω과 4Ω을 병렬로 연결했을 때 전체 소비전력은?\n\n- 제출 답안: 105W\n- 정답: 108W\n\n### 오답 원인\n\n개별 저항의 소비전력 합산 과정에서 계산 오류가 발생한 것으로 보인다.\n\n### 올바른 계산\n\nP1 = 12²/2 = 72W\n\nP2 = 12²/4 = 36W\n\n전체 소비전력 = 72 + 36 = 108W\n\n### 보충 결과\n\n최종 확인문제에서 병렬회로의 전체 소비전력을 정확하게 계산하였다.\n\n판정: 계산 정확도 보완\n\n---\n\n# 10. 시험 직전 암기 공식\n\n| 구분 | 공식 |\n| --- | --- |\n| 옴의 법칙 | V = IR |\n| 전류 | I = V/R |\n| 저항 | R = V/I |\n| 직렬 합성저항 | R = R1 + R2 |\n| 병렬 합성저항(2개) | R = R1R2/(R1+R2) |\n| 전압 분배 | V1 = V × R1/(R1+R2) |\n| 전류 분배 | I1 = I × R2/(R1+R2) |\n| 전력 | P = VI |\n| 전력 | P = I²R |\n| 전력 | P = V²/R |\n| 전체 소비전력 | P전체 = P1 + P2 + ... |\n\n### 반드시 암기할 7가지\n\n1. 직렬회로는 전류가 동일하다.\n2. 병렬회로는 전압이 동일하다.\n3. 직렬회로는 저항이 클수록 더 큰 전압이 걸린다.\n4. 병렬회로는 저항이 작을수록 더 큰 전류가 흐른다.\n5. 키르히호프 제1법칙은 전류 법칙이다.\n6. 키르히호프 제2법칙은 전압 법칙이다.\n7. 전체 소비전력은 개별 저항의 소비전력 합과 같다.\n\n---\n\n# 11. 4일차 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 기본 객관식 | 14/15 |\n| 기본 서술형 | 1/1 |\n| 보충문제 | 7/8 |\n| 최종 확인문제 | 2/2 |\n| 전체 정답 | 24/26 |\n| 정답률 | 92.3% |\n| 학습 목표 | 달성 |\n\n### 잘 이해한 내용\n\n- 직렬회로와 병렬회로의 구조\n- 합성저항 계산\n- 전압 분배와 전류 분배\n- 키르히호프 제1법칙과 제2법칙\n- 소비전력 공식의 선택\n- 전체 소비전력 계산\n- 직렬·병렬회로의 전력 차이\n\n### 개선할 부분\n\n1. 전체 소비전력과 개별 저항의 소비전력 구분\n2. 여러 저항의 소비전력을 합산할 때 계산 검산\n3. 문제에서 요구하는 물리량을 정확하게 확인\n\n### 최종 평가\n\n4일차 기본문제와 보충문제에서 각각 1문제씩 오답이 발생하였다.\n\n그러나 최종 확인문제 2개를 모두 맞혀 주요 개념을 보완하였다.\n\n직렬·병렬회로의 계산 원리와 키르히호프의 법칙을 이해하고 있으며, 계산형 문제에 적용할 수 있다.\n\n<b>최종 판정: 4일차 학습 목표 달성</b>\n\n---\n\n# 12. 5일차 학습 계획\n\n## 주제: 전기저항과 도체의 특성\n\n### 학습 예정 내용\n\n1. 저항률과 도전율\n2. 도선의 길이와 저항의 관계\n3. 도선의 단면적과 저항의 관계\n4. 저항 공식 R = ρL/A\n5. 온도 변화에 따른 저항 변화\n6. 전기기능사 필기 응용문제\n\n### 다음 학습 목표\n\n도선의 길이, 단면적, 재료, 온도가 저항에 미치는 영향을 이해하고 계산할 수 있다.","counts":{"correct":15,"total":16,"kind":"최초","label":"노션 확인 최초 성적"},"supplement":{"correct":7,"total":8},"sourceChecked":"2026-11-12","historyImportVersion":"public-history-2026-11-12-v1"},{"id":"past4","day":5,"round":1,"date":"2026-11-06","title":"전기저항과 도체의 특성","status":"완료","unitIds":["u2"],"concept":"# ⚡ 전기기능사 필기 5일차 1회차 학습 정리\n\n학습일: 2026년 11월 6일\n\n학습 주제: 전기저항과 도체의 특성\n\n학습 범위\n\n- 저항률과 도전율\n- 도선의 길이와 저항\n- 도선의 단면적과 저항\n- 원형 도선의 지름과 저항\n- 온도 변화에 따른 저항\n- 저항의 비례·반비례 응용 계산\n\n학습 결과\n\n- 기본 연습문제: 15/16\n- 보충문제: 5/5\n- 총 정답: 20/21\n- 최종 정답률: 95.2%\n- 최종 평가: 학습 목표 달성\n\n---\n\n# 1. 전기저항과 도체의 특성\n\n## 1.1 전기저항이란?\n\n전기저항은 전류의 흐름을 방해하는 정도를 나타내는 물리량이다.\n\n옴의 법칙:\n\nV = IR\n\n저항을 구하는 공식:\n\nR = V/I\n\n- R: 저항(Ω)\n- V: 전압(V)\n- I: 전류(A)\n\n도선의 저항은 길이, 단면적, 재료의 저항률, 온도에 따라 달라진다.\n\n## 1.2 도선의 길이와 저항\n\n동일한 재료와 단면적, 온도에서 저항은 도선의 길이에 비례한다.\n\n공식:\n\nR ∝ L\n\n- 길이 2배 → 저항 2배\n- 길이 3배 → 저항 3배\n- 길이 1/2배 → 저항 1/2배\n\n예제:\n\n10m 도선의 저항이 5Ω일 때 길이를 30m로 늘리면?\n\nR = 5 × (30/10)\n\nR = 15Ω\n\n정답: 15Ω\n\n핵심: 도선이 길수록 저항이 증가한다.\n\n---\n\n# 2. 도선의 단면적과 저항\n\n## 2.1 단면적이란?\n\n단면적은 도선을 길이 방향에 수직으로 잘랐을 때 나타나는 면의 넓이이다.\n\n단면적이 클수록 전류가 흐를 수 있는 통로가 넓어진다.\n\n따라서 동일한 재료, 길이, 온도에서 저항은 단면적에 반비례한다.\n\n공식:\n\nR ∝ 1/A\n\n- 단면적 2배 → 저항 1/2배\n- 단면적 3배 → 저항 1/3배\n- 단면적 1/2배 → 저항 2배\n- 단면적 1/3배 → 저항 3배\n\n## 2.2 계산 예제\n\n초기 조건:\n\n- 단면적: 2mm²\n- 저항: 8Ω\n\n변경 조건:\n\n- 단면적: 4mm²\n\n계산:\n\nR = 8 × (2/4)\n\nR = 4Ω\n\n정답: 4Ω\n\n핵심: 단면적이 넓을수록 저항이 감소한다.\n\n---\n\n# 3. 저항률과 도전율\n\n## 3.1 저항률\n\n저항률은 재료가 전류의 흐름을 방해하는 정도를 나타내는 물리적 특성이다.\n\n기호: ρ(로)\n\n단위: Ω·m\n\n저항률이 작을수록 전류가 잘 흐른다.\n\n대표적인 도체의 저항률은 다음과 같다.\n\n| 재료 | 저항률(Ω·m, 약 20℃) |\n| --- | --- |\n| 은 | 1.59 × 10⁻⁸ |\n| 구리 | 1.68 × 10⁻⁸ |\n| 금 | 2.44 × 10⁻⁸ |\n| 알루미늄 | 2.65 × 10⁻⁸ |\n| 철 | 약 1.0 × 10⁻⁷ |\n\n※ 재료의 순도와 온도에 따라 값은 달라질 수 있다.\n\n## 3.2 도전율\n\n도전율은 재료가 전류를 얼마나 잘 흐르게 하는지를 나타낸다.\n\n기호: σ(시그마)\n\n단위: S/m\n\n공식:\n\nσ = 1/ρ\n\nρ = 1/σ\n\n저항률과 도전율은 서로 역수 관계이다.\n\n- 저항률 증가 → 도전율 감소\n- 저항률 감소 → 도전율 증가\n\n### 계산 예제\n\n저항률이 0.25Ω·m인 재료의 도전율을 구하시오.\n\nσ = 1/0.25\n\nσ = 4S/m\n\n정답: 4S/m\n\n---\n\n# 4. 도체의 저항 계산\n\n## 4.1 기본 공식\n\nR = ρL/A\n\n- R: 저항(Ω)\n- ρ: 저항률\n- L: 도선의 길이\n- A: 도선의 단면적\n\n저항률 단위가 Ω·m이면 길이는 m, 단면적은 m²를 사용한다.\n\n저항률 단위가 Ω·mm²/m이면 길이는 m, 단면적은 mm²를 사용한다.\n\n## 4.2 공식의 의미\n\n저항은 다음과 같은 관계를 가진다.\n\n- 저항률에 비례\n- 도선의 길이에 비례\n- 도선의 단면적에 반비례\n\n즉, 저항률이나 길이가 증가하면 저항이 커지고, 단면적이 증가하면 저항이 작아진다.\n\n## 4.3 계산 예제\n\n조건:\n\n- 저항률: 0.02Ω·mm²/m\n- 길이: 100m\n- 단면적: 4mm²\n\n계산:\n\nR = 0.02 × 100/4\n\nR = 0.5Ω\n\n정답: 0.5Ω\n\n---\n\n# 5. 원형 도선의 지름과 저항\n\n## 5.1 원형 도선의 단면적\n\n원형 도선의 단면적 공식:\n\nA = πd²/4\n\n- A: 단면적\n- d: 도선의 지름\n- π: 원주율\n\n단면적은 지름의 제곱에 비례한다.\n\nA ∝ d²\n\n따라서 같은 재료와 길이, 온도에서 저항은 지름의 제곱에 반비례한다.\n\nR ∝ 1/d²\n\n## 5.2 지름 변화와 저항\n\n| 지름 변화 | 저항 변화 |\n| --- | --- |\n| 2배 | 1/4배 |\n| 3배 | 1/9배 |\n| 1/2배 | 4배 |\n| 1/3배 | 9배 |\n\n### 계산 예제\n\n초기 저항이 36Ω인 원형 도선의 지름을 3배로 늘리면?\n\nR = 36/3²\n\nR = 36/9\n\nR = 4Ω\n\n정답: 4Ω\n\n주의: 단면적 2배와 지름 2배는 다르다.\n\n- 단면적 2배 → 저항 1/2배\n- 지름 2배 → 저항 1/4배\n\n---\n\n# 6. 온도 변화에 따른 저항\n\n## 6.1 금속 도체의 온도 특성\n\n일반적인 금속 도체는 온도가 상승하면 저항이 증가한다.\n\n온도가 상승하면 금속 원자의 열적 진동이 커지고, 전자의 산란이 증가하기 때문이다.\n\n반면 반도체는 온도 상승으로 전하 운반자가 증가하여 저항이 감소하는 경우가 많다.\n\n## 6.2 온도 변화 공식\n\nR₂ = R₁[1 + α(t₂ − t₁)]\n\n- R₁: 기준 온도에서의 저항\n- R₂: 변화한 온도에서의 저항\n- α: 기준 온도에서의 저항 온도계수\n- t₁: 처음 온도\n- t₂: 나중 온도\n\n※ 해당 온도 범위에서 온도계수가 일정하다고 근사한 식이다.\n\n## 6.3 계산 예제\n\n조건:\n\n- 초기 온도: 20℃\n- 최종 온도: 70℃\n- 초기 저항: 20Ω\n- 온도계수: 0.004/℃\n\n계산:\n\n온도 변화 = 70 − 20 = 50℃\n\nR₂ = 20 × [1 + 0.004 × 50]\n\nR₂ = 20 × 1.2\n\nR₂ = 24Ω\n\n정답: 24Ω\n\n저항이 20Ω에서 24Ω으로 증가했으므로 증가율은 20%이다.\n\n---\n\n# 7. 길이와 단면적이 동시에 변하는 경우\n\n이번 학습에서 가장 중요하게 보완한 개념이다.\n\n## 7.1 저항 변화 공식\n\n재료와 온도가 일정할 때:\n\n변경 저항 = 기존 저항 × (변경 길이/기존 길이) × (기존 단면적/변경 단면적)\n\n예를 들어 길이가 2배, 단면적이 1/2배가 되면 다음과 같다.\n\n저항 변화 = 2 ÷ (1/2)\n\n저항 변화 = 4배\n\n반대로 길이와 단면적이 모두 2배가 되면 다음과 같다.\n\n저항 변화 = 2 ÷ 2\n\n저항 변화 = 1배\n\n따라서 저항은 변하지 않는다.\n\n## 7.2 계산할 때 주의할 점\n\n1. 길이의 변화 비율을 먼저 구한다.\n2. 단면적의 변화 비율을 구한다.\n3. 단면적은 저항과 반비례하므로 역수를 적용한다.\n4. 두 변화 비율을 곱한다.\n5. 기존 저항에 변화 비율을 곱한다.\n\n---\n\n## 1단계. 도선의 길이\n\n### 문제 1.1\n\n동일한 재료와 단면적을 가진 도선에서 길이가 2배가 되면 저항은?\n\n① 1/4배 ② 1/2배 ③ 2배 ④ 4배\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n해설: 저항은 길이에 비례하므로 2배가 된다.\n\n### 문제 1.2\n\n10m 도선의 저항이 5Ω이다. 길이를 30m로 늘리면?\n\n① 5Ω ② 10Ω ③ 15Ω ④ 30Ω\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n계산:\n\nR = 5 × 30/10 = 15Ω\n\n### 문제 1.3\n\n도선의 저항에 대한 설명 중 옳은 것은?\n\n① 길이가 길수록 저항은 감소한다.\n\n② 단면적이 넓을수록 저항은 증가한다.\n\n③ 저항률이 클수록 저항은 감소한다.\n\n④ 길이가 길수록 저항은 증가한다.\n\n- 제출 답안: ④\n- 정답: ④\n- 결과: 정답\n\n해설: 저항은 길이에 비례한다.\n\n---\n\n## 2단계. 단면적과 저항\n\n### 문제 2.1\n\n도선의 단면적이 2배가 되면 저항은?\n\n① 2배 ② 4배 ③ 1/2배 ④ 1/4배\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n해설: 저항은 단면적에 반비례한다.\n\n### 문제 2.2\n\n단면적 3mm², 저항 12Ω인 도선의 단면적을 9mm²로 늘리면?\n\n① 2Ω ② 4Ω ③ 6Ω ④ 36Ω\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n계산:\n\nR = 12 × 3/9 = 4Ω\n\n### 문제 2.3\n\n원형 도선의 지름을 2배로 늘리면 저항은?\n\n① 2배 ② 1/2배 ③ 1/4배 ④ 1/8배\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n해설: 단면적이 4배가 되므로 저항은 1/4배가 된다.\n\n---\n\n## 3단계. 저항률과 도전율\n\n### 문제 3.1\n\n저항률을 나타내는 기호는?\n\n① I ② V ③ ρ ④ P\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n해설: 저항률의 기호는 ρ(로)이다.\n\n### 문제 3.2\n\n저항률이 작은 재료의 특성으로 옳은 것은?\n\n① 전류가 잘 흐른다.\n\n② 도전율이 작다.\n\n③ 저항이 반드시 0이다.\n\n④ 전류가 흐르지 않는다.\n\n- 제출 답안: ①\n- 정답: ①\n- 결과: 정답\n\n해설: 저항률이 작을수록 도전율이 크고 전류가 잘 흐른다.\n\n### 문제 3.3\n\n저항률이 0.25Ω·m일 때 도전율은?\n\n① 0.25S/m ② 1S/m ③ 2S/m ④ 4S/m\n\n- 제출 답안: ④\n- 정답: ④\n- 결과: 정답\n\n계산:\n\nσ = 1/0.25 = 4S/m\n\n---\n\n## 4단계. 도체의 저항 계산\n\n### 문제 4.1\n\n저항률 0.02Ω·mm²/m, 길이 100m, 단면적 4mm²인 도선의 저항은?\n\n① 0.25Ω ② 0.5Ω ③ 1Ω ④ 2Ω\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n계산:\n\nR = 0.02 × 100/4 = 0.5Ω\n\n### 문제 4.2\n\n저항률 0.04Ω·mm²/m, 길이 200m, 단면적 2mm²인 도선의 저항은?\n\n① 1Ω ② 2Ω ③ 4Ω ④ 8Ω\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n계산:\n\nR = 0.04 × 200/2 = 4Ω\n\n### 문제 4.3 — 오답\n\n도선의 길이를 2배로 늘리고 단면적을 1/2배로 줄였다. 저항은 원래의 몇 배인가?\n\n① 1배 ② 2배 ③ 3배 ④ 4배\n\n- 제출 답안: ①\n- 정답: ④\n- 결과: 오답\n\n계산:\n\n저항 변화 = 2 ÷ (1/2)\n\n저항 변화 = 4배\n\n오답 원인\n\n길이 증가와 단면적 감소가 저항에 미치는 영향을 정확하게 결합하지 못했다.\n\n올바른 개념\n\n- 길이 2배 → 저항 2배\n- 단면적 1/2배 → 저항 2배\n- 두 변화가 동시에 발생 → 저항 4배\n\n---\n\n## 5단계. 온도와 저항\n\n### 문제 5.1\n\n일반적인 금속 도체의 온도가 상승하면 저항은?\n\n① 증가 ② 감소 ③ 0이 됨 ④ 일정\n\n- 제출 답안: ①\n- 정답: ①\n- 결과: 정답\n\n### 문제 5.2\n\n20℃에서 저항 20Ω, 온도계수 0.004/℃인 금속 도체가 70℃가 되면 저항은?\n\n① 20Ω ② 22Ω ③ 24Ω ④ 28Ω\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n계산:\n\nR₂ = 20 × [1 + 0.004 × (70 − 20)]\n\nR₂ = 24Ω\n\n### 문제 5.3\n\n금속 도체에서 온도 상승 시 저항이 증가하는 주된 이유는?\n\n① 전자의 전하량 증가\n\n② 원자의 열적 진동 증가로 전자 산란 증가\n\n③ 도선 길이가 반드시 2배 증가\n\n④ 자유전자가 모두 사라짐\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n---\n\n## 6단계. 종합 응용문제\n\n### 문제 6.1\n\n초기 조건:\n\n- 길이: 10m\n- 단면적: 2mm²\n- 저항: 8Ω\n\n변경 조건:\n\n- 길이: 20m\n- 단면적: 4mm²\n\nA. 길이 변화 비율은?\n\n- 제출 답안: 2배\n- 정답: 2배\n\nB. 단면적 변화 비율은?\n\n- 제출 답안: 2배\n- 정답: 2배\n\nC. 최종 저항은?\n\n- 제출 답안: 8Ω\n- 정답: 8Ω\n\n계산:\n\nR = 8 × (20/10) × (2/4)\n\nR = 8 × 2 × 1/2\n\nR = 8Ω\n\nD. 저항이 변하지 않는 이유는?\n\n제출 답안:\n\n\"저항은 길이에 비례하지만, 단면적과는 반비례하기 때문에 저항의 변화는 없다.\"\n\n평가: 정답\n\n길이와 단면적이 각각 2배 증가하여 두 효과가 상쇄된다.\n\n---\n\n### 보충 1\n\n도선의 길이를 3배로 늘리면 저항은?\n\n① 1/3배 ② 1배 ③ 3배 ④ 9배\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n해설: 길이에 비례하므로 3배 증가한다.\n\n### 보충 2\n\n단면적을 1/3배로 줄이면 저항은?\n\n① 1/3배 ② 1배 ③ 3배 ④ 9배\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n계산:\n\n저항 변화 = 1 ÷ (1/3) = 3배\n\n### 보충 3\n\n길이를 3배로 늘리고 단면적을 1/2배로 줄이면 저항은?\n\n① 1.5배 ② 3배 ③ 6배 ④ 9배\n\n- 제출 답안: 6배\n- 정답: ③ 6배\n- 결과: 정답\n\n계산:\n\n저항 변화 = 3 ÷ (1/2) = 6배\n\n### 보충 4\n\n초기 저항이 12Ω인 도선의 길이를 2배, 단면적을 4배로 늘리면?\n\n① 3Ω ② 6Ω ③ 12Ω ④ 24Ω\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n계산:\n\nR = 12 × 2/4\n\nR = 6Ω\n\n### 보충 5 — 서술형\n\n초기 조건:\n\n- 저항: 18Ω\n- 길이: 10m\n- 단면적: 2mm²\n\n변경 조건:\n\n- 길이: 30m\n- 단면적: 6mm²\n\nA. 길이 변화로 인한 저항 배율은?\n\n- 제출 답안: 3배\n- 정답: 3배\n\nB. 단면적 변화로 인한 저항 배율은?\n\n- 제출 답안: 1/3배\n- 정답: 1/3배\n\nC. 최종 저항은?\n\n- 제출 답안: 18Ω\n- 정답: 18Ω\n\n계산:\n\nR = 18 × 3 × (1/3)\n\nR = 18Ω\n\nD. 계산 이유를 설명하시오.\n\n제출 답안:\n\n\"저항은 길이에 비례하고, 단면적에 반비례한다.\"\n\n평가: 정답\n\n길이와 단면적이 모두 3배 증가하므로 저항은 변하지 않는다.\n\n---\n\n## 오답 1. 기본문제 4.3\n\n문제\n\n길이를 2배로 늘리고 단면적을 1/2배로 줄이면 저항은?\n\n- 제출 답안: 1배\n- 정답: 4배\n\n### 오답 원인\n\n길이와 단면적이 각각 저항에 미치는 영향을 혼동하였다.\n\n### 올바른 계산\n\n길이 변화: 2배\n\n단면적 변화: 1/2배\n\n저항 변화 = 2 ÷ (1/2)\n\n저항 변화 = 4배\n\n### 보충학습 결과\n\n- 보충 1: 정답\n- 보충 2: 정답\n- 보충 3: 정답\n- 보충 4: 정답\n- 보충 5: 정답\n\n최종 판정: 관련 응용문제 해결 능력 확인\n\n---\n\n# 11. 시험 직전 암기 공식\n\n| 구분 | 공식 |\n| --- | --- |\n| 옴의 법칙 | R = V/I |\n| 도체의 저항 | R = ρL/A |\n| 도전율 | σ = 1/ρ |\n| 저항률 | ρ = 1/σ |\n| 원형 도선의 단면적 | A = πd²/4 |\n| 지름과 저항 | R ∝ 1/d² |\n| 온도 변화에 따른 저항 | R₂ = R₁[1 + α(t₂ − t₁)] |\n\n### 반드시 암기할 7가지\n\n1. 도선의 길이가 길수록 저항이 증가한다.\n2. 도선의 단면적이 넓을수록 저항이 감소한다.\n3. 저항률이 작을수록 전류가 잘 흐른다.\n4. 도전율은 저항률의 역수이다.\n5. 원형 도선의 지름이 2배가 되면 저항은 1/4배가 된다.\n6. 일반적인 금속 도체는 온도가 높아지면 저항이 증가한다.\n7. 길이와 단면적이 동시에 변하면 두 변화 비율을 모두 고려해야 한다.\n\n---\n\n## 잘 이해한 내용\n\n- 저항률과 도전율의 개념\n- 저항 공식 R = ρL/A\n- 도선의 길이와 저항 관계\n- 단면적과 지름의 변화에 따른 저항 계산\n- 온도 변화에 따른 금속 도체의 저항\n- 길이와 단면적이 동시에 변하는 응용 계산\n\n## 개선할 부분\n\n1. 길이와 단면적의 변화가 동시에 주어질 때 각각의 배율을 구분한다.\n2. 단면적이 감소하면 저항은 증가한다는 사실을 확인한다.\n3. 계산 결과가 합리적인지 비례·반비례 관계로 검산한다.\n\n## 5일차 2회차: 정전기와 쿨롱의 법칙\n\n학습 예정 내용:\n\n1. 정전기와 전하의 개념\n2. 양전하와 음전하\n3. 쿨롱의 법칙\n4. 전하량과 거리 변화에 따른 전기력\n5. 전계의 세기\n6. 전위와 전위차\n7. 정전용량의 기초\n\n다음 학습 목표\n\n정전기 현상의 기본 원리를 이해하고, 쿨롱의 법칙을 이용하여 전하 사이에 작용하는 힘을 계산할 수 있다.","examples":"## 2.2 계산 예제\n\n초기 조건:\n\n- 단면적: 2mm²\n- 저항: 8Ω\n\n변경 조건:\n\n- 단면적: 4mm²\n\n계산:\n\nR = 8 × (2/4)\n\nR = 4Ω\n\n정답: 4Ω\n\n핵심: 단면적이 넓을수록 저항이 감소한다.\n\n---\n\n### 계산 예제\n\n저항률이 0.25Ω·m인 재료의 도전율을 구하시오.\n\nσ = 1/0.25\n\nσ = 4S/m\n\n정답: 4S/m\n\n---\n\n## 4.3 계산 예제\n\n조건:\n\n- 저항률: 0.02Ω·mm²/m\n- 길이: 100m\n- 단면적: 4mm²\n\n계산:\n\nR = 0.02 × 100/4\n\nR = 0.5Ω\n\n정답: 0.5Ω\n\n---\n\n### 계산 예제\n\n초기 저항이 36Ω인 원형 도선의 지름을 3배로 늘리면?\n\nR = 36/3²\n\nR = 36/9\n\nR = 4Ω\n\n정답: 4Ω\n\n주의: 단면적 2배와 지름 2배는 다르다.\n\n- 단면적 2배 → 저항 1/2배\n- 지름 2배 → 저항 1/4배\n\n---\n\n## 6.3 계산 예제\n\n조건:\n\n- 초기 온도: 20℃\n- 최종 온도: 70℃\n- 초기 저항: 20Ω\n- 온도계수: 0.004/℃\n\n계산:\n\n온도 변화 = 70 − 20 = 50℃\n\nR₂ = 20 × [1 + 0.004 × 50]\n\nR₂ = 20 × 1.2\n\nR₂ = 24Ω\n\n정답: 24Ω\n\n저항이 20Ω에서 24Ω으로 증가했으므로 증가율은 20%이다.\n\n---\n\n### 보충 5 — 서술형\n\n초기 조건:\n\n- 저항: 18Ω\n- 길이: 10m\n- 단면적: 2mm²\n\n변경 조건:\n\n- 길이: 30m\n- 단면적: 6mm²\n\nA. 길이 변화로 인한 저항 배율은?\n\n- 제출 답안: 3배\n- 정답: 3배\n\nB. 단면적 변화로 인한 저항 배율은?\n\n- 제출 답안: 1/3배\n- 정답: 1/3배\n\nC. 최종 저항은?\n\n- 제출 답안: 18Ω\n- 정답: 18Ω\n\n계산:\n\nR = 18 × 3 × (1/3)\n\nR = 18Ω\n\nD. 계산 이유를 설명하시오.\n\n제출 답안:\n\n\"저항은 길이에 비례하고, 단면적에 반비례한다.\"\n\n평가: 정답\n\n길이와 단면적이 모두 3배 증가하므로 저항은 변하지 않는다.\n\n---","notes":"# 8. 기본 연습문제 및 정답·해설\n\n기본 연습문제: 총 16문제 중 15문제 정답\n\n# 9. 보충문제 및 정답·해설\n\n보충문제: 총 5문제 중 5문제 정답\n\n# 10. 오답노트\n\n# 12. 5일차 1회차 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 기본 연습문제 | 15/16 |\n| 기본 정답률 | 93.8% |\n| 보충문제 | 5/5 |\n| 보충 정답률 | 100% |\n| 전체 정답 | 20/21 |\n| 최종 정답률 | 95.2% |\n| 학습 목표 | 달성 |\n\n## 최종 평가\n\n기본 연습문제 16문제 중 15문제를 맞혔다.\n\n길이와 단면적이 동시에 변하는 계산에서 오답이 한 문제 발생했지만, 보충문제 5문제를 모두 맞혀 해당 개념을 보완하였다.\n\n특히 서술형에서 저항의 비례·반비례 관계를 정확하게 설명하였다.\n\n최종 판정: 5일차 1회차 학습 목표 달성\n\n---\n\n# 13. 다음 학습 계획\n\n가져오기: 노션 확인 기록 전체를 보존했습니다. 문항별 제출 답안·정답은 원문 탭에서 볼 수 있습니다. 기록에 없는 성적·완료 범위는 추정하지 않았습니다.","questions":[],"source":"","sourceText":"# ⚡ 전기기능사 필기 5일차 1회차 학습 정리\n\n<b>학습일:</b> 2026년 11월 6일\n\n<b>학습 주제:</b> 전기저항과 도체의 특성\n\n<b>학습 범위</b>\n\n- 저항률과 도전율\n- 도선의 길이와 저항\n- 도선의 단면적과 저항\n- 원형 도선의 지름과 저항\n- 온도 변화에 따른 저항\n- 저항의 비례·반비례 응용 계산\n\n<b>학습 결과</b>\n\n- 기본 연습문제: 15/16\n- 보충문제: 5/5\n- 총 정답: 20/21\n- 최종 정답률: 95.2%\n- 최종 평가: 학습 목표 달성\n\n---\n\n# 1. 전기저항과 도체의 특성\n\n## 1.1 전기저항이란?\n\n전기저항은 전류의 흐름을 방해하는 정도를 나타내는 물리량이다.\n\n옴의 법칙:\n\nV = IR\n\n저항을 구하는 공식:\n\nR = V/I\n\n- R: 저항(Ω)\n- V: 전압(V)\n- I: 전류(A)\n\n도선의 저항은 길이, 단면적, 재료의 저항률, 온도에 따라 달라진다.\n\n## 1.2 도선의 길이와 저항\n\n동일한 재료와 단면적, 온도에서 저항은 도선의 길이에 비례한다.\n\n공식:\n\nR ∝ L\n\n- 길이 2배 → 저항 2배\n- 길이 3배 → 저항 3배\n- 길이 1/2배 → 저항 1/2배\n\n예제:\n\n10m 도선의 저항이 5Ω일 때 길이를 30m로 늘리면?\n\nR = 5 × (30/10)\n\nR = 15Ω\n\n정답: 15Ω\n\n<b>핵심: 도선이 길수록 저항이 증가한다.</b>\n\n---\n\n# 2. 도선의 단면적과 저항\n\n## 2.1 단면적이란?\n\n단면적은 도선을 길이 방향에 수직으로 잘랐을 때 나타나는 면의 넓이이다.\n\n단면적이 클수록 전류가 흐를 수 있는 통로가 넓어진다.\n\n따라서 동일한 재료, 길이, 온도에서 저항은 단면적에 반비례한다.\n\n공식:\n\nR ∝ 1/A\n\n- 단면적 2배 → 저항 1/2배\n- 단면적 3배 → 저항 1/3배\n- 단면적 1/2배 → 저항 2배\n- 단면적 1/3배 → 저항 3배\n\n## 2.2 계산 예제\n\n초기 조건:\n\n- 단면적: 2mm²\n- 저항: 8Ω\n\n변경 조건:\n\n- 단면적: 4mm²\n\n계산:\n\nR = 8 × (2/4)\n\nR = 4Ω\n\n정답: 4Ω\n\n<b>핵심: 단면적이 넓을수록 저항이 감소한다.</b>\n\n---\n\n# 3. 저항률과 도전율\n\n## 3.1 저항률\n\n저항률은 재료가 전류의 흐름을 방해하는 정도를 나타내는 물리적 특성이다.\n\n기호: ρ(로)\n\n단위: Ω·m\n\n저항률이 작을수록 전류가 잘 흐른다.\n\n대표적인 도체의 저항률은 다음과 같다.\n\n| 재료 | 저항률(Ω·m, 약 20℃) |\n| --- | --- |\n| 은 | 1.59 × 10⁻⁸ |\n| 구리 | 1.68 × 10⁻⁸ |\n| 금 | 2.44 × 10⁻⁸ |\n| 알루미늄 | 2.65 × 10⁻⁸ |\n| 철 | 약 1.0 × 10⁻⁷ |\n\n※ 재료의 순도와 온도에 따라 값은 달라질 수 있다.\n\n## 3.2 도전율\n\n도전율은 재료가 전류를 얼마나 잘 흐르게 하는지를 나타낸다.\n\n기호: σ(시그마)\n\n단위: S/m\n\n공식:\n\nσ = 1/ρ\n\nρ = 1/σ\n\n저항률과 도전율은 서로 역수 관계이다.\n\n- 저항률 증가 → 도전율 감소\n- 저항률 감소 → 도전율 증가\n\n### 계산 예제\n\n저항률이 0.25Ω·m인 재료의 도전율을 구하시오.\n\nσ = 1/0.25\n\nσ = 4S/m\n\n정답: 4S/m\n\n---\n\n# 4. 도체의 저항 계산\n\n## 4.1 기본 공식\n\n<b>R = ρL/A</b>\n\n- R: 저항(Ω)\n- ρ: 저항률\n- L: 도선의 길이\n- A: 도선의 단면적\n\n저항률 단위가 Ω·m이면 길이는 m, 단면적은 m²를 사용한다.\n\n저항률 단위가 Ω·mm²/m이면 길이는 m, 단면적은 mm²를 사용한다.\n\n## 4.2 공식의 의미\n\n저항은 다음과 같은 관계를 가진다.\n\n- 저항률에 비례\n- 도선의 길이에 비례\n- 도선의 단면적에 반비례\n\n즉, 저항률이나 길이가 증가하면 저항이 커지고, 단면적이 증가하면 저항이 작아진다.\n\n## 4.3 계산 예제\n\n조건:\n\n- 저항률: 0.02Ω·mm²/m\n- 길이: 100m\n- 단면적: 4mm²\n\n계산:\n\nR = 0.02 × 100/4\n\nR = 0.5Ω\n\n정답: 0.5Ω\n\n---\n\n# 5. 원형 도선의 지름과 저항\n\n## 5.1 원형 도선의 단면적\n\n원형 도선의 단면적 공식:\n\nA = πd²/4\n\n- A: 단면적\n- d: 도선의 지름\n- π: 원주율\n\n단면적은 지름의 제곱에 비례한다.\n\nA ∝ d²\n\n따라서 같은 재료와 길이, 온도에서 저항은 지름의 제곱에 반비례한다.\n\nR ∝ 1/d²\n\n## 5.2 지름 변화와 저항\n\n| 지름 변화 | 저항 변화 |\n| --- | --- |\n| 2배 | 1/4배 |\n| 3배 | 1/9배 |\n| 1/2배 | 4배 |\n| 1/3배 | 9배 |\n\n### 계산 예제\n\n초기 저항이 36Ω인 원형 도선의 지름을 3배로 늘리면?\n\nR = 36/3²\n\nR = 36/9\n\nR = 4Ω\n\n정답: 4Ω\n\n<b>주의: 단면적 2배와 지름 2배는 다르다.</b>\n\n- 단면적 2배 → 저항 1/2배\n- 지름 2배 → 저항 1/4배\n\n---\n\n# 6. 온도 변화에 따른 저항\n\n## 6.1 금속 도체의 온도 특성\n\n일반적인 금속 도체는 온도가 상승하면 저항이 증가한다.\n\n온도가 상승하면 금속 원자의 열적 진동이 커지고, 전자의 산란이 증가하기 때문이다.\n\n반면 반도체는 온도 상승으로 전하 운반자가 증가하여 저항이 감소하는 경우가 많다.\n\n## 6.2 온도 변화 공식\n\nR₂ = R₁\\[1 + α(t₂ − t₁)\\]\n\n- R₁: 기준 온도에서의 저항\n- R₂: 변화한 온도에서의 저항\n- α: 기준 온도에서의 저항 온도계수\n- t₁: 처음 온도\n- t₂: 나중 온도\n\n※ 해당 온도 범위에서 온도계수가 일정하다고 근사한 식이다.\n\n## 6.3 계산 예제\n\n조건:\n\n- 초기 온도: 20℃\n- 최종 온도: 70℃\n- 초기 저항: 20Ω\n- 온도계수: 0.004/℃\n\n계산:\n\n온도 변화 = 70 − 20 = 50℃\n\nR₂ = 20 × \\[1 + 0.004 × 50\\]\n\nR₂ = 20 × 1.2\n\nR₂ = 24Ω\n\n정답: 24Ω\n\n저항이 20Ω에서 24Ω으로 증가했으므로 증가율은 20%이다.\n\n---\n\n# 7. 길이와 단면적이 동시에 변하는 경우\n\n이번 학습에서 가장 중요하게 보완한 개념이다.\n\n## 7.1 저항 변화 공식\n\n재료와 온도가 일정할 때:\n\n<b>변경 저항 = 기존 저항 × (변경 길이/기존 길이) × (기존 단면적/변경 단면적)</b>\n\n예를 들어 길이가 2배, 단면적이 1/2배가 되면 다음과 같다.\n\n저항 변화 = 2 ÷ (1/2)\n\n저항 변화 = 4배\n\n반대로 길이와 단면적이 모두 2배가 되면 다음과 같다.\n\n저항 변화 = 2 ÷ 2\n\n저항 변화 = 1배\n\n따라서 저항은 변하지 않는다.\n\n## 7.2 계산할 때 주의할 점\n\n1. 길이의 변화 비율을 먼저 구한다.\n2. 단면적의 변화 비율을 구한다.\n3. 단면적은 저항과 반비례하므로 역수를 적용한다.\n4. 두 변화 비율을 곱한다.\n5. 기존 저항에 변화 비율을 곱한다.\n\n---\n\n# 8. 기본 연습문제 및 정답·해설\n\n<b>기본 연습문제: 총 16문제 중 15문제 정답</b>\n\n## 1단계. 도선의 길이\n\n### 문제 1.1\n\n동일한 재료와 단면적을 가진 도선에서 길이가 2배가 되면 저항은?\n\n① 1/4배 ② 1/2배 ③ 2배 ④ 4배\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n해설: 저항은 길이에 비례하므로 2배가 된다.\n\n### 문제 1.2\n\n10m 도선의 저항이 5Ω이다. 길이를 30m로 늘리면?\n\n① 5Ω ② 10Ω ③ 15Ω ④ 30Ω\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n계산:\n\nR = 5 × 30/10 = 15Ω\n\n### 문제 1.3\n\n도선의 저항에 대한 설명 중 옳은 것은?\n\n① 길이가 길수록 저항은 감소한다.\n\n② 단면적이 넓을수록 저항은 증가한다.\n\n③ 저항률이 클수록 저항은 감소한다.\n\n④ 길이가 길수록 저항은 증가한다.\n\n- 제출 답안: ④\n- 정답: ④\n- 결과: 정답\n\n해설: 저항은 길이에 비례한다.\n\n---\n\n## 2단계. 단면적과 저항\n\n### 문제 2.1\n\n도선의 단면적이 2배가 되면 저항은?\n\n① 2배 ② 4배 ③ 1/2배 ④ 1/4배\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n해설: 저항은 단면적에 반비례한다.\n\n### 문제 2.2\n\n단면적 3mm², 저항 12Ω인 도선의 단면적을 9mm²로 늘리면?\n\n① 2Ω ② 4Ω ③ 6Ω ④ 36Ω\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n계산:\n\nR = 12 × 3/9 = 4Ω\n\n### 문제 2.3\n\n원형 도선의 지름을 2배로 늘리면 저항은?\n\n① 2배 ② 1/2배 ③ 1/4배 ④ 1/8배\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n해설: 단면적이 4배가 되므로 저항은 1/4배가 된다.\n\n---\n\n## 3단계. 저항률과 도전율\n\n### 문제 3.1\n\n저항률을 나타내는 기호는?\n\n① I ② V ③ ρ ④ P\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n해설: 저항률의 기호는 ρ(로)이다.\n\n### 문제 3.2\n\n저항률이 작은 재료의 특성으로 옳은 것은?\n\n① 전류가 잘 흐른다.\n\n② 도전율이 작다.\n\n③ 저항이 반드시 0이다.\n\n④ 전류가 흐르지 않는다.\n\n- 제출 답안: ①\n- 정답: ①\n- 결과: 정답\n\n해설: 저항률이 작을수록 도전율이 크고 전류가 잘 흐른다.\n\n### 문제 3.3\n\n저항률이 0.25Ω·m일 때 도전율은?\n\n① 0.25S/m ② 1S/m ③ 2S/m ④ 4S/m\n\n- 제출 답안: ④\n- 정답: ④\n- 결과: 정답\n\n계산:\n\nσ = 1/0.25 = 4S/m\n\n---\n\n## 4단계. 도체의 저항 계산\n\n### 문제 4.1\n\n저항률 0.02Ω·mm²/m, 길이 100m, 단면적 4mm²인 도선의 저항은?\n\n① 0.25Ω ② 0.5Ω ③ 1Ω ④ 2Ω\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n계산:\n\nR = 0.02 × 100/4 = 0.5Ω\n\n### 문제 4.2\n\n저항률 0.04Ω·mm²/m, 길이 200m, 단면적 2mm²인 도선의 저항은?\n\n① 1Ω ② 2Ω ③ 4Ω ④ 8Ω\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n계산:\n\nR = 0.04 × 200/2 = 4Ω\n\n### 문제 4.3 — 오답\n\n도선의 길이를 2배로 늘리고 단면적을 1/2배로 줄였다. 저항은 원래의 몇 배인가?\n\n① 1배 ② 2배 ③ 3배 ④ 4배\n\n- 제출 답안: ①\n- 정답: ④\n- 결과: 오답\n\n계산:\n\n저항 변화 = 2 ÷ (1/2)\n\n저항 변화 = 4배\n\n<b>오답 원인</b>\n\n길이 증가와 단면적 감소가 저항에 미치는 영향을 정확하게 결합하지 못했다.\n\n<b>올바른 개념</b>\n\n- 길이 2배 → 저항 2배\n- 단면적 1/2배 → 저항 2배\n- 두 변화가 동시에 발생 → 저항 4배\n\n---\n\n## 5단계. 온도와 저항\n\n### 문제 5.1\n\n일반적인 금속 도체의 온도가 상승하면 저항은?\n\n① 증가 ② 감소 ③ 0이 됨 ④ 일정\n\n- 제출 답안: ①\n- 정답: ①\n- 결과: 정답\n\n### 문제 5.2\n\n20℃에서 저항 20Ω, 온도계수 0.004/℃인 금속 도체가 70℃가 되면 저항은?\n\n① 20Ω ② 22Ω ③ 24Ω ④ 28Ω\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n계산:\n\nR₂ = 20 × \\[1 + 0.004 × (70 − 20)\\]\n\nR₂ = 24Ω\n\n### 문제 5.3\n\n금속 도체에서 온도 상승 시 저항이 증가하는 주된 이유는?\n\n① 전자의 전하량 증가\n\n② 원자의 열적 진동 증가로 전자 산란 증가\n\n③ 도선 길이가 반드시 2배 증가\n\n④ 자유전자가 모두 사라짐\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n---\n\n## 6단계. 종합 응용문제\n\n### 문제 6.1\n\n초기 조건:\n\n- 길이: 10m\n- 단면적: 2mm²\n- 저항: 8Ω\n\n변경 조건:\n\n- 길이: 20m\n- 단면적: 4mm²\n\nA. 길이 변화 비율은?\n\n- 제출 답안: 2배\n- 정답: 2배\n\nB. 단면적 변화 비율은?\n\n- 제출 답안: 2배\n- 정답: 2배\n\nC. 최종 저항은?\n\n- 제출 답안: 8Ω\n- 정답: 8Ω\n\n계산:\n\nR = 8 × (20/10) × (2/4)\n\nR = 8 × 2 × 1/2\n\nR = 8Ω\n\nD. 저항이 변하지 않는 이유는?\n\n제출 답안:\n\n\"저항은 길이에 비례하지만, 단면적과는 반비례하기 때문에 저항의 변화는 없다.\"\n\n평가: 정답\n\n길이와 단면적이 각각 2배 증가하여 두 효과가 상쇄된다.\n\n---\n\n# 9. 보충문제 및 정답·해설\n\n<b>보충문제: 총 5문제 중 5문제 정답</b>\n\n### 보충 1\n\n도선의 길이를 3배로 늘리면 저항은?\n\n① 1/3배 ② 1배 ③ 3배 ④ 9배\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n해설: 길이에 비례하므로 3배 증가한다.\n\n### 보충 2\n\n단면적을 1/3배로 줄이면 저항은?\n\n① 1/3배 ② 1배 ③ 3배 ④ 9배\n\n- 제출 답안: ③\n- 정답: ③\n- 결과: 정답\n\n계산:\n\n저항 변화 = 1 ÷ (1/3) = 3배\n\n### 보충 3\n\n길이를 3배로 늘리고 단면적을 1/2배로 줄이면 저항은?\n\n① 1.5배 ② 3배 ③ 6배 ④ 9배\n\n- 제출 답안: 6배\n- 정답: ③ 6배\n- 결과: 정답\n\n계산:\n\n저항 변화 = 3 ÷ (1/2) = 6배\n\n### 보충 4\n\n초기 저항이 12Ω인 도선의 길이를 2배, 단면적을 4배로 늘리면?\n\n① 3Ω ② 6Ω ③ 12Ω ④ 24Ω\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n계산:\n\nR = 12 × 2/4\n\nR = 6Ω\n\n### 보충 5 — 서술형\n\n초기 조건:\n\n- 저항: 18Ω\n- 길이: 10m\n- 단면적: 2mm²\n\n변경 조건:\n\n- 길이: 30m\n- 단면적: 6mm²\n\nA. 길이 변화로 인한 저항 배율은?\n\n- 제출 답안: 3배\n- 정답: 3배\n\nB. 단면적 변화로 인한 저항 배율은?\n\n- 제출 답안: 1/3배\n- 정답: 1/3배\n\nC. 최종 저항은?\n\n- 제출 답안: 18Ω\n- 정답: 18Ω\n\n계산:\n\nR = 18 × 3 × (1/3)\n\nR = 18Ω\n\nD. 계산 이유를 설명하시오.\n\n제출 답안:\n\n\"저항은 길이에 비례하고, 단면적에 반비례한다.\"\n\n평가: 정답\n\n길이와 단면적이 모두 3배 증가하므로 저항은 변하지 않는다.\n\n---\n\n# 10. 오답노트\n\n## 오답 1. 기본문제 4.3\n\n<b>문제</b>\n\n길이를 2배로 늘리고 단면적을 1/2배로 줄이면 저항은?\n\n- 제출 답안: 1배\n- 정답: 4배\n\n### 오답 원인\n\n길이와 단면적이 각각 저항에 미치는 영향을 혼동하였다.\n\n### 올바른 계산\n\n길이 변화: 2배\n\n단면적 변화: 1/2배\n\n저항 변화 = 2 ÷ (1/2)\n\n저항 변화 = 4배\n\n### 보충학습 결과\n\n- 보충 1: 정답\n- 보충 2: 정답\n- 보충 3: 정답\n- 보충 4: 정답\n- 보충 5: 정답\n\n<b>최종 판정: 관련 응용문제 해결 능력 확인</b>\n\n---\n\n# 11. 시험 직전 암기 공식\n\n| 구분 | 공식 |\n| --- | --- |\n| 옴의 법칙 | R = V/I |\n| 도체의 저항 | R = ρL/A |\n| 도전율 | σ = 1/ρ |\n| 저항률 | ρ = 1/σ |\n| 원형 도선의 단면적 | A = πd²/4 |\n| 지름과 저항 | R ∝ 1/d² |\n| 온도 변화에 따른 저항 | R₂ = R₁\\[1 + α(t₂ − t₁)\\] |\n\n### 반드시 암기할 7가지\n\n1. 도선의 길이가 길수록 저항이 증가한다.\n2. 도선의 단면적이 넓을수록 저항이 감소한다.\n3. 저항률이 작을수록 전류가 잘 흐른다.\n4. 도전율은 저항률의 역수이다.\n5. 원형 도선의 지름이 2배가 되면 저항은 1/4배가 된다.\n6. 일반적인 금속 도체는 온도가 높아지면 저항이 증가한다.\n7. 길이와 단면적이 동시에 변하면 두 변화 비율을 모두 고려해야 한다.\n\n---\n\n# 12. 5일차 1회차 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 기본 연습문제 | 15/16 |\n| 기본 정답률 | 93.8% |\n| 보충문제 | 5/5 |\n| 보충 정답률 | 100% |\n| 전체 정답 | 20/21 |\n| 최종 정답률 | 95.2% |\n| 학습 목표 | 달성 |\n\n## 잘 이해한 내용\n\n- 저항률과 도전율의 개념\n- 저항 공식 R = ρL/A\n- 도선의 길이와 저항 관계\n- 단면적과 지름의 변화에 따른 저항 계산\n- 온도 변화에 따른 금속 도체의 저항\n- 길이와 단면적이 동시에 변하는 응용 계산\n\n## 개선할 부분\n\n1. 길이와 단면적의 변화가 동시에 주어질 때 각각의 배율을 구분한다.\n2. 단면적이 감소하면 저항은 증가한다는 사실을 확인한다.\n3. 계산 결과가 합리적인지 비례·반비례 관계로 검산한다.\n\n## 최종 평가\n\n기본 연습문제 16문제 중 15문제를 맞혔다.\n\n길이와 단면적이 동시에 변하는 계산에서 오답이 한 문제 발생했지만, 보충문제 5문제를 모두 맞혀 해당 개념을 보완하였다.\n\n특히 서술형에서 저항의 비례·반비례 관계를 정확하게 설명하였다.\n\n<b>최종 판정: 5일차 1회차 학습 목표 달성</b>\n\n---\n\n# 13. 다음 학습 계획\n\n## 5일차 2회차: 정전기와 쿨롱의 법칙\n\n학습 예정 내용:\n\n1. 정전기와 전하의 개념\n2. 양전하와 음전하\n3. 쿨롱의 법칙\n4. 전하량과 거리 변화에 따른 전기력\n5. 전계의 세기\n6. 전위와 전위차\n7. 정전용량의 기초\n\n<b>다음 학습 목표</b>\n\n정전기 현상의 기본 원리를 이해하고, 쿨롱의 법칙을 이용하여 전하 사이에 작용하는 힘을 계산할 수 있다.","counts":{"correct":15,"total":16,"kind":"최초","label":"노션 확인 최초 성적"},"supplement":{"correct":5,"total":5},"sourceChecked":"2026-11-12","historyImportVersion":"public-history-2026-11-12-v1"},{"id":"past5","day":5,"round":2,"date":"2026-11-06","title":"정전기, 쿨롱의 법칙, 전계의 세기, 전위와 전위차, 정전용량","status":"완료","unitIds":["u7","u8","u9"],"concept":"# ⚡ 전기기능사 필기 5일차 2회차 학습 정리\n\n학습일: 2026년 11월 6일\n\n학습 주제: 정전기, 쿨롱의 법칙, 전계의 세기, 전위와 전위차, 정전용량\n\n## 학습 결과\n\n| 학습 영역 | 정답 | 전체 | 정답률 |\n| --- | --- | --- | --- |\n| 쿨롱의 법칙 | 9 | 10 | 90.0% |\n| 전계의 세기 | 10 | 11 | 90.9% |\n| 전위와 전위차 | 12 | 14 | 85.7% |\n| 정전용량 | 10 | 11 | 90.9% |\n| 전체 | 41 | 46 | 89.1% |\n\n※ 서술형의 세부 문항은 하나의 문제로 묶어 채점했다.\n\n최종 평가: 학습 목표 달성\n\n---\n\n# 1. 정전기와 쿨롱의 법칙\n\n## 1.1 정전기란?\n\n정전기는 전하가 물체에 축적되어 있는 상태와 관련된 전기 현상이다.\n\n전하에는 두 종류가 있다.\n\n- 양전하(+)\n- 음전하(−)\n\n전하 사이에는 다음과 같은 힘이 작용한다.\n\n- 같은 종류의 전하: 척력(서로 밀어내는 힘)\n- 다른 종류의 전하: 인력(서로 끌어당기는 힘)\n\n## 1.2 쿨롱의 법칙\n\n두 점전하 사이에 작용하는 전기력의 크기를 계산하는 법칙이다.\n\nF = k × |Q₁ × Q₂| / r²\n\n\n전기력(Electric force)은 전하를 띤 입자나 물체 사이에 작용하는 상호작용의 힘을 말합니다.\n\n\n- F: 전기력(N)\n- k: 쿨롱 상수\n- Q₁, Q₂: 두 전하량(C)\n- r: 두 전하 사이의 거리(m)\n\n진공에서 쿨롱 상수 k는 약 9 × 10⁹ N·m²/C²이다.\n\n### 핵심 관계\n\n전기력은 두 전하량의 곱에 비례한다.\n\n전기력은 두 전하 사이 거리의 제곱에 반비례한다.\n\n| 조건 변화 | 전기력 변화 |\n| --- | --- |\n| Q₁만 2배 | 2배 |\n| Q₁과 Q₂ 각각 2배 | 4배 |\n| 거리 2배 | 1/4배 |\n| 거리 3배 | 1/9배 |\n| 거리 1/2배 | 4배 |\n\n### 계산 예제\n\n초기 전기력: 40N\n\n변경 조건:\n\n- Q₁: 3배\n- Q₂: 2배\n- 거리: 2배\n\n계산:\n\nF₂ = 40 × (3 × 2)/2²\n\nF₂ = 40 × 6/4\n\nF₂ = 60N\n\n### 기본문제 1.1\n\n같은 종류의 전하 사이에 작용하는 힘은?\n\n① 인력 ② 척력 ③ 중력 ④ 자기력\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n해설: 같은 종류의 전하는 서로 밀어낸다.\n\n### 기본문제 1.2\n\n두 점전하 사이 거리를 3배로 늘리면 전기력은?\n\n① 3배 ② 1/3배 ③ 9배 ④ 1/9배\n\n- 제출 답안: ④\n- 정답: ④\n- 결과: 정답\n\n계산: 1/3² = 1/9배\n\n### 기본문제 1.3 — 오답\n\n두 점전하의 전하량을 각각 2배로 늘리면 전기력은?\n\n① 2배 ② 4배 ③ 1/2배 ④ 1/4배\n\n- 제출 답안: ①\n- 정답: ②\n- 결과: 오답\n\n해설:\n\n두 전하량의 곱에 비례하므로 2 × 2 = 4배가 된다.\n\n### 기본문제 1.4\n\n전기력이 36N일 때 거리를 3배로 늘리면?\n\n① 3N ② 4N ③ 9N ④ 12N\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n계산: 36/3² = 4N\n\n### 기본문제 1.5 — 서술형\n\n쿨롱의 법칙에서 전기력이 거리의 제곱에 반비례한다는 의미를 설명하시오.\n\n제출 답안:\n\n전기력은 거리의 제곱에 반비례한다.\n\n- 평가: 정답\n\n보충 설명: 두 전하량과 매질이 일정할 때 거리가 2배이면 전기력은 1/4배가 된다.\n\n### 보충 1\n\n두 전하량을 각각 3배로 늘리면 전기력은?\n\n① 3배 ② 6배 ③ 9배 ④ 27배\n\n- 제출 답안: ③\n- 정답: ③\n- 계산: 3 × 3 = 9배\n\n### 보충 2\n\nQ₁을 2배, Q₂를 4배로 증가시키면 전기력은?\n\n① 2배 ② 4배 ③ 6배 ④ 8배\n\n- 제출 답안: ④\n- 정답: ④\n- 계산: 2 × 4 = 8배\n\n### 보충 3\n\n전기력이 24N일 때 두 전하량과 거리를 각각 2배로 늘리면?\n\n① 6N ② 12N ③ 24N ④ 48N\n\n- 제출 답안: ③\n- 정답: ③\n- 계산: 24 × 2 × 2 / 2² = 24N\n\n### 보충 4\n\n초기 전기력 40N, Q₁은 3배, Q₂는 2배, 거리는 2배가 되면?\n\n① 30N ② 40N ③ 60N ④ 120N\n\n- 제출 답안: ③\n- 정답: ③\n- 계산: 40 × 3 × 2 / 2² = 60N\n\n### 보충 5 — 서술형\n\n초기 전기력 36N\n\n변경 조건:\n\n- Q₁: 2배\n- Q₂: 1/2배\n- 거리: 3배\n\nA. 두 전하량의 곱 변화: 1배\n\nB. 거리 변화에 따른 전기력 변화: 1/9배\n\nC. 최종 전기력: 4N\n\nD. 전기력이 감소하는 이유:\n\n두 전하량의 곱은 변하지 않았지만 거리가 3배 증가하여 전기력이 1/9배가 되었기 때문이다.\n\n보충문제 결과: 5/5 정답\n\n---\n\n# 2. 전계의 세기\n\n## 2.1 전계란?\n\n전계(전기장)는 전하가 다른 전하에 전기력을 작용시키는 공간이다.\n\n전계의 세기는 특정 위치에 놓인 단위 양전하가 받는 전기력이다.\n\n## 2.2 전계의 세기 공식\n\nE = F/q\n\n- E: 전계의 세기(N/C)\n- F: 전기력(N)\n- q: 시험전하(C)\n\n전계의 세기는 V/m로도 나타낼 수 있다.\n\n### 계산 예제\n\n전기력: 12N\n\n시험전하: 2C\n\nE = 12/2\n\nE = 6N/C\n\n## 2.3 점전하가 만드는 전계\n\nE = k|Q|/r²\n\n- Q: 전계를 만드는 원천전하\n- r: 원천전하로부터의 거리\n\n### 원천전하와 시험전하의 차이\n\n| 구분 | 원천전하 Q | 시험전하 q |\n| --- | --- | --- |\n| 역할 | 전계를 만듦 | 전계에서 힘을 받음 |\n| 전하량 증가 | 원천전하가 만드는 전계 증가 | 받는 전기력 증가 |\n| 기존 전계 | 변화 가능 | 이상적으로 변화 없음 |\n\n※ 시험전하는 원래 전계를 교란하지 않는다고 가정한다.\n\n핵심: 원천전하 Q와 시험전하 q를 구분해야 한다.\n\n### 문제 2.1\n\n전계의 세기 단위는?\n\n① V ② A ③ N/C ④ Ω\n\n- 제출 답안: ③\n- 정답: ③\n\n### 문제 2.2\n\n2C의 시험전하가 12N의 힘을 받을 때 전계의 세기는?\n\n① 3N/C ② 6N/C ③ 12N/C ④ 24N/C\n\n- 제출 답안: ②\n- 정답: ②\n\n계산: E = 12/2 = 6N/C\n\n### 문제 2.3\n\n전계의 세기가 8N/C일 때 3C의 양전하가 받는 힘은?\n\n① 8N ② 11N ③ 16N ④ 24N\n\n- 제출 답안: ④\n- 정답: ④\n\n계산: F = 3 × 8 = 24N\n\n### 문제 2.4\n\n점전하로부터의 거리를 2배로 늘리면 전계는?\n\n① 2배 ② 1/2배 ③ 1/4배 ④ 4배\n\n- 제출 답안: ③\n- 정답: ③\n\n### 문제 2.5\n\n원천전하를 3배, 거리를 2배로 늘리면 전계는?\n\n① 3/4배 ② 3/2배 ③ 4/3배 ④ 6배\n\n- 제출 답안: ①\n- 정답: ①\n\n계산: 3/2² = 3/4배\n\n### 문제 2.6 — 오답\n\n전계의 세기가 10N/C인 위치가 있다.\n\nA. 시험전하 2C가 받는 힘은?\n\n정답: 20N\n\nB. 시험전하 5C가 받는 힘은?\n\n정답: 50N\n\nC. 시험전하가 증가하면 전계도 변하는가?\n\n- 제출 답안: 변한다.\n- 정답: 변하지 않는다.\n\nD. 이유를 설명하시오.\n\n올바른 설명:\n\n시험전하가 변하면 받는 전기력은 변하지만, 시험전하가 원래 전계를 교란하지 않는 조건에서는 전계의 세기 자체는 변하지 않는다.\n\n### 보충 1\n\n20N/C의 전계에서 2C가 받는 힘은?\n\n① 10N ② 20N ③ 40N ④ 80N\n\n정답: ③ 40N\n\n### 보충 2\n\n시험전하를 2C에서 4C로 변경하면 원래 전계의 세기는?\n\n① 10N/C ② 20N/C ③ 40N/C ④ 80N/C\n\n정답: ② 20N/C\n\n### 보충 3\n\n원천전하를 3배로 증가시키면 12N/C의 전계는?\n\n① 4N/C ② 12N/C ③ 24N/C ④ 36N/C\n\n정답: ④ 36N/C\n\n### 보충 4\n\n다음 중 옳은 설명은?\n\n① 시험전하가 2배 증가하면 원래 전계도 반드시 2배 증가한다.\n\n② 원천전하가 2배 증가하면 같은 거리에서 전계도 2배 증가한다.\n\n③ 시험전하가 증가하면 전기력은 반드시 감소한다.\n\n④ 전계의 세기는 항상 0이다.\n\n정답: ②\n\n### 보충 5 — 서술형\n\n초기 전계: 15N/C\n\nA. 시험전하 2C가 받는 힘: 30N\n\nB. 시험전하 4C가 받는 힘: 60N\n\nC. 시험전하 변화 후 원래 전계: 15N/C\n\nD. 원천전하 2배 증가 시 전계: 30N/C\n\nE. 원천전하와 시험전하의 차이:\n\n원천전하는 전계를 만들고 시험전하는 전계에서 힘을 받는다. 시험전하가 원래 전계를 교란하지 않는다는 가정에서는 시험전하를 변경해도 원래 전계는 변하지 않는다.\n\n보충문제 결과: 5/5 정답\n\n---\n\n# 3. 전위와 전위차\n\n## 3.1 전위란?\n\n전위는 전기장 속 특정 위치에서 단위 양전하가 가지는 전기적 위치에너지이다.\n\n전위의 단위는 V(볼트)이다.\n\n공식:\n\nV = U/q\n\n- V: 전위(V)\n- U: 전기적 위치에너지(J)\n- q: 전하량(C)\n\n## 3.2 전위차\n\n전위차는 두 지점 사이의 전위 차이다.\n\nV_AB = V_A − V_B\n\n예제:\n\nA 지점: 30V\n\nB 지점: 10V\n\n전위차 = 30 − 10\n\n정답: 20V\n\n## 3.3 전기적 위치에너지\n\nU = qV\n\n전하량의 부호를 포함해 계산해야 한다.\n\n전기적 위치에너지 변화량:\n\nΔU = q(V₂ − V₁)\n\n전기장이 한 일:\n\nW = −ΔU\n\n### 양전하와 음전하 비교\n\n| 이동 방향 | 양전하 위치에너지 | 음전하 위치에너지 |\n| --- | --- | --- |\n| 낮은 전위 → 높은 전위 | 증가 | 감소 |\n| 높은 전위 → 낮은 전위 | 감소 | 증가 |\n\n※ 전기장 외의 힘이 작용하면 전하가 자연스러운 이동 방향과 반대로 이동할 수도 있다.\n\n## 3.4 계산 예제\n\n조건:\n\n- 전하량: −2C\n- 초기 전위: 10V\n- 최종 전위: 30V\n\n계산:\n\nU₁ = −2 × 10 = −20J\n\nU₂ = −2 × 30 = −60J\n\nΔU = −60 − (−20)\n\nΔU = −40J\n\n음전하가 높은 전위로 이동했으므로 위치에너지가 40J 감소했다.\n\n### 문제 3.1\n\n전위의 단위는?\n\n① A ② Ω ③ V ④ W\n\n정답: ③\n\n### 문제 3.2\n\nA 지점 30V, B 지점 10V일 때 V_A − V_B는?\n\n① 10V ② 20V ③ 30V ④ 40V\n\n정답: ② 20V\n\n### 문제 3.3\n\n전위차 20V에서 2C 전하의 전기적 에너지 변화 크기는?\n\n① 10J ② 20J ③ 40J ④ 80J\n\n정답: ③ 40J\n\n### 문제 3.4\n\n4C 전하의 위치에너지가 80J일 때 전위는?\n\n① 10V ② 20V ③ 40V ④ 80V\n\n정답: ② 20V\n\n### 문제 3.5\n\n올바른 설명은?\n\n① 전위 단위는 A이다.\n\n② 전위차는 두 지점의 전위 차이이다.\n\n③ 전위차가 0이면 반드시 전류가 흐른다.\n\n④ 전위는 항상 0이다.\n\n정답: ②\n\n### 문제 3.6 — 오답\n\n조건:\n\n- A 지점: 50V\n- B 지점: 10V\n- 양전하: +3C\n\nA. 전위차: 40V\n\nB. 위치에너지 변화 크기: 120J\n\nC. 전위가 높은 지점: A\n\nD. 양전하가 A에서 B로 이동할 때 위치에너지 변화:\n\n- 제출 답안: 증가\n- 정답: 감소\n\n계산:\n\nU_A = 3 × 50 = 150J\n\nU_B = 3 × 10 = 30J\n\nΔU = 30 − 150 = −120J\n\n위치에너지가 120J 감소한다.\n\n### 보충 1\n\n+2C의 전하가 30V에 있을 때 위치에너지는?\n\n① 15J ② 30J ③ 60J ④ 90J\n\n정답: ③ 60J\n\n### 보충 2\n\n+3C가 40V에서 10V로 이동하면?\n\n① 90J 증가 ② 90J 감소 ③ 30J 증가 ④ 30J 감소\n\n정답: ② 90J 감소\n\n### 보충 3 — 오답\n\n−2C가 10V에서 30V로 이동하면?\n\n① 40J 증가 ② 40J 감소 ③ 20J 증가 ④ 20J 감소\n\n- 제출 답안: ①\n- 정답: ②\n\n계산:\n\nΔU = −2 × (30 − 10)\n\nΔU = −40J\n\n### 보충 4\n\n올바른 설명은?\n\n① 양전하가 높은 전위에서 낮은 전위로 이동하면 위치에너지가 증가한다.\n\n② 음전하가 높은 전위에서 낮은 전위로 이동하면 위치에너지가 감소한다.\n\n③ 양전하가 높은 전위에서 낮은 전위로 이동하면 위치에너지가 감소한다.\n\n④ 전하의 종류와 관계없이 위치에너지는 항상 일정하다.\n\n정답: ③\n\n### 보충 5 — 서술형\n\n조건:\n\n- A 지점: 60V\n- B 지점: 20V\n- 전하량: +4C\n\nA. 초기 위치에너지: 240J\n\nB. 최종 위치에너지: 80J\n\nC. 변화량: −160J\n\nD. 전기장이 한 일: +160J\n\nE. 위치에너지 감소 이유:\n\n양전하는 높은 전위에서 낮은 전위로 이동하면 전기적 위치에너지가 감소한다.\n\n## 3.7 최종 확인문제\n\n### 확인 1\n\n−3C가 10V에서 20V로 이동하면 위치에너지 변화량은?\n\n① +30J ② −30J ③ +60J ④ −60J\n\n- 제출 답안: ②\n- 정답: ②\n\n계산:\n\nΔU = −3 × (20 − 10) = −30J\n\n### 확인 2\n\n−2C가 40V에서 10V로 이동하면?\n\n① 60J 증가 ② 60J 감소 ③ 80J 증가 ④ 80J 감소\n\n- 제출 답안: ①\n- 정답: ①\n\n계산:\n\nΔU = −2 × (10 − 40) = +60J\n\n### 확인 3 — 서술형\n\n조건:\n\n- 전하량: −4C\n- A 지점: 10V\n- B 지점: 50V\n\nA. 초기 위치에너지: −40J\n\nB. 최종 위치에너지: −200J\n\nC. 변화량: −160J\n\nD. 전기장이 한 일: +160J\n\nE. 위치에너지 감소 이유:\n\n음전하는 전하량의 부호가 음수이므로 전위가 높아지면 위치에너지가 감소한다.\n\n최종 확인문제 결과: 3/3 정답\n\n---\n\n# 4. 정전용량\n\n## 4.1 정전용량이란?\n\n정전용량은 전하를 저장하는 능력을 나타내는 물리량이다.\n\n정전용량을 가진 대표적인 전기 부품은 콘덴서(커패시터)이다.\n\n기본 공식:\n\nC = Q/V\n\n- C: 정전용량(F)\n- Q: 저장된 전하량의 크기(C)\n- V: 두 단자 사이의 전압(V)\n\n전하량 공식:\n\nQ = CV\n\n## 4.2 계산 예제\n\n정전용량 4F인 콘덴서에 5V를 가하면 저장되는 전하량은?\n\nQ = 4 × 5\n\n정답: 20C\n\n## 4.3 평행판 콘덴서\n\n기본 공식:\n\nC = εA/d\n\n- ε: 유전율\n- A: 도체판의 면적\n- d: 두 도체판 사이의 거리\n\n이상적인 평행판 콘덴서에서 다음 관계가 성립한다.\n\n- 판 면적 증가 → 정전용량 증가\n- 판 사이 거리 증가 → 정전용량 감소\n- 유전율 증가 → 정전용량 증가\n\n### 변화 배율\n\n| 변화 조건 | 정전용량 변화 |\n| --- | --- |\n| 판 면적 2배 | 2배 |\n| 판 면적 1/2배 | 1/2배 |\n| 판 사이 거리 2배 | 1/2배 |\n| 판 사이 거리 1/2배 | 2배 |\n| 판 사이 거리 1/3배 | 3배 |\n\n### 문제 4.1\n\n정전용량의 단위는?\n\n① V ② Ω ③ F ④ A\n\n정답: ③\n\n### 문제 4.2\n\n10V에서 20C의 전하를 저장하는 콘덴서의 정전용량은?\n\n① 1F ② 2F ③ 10F ④ 20F\n\n정답: ② 2F\n\n계산: C = 20/10 = 2F\n\n### 문제 4.3\n\n4F인 콘덴서에 5V를 가하면 전하량은?\n\n① 5C ② 10C ③ 15C ④ 20C\n\n정답: ④ 20C\n\n### 문제 4.4\n\n정전용량이 일정할 때 전압을 2배로 하면 저장 전하량은?\n\n① 1/4배 ② 1/2배 ③ 2배 ④ 4배\n\n정답: ③\n\n### 문제 4.5\n\n평행판 콘덴서의 판 면적을 3배로 늘리면 정전용량은?\n\n① 1/3배 ② 1배 ③ 3배 ④ 9배\n\n정답: ③\n\n### 문제 4.6\n\n평행판 콘덴서의 판 사이 거리를 2배로 늘리면 정전용량은?\n\n① 1/4배 ② 1/2배 ③ 2배 ④ 4배\n\n정답: ②\n\n### 문제 4.7 — 오답\n\n초기 정전용량: 6μF\n\n변경 조건:\n\n- 판 면적: 2배\n- 판 사이 거리: 1/2배\n- 유전율: 일정\n\nA. 면적 변화에 따른 정전용량 배율\n\n- 제출 답안: 2배\n- 정답: 2배\n\nB. 거리 변화에 따른 정전용량 배율\n\n- 제출 답안: 1/2배\n- 정답: 2배\n- 결과: 오답\n\nC. 최종 정전용량\n\n- 제출 답안: 24μF\n- 정답: 24μF\n\n계산:\n\nC₂ = 6 × 2 ÷ (1/2)\n\nC₂ = 24μF\n\nD. 정전용량 증가 이유\n\n판 면적은 2배 증가하고 판 사이 거리는 절반으로 감소했기 때문에 정전용량이 증가한다.\n\n### 보충 1\n\n판 사이 거리를 1/3배로 줄이면 정전용량은?\n\n① 1/3배 ② 1배 ③ 3배 ④ 9배\n\n정답: ③ 3배\n\n### 보충 2\n\n초기 정전용량 10μF, 판 면적과 거리를 모두 2배로 늘리면?\n\n① 5μF ② 10μF ③ 20μF ④ 40μF\n\n정답: ② 10μF\n\n계산:\n\nC₂ = 10 × 2/2 = 10μF\n\n### 보충 3\n\n초기 정전용량 8μF, 판 면적 3배, 거리 1/2배이면?\n\n① 12μF ② 24μF ③ 48μF ④ 64μF\n\n정답: ③ 48μF\n\n계산:\n\nC₂ = 8 × 3 ÷ (1/2)\n\nC₂ = 48μF\n\n### 보충 4 — 서술형\n\n초기 정전용량: 12μF\n\n변경 조건:\n\n- 판 면적: 1/2배\n- 판 사이 거리: 1/3배\n\nA. 면적 변화에 따른 정전용량 배율: 1/2배\n\nB. 거리 변화에 따른 정전용량 배율: 3배\n\nC. 최종 정전용량: 18μF\n\n계산:\n\nC₂ = 12 × (1/2) × 3\n\nC₂ = 18μF\n\nD. 정전용량이 증가하는 이유:\n\n판 면적 감소로 정전용량은 1/2배가 되지만 판 사이 거리 감소로 3배가 되므로 최종 정전용량은 1.5배 증가한다.\n\n보충문제 결과: 4/4 정답\n\n---\n\n## 오답 1. 쿨롱의 법칙\n\n문제: 두 전하량을 각각 2배로 증가시키면?\n\n- 제출 답안: 2배\n- 정답: 4배\n\n오답 원인:\n\n전하량 하나의 변화만 고려하였다.\n\n보완 개념:\n\n전기력은 두 전하량의 곱에 비례한다.\n\n2 × 2 = 4배\n\n보충학습 결과: 5/5 정답\n\n판정: 개념 보완 완료\n\n## 오답 2. 전계의 세기\n\n문제: 시험전하가 증가하면 원래 전계도 증가하는가?\n\n- 제출 답안: 증가한다.\n- 정답: 변하지 않는다.\n\n오답 원인:\n\n원천전하와 시험전하를 혼동하였다.\n\n보완 개념:\n\n- 원천전하 Q: 전계를 만드는 전하\n- 시험전하 q: 전계에서 힘을 받는 전하\n\n시험전하가 원래 전계를 교란하지 않는다고 가정하면 시험전하를 변경해도 기존 전계는 변하지 않는다.\n\n보충학습 결과: 5/5 정답\n\n판정: 개념 보완 완료\n\n## 오답 3. 양전하의 위치에너지\n\n문제: 양전하가 높은 전위에서 낮은 전위로 이동하면?\n\n- 제출 답안: 증가\n- 정답: 감소\n\n보완 개념:\n\nU = qV\n\n양전하는 q가 양수이므로 전위가 낮아지면 위치에너지도 감소한다.\n\n## 오답 4. 음전하의 위치에너지\n\n문제: −2C가 10V에서 30V로 이동하면?\n\n- 제출 답안: 40J 증가\n- 정답: 40J 감소\n\n계산:\n\nΔU = −2 × (30 − 10)\n\nΔU = −40J\n\n보완 개념:\n\n음전하는 전하량이 음수이므로 높은 전위로 이동할 때 위치에너지가 감소한다.\n\n최종 확인문제 결과: 3/3 정답\n\n판정: 개념 보완 완료\n\n## 오답 5. 평행판 콘덴서의 거리\n\n문제: 판 사이 거리가 1/2배가 되면 정전용량은?\n\n- 제출 답안: 1/2배\n- 정답: 2배\n\n오답 원인:\n\n거리 변화 비율을 정전용량 변화 비율에 그대로 적용하였다.\n\n보완 개념:\n\n정전용량은 판 사이 거리에 반비례한다.\n\n1 ÷ (1/2) = 2배\n\n보충학습 결과: 4/4 정답\n\n판정: 개념 보완 완료\n\n---\n\n# 6. 시험 직전 암기 공식\n\n| 학습 주제 | 공식 |\n| --- | --- |\n| 쿨롱의 법칙 | F = k × |Q₁Q₂|/r² |\n| 전계의 세기 | E = F/q |\n| 점전하가 만드는 전계 | E = k|Q|/r² |\n| 전위 | V = U/q |\n| 전위차 | V_AB = V_A − V_B |\n| 전기적 위치에너지 | U = qV |\n| 위치에너지 변화량 | ΔU = q(V₂ − V₁) |\n| 전기장이 한 일 | W = −ΔU |\n| 정전용량 | C = Q/V |\n| 저장 전하량 | Q = CV |\n| 평행판 콘덴서 | C = εA/d |\n\n## 반드시 암기할 8가지\n\n1. 같은 종류의 전하는 밀어내고 다른 종류의 전하는 끌어당긴다.\n2. 쿨롱의 법칙에서 전기력은 거리의 제곱에 반비례한다.\n3. 전계의 세기는 단위 양전하가 받는 힘이다.\n4. 원천전하와 시험전하의 역할은 다르다.\n5. 양전하는 높은 전위에서 낮은 전위로 이동하면 위치에너지가 감소한다.\n6. 음전하는 낮은 전위에서 높은 전위로 이동하면 위치에너지가 감소한다.\n7. 전기장이 한 일은 위치에너지 변화량의 음수이다.\n8. 평행판 콘덴서의 정전용량은 판 면적에 비례하고 판 사이 거리에 반비례한다.\n\n---\n\n## 잘 이해한 내용\n\n- 전하 사이의 인력과 척력\n- 쿨롱의 법칙 계산\n- 전하량과 거리의 복합 변화\n- 전계의 세기 계산\n- 원천전하와 시험전하의 구분\n- 양전하와 음전하의 위치에너지 계산\n- 전기장이 한 일과 위치에너지 변화량\n- 콘덴서의 정전용량 계산\n- 평행판 콘덴서의 면적·거리 변화\n\n## 개선할 부분\n\n1. 전하량과 거리 변화 배율을 구분하여 계산한다.\n2. 시험전하와 원천전하를 구분한다.\n3. 위치에너지 계산 시 전하량의 부호를 확인한다.\n4. 위치에너지 변화량과 전기장이 한 일의 부호를 구분한다.\n5. 정전용량 계산에서 거리 변화 비율의 역수를 적용한다.\n\n# 8. 5일차 전체 학습 평가\n\n| 구분 | 정답 | 전체 | 정답률 |\n| --- | --- | --- | --- |\n| 5일차 1회차 | 20 | 21 | 95.2% |\n| 5일차 2회차 | 41 | 46 | 89.1% |\n| 합계 | 61 | 67 | 91.0% |\n\n### 5일차 학습 성과\n\n하루 2회 학습을 통해 전기저항과 도체의 특성부터 정전용량까지 학습하였다.\n\n전체 67문제 중 61문제를 맞혔으며, 오답이 발생한 영역은 보충학습을 진행하였다.\n\n최종 평가: 하루 2회 학습 목표 달성\n\n---\n\n## 6일차 1회차\n\n주제: 콘덴서의 직렬·병렬 연결\n\n학습 예정 내용:\n\n1. 콘덴서 직렬 연결\n2. 콘덴서 병렬 연결\n3. 합성 정전용량 계산\n4. 직렬 연결에서 전하량과 전압의 관계\n5. 병렬 연결에서 전압과 전하량의 관계\n6. 전기기능사 필기 응용문제\n\n## 6일차 2회차\n\n주제: 콘덴서에 저장되는 에너지와 전기이론 종합 복습\n\n학습 예정 내용:\n\n1. 콘덴서에 저장되는 에너지\n2. 저장 에너지 계산 공식\n3. 전압과 정전용량 변화에 따른 에너지\n4. 직렬·병렬 콘덴서 응용 계산\n5. 전기이론 누적 복습문제\n\n다음 학습 목표: 콘덴서의 직렬·병렬 연결을 이해하고 합성 정전용량과 저장 에너지를 계산할 수 있다.","examples":"### 계산 예제\n\n초기 전기력: 40N\n\n변경 조건:\n\n- Q₁: 3배\n- Q₂: 2배\n- 거리: 2배\n\n계산:\n\nF₂ = 40 × (3 × 2)/2²\n\nF₂ = 40 × 6/4\n\nF₂ = 60N\n\n### 기본문제 1.5 — 서술형\n\n쿨롱의 법칙에서 전기력이 거리의 제곱에 반비례한다는 의미를 설명하시오.\n\n제출 답안:\n\n전기력은 거리의 제곱에 반비례한다.\n\n- 평가: 정답\n\n보충 설명: 두 전하량과 매질이 일정할 때 거리가 2배이면 전기력은 1/4배가 된다.\n\n### 보충 5 — 서술형\n\n초기 전기력 36N\n\n변경 조건:\n\n- Q₁: 2배\n- Q₂: 1/2배\n- 거리: 3배\n\nA. 두 전하량의 곱 변화: 1배\n\nB. 거리 변화에 따른 전기력 변화: 1/9배\n\nC. 최종 전기력: 4N\n\nD. 전기력이 감소하는 이유:\n\n두 전하량의 곱은 변하지 않았지만 거리가 3배 증가하여 전기력이 1/9배가 되었기 때문이다.\n\n보충문제 결과: 5/5 정답\n\n---\n\n### 계산 예제\n\n전기력: 12N\n\n시험전하: 2C\n\nE = 12/2\n\nE = 6N/C\n\n### 보충 5 — 서술형\n\n초기 전계: 15N/C\n\nA. 시험전하 2C가 받는 힘: 30N\n\nB. 시험전하 4C가 받는 힘: 60N\n\nC. 시험전하 변화 후 원래 전계: 15N/C\n\nD. 원천전하 2배 증가 시 전계: 30N/C\n\nE. 원천전하와 시험전하의 차이:\n\n원천전하는 전계를 만들고 시험전하는 전계에서 힘을 받는다. 시험전하가 원래 전계를 교란하지 않는다는 가정에서는 시험전하를 변경해도 원래 전계는 변하지 않는다.\n\n보충문제 결과: 5/5 정답\n\n---\n\n## 3.4 계산 예제\n\n조건:\n\n- 전하량: −2C\n- 초기 전위: 10V\n- 최종 전위: 30V\n\n계산:\n\nU₁ = −2 × 10 = −20J\n\nU₂ = −2 × 30 = −60J\n\nΔU = −60 − (−20)\n\nΔU = −40J\n\n음전하가 높은 전위로 이동했으므로 위치에너지가 40J 감소했다.\n\n### 보충 5 — 서술형\n\n조건:\n\n- A 지점: 60V\n- B 지점: 20V\n- 전하량: +4C\n\nA. 초기 위치에너지: 240J\n\nB. 최종 위치에너지: 80J\n\nC. 변화량: −160J\n\nD. 전기장이 한 일: +160J\n\nE. 위치에너지 감소 이유:\n\n양전하는 높은 전위에서 낮은 전위로 이동하면 전기적 위치에너지가 감소한다.\n\n### 확인 3 — 서술형\n\n조건:\n\n- 전하량: −4C\n- A 지점: 10V\n- B 지점: 50V\n\nA. 초기 위치에너지: −40J\n\nB. 최종 위치에너지: −200J\n\nC. 변화량: −160J\n\nD. 전기장이 한 일: +160J\n\nE. 위치에너지 감소 이유:\n\n음전하는 전하량의 부호가 음수이므로 전위가 높아지면 위치에너지가 감소한다.\n\n최종 확인문제 결과: 3/3 정답\n\n---\n\n## 4.2 계산 예제\n\n정전용량 4F인 콘덴서에 5V를 가하면 저장되는 전하량은?\n\nQ = 4 × 5\n\n정답: 20C\n\n### 보충 4 — 서술형\n\n초기 정전용량: 12μF\n\n변경 조건:\n\n- 판 면적: 1/2배\n- 판 사이 거리: 1/3배\n\nA. 면적 변화에 따른 정전용량 배율: 1/2배\n\nB. 거리 변화에 따른 정전용량 배율: 3배\n\nC. 최종 정전용량: 18μF\n\n계산:\n\nC₂ = 12 × (1/2) × 3\n\nC₂ = 18μF\n\nD. 정전용량이 증가하는 이유:\n\n판 면적 감소로 정전용량은 1/2배가 되지만 판 사이 거리 감소로 3배가 되므로 최종 정전용량은 1.5배 증가한다.\n\n보충문제 결과: 4/4 정답\n\n---","notes":"## 1.3 쿨롱의 법칙 연습문제 및 해설\n\n## 1.4 쿨롱의 법칙 보충문제\n\n## 2.4 기본 연습문제\n\n## 2.5 보충문제\n\n## 3.5 기본 연습문제\n\n## 3.6 보충문제\n\n## 4.4 기본 연습문제\n\n## 4.5 정전용량 보충문제\n\n# 5. 오답노트\n\n# 7. 5일차 2회차 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 쿨롱의 법칙 | 9/10 |\n| 전계의 세기 | 10/11 |\n| 전위와 전위차 | 12/14 |\n| 정전용량 | 10/11 |\n| 전체 정답 | 41/46 |\n| 최종 정답률 | 89.1% |\n| 학습 목표 | 달성 |\n\n## 최종 평가\n\n기본 연습문제에서 일부 개념 오류가 발생했지만 보충학습을 통해 대부분의 취약 개념을 보완하였다.\n\n특히 쿨롱의 법칙과 전계의 세기에서는 계산 능력이 우수했고, 전위와 위치에너지에서는 양전하와 음전하의 차이를 최종 확인문제로 검증하였다.\n\n정전용량 단원에서도 판 면적과 거리의 변화에 따른 응용 계산을 정확하게 해결하였다.\n\n최종 판정: 5일차 2회차 학습 목표 달성\n\n---\n\n# 9. 다음 학습 계획\n\n가져오기: 노션 확인 기록 전체를 보존했습니다. 문항별 제출 답안·정답은 원문 탭에서 볼 수 있습니다. 기록에 없는 성적·완료 범위는 추정하지 않았습니다.","questions":[],"source":"","sourceText":"# ⚡ 전기기능사 필기 5일차 2회차 학습 정리\n\n<b>학습일:</b> 2026년 11월 6일\n\n<b>학습 주제:</b> 정전기, 쿨롱의 법칙, 전계의 세기, 전위와 전위차, 정전용량\n\n## 학습 결과\n\n| 학습 영역 | 정답 | 전체 | 정답률 |\n| --- | --- | --- | --- |\n| 쿨롱의 법칙 | 9 | 10 | 90.0% |\n| 전계의 세기 | 10 | 11 | 90.9% |\n| 전위와 전위차 | 12 | 14 | 85.7% |\n| 정전용량 | 10 | 11 | 90.9% |\n| <b>전체</b> | <b>41</b> | <b>46</b> | <b>89.1%</b> |\n\n※ 서술형의 세부 문항은 하나의 문제로 묶어 채점했다.\n\n<b>최종 평가: 학습 목표 달성</b>\n\n---\n\n# 1. 정전기와 쿨롱의 법칙\n\n## 1.1 정전기란?\n\n정전기는 전하가 물체에 축적되어 있는 상태와 관련된 전기 현상이다.\n\n전하에는 두 종류가 있다.\n\n- 양전하(+)\n- 음전하(−)\n\n전하 사이에는 다음과 같은 힘이 작용한다.\n\n- 같은 종류의 전하: 척력(서로 밀어내는 힘)\n- 다른 종류의 전하: 인력(서로 끌어당기는 힘)\n\n## 1.2 쿨롱의 법칙\n\n두 점전하 사이에 작용하는 전기력의 크기를 계산하는 법칙이다.\n\n<b>F = k × \\|Q₁ × Q₂\\| / r²</b>\n\n<p color=\"red_bg\">\n<b>전기력(Electric force)</b>은 전하를 띤 입자나 물체 사이에 작용하는 상호작용의 힘을 말합니다.\n</p>\n\n- F: 전기력(N)\n- k: 쿨롱 상수\n- Q₁, Q₂: 두 전하량(C)\n- r: 두 전하 사이의 거리(m)\n\n진공에서 쿨롱 상수 k는 약 9 × 10⁹ N·m²/C²이다.\n\n### 핵심 관계\n\n전기력은 두 전하량의 곱에 비례한다.\n\n전기력은 두 전하 사이 거리의 제곱에 반비례한다.\n\n| 조건 변화 | 전기력 변화 |\n| --- | --- |\n| Q₁만 2배 | 2배 |\n| Q₁과 Q₂ 각각 2배 | 4배 |\n| 거리 2배 | 1/4배 |\n| 거리 3배 | 1/9배 |\n| 거리 1/2배 | 4배 |\n\n### 계산 예제\n\n초기 전기력: 40N\n\n변경 조건:\n\n- Q₁: 3배\n- Q₂: 2배\n- 거리: 2배\n\n계산:\n\nF₂ = 40 × (3 × 2)/2²\n\nF₂ = 40 × 6/4\n\n<b>F₂ = 60N</b>\n\n## 1.3 쿨롱의 법칙 연습문제 및 해설\n\n### 기본문제 1.1\n\n같은 종류의 전하 사이에 작용하는 힘은?\n\n① 인력 ② 척력 ③ 중력 ④ 자기력\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n해설: 같은 종류의 전하는 서로 밀어낸다.\n\n### 기본문제 1.2\n\n두 점전하 사이 거리를 3배로 늘리면 전기력은?\n\n① 3배 ② 1/3배 ③ 9배 ④ 1/9배\n\n- 제출 답안: ④\n- 정답: ④\n- 결과: 정답\n\n계산: 1/3² = 1/9배\n\n### 기본문제 1.3 — 오답\n\n두 점전하의 전하량을 각각 2배로 늘리면 전기력은?\n\n① 2배 ② 4배 ③ 1/2배 ④ 1/4배\n\n- 제출 답안: ①\n- 정답: ②\n- 결과: 오답\n\n해설:\n\n두 전하량의 곱에 비례하므로 2 × 2 = 4배가 된다.\n\n### 기본문제 1.4\n\n전기력이 36N일 때 거리를 3배로 늘리면?\n\n① 3N ② 4N ③ 9N ④ 12N\n\n- 제출 답안: ②\n- 정답: ②\n- 결과: 정답\n\n계산: 36/3² = 4N\n\n### 기본문제 1.5 — 서술형\n\n쿨롱의 법칙에서 전기력이 거리의 제곱에 반비례한다는 의미를 설명하시오.\n\n제출 답안:\n\n전기력은 거리의 제곱에 반비례한다.\n\n- 평가: 정답\n\n보충 설명: 두 전하량과 매질이 일정할 때 거리가 2배이면 전기력은 1/4배가 된다.\n\n## 1.4 쿨롱의 법칙 보충문제\n\n### 보충 1\n\n두 전하량을 각각 3배로 늘리면 전기력은?\n\n① 3배 ② 6배 ③ 9배 ④ 27배\n\n- 제출 답안: ③\n- 정답: ③\n- 계산: 3 × 3 = 9배\n\n### 보충 2\n\nQ₁을 2배, Q₂를 4배로 증가시키면 전기력은?\n\n① 2배 ② 4배 ③ 6배 ④ 8배\n\n- 제출 답안: ④\n- 정답: ④\n- 계산: 2 × 4 = 8배\n\n### 보충 3\n\n전기력이 24N일 때 두 전하량과 거리를 각각 2배로 늘리면?\n\n① 6N ② 12N ③ 24N ④ 48N\n\n- 제출 답안: ③\n- 정답: ③\n- 계산: 24 × 2 × 2 / 2² = 24N\n\n### 보충 4\n\n초기 전기력 40N, Q₁은 3배, Q₂는 2배, 거리는 2배가 되면?\n\n① 30N ② 40N ③ 60N ④ 120N\n\n- 제출 답안: ③\n- 정답: ③\n- 계산: 40 × 3 × 2 / 2² = 60N\n\n### 보충 5 — 서술형\n\n초기 전기력 36N\n\n변경 조건:\n\n- Q₁: 2배\n- Q₂: 1/2배\n- 거리: 3배\n\nA. 두 전하량의 곱 변화: 1배\n\nB. 거리 변화에 따른 전기력 변화: 1/9배\n\nC. 최종 전기력: 4N\n\nD. 전기력이 감소하는 이유:\n\n두 전하량의 곱은 변하지 않았지만 거리가 3배 증가하여 전기력이 1/9배가 되었기 때문이다.\n\n<b>보충문제 결과: 5/5 정답</b>\n\n---\n\n# 2. 전계의 세기\n\n## 2.1 전계란?\n\n전계(전기장)는 전하가 다른 전하에 전기력을 작용시키는 공간이다.\n\n전계의 세기는 특정 위치에 놓인 단위 양전하가 받는 전기력이다.\n\n## 2.2 전계의 세기 공식\n\n<b>E = F/q</b>\n\n- E: 전계의 세기(N/C)\n- F: 전기력(N)\n- q: 시험전하(C)\n\n전계의 세기는 V/m로도 나타낼 수 있다.\n\n### 계산 예제\n\n전기력: 12N\n\n시험전하: 2C\n\nE = 12/2\n\n<b>E = 6N/C</b>\n\n## 2.3 점전하가 만드는 전계\n\n<b>E = k\\|Q\\|/r²</b>\n\n- Q: 전계를 만드는 원천전하\n- r: 원천전하로부터의 거리\n\n### 원천전하와 시험전하의 차이\n\n| 구분 | 원천전하 Q | 시험전하 q |\n| --- | --- | --- |\n| 역할 | 전계를 만듦 | 전계에서 힘을 받음 |\n| 전하량 증가 | 원천전하가 만드는 전계 증가 | 받는 전기력 증가 |\n| 기존 전계 | 변화 가능 | 이상적으로 변화 없음 |\n\n※ 시험전하는 원래 전계를 교란하지 않는다고 가정한다.\n\n<b>핵심: 원천전하 Q와 시험전하 q를 구분해야 한다.</b>\n\n## 2.4 기본 연습문제\n\n### 문제 2.1\n\n전계의 세기 단위는?\n\n① V ② A ③ N/C ④ Ω\n\n- 제출 답안: ③\n- 정답: ③\n\n### 문제 2.2\n\n2C의 시험전하가 12N의 힘을 받을 때 전계의 세기는?\n\n① 3N/C ② 6N/C ③ 12N/C ④ 24N/C\n\n- 제출 답안: ②\n- 정답: ②\n\n계산: E = 12/2 = 6N/C\n\n### 문제 2.3\n\n전계의 세기가 8N/C일 때 3C의 양전하가 받는 힘은?\n\n① 8N ② 11N ③ 16N ④ 24N\n\n- 제출 답안: ④\n- 정답: ④\n\n계산: F = 3 × 8 = 24N\n\n### 문제 2.4\n\n점전하로부터의 거리를 2배로 늘리면 전계는?\n\n① 2배 ② 1/2배 ③ 1/4배 ④ 4배\n\n- 제출 답안: ③\n- 정답: ③\n\n### 문제 2.5\n\n원천전하를 3배, 거리를 2배로 늘리면 전계는?\n\n① 3/4배 ② 3/2배 ③ 4/3배 ④ 6배\n\n- 제출 답안: ①\n- 정답: ①\n\n계산: 3/2² = 3/4배\n\n### 문제 2.6 — 오답\n\n전계의 세기가 10N/C인 위치가 있다.\n\nA. 시험전하 2C가 받는 힘은?\n\n정답: 20N\n\nB. 시험전하 5C가 받는 힘은?\n\n정답: 50N\n\nC. 시험전하가 증가하면 전계도 변하는가?\n\n- 제출 답안: 변한다.\n- 정답: 변하지 않는다.\n\nD. 이유를 설명하시오.\n\n올바른 설명:\n\n시험전하가 변하면 받는 전기력은 변하지만, 시험전하가 원래 전계를 교란하지 않는 조건에서는 전계의 세기 자체는 변하지 않는다.\n\n## 2.5 보충문제\n\n### 보충 1\n\n20N/C의 전계에서 2C가 받는 힘은?\n\n① 10N ② 20N ③ 40N ④ 80N\n\n정답: ③ 40N\n\n### 보충 2\n\n시험전하를 2C에서 4C로 변경하면 원래 전계의 세기는?\n\n① 10N/C ② 20N/C ③ 40N/C ④ 80N/C\n\n정답: ② 20N/C\n\n### 보충 3\n\n원천전하를 3배로 증가시키면 12N/C의 전계는?\n\n① 4N/C ② 12N/C ③ 24N/C ④ 36N/C\n\n정답: ④ 36N/C\n\n### 보충 4\n\n다음 중 옳은 설명은?\n\n① 시험전하가 2배 증가하면 원래 전계도 반드시 2배 증가한다.\n\n② 원천전하가 2배 증가하면 같은 거리에서 전계도 2배 증가한다.\n\n③ 시험전하가 증가하면 전기력은 반드시 감소한다.\n\n④ 전계의 세기는 항상 0이다.\n\n정답: ②\n\n### 보충 5 — 서술형\n\n초기 전계: 15N/C\n\nA. 시험전하 2C가 받는 힘: 30N\n\nB. 시험전하 4C가 받는 힘: 60N\n\nC. 시험전하 변화 후 원래 전계: 15N/C\n\nD. 원천전하 2배 증가 시 전계: 30N/C\n\nE. 원천전하와 시험전하의 차이:\n\n원천전하는 전계를 만들고 시험전하는 전계에서 힘을 받는다. 시험전하가 원래 전계를 교란하지 않는다는 가정에서는 시험전하를 변경해도 원래 전계는 변하지 않는다.\n\n<b>보충문제 결과: 5/5 정답</b>\n\n---\n\n# 3. 전위와 전위차\n\n## 3.1 전위란?\n\n전위는 전기장 속 특정 위치에서 단위 양전하가 가지는 전기적 위치에너지이다.\n\n전위의 단위는 V(볼트)이다.\n\n공식:\n\n<b>V = U/q</b>\n\n- V: 전위(V)\n- U: 전기적 위치에너지(J)\n- q: 전하량(C)\n\n## 3.2 전위차\n\n전위차는 두 지점 사이의 전위 차이다.\n\nV\\_AB = V\\_A − V\\_B\n\n예제:\n\nA 지점: 30V\n\nB 지점: 10V\n\n전위차 = 30 − 10\n\n정답: 20V\n\n## 3.3 전기적 위치에너지\n\n<b>U = qV</b>\n\n전하량의 부호를 포함해 계산해야 한다.\n\n전기적 위치에너지 변화량:\n\n<b>ΔU = q(V₂ − V₁)</b>\n\n전기장이 한 일:\n\n<b>W = −ΔU</b>\n\n### 양전하와 음전하 비교\n\n| 이동 방향 | 양전하 위치에너지 | 음전하 위치에너지 |\n| --- | --- | --- |\n| 낮은 전위 → 높은 전위 | 증가 | 감소 |\n| 높은 전위 → 낮은 전위 | 감소 | 증가 |\n\n※ 전기장 외의 힘이 작용하면 전하가 자연스러운 이동 방향과 반대로 이동할 수도 있다.\n\n## 3.4 계산 예제\n\n조건:\n\n- 전하량: −2C\n- 초기 전위: 10V\n- 최종 전위: 30V\n\n계산:\n\nU₁ = −2 × 10 = −20J\n\nU₂ = −2 × 30 = −60J\n\nΔU = −60 − (−20)\n\n<b>ΔU = −40J</b>\n\n음전하가 높은 전위로 이동했으므로 위치에너지가 40J 감소했다.\n\n## 3.5 기본 연습문제\n\n### 문제 3.1\n\n전위의 단위는?\n\n① A ② Ω ③ V ④ W\n\n정답: ③\n\n### 문제 3.2\n\nA 지점 30V, B 지점 10V일 때 V\\_A − V\\_B는?\n\n① 10V ② 20V ③ 30V ④ 40V\n\n정답: ② 20V\n\n### 문제 3.3\n\n전위차 20V에서 2C 전하의 전기적 에너지 변화 크기는?\n\n① 10J ② 20J ③ 40J ④ 80J\n\n정답: ③ 40J\n\n### 문제 3.4\n\n4C 전하의 위치에너지가 80J일 때 전위는?\n\n① 10V ② 20V ③ 40V ④ 80V\n\n정답: ② 20V\n\n### 문제 3.5\n\n올바른 설명은?\n\n① 전위 단위는 A이다.\n\n② 전위차는 두 지점의 전위 차이이다.\n\n③ 전위차가 0이면 반드시 전류가 흐른다.\n\n④ 전위는 항상 0이다.\n\n정답: ②\n\n### 문제 3.6 — 오답\n\n조건:\n\n- A 지점: 50V\n- B 지점: 10V\n- 양전하: +3C\n\nA. 전위차: 40V\n\nB. 위치에너지 변화 크기: 120J\n\nC. 전위가 높은 지점: A\n\nD. 양전하가 A에서 B로 이동할 때 위치에너지 변화:\n\n- 제출 답안: 증가\n- 정답: 감소\n\n계산:\n\nU\\_A = 3 × 50 = 150J\n\nU\\_B = 3 × 10 = 30J\n\nΔU = 30 − 150 = −120J\n\n위치에너지가 120J 감소한다.\n\n## 3.6 보충문제\n\n### 보충 1\n\n+2C의 전하가 30V에 있을 때 위치에너지는?\n\n① 15J ② 30J ③ 60J ④ 90J\n\n정답: ③ 60J\n\n### 보충 2\n\n+3C가 40V에서 10V로 이동하면?\n\n① 90J 증가 ② 90J 감소 ③ 30J 증가 ④ 30J 감소\n\n정답: ② 90J 감소\n\n### 보충 3 — 오답\n\n−2C가 10V에서 30V로 이동하면?\n\n① 40J 증가 ② 40J 감소 ③ 20J 증가 ④ 20J 감소\n\n- 제출 답안: ①\n- 정답: ②\n\n계산:\n\nΔU = −2 × (30 − 10)\n\nΔU = −40J\n\n### 보충 4\n\n올바른 설명은?\n\n① 양전하가 높은 전위에서 낮은 전위로 이동하면 위치에너지가 증가한다.\n\n② 음전하가 높은 전위에서 낮은 전위로 이동하면 위치에너지가 감소한다.\n\n③ 양전하가 높은 전위에서 낮은 전위로 이동하면 위치에너지가 감소한다.\n\n④ 전하의 종류와 관계없이 위치에너지는 항상 일정하다.\n\n정답: ③\n\n### 보충 5 — 서술형\n\n조건:\n\n- A 지점: 60V\n- B 지점: 20V\n- 전하량: +4C\n\nA. 초기 위치에너지: 240J\n\nB. 최종 위치에너지: 80J\n\nC. 변화량: −160J\n\nD. 전기장이 한 일: +160J\n\nE. 위치에너지 감소 이유:\n\n양전하는 높은 전위에서 낮은 전위로 이동하면 전기적 위치에너지가 감소한다.\n\n## 3.7 최종 확인문제\n\n### 확인 1\n\n−3C가 10V에서 20V로 이동하면 위치에너지 변화량은?\n\n① +30J ② −30J ③ +60J ④ −60J\n\n- 제출 답안: ②\n- 정답: ②\n\n계산:\n\nΔU = −3 × (20 − 10) = −30J\n\n### 확인 2\n\n−2C가 40V에서 10V로 이동하면?\n\n① 60J 증가 ② 60J 감소 ③ 80J 증가 ④ 80J 감소\n\n- 제출 답안: ①\n- 정답: ①\n\n계산:\n\nΔU = −2 × (10 − 40) = +60J\n\n### 확인 3 — 서술형\n\n조건:\n\n- 전하량: −4C\n- A 지점: 10V\n- B 지점: 50V\n\nA. 초기 위치에너지: −40J\n\nB. 최종 위치에너지: −200J\n\nC. 변화량: −160J\n\nD. 전기장이 한 일: +160J\n\nE. 위치에너지 감소 이유:\n\n음전하는 전하량의 부호가 음수이므로 전위가 높아지면 위치에너지가 감소한다.\n\n<b>최종 확인문제 결과: 3/3 정답</b>\n\n---\n\n# 4. 정전용량\n\n## 4.1 정전용량이란?\n\n정전용량은 전하를 저장하는 능력을 나타내는 물리량이다.\n\n정전용량을 가진 대표적인 전기 부품은 콘덴서(커패시터)이다.\n\n기본 공식:\n\n<b>C = Q/V</b>\n\n- C: 정전용량(F)\n- Q: 저장된 전하량의 크기(C)\n- V: 두 단자 사이의 전압(V)\n\n전하량 공식:\n\n<b>Q = CV</b>\n\n## 4.2 계산 예제\n\n정전용량 4F인 콘덴서에 5V를 가하면 저장되는 전하량은?\n\nQ = 4 × 5\n\n정답: 20C\n\n## 4.3 평행판 콘덴서\n\n기본 공식:\n\n<b>C = εA/d</b>\n\n- ε: 유전율\n- A: 도체판의 면적\n- d: 두 도체판 사이의 거리\n\n이상적인 평행판 콘덴서에서 다음 관계가 성립한다.\n\n- 판 면적 증가 → 정전용량 증가\n- 판 사이 거리 증가 → 정전용량 감소\n- 유전율 증가 → 정전용량 증가\n\n### 변화 배율\n\n| 변화 조건 | 정전용량 변화 |\n| --- | --- |\n| 판 면적 2배 | 2배 |\n| 판 면적 1/2배 | 1/2배 |\n| 판 사이 거리 2배 | 1/2배 |\n| 판 사이 거리 1/2배 | 2배 |\n| 판 사이 거리 1/3배 | 3배 |\n\n## 4.4 기본 연습문제\n\n### 문제 4.1\n\n정전용량의 단위는?\n\n① V ② Ω ③ F ④ A\n\n정답: ③\n\n### 문제 4.2\n\n10V에서 20C의 전하를 저장하는 콘덴서의 정전용량은?\n\n① 1F ② 2F ③ 10F ④ 20F\n\n정답: ② 2F\n\n계산: C = 20/10 = 2F\n\n### 문제 4.3\n\n4F인 콘덴서에 5V를 가하면 전하량은?\n\n① 5C ② 10C ③ 15C ④ 20C\n\n정답: ④ 20C\n\n### 문제 4.4\n\n정전용량이 일정할 때 전압을 2배로 하면 저장 전하량은?\n\n① 1/4배 ② 1/2배 ③ 2배 ④ 4배\n\n정답: ③\n\n### 문제 4.5\n\n평행판 콘덴서의 판 면적을 3배로 늘리면 정전용량은?\n\n① 1/3배 ② 1배 ③ 3배 ④ 9배\n\n정답: ③\n\n### 문제 4.6\n\n평행판 콘덴서의 판 사이 거리를 2배로 늘리면 정전용량은?\n\n① 1/4배 ② 1/2배 ③ 2배 ④ 4배\n\n정답: ②\n\n### 문제 4.7 — 오답\n\n초기 정전용량: 6μF\n\n변경 조건:\n\n- 판 면적: 2배\n- 판 사이 거리: 1/2배\n- 유전율: 일정\n\nA. 면적 변화에 따른 정전용량 배율\n\n- 제출 답안: 2배\n- 정답: 2배\n\nB. 거리 변화에 따른 정전용량 배율\n\n- 제출 답안: 1/2배\n- 정답: 2배\n- 결과: 오답\n\nC. 최종 정전용량\n\n- 제출 답안: 24μF\n- 정답: 24μF\n\n계산:\n\nC₂ = 6 × 2 ÷ (1/2)\n\nC₂ = 24μF\n\nD. 정전용량 증가 이유\n\n판 면적은 2배 증가하고 판 사이 거리는 절반으로 감소했기 때문에 정전용량이 증가한다.\n\n## 4.5 정전용량 보충문제\n\n### 보충 1\n\n판 사이 거리를 1/3배로 줄이면 정전용량은?\n\n① 1/3배 ② 1배 ③ 3배 ④ 9배\n\n정답: ③ 3배\n\n### 보충 2\n\n초기 정전용량 10μF, 판 면적과 거리를 모두 2배로 늘리면?\n\n① 5μF ② 10μF ③ 20μF ④ 40μF\n\n정답: ② 10μF\n\n계산:\n\nC₂ = 10 × 2/2 = 10μF\n\n### 보충 3\n\n초기 정전용량 8μF, 판 면적 3배, 거리 1/2배이면?\n\n① 12μF ② 24μF ③ 48μF ④ 64μF\n\n정답: ③ 48μF\n\n계산:\n\nC₂ = 8 × 3 ÷ (1/2)\n\nC₂ = 48μF\n\n### 보충 4 — 서술형\n\n초기 정전용량: 12μF\n\n변경 조건:\n\n- 판 면적: 1/2배\n- 판 사이 거리: 1/3배\n\nA. 면적 변화에 따른 정전용량 배율: 1/2배\n\nB. 거리 변화에 따른 정전용량 배율: 3배\n\nC. 최종 정전용량: 18μF\n\n계산:\n\nC₂ = 12 × (1/2) × 3\n\nC₂ = 18μF\n\nD. 정전용량이 증가하는 이유:\n\n판 면적 감소로 정전용량은 1/2배가 되지만 판 사이 거리 감소로 3배가 되므로 최종 정전용량은 1.5배 증가한다.\n\n<b>보충문제 결과: 4/4 정답</b>\n\n---\n\n# 5. 오답노트\n\n## 오답 1. 쿨롱의 법칙\n\n<b>문제:</b> 두 전하량을 각각 2배로 증가시키면?\n\n- 제출 답안: 2배\n- 정답: 4배\n\n오답 원인:\n\n전하량 하나의 변화만 고려하였다.\n\n보완 개념:\n\n전기력은 두 전하량의 곱에 비례한다.\n\n2 × 2 = 4배\n\n보충학습 결과: 5/5 정답\n\n<b>판정: 개념 보완 완료</b>\n\n## 오답 2. 전계의 세기\n\n<b>문제:</b> 시험전하가 증가하면 원래 전계도 증가하는가?\n\n- 제출 답안: 증가한다.\n- 정답: 변하지 않는다.\n\n오답 원인:\n\n원천전하와 시험전하를 혼동하였다.\n\n보완 개념:\n\n- 원천전하 Q: 전계를 만드는 전하\n- 시험전하 q: 전계에서 힘을 받는 전하\n\n시험전하가 원래 전계를 교란하지 않는다고 가정하면 시험전하를 변경해도 기존 전계는 변하지 않는다.\n\n보충학습 결과: 5/5 정답\n\n<b>판정: 개념 보완 완료</b>\n\n## 오답 3. 양전하의 위치에너지\n\n<b>문제:</b> 양전하가 높은 전위에서 낮은 전위로 이동하면?\n\n- 제출 답안: 증가\n- 정답: 감소\n\n보완 개념:\n\nU = qV\n\n양전하는 q가 양수이므로 전위가 낮아지면 위치에너지도 감소한다.\n\n## 오답 4. 음전하의 위치에너지\n\n<b>문제:</b> −2C가 10V에서 30V로 이동하면?\n\n- 제출 답안: 40J 증가\n- 정답: 40J 감소\n\n계산:\n\nΔU = −2 × (30 − 10)\n\nΔU = −40J\n\n보완 개념:\n\n음전하는 전하량이 음수이므로 높은 전위로 이동할 때 위치에너지가 감소한다.\n\n최종 확인문제 결과: 3/3 정답\n\n<b>판정: 개념 보완 완료</b>\n\n## 오답 5. 평행판 콘덴서의 거리\n\n<b>문제:</b> 판 사이 거리가 1/2배가 되면 정전용량은?\n\n- 제출 답안: 1/2배\n- 정답: 2배\n\n오답 원인:\n\n거리 변화 비율을 정전용량 변화 비율에 그대로 적용하였다.\n\n보완 개념:\n\n정전용량은 판 사이 거리에 반비례한다.\n\n1 ÷ (1/2) = 2배\n\n보충학습 결과: 4/4 정답\n\n<b>판정: 개념 보완 완료</b>\n\n---\n\n# 6. 시험 직전 암기 공식\n\n| 학습 주제 | 공식 |\n| --- | --- |\n| 쿨롱의 법칙 | F = k × \\|Q₁Q₂\\|/r² |\n| 전계의 세기 | E = F/q |\n| 점전하가 만드는 전계 | E = k\\|Q\\|/r² |\n| 전위 | V = U/q |\n| 전위차 | V\\_AB = V\\_A − V\\_B |\n| 전기적 위치에너지 | U = qV |\n| 위치에너지 변화량 | ΔU = q(V₂ − V₁) |\n| 전기장이 한 일 | W = −ΔU |\n| 정전용량 | C = Q/V |\n| 저장 전하량 | Q = CV |\n| 평행판 콘덴서 | C = εA/d |\n\n## 반드시 암기할 8가지\n\n1. 같은 종류의 전하는 밀어내고 다른 종류의 전하는 끌어당긴다.\n2. 쿨롱의 법칙에서 전기력은 거리의 제곱에 반비례한다.\n3. 전계의 세기는 단위 양전하가 받는 힘이다.\n4. 원천전하와 시험전하의 역할은 다르다.\n5. 양전하는 높은 전위에서 낮은 전위로 이동하면 위치에너지가 감소한다.\n6. 음전하는 낮은 전위에서 높은 전위로 이동하면 위치에너지가 감소한다.\n7. 전기장이 한 일은 위치에너지 변화량의 음수이다.\n8. 평행판 콘덴서의 정전용량은 판 면적에 비례하고 판 사이 거리에 반비례한다.\n\n---\n\n# 7. 5일차 2회차 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 쿨롱의 법칙 | 9/10 |\n| 전계의 세기 | 10/11 |\n| 전위와 전위차 | 12/14 |\n| 정전용량 | 10/11 |\n| 전체 정답 | 41/46 |\n| 최종 정답률 | 89.1% |\n| 학습 목표 | 달성 |\n\n## 잘 이해한 내용\n\n- 전하 사이의 인력과 척력\n- 쿨롱의 법칙 계산\n- 전하량과 거리의 복합 변화\n- 전계의 세기 계산\n- 원천전하와 시험전하의 구분\n- 양전하와 음전하의 위치에너지 계산\n- 전기장이 한 일과 위치에너지 변화량\n- 콘덴서의 정전용량 계산\n- 평행판 콘덴서의 면적·거리 변화\n\n## 개선할 부분\n\n1. 전하량과 거리 변화 배율을 구분하여 계산한다.\n2. 시험전하와 원천전하를 구분한다.\n3. 위치에너지 계산 시 전하량의 부호를 확인한다.\n4. 위치에너지 변화량과 전기장이 한 일의 부호를 구분한다.\n5. 정전용량 계산에서 거리 변화 비율의 역수를 적용한다.\n\n## 최종 평가\n\n기본 연습문제에서 일부 개념 오류가 발생했지만 보충학습을 통해 대부분의 취약 개념을 보완하였다.\n\n특히 쿨롱의 법칙과 전계의 세기에서는 계산 능력이 우수했고, 전위와 위치에너지에서는 양전하와 음전하의 차이를 최종 확인문제로 검증하였다.\n\n정전용량 단원에서도 판 면적과 거리의 변화에 따른 응용 계산을 정확하게 해결하였다.\n\n<b>최종 판정: 5일차 2회차 학습 목표 달성</b>\n\n---\n\n# 8. 5일차 전체 학습 평가\n\n| 구분 | 정답 | 전체 | 정답률 |\n| --- | --- | --- | --- |\n| 5일차 1회차 | 20 | 21 | 95.2% |\n| 5일차 2회차 | 41 | 46 | 89.1% |\n| <b>합계</b> | <b>61</b> | <b>67</b> | <b>91.0%</b> |\n\n### 5일차 학습 성과\n\n하루 2회 학습을 통해 전기저항과 도체의 특성부터 정전용량까지 학습하였다.\n\n전체 67문제 중 61문제를 맞혔으며, 오답이 발생한 영역은 보충학습을 진행하였다.\n\n<b>최종 평가: 하루 2회 학습 목표 달성</b>\n\n---\n\n# 9. 다음 학습 계획\n\n## 6일차 1회차\n\n<b>주제: 콘덴서의 직렬·병렬 연결</b>\n\n학습 예정 내용:\n\n1. 콘덴서 직렬 연결\n2. 콘덴서 병렬 연결\n3. 합성 정전용량 계산\n4. 직렬 연결에서 전하량과 전압의 관계\n5. 병렬 연결에서 전압과 전하량의 관계\n6. 전기기능사 필기 응용문제\n\n## 6일차 2회차\n\n<b>주제: 콘덴서에 저장되는 에너지와 전기이론 종합 복습</b>\n\n학습 예정 내용:\n\n1. 콘덴서에 저장되는 에너지\n2. 저장 에너지 계산 공식\n3. 전압과 정전용량 변화에 따른 에너지\n4. 직렬·병렬 콘덴서 응용 계산\n5. 전기이론 누적 복습문제\n\n<b>다음 학습 목표:</b> 콘덴서의 직렬·병렬 연결을 이해하고 합성 정전용량과 저장 에너지를 계산할 수 있다.","counts":null,"supplement":null,"sourceChecked":"2026-11-12","historyImportVersion":"public-history-2026-11-12-v1","reportedTotal":{"correct":41,"total":46,"label":"보충 포함, 최초 집계에서 제외"}},{"id":"past6","day":6,"round":1,"date":"2026-11-09","title":"콘덴서 직렬·병렬 연결과 합성 정전용량","status":"완료","unitIds":["u9"],"concept":"# ⚡ 전기기능사 필기 6일차 1회차 학습 정리\n\n학습일: 2026년 11월 9일\n\n학습 주제: 콘덴서 직렬·병렬 연결과 합성 정전용량\n\n학습 결과: 총 31문항 중 30문항 정답 (96.8%)\n\n최종 평가: 학습 목표 달성, 취약 개념 보충 완료\n\n---\n\n## 1. 학습 목표\n\n1. 콘덴서 직렬·병렬 연결의 차이 이해\n2. 합성 정전용량 계산\n3. 직렬 연결에서 전압 분배 계산\n4. 병렬 연결에서 전하량 계산\n5. 저항과 콘덴서의 합성 공식 비교\n6. 전압 변화에 따른 정전용량과 전하량의 관계 이해\n\n---\n\n## 2. 정전용량의 기본 개념\n\n콘덴서(Capacitor)는 전하와 전기적 에너지를 저장하는 전기 부품이다.\n\n정전용량은 전하를 저장하는 능력을 나타낸다.\n\n### 기본 공식\n\nC = Q/V\n\nQ = CV\n\nV = Q/C\n\n- C: 정전용량(F)\n- Q: 전하량(C)\n- V: 전압(V)\n\n### 단위 관계\n\n1F = 1C/V\n\n1μF = 0.000001F\n\n1μC = 0.000001C\n\n정전용량을 μF, 전압을 V로 계산하면 전하량은 μC로 구할 수 있다.\n\n### 예제\n\n정전용량 4μF인 콘덴서에 10V를 가할 때 전하량은?\n\nQ = CV\n\nQ = 4 × 10\n\n정답: 40μC\n\n---\n\n## 3. 콘덴서 직렬 연결\n\n### 3.1 특징\n\n콘덴서를 한 줄로 연결하는 방식이다.\n\n처음 충전되지 않은 이상적인 콘덴서를 직렬로 연결해 충전하는 경우 다음 특징을 가진다.\n\n- 각 콘덴서에 저장되는 전하량의 크기는 같다.\n- 전체 전압은 각 콘덴서에 걸리는 전압의 합이다.\n- 합성 정전용량은 가장 작은 콘덴서의 정전용량보다 작다.\n- 정전용량이 작은 콘덴서에 더 높은 전압이 걸린다.\n\n### 3.2 핵심 공식\n\n1/C = 1/C1 + 1/C2 + 1/C3\n\n콘덴서 2개인 경우:\n\nC = (C1 × C2)/(C1 + C2)\n\n전하량:\n\nQ = Q1 = Q2\n\n전압:\n\nV = V1 + V2\n\n### 3.3 계산 예제\n\nC1 = 6μF\n\nC2 = 3μF\n\n합성 정전용량:\n\nC = (6 × 3)/(6 + 3)\n\nC = 18/9\n\n정답: 2μF\n\n### 3.4 직렬 연결 전압 분배\n\n조건:\n\n- C1 = 2μF\n- C2 = 4μF\n- 전체 전압 = 12V\n\n① 합성 정전용량\n\nC = (2 × 4)/(2 + 4) = 4/3μF\n\n② 전하량\n\nQ = (4/3) × 12 = 16μC\n\n③ C1 전압\n\nV1 = 16/2 = 8V\n\n④ C2 전압\n\nV2 = 16/4 = 4V\n\n⑤ 검산\n\n8V + 4V = 12V\n\n핵심: 직렬 연결에서는 전하량이 같으므로 정전용량과 전압이 반비례한다.\n\n---\n\n## 4. 콘덴서 병렬 연결\n\n### 4.1 특징\n\n콘덴서의 양쪽 단자를 각각 공통으로 연결하는 방식이다.\n\n- 각 콘덴서에 걸리는 전압이 같다.\n- 전체 전하량은 각 콘덴서에 저장된 전하량의 합이다.\n- 합성 정전용량은 각 콘덴서 정전용량의 합이다.\n- 정전용량이 큰 콘덴서에 더 많은 전하가 저장된다.\n\n### 4.2 핵심 공식\n\nC = C1 + C2 + C3\n\n전압:\n\nV = V1 = V2 = V3\n\n전하량:\n\nQ = Q1 + Q2 + Q3\n\n### 4.3 계산 예제\n\nC1 = 6μF\n\nC2 = 3μF\n\n합성 정전용량:\n\nC = 6 + 3\n\n정답: 9μF\n\n### 4.4 병렬 연결 전하량 계산\n\n조건:\n\n- C1 = 2μF\n- C2 = 4μF\n- 전체 전압 = 12V\n\n① 합성 정전용량\n\nC = 2 + 4 = 6μF\n\n② C1 전하량\n\nQ1 = 2 × 12 = 24μC\n\n③ C2 전하량\n\nQ2 = 4 × 12 = 48μC\n\n④ 전체 전하량\n\nQ = 24 + 48\n\n정답: 72μC\n\n---\n\n## 5. 직렬·병렬 연결 비교\n\n| 구분 | 직렬 연결 | 병렬 연결 |\n| --- | --- | --- |\n| 전하량 | 동일 | 각각 다를 수 있음 |\n| 전압 | 분배됨 | 동일 |\n| 합성 정전용량 | 역수의 합 | 정전용량의 합 |\n| 합성 정전용량 크기 | 가장 작은 값보다 작음 | 가장 큰 값보다 큼 |\n| 정전용량이 큰 콘덴서 | 전압이 작음 | 전하량이 큼 |\n\n※ 직렬 연결의 전하량 관계는 처음 충전되지 않은 이상적인 콘덴서를 직렬로 연결해 충전하는 조건을 기준으로 한다.\n\n### 저항과 콘덴서 비교\n\n| 연결 | 저항 | 콘덴서 |\n| --- | --- | --- |\n| 직렬 | R = R1 + R2 | 1/C = 1/C1 + 1/C2 |\n| 병렬 | 1/R = 1/R1 + 1/R2 | C = C1 + C2 |\n\n암기: 저항은 직렬에서 더하고, 콘덴서는 병렬에서 더한다.\n\n---\n\n## 6. 콘덴서 직렬·병렬 혼합 연결\n\n### 풀이\n\n① 병렬 부분\n\nC = 6 + 3 = 9μF\n\n② 직렬 부분\n\nC = (9 × 3)/(9 + 3)\n\nC = 27/12\n\n정답: 2.25μF\n\n### 핵심\n\n혼합 연결에서는 먼저 직렬 또는 병렬로 묶인 부분을 계산하고, 그 결과를 하나의 콘덴서로 생각하여 다음 단계의 합성 정전용량을 계산한다.\n\n---\n\n## 7. 전압 변화와 정전용량\n\n이번 학습에서 발생한 오답과 보충학습으로 해결한 개념이다.\n\n### 7.1 기본 원리\n\n이상적인 선형 콘덴서의 정전용량은 도체판의 면적, 거리, 유전율에 의해 결정된다.\n\n평행판 콘덴서 공식:\n\nC = εA/d\n\n- ε: 유전율\n- A: 도체판 면적\n- d: 도체판 사이 거리\n\n도체판 면적과 거리, 유전율이 일정하면 정전용량도 일정하다.\n\n따라서 전압이 증가해도 정전용량은 변하지 않는다.\n\n### 7.2 전압과 전하량 관계\n\nQ = CV\n\n정전용량이 일정할 때:\n\n- 전압 2배 → 전하량 2배\n- 전압 3배 → 전하량 3배\n- 전압 1/2배 → 전하량 1/2배\n\n### 최종 이해\n\n이상적인 선형 콘덴서에서 구조와 유전체가 일정하면 정전용량은 일정하다.\n\n전압이 3배 증가하면 저장되는 전하량도 3배 증가하지만 정전용량은 변하지 않는다.\n\n---\n\n### 8.1 기본·응용문제\n\n| 문제 | 제출 답안 | 정답 | 결과 |\n| --- | --- | --- | --- |\n| 1.1 | ③ | ③ | 정답 |\n| 1.2 | ① | ① | 정답 |\n| 1.3 | ② | ② | 정답 |\n| 1.4 | ② | ② | 정답 |\n| 2.1 | ③ | ③ | 정답 |\n| 2.2 | ② | ② | 정답 |\n| 2.3 | ③ | ③ | 정답 |\n| 3.1 | ② | ② | 정답 |\n| 3.2 | ④ | ④ | 정답 |\n| 3.3 | ③ | ③ | 정답 |\n| 3.4 | ③ | ③ | 정답 |\n| 4.1 | ① | ① | 정답 |\n| 4.2 | ④ | ④ | 정답 |\n\n기본·응용 객관식 13문제 모두 정답.\n\n### 8.2 서술형 5.1\n\n조건:\n\nC1 = 4μF\n\nC2 = 8μF\n\n전체 전압 = 24V\n\n직렬 연결\n\n| 항목 | 제출 답안 | 결과 |\n| --- | --- | --- |\n| A. 합성 정전용량 | 8/3μF | 정답 |\n| B. 전하량 | 64μC | 정답 |\n| C. C1 전압 | 16V | 정답 |\n| D. C2 전압 | 8V | 정답 |\n| E. 원리 설명 | 정전용량과 전압은 반비례 | 정답 |\n\n해설:\n\nC = (4 × 8)/(4 + 8) = 8/3μF\n\nQ = (8/3) × 24 = 64μC\n\nV1 = 64/4 = 16V\n\nV2 = 64/8 = 8V\n\n검산:\n\n16 + 8 = 24V\n\n### 8.3 종합문제 6.1\n\n조건:\n\nC1 = 3μF\n\nC2 = 6μF\n\n| 항목 | 정답 |\n| --- | --- |\n| A. 직렬 합성 정전용량 | 2μF |\n| B. 병렬 합성 정전용량 | 9μF |\n| C. 합성 정전용량이 큰 연결 | 병렬 |\n| D. 저항과 콘덴서 공식 비교 | 서로 반대 |\n\n처음 미완료였던 D번은 추가 확인문제에서 정답 처리했다.\n\n---\n\n### 오답 1. 전압 변화와 합성 정전용량\n\n문제\n\n4μF와 8μF 콘덴서를 직렬로 연결했다.\n\n전체 전압을 24V에서 48V로 증가시키면 합성 정전용량은 몇 배가 되는가?\n\n제출 답안: 1/2배\n\n정답: 1배(변화 없음)\n\n### 오답 원인\n\n전압 증가가 정전용량 자체의 변화로 이어진다고 혼동했다.\n\n### 올바른 개념\n\n합성 정전용량:\n\nC = (4 × 8)/(4 + 8)\n\nC = 8/3μF\n\n전체 전압이 24V에서 48V로 증가하더라도 이상적인 선형 콘덴서의 정전용량은 변하지 않는다.\n\n따라서 합성 정전용량도 일정하다.\n\n반면 저장되는 전하량은 2배 증가한다.\n\n### 보충학습\n\n정전용량 5μF, 전압 10V에서 30V로 증가하는 문제를 풀이했다.\n\n결과:\n\n- Q1: 정전용량 5μF — 정답\n- Q2: 전하량 3배 — 정답\n- Q3: 정전용량이 일정한 이유 — 정답\n\n보충문제 3/3 정답\n\n최종 판정: 취약 개념 보완 완료\n\n---\n\n## 10. 시험 직전 암기 공식\n\n| 구분 | 공식 |\n| --- | --- |\n| 기본 정전용량 | C = Q/V |\n| 전하량 | Q = CV |\n| 콘덴서 직렬 | 1/C = 1/C1 + 1/C2 |\n| 직렬 2개 | C = C1 × C2/(C1 + C2) |\n| 콘덴서 병렬 | C = C1 + C2 + C3 |\n| 직렬 전하량 | Q1 = Q2 |\n| 병렬 전압 | V1 = V2 |\n| 평행판 콘덴서 | C = εA/d |\n\n### 반드시 기억할 7가지\n\n1. 직렬에서는 전하량이 같다.\n2. 병렬에서는 전압이 같다.\n3. 직렬에서는 합성 정전용량이 감소한다.\n4. 병렬에서는 합성 정전용량이 증가한다.\n5. 직렬에서는 정전용량이 작은 콘덴서에 더 높은 전압이 걸린다.\n6. 저항과 콘덴서의 합성 공식은 서로 반대이다.\n7. 이상적인 선형 콘덴서에서 전압이 증가해도 정전용량은 변하지 않는다.\n\n---\n\n### 잘 이해한 부분\n\n- 합성 정전용량 계산\n- 직렬 연결의 전압 분배\n- 병렬 연결의 전하량\n- 저항과 콘덴서의 합성 공식 차이\n- 직렬·병렬 혼합 연결\n\n### 개선한 부분\n\n전압이 증가해도 정전용량은 변하지 않으며, 정전용량이 일정할 때 저장되는 전하량은 전압에 비례한다는 사실을 보충학습을 통해 확인했다.\n\n최종 판정: 6일차 1회차 학습 목표 달성\n\n---\n\n### 6일차 2회차\n\n학습 주제: 콘덴서에 저장되는 에너지\n\n학습 예정 내용:\n\n1. 콘덴서에 저장되는 에너지의 개념\n2. 저장 에너지 공식\n3. 전압 변화에 따른 저장 에너지\n4. 정전용량 변화에 따른 저장 에너지\n5. 직렬·병렬 콘덴서의 에너지 계산\n6. 전기이론 누적 복습\n\n핵심 공식:\n\nW = (1/2) × C × V²\n\nW = (1/2) × Q × V\n\nW = Q²/(2C)\n\n- W: 저장 에너지(J)\n- C: 정전용량(F)\n- V: 전압(V)\n- Q: 전하량(C)\n\n다음 학습 목표: 전압과 정전용량 변화에 따른 콘덴서의 저장 에너지를 정확히 계산할 수 있다.","examples":"### 예제\n\n정전용량 4μF인 콘덴서에 10V를 가할 때 전하량은?\n\nQ = CV\n\nQ = 4 × 10\n\n정답: 40μC\n\n---\n\n### 3.3 계산 예제\n\nC1 = 6μF\n\nC2 = 3μF\n\n합성 정전용량:\n\nC = (6 × 3)/(6 + 3)\n\nC = 18/9\n\n정답: 2μF\n\n### 4.3 계산 예제\n\nC1 = 6μF\n\nC2 = 3μF\n\n합성 정전용량:\n\nC = 6 + 3\n\n정답: 9μF\n\n### 8.2 서술형 5.1\n\n조건:\n\nC1 = 4μF\n\nC2 = 8μF\n\n전체 전압 = 24V\n\n직렬 연결\n\n| 항목 | 제출 답안 | 결과 |\n| --- | --- | --- |\n| A. 합성 정전용량 | 8/3μF | 정답 |\n| B. 전하량 | 64μC | 정답 |\n| C. C1 전압 | 16V | 정답 |\n| D. C2 전압 | 8V | 정답 |\n| E. 원리 설명 | 정전용량과 전압은 반비례 | 정답 |\n\n해설:\n\nC = (4 × 8)/(4 + 8) = 8/3μF\n\nQ = (8/3) × 24 = 64μC\n\nV1 = 64/4 = 16V\n\nV2 = 64/8 = 8V\n\n검산:\n\n16 + 8 = 24V","notes":"### 연습문제\n\n6μF와 3μF 콘덴서를 병렬로 연결하고, 이 부분을 다시 3μF 콘덴서와 직렬 연결했다.\n\n전체 합성 정전용량은?\n\n### 7.3 보충문제\n\n조건:\n\n- 정전용량 = 5μF\n- 초기 전압 = 10V\n- 변경 전압 = 30V\n\n① 변경 후 정전용량\n\n5μF (변화 없음)\n\n② 초기 전하량\n\nQ1 = 5 × 10 = 50μC\n\n③ 변경 후 전하량\n\nQ2 = 5 × 30 = 150μC\n\n④ 전하량 변화\n\n150/50 = 3배\n\n## 8. 연습문제 및 채점 결과\n\n## 9. 오답노트\n\n## 11. 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 기본·응용 및 서술형 | 22/22 |\n| 추가 확인문제 | 5/6 |\n| 최종 보충문제 | 3/3 |\n| 전체 정답 | 30/31 |\n| 최종 정답률 | 96.8% |\n| 오답 보충 | 완료 |\n| 최종 평가 | 학습 목표 달성 |\n\n## 12. 다음 학습 계획\n\n가져오기: 노션 확인 기록 전체를 보존했습니다. 문항별 제출 답안·정답은 원문 탭에서 볼 수 있습니다. 기록에 없는 성적·완료 범위는 추정하지 않았습니다.","questions":[],"source":"","sourceText":"# ⚡ 전기기능사 필기 6일차 1회차 학습 정리\n\n<b>학습일:</b> 2026년 11월 9일\n\n<b>학습 주제:</b> 콘덴서 직렬·병렬 연결과 합성 정전용량\n\n<b>학습 결과:</b> 총 31문항 중 30문항 정답 (96.8%)\n\n<b>최종 평가:</b> 학습 목표 달성, 취약 개념 보충 완료\n\n---\n\n## 1. 학습 목표\n\n1. 콘덴서 직렬·병렬 연결의 차이 이해\n2. 합성 정전용량 계산\n3. 직렬 연결에서 전압 분배 계산\n4. 병렬 연결에서 전하량 계산\n5. 저항과 콘덴서의 합성 공식 비교\n6. 전압 변화에 따른 정전용량과 전하량의 관계 이해\n\n---\n\n## 2. 정전용량의 기본 개념\n\n콘덴서(Capacitor)는 전하와 전기적 에너지를 저장하는 전기 부품이다.\n\n정전용량은 전하를 저장하는 능력을 나타낸다.\n\n### 기본 공식\n\nC = Q/V\n\nQ = CV\n\nV = Q/C\n\n- C: 정전용량(F)\n- Q: 전하량(C)\n- V: 전압(V)\n\n### 단위 관계\n\n1F = 1C/V\n\n1μF = 0.000001F\n\n1μC = 0.000001C\n\n정전용량을 μF, 전압을 V로 계산하면 전하량은 μC로 구할 수 있다.\n\n### 예제\n\n정전용량 4μF인 콘덴서에 10V를 가할 때 전하량은?\n\nQ = CV\n\nQ = 4 × 10\n\n정답: 40μC\n\n---\n\n## 3. 콘덴서 직렬 연결\n\n### 3.1 특징\n\n콘덴서를 한 줄로 연결하는 방식이다.\n\n처음 충전되지 않은 이상적인 콘덴서를 직렬로 연결해 충전하는 경우 다음 특징을 가진다.\n\n- 각 콘덴서에 저장되는 전하량의 크기는 같다.\n- 전체 전압은 각 콘덴서에 걸리는 전압의 합이다.\n- 합성 정전용량은 가장 작은 콘덴서의 정전용량보다 작다.\n- 정전용량이 작은 콘덴서에 더 높은 전압이 걸린다.\n\n### 3.2 핵심 공식\n\n1/C = 1/C1 + 1/C2 + 1/C3\n\n콘덴서 2개인 경우:\n\nC = (C1 × C2)/(C1 + C2)\n\n전하량:\n\nQ = Q1 = Q2\n\n전압:\n\nV = V1 + V2\n\n### 3.3 계산 예제\n\nC1 = 6μF\n\nC2 = 3μF\n\n합성 정전용량:\n\nC = (6 × 3)/(6 + 3)\n\nC = 18/9\n\n<b>정답: 2μF</b>\n\n### 3.4 직렬 연결 전압 분배\n\n조건:\n\n- C1 = 2μF\n- C2 = 4μF\n- 전체 전압 = 12V\n\n① 합성 정전용량\n\nC = (2 × 4)/(2 + 4) = 4/3μF\n\n② 전하량\n\nQ = (4/3) × 12 = 16μC\n\n③ C1 전압\n\nV1 = 16/2 = 8V\n\n④ C2 전압\n\nV2 = 16/4 = 4V\n\n⑤ 검산\n\n8V + 4V = 12V\n\n<b>핵심: 직렬 연결에서는 전하량이 같으므로 정전용량과 전압이 반비례한다.</b>\n\n---\n\n## 4. 콘덴서 병렬 연결\n\n### 4.1 특징\n\n콘덴서의 양쪽 단자를 각각 공통으로 연결하는 방식이다.\n\n- 각 콘덴서에 걸리는 전압이 같다.\n- 전체 전하량은 각 콘덴서에 저장된 전하량의 합이다.\n- 합성 정전용량은 각 콘덴서 정전용량의 합이다.\n- 정전용량이 큰 콘덴서에 더 많은 전하가 저장된다.\n\n### 4.2 핵심 공식\n\nC = C1 + C2 + C3\n\n전압:\n\nV = V1 = V2 = V3\n\n전하량:\n\nQ = Q1 + Q2 + Q3\n\n### 4.3 계산 예제\n\nC1 = 6μF\n\nC2 = 3μF\n\n합성 정전용량:\n\nC = 6 + 3\n\n<b>정답: 9μF</b>\n\n### 4.4 병렬 연결 전하량 계산\n\n조건:\n\n- C1 = 2μF\n- C2 = 4μF\n- 전체 전압 = 12V\n\n① 합성 정전용량\n\nC = 2 + 4 = 6μF\n\n② C1 전하량\n\nQ1 = 2 × 12 = 24μC\n\n③ C2 전하량\n\nQ2 = 4 × 12 = 48μC\n\n④ 전체 전하량\n\nQ = 24 + 48\n\n<b>정답: 72μC</b>\n\n---\n\n## 5. 직렬·병렬 연결 비교\n\n| 구분 | 직렬 연결 | 병렬 연결 |\n| --- | --- | --- |\n| 전하량 | 동일 | 각각 다를 수 있음 |\n| 전압 | 분배됨 | 동일 |\n| 합성 정전용량 | 역수의 합 | 정전용량의 합 |\n| 합성 정전용량 크기 | 가장 작은 값보다 작음 | 가장 큰 값보다 큼 |\n| 정전용량이 큰 콘덴서 | 전압이 작음 | 전하량이 큼 |\n\n※ 직렬 연결의 전하량 관계는 처음 충전되지 않은 이상적인 콘덴서를 직렬로 연결해 충전하는 조건을 기준으로 한다.\n\n### 저항과 콘덴서 비교\n\n| 연결 | 저항 | 콘덴서 |\n| --- | --- | --- |\n| 직렬 | R = R1 + R2 | 1/C = 1/C1 + 1/C2 |\n| 병렬 | 1/R = 1/R1 + 1/R2 | C = C1 + C2 |\n\n<b>암기: 저항은 직렬에서 더하고, 콘덴서는 병렬에서 더한다.</b>\n\n---\n\n## 6. 콘덴서 직렬·병렬 혼합 연결\n\n### 연습문제\n\n6μF와 3μF 콘덴서를 병렬로 연결하고, 이 부분을 다시 3μF 콘덴서와 직렬 연결했다.\n\n전체 합성 정전용량은?\n\n### 풀이\n\n① 병렬 부분\n\nC = 6 + 3 = 9μF\n\n② 직렬 부분\n\nC = (9 × 3)/(9 + 3)\n\nC = 27/12\n\n<b>정답: 2.25μF</b>\n\n### 핵심\n\n혼합 연결에서는 먼저 직렬 또는 병렬로 묶인 부분을 계산하고, 그 결과를 하나의 콘덴서로 생각하여 다음 단계의 합성 정전용량을 계산한다.\n\n---\n\n## 7. 전압 변화와 정전용량\n\n이번 학습에서 발생한 오답과 보충학습으로 해결한 개념이다.\n\n### 7.1 기본 원리\n\n이상적인 선형 콘덴서의 정전용량은 도체판의 면적, 거리, 유전율에 의해 결정된다.\n\n평행판 콘덴서 공식:\n\nC = εA/d\n\n- ε: 유전율\n- A: 도체판 면적\n- d: 도체판 사이 거리\n\n도체판 면적과 거리, 유전율이 일정하면 정전용량도 일정하다.\n\n따라서 전압이 증가해도 정전용량은 변하지 않는다.\n\n### 7.2 전압과 전하량 관계\n\nQ = CV\n\n정전용량이 일정할 때:\n\n- 전압 2배 → 전하량 2배\n- 전압 3배 → 전하량 3배\n- 전압 1/2배 → 전하량 1/2배\n\n### 7.3 보충문제\n\n조건:\n\n- 정전용량 = 5μF\n- 초기 전압 = 10V\n- 변경 전압 = 30V\n\n① 변경 후 정전용량\n\n5μF (변화 없음)\n\n② 초기 전하량\n\nQ1 = 5 × 10 = 50μC\n\n③ 변경 후 전하량\n\nQ2 = 5 × 30 = 150μC\n\n④ 전하량 변화\n\n150/50 = 3배\n\n### 최종 이해\n\n이상적인 선형 콘덴서에서 구조와 유전체가 일정하면 정전용량은 일정하다.\n\n전압이 3배 증가하면 저장되는 전하량도 3배 증가하지만 정전용량은 변하지 않는다.\n\n---\n\n## 8. 연습문제 및 채점 결과\n\n### 8.1 기본·응용문제\n\n| 문제 | 제출 답안 | 정답 | 결과 |\n| --- | --- | --- | --- |\n| 1.1 | ③ | ③ | 정답 |\n| 1.2 | ① | ① | 정답 |\n| 1.3 | ② | ② | 정답 |\n| 1.4 | ② | ② | 정답 |\n| 2.1 | ③ | ③ | 정답 |\n| 2.2 | ② | ② | 정답 |\n| 2.3 | ③ | ③ | 정답 |\n| 3.1 | ② | ② | 정답 |\n| 3.2 | ④ | ④ | 정답 |\n| 3.3 | ③ | ③ | 정답 |\n| 3.4 | ③ | ③ | 정답 |\n| 4.1 | ① | ① | 정답 |\n| 4.2 | ④ | ④ | 정답 |\n\n기본·응용 객관식 13문제 모두 정답.\n\n### 8.2 서술형 5.1\n\n조건:\n\nC1 = 4μF\n\nC2 = 8μF\n\n전체 전압 = 24V\n\n직렬 연결\n\n| 항목 | 제출 답안 | 결과 |\n| --- | --- | --- |\n| A. 합성 정전용량 | 8/3μF | 정답 |\n| B. 전하량 | 64μC | 정답 |\n| C. C1 전압 | 16V | 정답 |\n| D. C2 전압 | 8V | 정답 |\n| E. 원리 설명 | 정전용량과 전압은 반비례 | 정답 |\n\n해설:\n\nC = (4 × 8)/(4 + 8) = 8/3μF\n\nQ = (8/3) × 24 = 64μC\n\nV1 = 64/4 = 16V\n\nV2 = 64/8 = 8V\n\n검산:\n\n16 + 8 = 24V\n\n### 8.3 종합문제 6.1\n\n조건:\n\nC1 = 3μF\n\nC2 = 6μF\n\n| 항목 | 정답 |\n| --- | --- |\n| A. 직렬 합성 정전용량 | 2μF |\n| B. 병렬 합성 정전용량 | 9μF |\n| C. 합성 정전용량이 큰 연결 | 병렬 |\n| D. 저항과 콘덴서 공식 비교 | 서로 반대 |\n\n처음 미완료였던 D번은 추가 확인문제에서 정답 처리했다.\n\n---\n\n## 9. 오답노트\n\n### 오답 1. 전압 변화와 합성 정전용량\n\n<b>문제</b>\n\n4μF와 8μF 콘덴서를 직렬로 연결했다.\n\n전체 전압을 24V에서 48V로 증가시키면 합성 정전용량은 몇 배가 되는가?\n\n제출 답안: 1/2배\n\n정답: 1배(변화 없음)\n\n### 오답 원인\n\n전압 증가가 정전용량 자체의 변화로 이어진다고 혼동했다.\n\n### 올바른 개념\n\n합성 정전용량:\n\nC = (4 × 8)/(4 + 8)\n\nC = 8/3μF\n\n전체 전압이 24V에서 48V로 증가하더라도 이상적인 선형 콘덴서의 정전용량은 변하지 않는다.\n\n따라서 합성 정전용량도 일정하다.\n\n반면 저장되는 전하량은 2배 증가한다.\n\n### 보충학습\n\n정전용량 5μF, 전압 10V에서 30V로 증가하는 문제를 풀이했다.\n\n결과:\n\n- Q1: 정전용량 5μF — 정답\n- Q2: 전하량 3배 — 정답\n- Q3: 정전용량이 일정한 이유 — 정답\n\n<b>보충문제 3/3 정답</b>\n\n최종 판정: 취약 개념 보완 완료\n\n---\n\n## 10. 시험 직전 암기 공식\n\n| 구분 | 공식 |\n| --- | --- |\n| 기본 정전용량 | C = Q/V |\n| 전하량 | Q = CV |\n| 콘덴서 직렬 | 1/C = 1/C1 + 1/C2 |\n| 직렬 2개 | C = C1 × C2/(C1 + C2) |\n| 콘덴서 병렬 | C = C1 + C2 + C3 |\n| 직렬 전하량 | Q1 = Q2 |\n| 병렬 전압 | V1 = V2 |\n| 평행판 콘덴서 | C = εA/d |\n\n### 반드시 기억할 7가지\n\n1. 직렬에서는 전하량이 같다.\n2. 병렬에서는 전압이 같다.\n3. 직렬에서는 합성 정전용량이 감소한다.\n4. 병렬에서는 합성 정전용량이 증가한다.\n5. 직렬에서는 정전용량이 작은 콘덴서에 더 높은 전압이 걸린다.\n6. 저항과 콘덴서의 합성 공식은 서로 반대이다.\n7. 이상적인 선형 콘덴서에서 전압이 증가해도 정전용량은 변하지 않는다.\n\n---\n\n## 11. 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 기본·응용 및 서술형 | 22/22 |\n| 추가 확인문제 | 5/6 |\n| 최종 보충문제 | 3/3 |\n| 전체 정답 | 30/31 |\n| 최종 정답률 | 96.8% |\n| 오답 보충 | 완료 |\n| 최종 평가 | 학습 목표 달성 |\n\n### 잘 이해한 부분\n\n- 합성 정전용량 계산\n- 직렬 연결의 전압 분배\n- 병렬 연결의 전하량\n- 저항과 콘덴서의 합성 공식 차이\n- 직렬·병렬 혼합 연결\n\n### 개선한 부분\n\n전압이 증가해도 정전용량은 변하지 않으며, 정전용량이 일정할 때 저장되는 전하량은 전압에 비례한다는 사실을 보충학습을 통해 확인했다.\n\n<b>최종 판정: 6일차 1회차 학습 목표 달성</b>\n\n---\n\n## 12. 다음 학습 계획\n\n### 6일차 2회차\n\n<b>학습 주제: 콘덴서에 저장되는 에너지</b>\n\n학습 예정 내용:\n\n1. 콘덴서에 저장되는 에너지의 개념\n2. 저장 에너지 공식\n3. 전압 변화에 따른 저장 에너지\n4. 정전용량 변화에 따른 저장 에너지\n5. 직렬·병렬 콘덴서의 에너지 계산\n6. 전기이론 누적 복습\n\n핵심 공식:\n\nW = (1/2) × C × V²\n\nW = (1/2) × Q × V\n\nW = Q²/(2C)\n\n- W: 저장 에너지(J)\n- C: 정전용량(F)\n- V: 전압(V)\n- Q: 전하량(C)\n\n<b>다음 학습 목표: 전압과 정전용량 변화에 따른 콘덴서의 저장 에너지를 정확히 계산할 수 있다.</b>","counts":{"correct":22,"total":22,"kind":"최초","label":"노션 확인 최초 성적"},"supplement":{"correct":3,"total":3},"sourceChecked":"2026-11-12","historyImportVersion":"public-history-2026-11-12-v1","reportedTotal":{"correct":30,"total":31,"label":"추가확인·보충 포함, 최초 집계에서 제외"}},{"id":"past7","day":6,"round":2,"date":"2026-11-10","title":"콘덴서에 저장되는 에너지","status":"완료","unitIds":["u9"],"concept":"# ⚡ 전기기능사 필기 6일차 2회차 학습 정리\n\n학습일: 2026년 11월 10일\n\n학습 주제: 콘덴서에 저장되는 에너지와 전기이론 종합 복습\n\n학습 결과: 30문항 중 27문항 정답 (90.0%)\n\n콘덴서 단원: 26문항 모두 정답 (100%)\n\n최종 평가: 저장 에너지 학습 목표 달성, 전기이론 누적 복습 필요\n\n---\n\n## 1. 학습 목표\n\n1. 콘덴서에 저장되는 전기적 에너지의 개념 이해\n2. 저장 에너지 공식 3가지 숙달\n3. 전압 변화에 따른 에너지 계산\n4. 정전용량 변화에 따른 에너지 계산\n5. 전원 연결과 분리 상태의 차이 이해\n6. 직렬·병렬 콘덴서의 전체 저장 에너지 계산\n7. 기존 전기이론 공식 종합 복습\n\n---\n\n## 2. 콘덴서에 저장되는 에너지\n\n콘덴서는 전하를 저장하는 전기 부품이다.\n\n콘덴서에 전압을 가하면 두 도체판 사이에 전기장이 형성되고, 이 전기장에 에너지가 저장된다.\n\n이를 정전 에너지라고 한다.\n\n저장 에너지의 단위는 J(줄)이다.\n\n### 기본 공식\n\n① W = CV²/2\n\n② W = QV/2\n\n③ W = Q²/(2C)\n\n- W: 저장 에너지(J)\n- C: 정전용량(F)\n- V: 전압(V)\n- Q: 전하량(C)\n\n세 공식은 Q = CV 관계를 이용해 서로 변환할 수 있다.\n\n### 공식 선택 기준\n\n| 주어진 조건 | 사용 공식 |\n| --- | --- |\n| 정전용량과 전압 | W = CV²/2 |\n| 전하량과 전압 | W = QV/2 |\n| 전하량과 정전용량 | W = Q²/(2C) |\n\n주의: 저장 에너지 공식에는 1/2이 포함된다.\n\n### 계산 예제\n\n정전용량 2F, 전압 6V인 콘덴서의 저장 에너지는?\n\nW = CV²/2\n\nW = 2 × 6² / 2\n\nW = 36J\n\n---\n\n## 3. 전압 변화와 저장 에너지\n\n정전용량이 일정한 경우:\n\nW = CV²/2\n\n따라서 저장 에너지는 전압의 제곱에 비례한다.\n\nW ∝ V²\n\n| 전압 변화 | 저장 에너지 변화 |\n| --- | --- |\n| 2배 | 4배 |\n| 3배 | 9배 |\n| 4배 | 16배 |\n| 1/2배 | 1/4배 |\n| 1/3배 | 1/9배 |\n\n### 계산 예제\n\n초기 저장 에너지: 8J\n\n초기 전압: 10V\n\n변경 전압: 30V\n\n전압 변화 = 30/10 = 3배\n\n에너지 변화 = 3² = 9배\n\n최종 에너지 = 8 × 9 = 72J\n\n핵심: 정전용량이 일정할 때 전압 3배 → 전하량 3배 → 저장 에너지 9배\n\n---\n\n## 4. 정전용량 변화와 저장 에너지\n\n정전용량이 변하는 경우에는 전압이 일정한지, 전하량이 일정한지 반드시 구분해야 한다.\n\n### 4.1 전압이 일정한 경우\n\nW = CV²/2\n\n전압이 일정하면 저장 에너지는 정전용량에 비례한다.\n\nW ∝ C\n\n- 정전용량 2배 → 에너지 2배\n- 정전용량 3배 → 에너지 3배\n- 정전용량 1/2배 → 에너지 1/2배\n\n### 4.2 전하량이 일정한 경우\n\nW = Q²/(2C)\n\n전하량이 일정하면 저장 에너지는 정전용량에 반비례한다.\n\nW ∝ 1/C\n\n- 정전용량 2배 → 에너지 1/2배\n- 정전용량 3배 → 에너지 1/3배\n- 정전용량 1/2배 → 에너지 2배\n\n### 반드시 암기할 비교\n\n| 조건 | 정전용량 2배 시 에너지 |\n| --- | --- |\n| 전압 일정 | 2배 |\n| 전하량 일정 | 1/2배 |\n\n---\n\n## 5. 전원 연결과 분리\n\n### 5.1 일정 전압 전원에 연결된 콘덴서\n\n이상적인 일정 전압 전원에 연결되어 있다면 콘덴서의 전압은 일정하다.\n\nQ = CV\n\nW = CV²/2\n\n따라서 정전용량을 2배 증가시키면 전하량과 저장 에너지도 2배 증가한다.\n\n### 5.2 전원에서 분리한 콘덴서\n\n충전 후 전원에서 분리하고 전하 누설이 없다고 가정하면 저장된 전하량은 일정하다.\n\nV = Q/C\n\nW = Q²/(2C)\n\n정전용량을 2배 증가시키면 전압과 저장 에너지는 각각 1/2배가 된다.\n\n| 구분 | 전원 연결 | 전원 분리 |\n| --- | --- | --- |\n| 일정한 값 | 전압 | 전하량 |\n| 정전용량 2배 | 전하량 2배 | 전압 1/2배 |\n| 저장 에너지 | 2배 | 1/2배 |\n\n※ 이상적인 전원과 전하 누설이 없는 조건을 가정한다.\n\n---\n\n## 6. 콘덴서 직렬·병렬 연결과 저장 에너지\n\n### 6.1 직렬 연결\n\n조건:\n\nC1 = 2F\n\nC2 = 4F\n\n전체 전압 = 12V\n\n합성 정전용량:\n\nC = (2 × 4)/(2 + 4)\n\nC = 4/3F\n\n전체 저장 에너지:\n\nW = (4/3) × 12² / 2\n\nW = 96J\n\n### 6.2 병렬 연결\n\n조건:\n\nC1 = 2F\n\nC2 = 4F\n\n전체 전압 = 12V\n\n합성 정전용량:\n\nC = 2 + 4 = 6F\n\n전체 저장 에너지:\n\nW = 6 × 12² / 2\n\nW = 432J\n\n### 직렬·병렬 비교\n\n| 구분 | 직렬 | 병렬 |\n| --- | --- | --- |\n| 합성 정전용량 | 4/3F | 6F |\n| 전체 전압 | 12V | 12V |\n| 전체 저장 에너지 | 96J | 432J |\n\n같은 콘덴서를 사용하고 전체 전압이 동일하다면 합성 정전용량이 큰 연결 방식에 더 많은 에너지가 저장된다.\n\n---\n\n## 7. 단위 변환\n\n실제 필기시험에서는 μF 단위가 사용될 수 있다.\n\n1μF = 0.000001F\n\n### 계산 예제\n\n정전용량 4μF\n\n전압 100V\n\n저장 에너지:\n\nW = CV²/2\n\nW = 4 × 0.000001 × 100² / 2\n\nW = 0.02J\n\n핵심: 에너지를 J 단위로 계산할 때 μF를 F로 변환해야 한다.\n\n---\n\n### 8.1 기본·응용 객관식\n\n| 문제 | 학습 내용 | 제출 답안 | 정답 | 결과 |\n| --- | --- | --- | --- | --- |\n| 1.1 | 에너지 단위 | ③ | ③ | 정답 |\n| 1.2 | 저장 에너지 공식 | ② | ② | 정답 |\n| 1.3 | 전압과 에너지 관계 | ② | ② | 정답 |\n| 2.1 | 2F, 6V 에너지 | ③ | ③ | 정답 |\n| 2.2 | 4F, 10V 에너지 | ③ | ③ | 정답 |\n| 2.3 | 전하량과 전압 | ② | ② | 정답 |\n| 2.4 | 전하량과 정전용량 | ③ | ③ | 정답 |\n| 3.1 | 전압 2배 | ② | ② | 정답 |\n| 3.2 | 전압 3배 | ③ | ③ | 정답 |\n| 3.3 | 전압 1/2배 | ② | ② | 정답 |\n| 3.4 | 전압 변화 계산 | ③ | ③ | 정답 |\n| 4.1 | 전압 일정, C 2배 | ③ | ③ | 정답 |\n| 4.2 | 전하량 일정, C 2배 | ② | ② | 정답 |\n| 4.3 | 전압 일정, C 3배 | ④ | ④ | 정답 |\n| 4.4 | 전하량 일정, C 3배 | ② | ② | 정답 |\n| 5.1 | 직렬 저장 에너지 | ③ | ③ | 정답 |\n| 5.2 | 병렬 저장 에너지 | ④ | ④ | 정답 |\n| 5.3 | μF 단위 변환 | ② | ② | 정답 |\n\n기본·응용 객관식: 18/18 정답 (100%)\n\n---\n\n## 9. 서술형 문제와 해설\n\n### 9.1 문제 6.1 — 전압 변화\n\n조건:\n\n- 정전용량: 5F\n- 초기 전압: 4V\n- 최종 전압: 12V\n\n| 항목 | 제출 답안 | 결과 |\n| --- | --- | --- |\n| A. 초기 에너지 | 40J | 정답 |\n| B. 최종 에너지 | 360J | 정답 |\n| C. 에너지 변화 | 9배 | 정답 |\n| D. 전하량 변화 | 3배 | 정답 |\n| E. 이유 설명 | 에너지는 전압 제곱에 비례 | 정답 |\n\n계산:\n\nW1 = 5 × 4² / 2 = 40J\n\nW2 = 5 × 12² / 2 = 360J\n\n에너지 변화 = 360/40 = 9배\n\n전하량 변화 = 12/4 = 3배\n\n서술형 6.1: 5/5 정답\n\n### 9.2 문제 6.2 — 전원 연결과 분리\n\n초기 저장 에너지: 40J\n\n정전용량: 2배 증가\n\nA. 전압 일정\n\nW2 = 40 × 2 = 80J\n\n정답\n\nB. 전하량 일정\n\nW2 = 40/2 = 20J\n\n정답\n\nC. 이유 설명\n\n제출 답안:\n\n\"저장에너지는 전압제곱에 비례하고, 전하량이 일정하게 유지될 경우 저장에너지는 정전용량에 반비례하기 때문이다.\"\n\n정답\n\n보충 설명:\n\n전압이 일정하면 저장 에너지는 정전용량에 비례한다.\n\n전하량이 일정하면 저장 에너지는 정전용량에 반비례한다.\n\n서술형 6.2: 3/3 정답\n\n---\n\n## 10. 전기이론 누적 복습 결과\n\n| 문제 | 내용 | 제출 답안 | 정답 | 결과 |\n| --- | --- | --- | --- | --- |\n| 7.1 | 도선의 저항 | ③ | ③ | 정답 |\n| 7.2 | 쿨롱의 법칙 | 기억 안 남 | ③ | 미정답 |\n| 7.3 | 전계의 세기 | 기억 안 남 | ① | 미정답 |\n| 7.4 | 전위와 위치에너지 | 기억 안 남 | ② | 미정답 |\n\n누적 복습: 1/4 정답 (25%)\n\n콘덴서 저장 에너지 계산은 모두 정확했으나 이전에 배운 전기이론 공식 3개를 기억하지 못했다.\n\n계산 능력보다 과거 공식의 장기 기억 유지가 현재 보완 과제로 확인되었다.\n\n---\n\n## 11. 취약 개념 복습\n\n### 11.1 쿨롱의 법칙\n\n두 점전하 사이에 작용하는 힘을 계산한다.\n\nF = k × |Q1 × Q2| / r²\n\n- F: 전기력(N)\n- Q1, Q2: 전하량(C)\n- r: 두 전하 사이 거리(m)\n\n#### 복습문제 7.2\n\n두 전하량을 각각 2배로 증가시키고 거리를 2배로 늘렸다.\n\n전기력 변화:\n\nF2/F1 = (2 × 2)/2²\n\nF2/F1 = 4/4 = 1\n\n정답: 1배\n\n기억할 내용:\n\n전기력은 두 전하량의 곱에 비례하고 거리의 제곱에 반비례한다.\n\n### 11.2 전계의 세기\n\n점전하가 만드는 전계의 세기:\n\nE = k × |Q| / r²\n\n- E: 전계의 세기(N/C)\n- Q: 원천전하(C)\n- r: 원천전하로부터의 거리(m)\n\n#### 복습문제 7.3\n\n원천전하를 3배, 거리를 2배로 증가시켰다.\n\nE2/E1 = 3/2²\n\nE2/E1 = 3/4\n\n정답: 3/4배\n\n쿨롱의 법칙은 전하량 두 개의 곱을 사용하지만, 점전하가 만드는 전계의 세기는 원천전하 하나를 사용한다.\n\n### 11.3 전위와 위치에너지\n\n위치에너지 변화 공식:\n\nΔU = q × (V2 - V1)\n\n- ΔU: 위치에너지 변화량(J)\n- q: 전하량(C)\n- V1: 초기 전위(V)\n- V2: 최종 전위(V)\n\n#### 복습문제 7.4\n\n전하량 -2C인 음전하가 10V에서 30V로 이동했다.\n\nΔU = -2 × (30 - 10)\n\nΔU = -40J\n\n정답: -40J\n\n음전하가 높은 전위로 이동하면 위치에너지는 감소한다.\n\n### 핵심 비교\n\n| 주제 | 공식 | 주의사항 |\n| --- | --- | --- |\n| 쿨롱의 법칙 | F = k × |Q1Q2|/r² | 전하량 두 개 |\n| 점전하의 전계 | E = k × |Q|/r² | 원천전하 하나 |\n| 위치에너지 변화 | ΔU = q(V2-V1) | 전하량의 부호 |\n\n---\n\n## 12. 시험 직전 암기 공식\n\n| 학습 주제 | 핵심 공식 |\n| --- | --- |\n| 정전용량 | C = Q/V |\n| 전하량 | Q = CV |\n| 저장 에너지 1 | W = CV²/2 |\n| 저장 에너지 2 | W = QV/2 |\n| 저장 에너지 3 | W = Q²/(2C) |\n| 직렬 합성 정전용량 | 1/C = 1/C1 + 1/C2 |\n| 병렬 합성 정전용량 | C = C1 + C2 |\n| 쿨롱의 법칙 | F = k × |Q1Q2|/r² |\n| 점전하의 전계 | E = k × |Q|/r² |\n| 위치에너지 변화 | ΔU = q(V2-V1) |\n| 도선의 저항 | R = ρL/A |\n\n### 반드시 암기할 6가지\n\n1. 저장 에너지는 전압의 제곱에 비례한다. (정전용량 일정)\n2. 전압이 일정하면 저장 에너지는 정전용량에 비례한다.\n3. 전하량이 일정하면 저장 에너지는 정전용량에 반비례한다.\n4. 직렬 콘덴서에서는 전하량의 크기가 같다.\n5. 병렬 콘덴서에서는 전압이 같다.\n6. 쿨롱의 법칙, 전계의 세기, 위치에너지 변화 공식은 구분해서 암기한다.\n\n---\n\n### 잘 이해한 부분\n\n- 저장 에너지 공식 3가지\n- 전압의 제곱과 저장 에너지 관계\n- 전압 일정 및 전하량 일정 조건 구분\n- 직렬·병렬 연결의 저장 에너지\n- μF 단위 변환\n- 저장 에너지 서술형 계산 및 원리 설명\n\n### 보완할 부분\n\n1. 쿨롱의 법칙 공식 재암기\n2. 점전하의 전계 공식 재암기\n3. 음전하의 위치에너지 변화 계산 복습\n4. 이전 단원의 공식을 누적 반복학습으로 장기 기억에 정착시키기\n\n### 7일차 학습 운영\n\n2027년 1월 전기기능사 필기시험 합격을 목표로 다음부터는 다산에듀 2026 속전속결 전기기능사 필기 이론서 2권의 실제 목차와 진도에 맞춰 학습한다.\n\n기존 학습 내용과 교재의 차이를 비교하고, 이미 학습한 부분은 복습으로 처리하며 미학습 단원부터 진도를 진행한다.\n\n각 회차에 다음 항목을 기록한다.\n\n- 교재명 및 과목\n- 장·절 및 페이지\n- 학습 완료 여부\n- 연습문제 정답률\n- 오답 및 보충학습 여부\n- 다음 학습 범위\n\n특히 쿨롱의 법칙, 전계, 전위와 위치에너지 공식은 다음 회차의 누적 복습에 포함한다.\n\n최종 목표: 2027년 1월 전기기능사 필기시험 합격","examples":"### 계산 예제\n\n정전용량 2F, 전압 6V인 콘덴서의 저장 에너지는?\n\nW = CV²/2\n\nW = 2 × 6² / 2\n\nW = 36J\n\n---\n\n### 계산 예제\n\n초기 저장 에너지: 8J\n\n초기 전압: 10V\n\n변경 전압: 30V\n\n전압 변화 = 30/10 = 3배\n\n에너지 변화 = 3² = 9배\n\n최종 에너지 = 8 × 9 = 72J\n\n핵심: 정전용량이 일정할 때 전압 3배 → 전하량 3배 → 저장 에너지 9배\n\n---\n\n### 계산 예제\n\n정전용량 4μF\n\n전압 100V\n\n저장 에너지:\n\nW = CV²/2\n\nW = 4 × 0.000001 × 100² / 2\n\nW = 0.02J\n\n핵심: 에너지를 J 단위로 계산할 때 μF를 F로 변환해야 한다.\n\n---\n\n## 9. 서술형 문제와 해설","notes":"## 8. 연습문제 및 채점 결과\n\n## 13. 학습 성적 및 최종 평가\n\n| 학습 영역 | 정답 | 전체 | 정답률 |\n| --- | --- | --- | --- |\n| 저장 에너지 기본 및 응용 | 18 | 18 | 100% |\n| 서술형 | 8 | 8 | 100% |\n| 전기이론 누적 복습 | 1 | 4 | 25% |\n| 전체 | 27 | 30 | 90.0% |\n\n### 최종 평가\n\n콘덴서 저장 에너지 관련 26개 세부 문항에서 모두 정답을 기록했다.\n\n전압과 정전용량의 관계를 정확하게 구분했으며, 직렬·병렬 연결의 저장 에너지 계산도 정확하게 수행했다.\n\n반면 전기이론 누적 복습에서는 4문제 중 3문제의 공식을 기억하지 못했다.\n\n6일차 2회차 신규 학습 목표 달성. 전기이론 누적 복습은 추가 보완 필요.\n\n※ 추가 보충문제 4문항은 아직 답안을 제출하지 않았으므로 최종 성적에 포함하지 않았다.\n\n---\n\n## 14. 다음 학습 계획\n\n가져오기: 노션 확인 기록 전체를 보존했습니다. 문항별 제출 답안·정답은 원문 탭에서 볼 수 있습니다. 기록에 없는 성적·완료 범위는 추정하지 않았습니다.","questions":[],"source":"","sourceText":"# ⚡ 전기기능사 필기 6일차 2회차 학습 정리\n\n<b>학습일:</b> 2026년 11월 10일\n\n<b>학습 주제:</b> 콘덴서에 저장되는 에너지와 전기이론 종합 복습\n\n<b>학습 결과:</b> 30문항 중 27문항 정답 (90.0%)\n\n<b>콘덴서 단원:</b> 26문항 모두 정답 (100%)\n\n<b>최종 평가:</b> 저장 에너지 학습 목표 달성, 전기이론 누적 복습 필요\n\n---\n\n## 1. 학습 목표\n\n1. 콘덴서에 저장되는 전기적 에너지의 개념 이해\n2. 저장 에너지 공식 3가지 숙달\n3. 전압 변화에 따른 에너지 계산\n4. 정전용량 변화에 따른 에너지 계산\n5. 전원 연결과 분리 상태의 차이 이해\n6. 직렬·병렬 콘덴서의 전체 저장 에너지 계산\n7. 기존 전기이론 공식 종합 복습\n\n---\n\n## 2. 콘덴서에 저장되는 에너지\n\n콘덴서는 전하를 저장하는 전기 부품이다.\n\n콘덴서에 전압을 가하면 두 도체판 사이에 전기장이 형성되고, 이 전기장에 에너지가 저장된다.\n\n이를 정전 에너지라고 한다.\n\n저장 에너지의 단위는 J(줄)이다.\n\n### 기본 공식\n\n① W = CV²/2\n\n② W = QV/2\n\n③ W = Q²/(2C)\n\n- W: 저장 에너지(J)\n- C: 정전용량(F)\n- V: 전압(V)\n- Q: 전하량(C)\n\n세 공식은 Q = CV 관계를 이용해 서로 변환할 수 있다.\n\n### 공식 선택 기준\n\n| 주어진 조건 | 사용 공식 |\n| --- | --- |\n| 정전용량과 전압 | W = CV²/2 |\n| 전하량과 전압 | W = QV/2 |\n| 전하량과 정전용량 | W = Q²/(2C) |\n\n<b>주의: 저장 에너지 공식에는 1/2이 포함된다.</b>\n\n### 계산 예제\n\n정전용량 2F, 전압 6V인 콘덴서의 저장 에너지는?\n\nW = CV²/2\n\nW = 2 × 6² / 2\n\nW = 36J\n\n---\n\n## 3. 전압 변화와 저장 에너지\n\n정전용량이 일정한 경우:\n\nW = CV²/2\n\n따라서 저장 에너지는 전압의 제곱에 비례한다.\n\nW ∝ V²\n\n| 전압 변화 | 저장 에너지 변화 |\n| --- | --- |\n| 2배 | 4배 |\n| 3배 | 9배 |\n| 4배 | 16배 |\n| 1/2배 | 1/4배 |\n| 1/3배 | 1/9배 |\n\n### 계산 예제\n\n초기 저장 에너지: 8J\n\n초기 전압: 10V\n\n변경 전압: 30V\n\n전압 변화 = 30/10 = 3배\n\n에너지 변화 = 3² = 9배\n\n최종 에너지 = 8 × 9 = 72J\n\n<b>핵심: 정전용량이 일정할 때 전압 3배 → 전하량 3배 → 저장 에너지 9배</b>\n\n---\n\n## 4. 정전용량 변화와 저장 에너지\n\n정전용량이 변하는 경우에는 전압이 일정한지, 전하량이 일정한지 반드시 구분해야 한다.\n\n### 4.1 전압이 일정한 경우\n\nW = CV²/2\n\n전압이 일정하면 저장 에너지는 정전용량에 비례한다.\n\nW ∝ C\n\n- 정전용량 2배 → 에너지 2배\n- 정전용량 3배 → 에너지 3배\n- 정전용량 1/2배 → 에너지 1/2배\n\n### 4.2 전하량이 일정한 경우\n\nW = Q²/(2C)\n\n전하량이 일정하면 저장 에너지는 정전용량에 반비례한다.\n\nW ∝ 1/C\n\n- 정전용량 2배 → 에너지 1/2배\n- 정전용량 3배 → 에너지 1/3배\n- 정전용량 1/2배 → 에너지 2배\n\n### 반드시 암기할 비교\n\n| 조건 | 정전용량 2배 시 에너지 |\n| --- | --- |\n| 전압 일정 | 2배 |\n| 전하량 일정 | 1/2배 |\n\n---\n\n## 5. 전원 연결과 분리\n\n### 5.1 일정 전압 전원에 연결된 콘덴서\n\n이상적인 일정 전압 전원에 연결되어 있다면 콘덴서의 전압은 일정하다.\n\nQ = CV\n\nW = CV²/2\n\n따라서 정전용량을 2배 증가시키면 전하량과 저장 에너지도 2배 증가한다.\n\n### 5.2 전원에서 분리한 콘덴서\n\n충전 후 전원에서 분리하고 전하 누설이 없다고 가정하면 저장된 전하량은 일정하다.\n\nV = Q/C\n\nW = Q²/(2C)\n\n정전용량을 2배 증가시키면 전압과 저장 에너지는 각각 1/2배가 된다.\n\n| 구분 | 전원 연결 | 전원 분리 |\n| --- | --- | --- |\n| 일정한 값 | 전압 | 전하량 |\n| 정전용량 2배 | 전하량 2배 | 전압 1/2배 |\n| 저장 에너지 | 2배 | 1/2배 |\n\n※ 이상적인 전원과 전하 누설이 없는 조건을 가정한다.\n\n---\n\n## 6. 콘덴서 직렬·병렬 연결과 저장 에너지\n\n### 6.1 직렬 연결\n\n조건:\n\nC1 = 2F\n\nC2 = 4F\n\n전체 전압 = 12V\n\n합성 정전용량:\n\nC = (2 × 4)/(2 + 4)\n\nC = 4/3F\n\n전체 저장 에너지:\n\nW = (4/3) × 12² / 2\n\n<b>W = 96J</b>\n\n### 6.2 병렬 연결\n\n조건:\n\nC1 = 2F\n\nC2 = 4F\n\n전체 전압 = 12V\n\n합성 정전용량:\n\nC = 2 + 4 = 6F\n\n전체 저장 에너지:\n\nW = 6 × 12² / 2\n\n<b>W = 432J</b>\n\n### 직렬·병렬 비교\n\n| 구분 | 직렬 | 병렬 |\n| --- | --- | --- |\n| 합성 정전용량 | 4/3F | 6F |\n| 전체 전압 | 12V | 12V |\n| 전체 저장 에너지 | 96J | 432J |\n\n같은 콘덴서를 사용하고 전체 전압이 동일하다면 합성 정전용량이 큰 연결 방식에 더 많은 에너지가 저장된다.\n\n---\n\n## 7. 단위 변환\n\n실제 필기시험에서는 μF 단위가 사용될 수 있다.\n\n1μF = 0.000001F\n\n### 계산 예제\n\n정전용량 4μF\n\n전압 100V\n\n저장 에너지:\n\nW = CV²/2\n\nW = 4 × 0.000001 × 100² / 2\n\nW = 0.02J\n\n<b>핵심: 에너지를 J 단위로 계산할 때 μF를 F로 변환해야 한다.</b>\n\n---\n\n## 8. 연습문제 및 채점 결과\n\n### 8.1 기본·응용 객관식\n\n| 문제 | 학습 내용 | 제출 답안 | 정답 | 결과 |\n| --- | --- | --- | --- | --- |\n| 1.1 | 에너지 단위 | ③ | ③ | 정답 |\n| 1.2 | 저장 에너지 공식 | ② | ② | 정답 |\n| 1.3 | 전압과 에너지 관계 | ② | ② | 정답 |\n| 2.1 | 2F, 6V 에너지 | ③ | ③ | 정답 |\n| 2.2 | 4F, 10V 에너지 | ③ | ③ | 정답 |\n| 2.3 | 전하량과 전압 | ② | ② | 정답 |\n| 2.4 | 전하량과 정전용량 | ③ | ③ | 정답 |\n| 3.1 | 전압 2배 | ② | ② | 정답 |\n| 3.2 | 전압 3배 | ③ | ③ | 정답 |\n| 3.3 | 전압 1/2배 | ② | ② | 정답 |\n| 3.4 | 전압 변화 계산 | ③ | ③ | 정답 |\n| 4.1 | 전압 일정, C 2배 | ③ | ③ | 정답 |\n| 4.2 | 전하량 일정, C 2배 | ② | ② | 정답 |\n| 4.3 | 전압 일정, C 3배 | ④ | ④ | 정답 |\n| 4.4 | 전하량 일정, C 3배 | ② | ② | 정답 |\n| 5.1 | 직렬 저장 에너지 | ③ | ③ | 정답 |\n| 5.2 | 병렬 저장 에너지 | ④ | ④ | 정답 |\n| 5.3 | μF 단위 변환 | ② | ② | 정답 |\n\n<b>기본·응용 객관식: 18/18 정답 (100%)</b>\n\n---\n\n## 9. 서술형 문제와 해설\n\n### 9.1 문제 6.1 — 전압 변화\n\n조건:\n\n- 정전용량: 5F\n- 초기 전압: 4V\n- 최종 전압: 12V\n\n| 항목 | 제출 답안 | 결과 |\n| --- | --- | --- |\n| A. 초기 에너지 | 40J | 정답 |\n| B. 최종 에너지 | 360J | 정답 |\n| C. 에너지 변화 | 9배 | 정답 |\n| D. 전하량 변화 | 3배 | 정답 |\n| E. 이유 설명 | 에너지는 전압 제곱에 비례 | 정답 |\n\n계산:\n\nW1 = 5 × 4² / 2 = 40J\n\nW2 = 5 × 12² / 2 = 360J\n\n에너지 변화 = 360/40 = 9배\n\n전하량 변화 = 12/4 = 3배\n\n<b>서술형 6.1: 5/5 정답</b>\n\n### 9.2 문제 6.2 — 전원 연결과 분리\n\n초기 저장 에너지: 40J\n\n정전용량: 2배 증가\n\n<b>A. 전압 일정</b>\n\nW2 = 40 × 2 = 80J\n\n정답\n\n<b>B. 전하량 일정</b>\n\nW2 = 40/2 = 20J\n\n정답\n\n<b>C. 이유 설명</b>\n\n제출 답안:\n\n\"저장에너지는 전압제곱에 비례하고, 전하량이 일정하게 유지될 경우 저장에너지는 정전용량에 반비례하기 때문이다.\"\n\n정답\n\n보충 설명:\n\n전압이 일정하면 저장 에너지는 정전용량에 비례한다.\n\n전하량이 일정하면 저장 에너지는 정전용량에 반비례한다.\n\n<b>서술형 6.2: 3/3 정답</b>\n\n---\n\n## 10. 전기이론 누적 복습 결과\n\n| 문제 | 내용 | 제출 답안 | 정답 | 결과 |\n| --- | --- | --- | --- | --- |\n| 7.1 | 도선의 저항 | ③ | ③ | 정답 |\n| 7.2 | 쿨롱의 법칙 | 기억 안 남 | ③ | 미정답 |\n| 7.3 | 전계의 세기 | 기억 안 남 | ① | 미정답 |\n| 7.4 | 전위와 위치에너지 | 기억 안 남 | ② | 미정답 |\n\n<b>누적 복습: 1/4 정답 (25%)</b>\n\n콘덴서 저장 에너지 계산은 모두 정확했으나 이전에 배운 전기이론 공식 3개를 기억하지 못했다.\n\n계산 능력보다 과거 공식의 장기 기억 유지가 현재 보완 과제로 확인되었다.\n\n---\n\n## 11. 취약 개념 복습\n\n### 11.1
