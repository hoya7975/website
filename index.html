 쿨롱의 법칙\n\n두 점전하 사이에 작용하는 힘을 계산한다.\n\nF = k × \\|Q1 × Q2\\| / r²\n\n- F: 전기력(N)\n- Q1, Q2: 전하량(C)\n- r: 두 전하 사이 거리(m)\n\n#### 복습문제 7.2\n\n두 전하량을 각각 2배로 증가시키고 거리를 2배로 늘렸다.\n\n전기력 변화:\n\nF2/F1 = (2 × 2)/2²\n\nF2/F1 = 4/4 = 1\n\n<b>정답: 1배</b>\n\n기억할 내용:\n\n전기력은 두 전하량의 곱에 비례하고 거리의 제곱에 반비례한다.\n\n### 11.2 전계의 세기\n\n점전하가 만드는 전계의 세기:\n\nE = k × \\|Q\\| / r²\n\n- E: 전계의 세기(N/C)\n- Q: 원천전하(C)\n- r: 원천전하로부터의 거리(m)\n\n#### 복습문제 7.3\n\n원천전하를 3배, 거리를 2배로 증가시켰다.\n\nE2/E1 = 3/2²\n\nE2/E1 = 3/4\n\n<b>정답: 3/4배</b>\n\n쿨롱의 법칙은 전하량 두 개의 곱을 사용하지만, 점전하가 만드는 전계의 세기는 원천전하 하나를 사용한다.\n\n### 11.3 전위와 위치에너지\n\n위치에너지 변화 공식:\n\nΔU = q × (V2 - V1)\n\n- ΔU: 위치에너지 변화량(J)\n- q: 전하량(C)\n- V1: 초기 전위(V)\n- V2: 최종 전위(V)\n\n#### 복습문제 7.4\n\n전하량 -2C인 음전하가 10V에서 30V로 이동했다.\n\nΔU = -2 × (30 - 10)\n\nΔU = -40J\n\n<b>정답: -40J</b>\n\n음전하가 높은 전위로 이동하면 위치에너지는 감소한다.\n\n### 핵심 비교\n\n| 주제 | 공식 | 주의사항 |\n| --- | --- | --- |\n| 쿨롱의 법칙 | F = k × \\|Q1Q2\\|/r² | 전하량 두 개 |\n| 점전하의 전계 | E = k × \\|Q\\|/r² | 원천전하 하나 |\n| 위치에너지 변화 | ΔU = q(V2-V1) | 전하량의 부호 |\n\n---\n\n## 12. 시험 직전 암기 공식\n\n| 학습 주제 | 핵심 공식 |\n| --- | --- |\n| 정전용량 | C = Q/V |\n| 전하량 | Q = CV |\n| 저장 에너지 1 | W = CV²/2 |\n| 저장 에너지 2 | W = QV/2 |\n| 저장 에너지 3 | W = Q²/(2C) |\n| 직렬 합성 정전용량 | 1/C = 1/C1 + 1/C2 |\n| 병렬 합성 정전용량 | C = C1 + C2 |\n| 쿨롱의 법칙 | F = k × \\|Q1Q2\\|/r² |\n| 점전하의 전계 | E = k × \\|Q\\|/r² |\n| 위치에너지 변화 | ΔU = q(V2-V1) |\n| 도선의 저항 | R = ρL/A |\n\n### 반드시 암기할 6가지\n\n1. 저장 에너지는 전압의 제곱에 비례한다. (정전용량 일정)\n2. 전압이 일정하면 저장 에너지는 정전용량에 비례한다.\n3. 전하량이 일정하면 저장 에너지는 정전용량에 반비례한다.\n4. 직렬 콘덴서에서는 전하량의 크기가 같다.\n5. 병렬 콘덴서에서는 전압이 같다.\n6. 쿨롱의 법칙, 전계의 세기, 위치에너지 변화 공식은 구분해서 암기한다.\n\n---\n\n## 13. 학습 성적 및 최종 평가\n\n| 학습 영역 | 정답 | 전체 | 정답률 |\n| --- | --- | --- | --- |\n| 저장 에너지 기본 및 응용 | 18 | 18 | 100% |\n| 서술형 | 8 | 8 | 100% |\n| 전기이론 누적 복습 | 1 | 4 | 25% |\n| <b>전체</b> | <b>27</b> | <b>30</b> | <b>90.0%</b> |\n\n### 잘 이해한 부분\n\n- 저장 에너지 공식 3가지\n- 전압의 제곱과 저장 에너지 관계\n- 전압 일정 및 전하량 일정 조건 구분\n- 직렬·병렬 연결의 저장 에너지\n- μF 단위 변환\n- 저장 에너지 서술형 계산 및 원리 설명\n\n### 보완할 부분\n\n1. 쿨롱의 법칙 공식 재암기\n2. 점전하의 전계 공식 재암기\n3. 음전하의 위치에너지 변화 계산 복습\n4. 이전 단원의 공식을 누적 반복학습으로 장기 기억에 정착시키기\n\n### 최종 평가\n\n콘덴서 저장 에너지 관련 26개 세부 문항에서 모두 정답을 기록했다.\n\n전압과 정전용량의 관계를 정확하게 구분했으며, 직렬·병렬 연결의 저장 에너지 계산도 정확하게 수행했다.\n\n반면 전기이론 누적 복습에서는 4문제 중 3문제의 공식을 기억하지 못했다.\n\n<b>6일차 2회차 신규 학습 목표 달성. 전기이론 누적 복습은 추가 보완 필요.</b>\n\n※ 추가 보충문제 4문항은 아직 답안을 제출하지 않았으므로 최종 성적에 포함하지 않았다.\n\n---\n\n## 14. 다음 학습 계획\n\n### 7일차 학습 운영\n\n2027년 1월 전기기능사 필기시험 합격을 목표로 다음부터는 <b>다산에듀 2026 속전속결 전기기능사 필기 이론서 2권의 실제 목차와 진도에 맞춰 학습</b>한다.\n\n기존 학습 내용과 교재의 차이를 비교하고, 이미 학습한 부분은 복습으로 처리하며 미학습 단원부터 진도를 진행한다.\n\n각 회차에 다음 항목을 기록한다.\n\n- 교재명 및 과목\n- 장·절 및 페이지\n- 학습 완료 여부\n- 연습문제 정답률\n- 오답 및 보충학습 여부\n- 다음 학습 범위\n\n특히 쿨롱의 법칙, 전계, 전위와 위치에너지 공식은 다음 회차의 누적 복습에 포함한다.\n\n<b>최종 목표: 2027년 1월 전기기능사 필기시험 합격</b>","counts":{"correct":27,"total":30,"kind":"최초","label":"노션 확인 최초 성적"},"supplement":null,"sourceChecked":"2026-11-12","historyImportVersion":"public-history-2026-11-12-v1"},{"id":"past8","day":7,"round":1,"date":"2026-11-11","title":"전지의 직렬·병렬접속과 전기 측정","status":"완료","unitIds":["u4"],"concept":"# 전기기능사 필기 7일차 1회차 학습 정리\n\n학습일: 2026년 11월 11일\n\n시험 목표: 2027년 1월 전기기능사 필기 합격\n\n학습 주제: 전지의 직렬·병렬접속과 전기 측정\n\n최종 평가: 학습 목표 달성 / 보충학습 완료\n\n---\n\n## 1. 교재 및 진도\n\n- 교재: 다산에듀 2026 속전속결 전기기능사 필기 이론서 1권\n- 과목: 전기이론\n- 장: 제1장 직류회로\n- 절: 제4절 전지접속과 측정\n- 핵심개념: 32~36쪽\n- 필수문제: 37~40쪽 (별도 전수 풀이 미실시)\n- 진도 상태: 핵심개념 학습 완료\n- 보충학습: 완료\n\n### 학습 목표\n\n1. 전지의 기전력과 내부저항 이해\n2. 전지 직렬접속의 합성 기전력과 내부저항 계산\n3. 전지 병렬접속의 합성 내부저항 계산\n4. 직렬·병렬접속 시 부하 전류 계산\n5. 전류계·전압계의 접속 방식 이해\n6. 분류기와 배율기의 용도 및 계산\n7. 휘스톤 브리지 평형 조건 이해\n8. 이전 학습 공식 누적 복습\n\n---\n\n## 2. 전지의 기전력과 내부저항\n\n전지는 전기에너지를 공급하는 장치이며, 실제 전지에는 내부저항이 존재한다.\n\n### 핵심 공식\n\nI = E / (R + r)\n\n- I: 전류(A)\n- E: 기전력(V)\n- R: 외부저항(Ω)\n- r: 내부저항(Ω)\n\n방전 중인 전지의 단자전압:\n\nV = E - Ir\n\n### 계산 예제\n\n기전력 12V, 내부저항 1Ω, 외부저항 5Ω\n\nI = 12 / (5+1) = 2A\n\n핵심: 전류 계산 시 외부저항과 내부저항을 모두 고려한다.\n\n---\n\n## 3. 전지의 직렬접속\n\n동일한 전지 n개를 같은 방향으로 직렬접속하면 기전력과 내부저항이 모두 증가한다.\n\n### 핵심 공식\n\n전체 기전력 = nE\n\n전체 내부저항 = nr\n\nI = nE / (R + nr)\n\n### 계산 예제\n\n기전력 1.5V, 내부저항 0.2Ω인 전지 4개를 직렬접속하고 외부저항 5.2Ω을 연결한다.\n\n전체 기전력 = 1.5 × 4 = 6V\n\n전체 내부저항 = 0.2 × 4 = 0.8Ω\n\n전체저항 = 5.2 + 0.8 = 6Ω\n\n전류 = 6/6 = 1A\n\n### 암기 사항\n\n- 직렬접속 → 기전력 증가\n- 직렬접속 → 내부저항 증가\n- 전류 계산 시 전체저항 사용\n\n---\n\n## 4. 전지의 병렬접속\n\n동일한 전지를 같은 극끼리 병렬접속하면 전체 기전력은 전지 1개와 같고 내부저항은 감소한다.\n\n### 핵심 공식\n\n전체 기전력 = E\n\n전체 내부저항 = r/n\n\nI = E / (R + r/n)\n\n### 계산 예제\n\n기전력 6V, 내부저항 2Ω인 전지 4개를 병렬접속하고 외부저항 5.5Ω을 연결한다.\n\n전체 기전력 = 6V\n\n합성 내부저항 = 2/4 = 0.5Ω\n\n전체저항 = 5.5+0.5 = 6Ω\n\n전류 = 6/6 = 1A\n\n### 직렬·병렬접속 비교\n\n| 구분 | 직렬접속 | 병렬접속 |\n| --- | --- | --- |\n| 전체 기전력 | nE | E |\n| 합성 내부저항 | nr | r/n |\n| 전류 공식 | nE/(R+nr) | E/(R+r/n) |\n| 특징 | 전압 증가 | 내부저항 감소 |\n\n주의: 병렬접속으로 내부저항이 감소하더라도 직렬접속보다 전류가 반드시 커지는 것은 아니다. 전체 기전력과 전체저항을 함께 고려해야 한다.\n\n---\n\n## 5. 전류계와 전압계\n\n### 전류계\n\n- 목적: 전류 측정\n- 접속: 직렬\n- 이상적인 내부저항: 0Ω\n\n### 전압계\n\n- 목적: 전압 측정\n- 접속: 병렬\n- 이상적인 내부저항: 무한대\n\n### 분류기\n\n전류계의 측정범위를 확대하는 장치이다.\n\n- 전류계와 병렬접속\n- 전류를 분배하는 원리\n\n### 배율기\n\n전압계의 측정범위를 확대하는 장치이다.\n\n- 전압계와 직렬접속\n- 전압을 분배하는 원리\n\n배율저항 공식:\n\nRm = (m-1)Rv\n\n- Rm: 추가 배율저항\n- m: 측정범위 확대 배수\n- Rv: 전압계 내부저항\n\n### 계산 예제\n\n내부저항 2,000Ω인 전압계의 측정범위를 3배로 확대한다.\n\nRm = (3-1) × 2,000\n\nRm = 4,000Ω\n\n암기: 전류계는 직렬, 전압계는 병렬, 분류기는 병렬, 배율기는 직렬.\n\n---\n\n## 6. 휘스톤 브리지\n\n휘스톤 브리지는 미지의 저항을 측정하기 위한 회로이다.\n\n평형 상태에서는 검류계 G에 전류가 흐르지 않는다.\n\n교재의 P, Q, R, X 배치 기준 평형 조건:\n\nP × R = Q × X\n\n미지저항 공식:\n\nX = P × R / Q\n\n### 계산 예제\n\nP = 5Ω\n\nQ = 10Ω\n\nR = 8Ω\n\nX = 5 × 8 / 10\n\nX = 4Ω\n\n핵심: 브리지 평형 조건과 저항의 위치를 함께 기억한다.\n\n---\n\n## 7. 누적 복습\n\n### 7.1 쿨롱의 법칙\n\nF = k × |Q1 × Q2| / r²\n\n- 두 전하량의 곱에 비례\n- 거리의 제곱에 반비례\n\n거리 3배 → 전기력 1/9배\n\n### 7.2 전계의 세기\n\nE = k × |Q| / r²\n\n- 원천전하에 비례\n- 거리의 제곱에 반비례\n\n원천전하 2배, 거리 2배 → 전계 1/2배\n\n### 7.3 전위와 위치에너지\n\nΔU = q × (V2-V1)\n\n음전하 -2C가 10V에서 30V로 이동한다.\n\nΔU = -2 × (30-10)\n\nΔU = -40J\n\n### 누적 복습 결과\n\n3문제 모두 정답.\n\n6일차에 기억하지 못했던 공식을 이번 회차에서 정확히 적용했다.\n\n---\n\n### 객관식\n\n| 문제 | 제출 | 정답 | 결과 |\n| --- | --- | --- | --- |\n| 1.1 | ③ | ③ | 정답 |\n| 1.2 | ③ | ③ | 정답 |\n| 1.3 | ② | ② | 정답 |\n| 2.1 | ② | ② | 정답 |\n| 2.2 | ② | ② | 정답 |\n| 2.3 | ③ | ③ | 정답 |\n| 2.4 | ③ | ③ | 정답 |\n| 3.1 | ② | ② | 정답 |\n| 3.2 | ② | ② | 정답 |\n| 3.3 | ① | ① | 정답 |\n| 3.4 | ③ | ③ | 정답 |\n| 4.1 | ③ | ③ | 정답 |\n| 4.2 | ① | ① | 정답 |\n| 4.3 | ② | ② | 정답 |\n| 5.1 | ③ | ③ | 정답 |\n| 5.2 | ② | ② | 정답 |\n| 5.3 | ② | ② | 정답 |\n\n객관식: 17/17 정답 (100%)\n\n### 서술형 6.1\n\n조건:\n\n- 전지 기전력: 2V\n- 전지 내부저항: 0.5Ω\n- 전지 수: 3개\n- 외부저항: 4.5Ω\n\n| 항목 | 제출 답안 | 정답 | 결과 |\n| --- | --- | --- | --- |\n| A. 직렬 기전력 | 6 | 6V | 정답 |\n| B. 직렬 내부저항 | 1.5 | 1.5Ω | 정답 |\n| C. 직렬 전류 | 6 | 1A | 오답 |\n| D. 병렬 내부저항 | 0.17 | 약 0.167Ω | 정답 |\n| E. 병렬 전류 | 4.67 | 약 0.429A | 오답 |\n| F. 원리 설명 | 정확 | 정확 | 정답 |\n\n서술형: 4/6 정답 (66.7%)\n\n### 최초 종합 성적\n\n- 객관식: 17/17\n- 서술형: 4/6\n- 전체: 21/23\n- 정답률: 91.3%\n\n---\n\n### 오답 1 — 직렬접속 시 전류\n\n제출 답안: 6\n\n정답: 1A\n\n#### 올바른 계산\n\n전체 기전력 = 2 × 3 = 6V\n\n전체 내부저항 = 0.5 × 3 = 1.5Ω\n\n전체저항 = 4.5 + 1.5 = 6Ω\n\nI = 6/6 = 1A\n\n#### 오답 원인\n\n기전력 또는 전체저항을 구한 후 마지막 전류 계산을 정확하게 수행하지 못한 것으로 추정된다.\n\n#### 개선 방법\n\n전체 기전력 → 합성 내부저항 → 전체저항 → 전류 순서로 계산한다.\n\n### 오답 2 — 병렬접속 시 전류\n\n제출 답안: 4.67\n\n정답: 약 0.429A\n\n#### 올바른 계산\n\n전체 기전력 = 2V\n\n합성 내부저항 = 0.5/3 = 약 0.167Ω\n\n전체저항 = 4.5 + 0.167 = 약 4.667Ω\n\nI = 2/4.667 = 약 0.429A\n\n#### 오답 원인\n\n전체저항 약 4.67Ω을 전류값으로 잘못 제출하였다.\n\n#### 개선 방법\n\n전류 문제에서는 마지막 계산이 I = E/R전체인지 반드시 확인한다.\n\n---\n\n### 보충 5-C 서술형\n\n제출 답안:\n\n\"전류는 전압의 크기에 비례하고 저항에 반비례하기 때문이다.\"\n\n정답 인정.\n\n추가 이해:\n\n직렬접속에서는 기전력 6V, 전체저항 6Ω으로 전류가 1A이다.\n\n병렬접속에서는 기전력 2V, 전체저항 약 4.667Ω으로 전류가 약 0.429A이다.\n\n병렬접속은 저항이 감소하지만 기전력도 크게 감소하므로 이 문제에서는 직렬접속보다 전류가 작다.\n\n### 보충학습 결론\n\n최초 오답 2개 모두 보완 완료.\n\n추가 보충문제 불필요.\n\n---\n\n## 11. 시험 직전 암기 공식\n\n| 항목 | 공식 |  |  |\n| --- | --- | --- | --- |\n| 단일 전지 전류 | I = E/(R+r) |  |  |\n| 직렬접속 기전력 | E전체 = nE |  |  |\n| 직렬접속 내부저항 | r전체 = nr |  |  |\n| 직렬접속 전류 | I = nE/(R+nr) |  |  |\n| 병렬접속 기전력 | E전체 = E |  |  |\n| 병렬접속 내부저항 | r전체 = r/n |  |  |\n| 병렬접속 전류 | I = E/(R+r/n) |  |  |\n| 배율기 저항 | Rm = (m-1)Rv |  |  |\n| 브리지 평형 | PR = QX |  |  |\n| 미지저항 | X = PR/Q |  |  |\n| 쿨롱의 법칙 | F = k× | Q1Q2 | /r² |\n| 점전하의 전계 | E = k× | Q | /r² |\n| 위치에너지 변화 | ΔU = q(V2-V1) |  |  |\n\n※ 직렬·병렬 전지 공식은 동일한 전지, 같은 방향 또는 같은 극의 접속을 가정한다.\n\n---\n\n### 잘 이해한 부분\n\n- 전지의 직렬·병렬접속 원리\n- 기전력 및 내부저항 계산\n- 전류계와 전압계의 접속\n- 분류기와 배율기의 용도\n- 휘스톤 브리지 평형 조건\n- 쿨롱의 법칙 및 전계 공식\n- 전위와 위치에너지 관계\n\n### 개선한 부분\n\n- 전지접속 시 전체저항 계산\n- 내부저항과 외부저항의 구분\n- 전체저항과 전류의 구분\n- 옴의 법칙을 이용한 최종 전류 계산\n- 직렬·병렬접속의 전류 차이에 관한 설명\n\n### 향후 주의사항\n\n1. 문제에서 요구하는 값이 전압, 저항, 전류 중 무엇인지 확인한다.\n2. 내부저항을 빠뜨리지 않는다.\n3. 병렬접속 시 기전력을 합산하지 않는다.\n4. 계산 마지막에 단위를 반드시 확인한다.\n5. 이전 단원의 공식을 누적 복습한다.\n\n---\n\n### 7일차 2회차\n\n교재: 다산에듀 2026 속전속결 전기기능사 필기 이론서 1권\n\n과목: 전기이론\n\n단원: 제1장 직류회로 6절\n\n학습 주제: 전류의 화학작용과 열작용\n\n이론 페이지: 51~55쪽\n\n필수문제: 56쪽부터\n\n### 학습 예정 내용\n\n1. 전기분해\n2. 패러데이의 법칙\n3. 1차 전지와 2차 전지\n4. 전지의 분극작용과 감극제\n5. 제베크 효과\n6. 펠티에 효과\n7. 톰슨 효과\n8. 누적 복습 및 연습문제\n\n7일차 1회차 최종 판정: 학습 목표 달성 / 계산 오류 보완 완료 / 회차 종료\n\n최종 목표: 2027년 1월 전기기능사 필기시험 합격","examples":"### 계산 예제\n\n기전력 12V, 내부저항 1Ω, 외부저항 5Ω\n\nI = 12 / (5+1) = 2A\n\n핵심: 전류 계산 시 외부저항과 내부저항을 모두 고려한다.\n\n---\n\n### 계산 예제\n\n기전력 1.5V, 내부저항 0.2Ω인 전지 4개를 직렬접속하고 외부저항 5.2Ω을 연결한다.\n\n전체 기전력 = 1.5 × 4 = 6V\n\n전체 내부저항 = 0.2 × 4 = 0.8Ω\n\n전체저항 = 5.2 + 0.8 = 6Ω\n\n전류 = 6/6 = 1A\n\n### 계산 예제\n\n기전력 6V, 내부저항 2Ω인 전지 4개를 병렬접속하고 외부저항 5.5Ω을 연결한다.\n\n전체 기전력 = 6V\n\n합성 내부저항 = 2/4 = 0.5Ω\n\n전체저항 = 5.5+0.5 = 6Ω\n\n전류 = 6/6 = 1A\n\n### 계산 예제\n\n내부저항 2,000Ω인 전압계의 측정범위를 3배로 확대한다.\n\nRm = (3-1) × 2,000\n\nRm = 4,000Ω\n\n암기: 전류계는 직렬, 전압계는 병렬, 분류기는 병렬, 배율기는 직렬.\n\n---\n\n### 계산 예제\n\nP = 5Ω\n\nQ = 10Ω\n\nR = 8Ω\n\nX = 5 × 8 / 10\n\nX = 4Ω\n\n핵심: 브리지 평형 조건과 저항의 위치를 함께 기억한다.\n\n---\n\n### 서술형 6.1\n\n조건:\n\n- 전지 기전력: 2V\n- 전지 내부저항: 0.5Ω\n- 전지 수: 3개\n- 외부저항: 4.5Ω\n\n| 항목 | 제출 답안 | 정답 | 결과 |\n| --- | --- | --- | --- |\n| A. 직렬 기전력 | 6 | 6V | 정답 |\n| B. 직렬 내부저항 | 1.5 | 1.5Ω | 정답 |\n| C. 직렬 전류 | 6 | 1A | 오답 |\n| D. 병렬 내부저항 | 0.17 | 약 0.167Ω | 정답 |\n| E. 병렬 전류 | 4.67 | 약 0.429A | 오답 |\n| F. 원리 설명 | 정확 | 정확 | 정답 |\n\n서술형: 4/6 정답 (66.7%)\n\n### 보충 5-C 서술형\n\n제출 답안:\n\n\"전류는 전압의 크기에 비례하고 저항에 반비례하기 때문이다.\"\n\n정답 인정.\n\n추가 이해:\n\n직렬접속에서는 기전력 6V, 전체저항 6Ω으로 전류가 1A이다.\n\n병렬접속에서는 기전력 2V, 전체저항 약 4.667Ω으로 전류가 약 0.429A이다.\n\n병렬접속은 저항이 감소하지만 기전력도 크게 감소하므로 이 문제에서는 직렬접속보다 전류가 작다.","notes":"## 8. 최초 연습문제 채점 결과\n\n## 9. 오답노트\n\n## 10. 보충문제 및 최종 채점\n\n| 문제 | 제출 | 정답 | 결과 |\n| --- | --- | --- | --- |\n| 보충 1 | ② | ② (1A) | 정답 |\n| 보충 2 | ③ | ③ (2A) | 정답 |\n| 보충 3 | ① | ① (3Ω, 1A) | 정답 |\n| 보충 4 | ② | ② (1A) | 정답 |\n| 보충 5-A | 1 | 1A | 정답 |\n| 보충 5-B | 0.43 | 약 0.429A | 정답 |\n| 보충 5-C | 옴의 법칙 설명 | 정답 인정 | 정답 |\n\n보충학습: 7/7 정답 (100%)\n\n## 12. 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 최초 객관식 | 17/17 (100%) |\n| 최초 서술형 | 4/6 (66.7%) |\n| 최초 종합 | 21/23 (91.3%) |\n| 누적 복습 | 3/3 정답 |\n| 보충문제 | 7/7 (100%) |\n| 최초 오답 | 2개 |\n| 보완 완료 | 2개 |\n| 추가 보충 필요 | 없음 |\n| 최종 평가 | 학습 목표 달성 |\n\n## 13. 다음 학습 계획\n\n가져오기: 노션 확인 기록 전체를 보존했습니다. 문항별 제출 답안·정답은 원문 탭에서 볼 수 있습니다. 기록에 없는 성적·완료 범위는 추정하지 않았습니다.","questions":[],"source":"","sourceText":"# 전기기능사 필기 7일차 1회차 학습 정리\n\n<b>학습일:</b> 2026년 11월 11일\n\n<b>시험 목표:</b> 2027년 1월 전기기능사 필기 합격\n\n<b>학습 주제:</b> 전지의 직렬·병렬접속과 전기 측정\n\n<b>최종 평가:</b> 학습 목표 달성 / 보충학습 완료\n\n---\n\n## 1. 교재 및 진도\n\n- 교재: 다산에듀 2026 속전속결 전기기능사 필기 이론서 1권\n- 과목: 전기이론\n- 장: 제1장 직류회로\n- 절: 제4절 전지접속과 측정\n- 핵심개념: 32\\~36쪽\n- 필수문제: 37\\~40쪽 (별도 전수 풀이 미실시)\n- 진도 상태: 핵심개념 학습 완료\n- 보충학습: 완료\n\n### 학습 목표\n\n1. 전지의 기전력과 내부저항 이해\n2. 전지 직렬접속의 합성 기전력과 내부저항 계산\n3. 전지 병렬접속의 합성 내부저항 계산\n4. 직렬·병렬접속 시 부하 전류 계산\n5. 전류계·전압계의 접속 방식 이해\n6. 분류기와 배율기의 용도 및 계산\n7. 휘스톤 브리지 평형 조건 이해\n8. 이전 학습 공식 누적 복습\n\n---\n\n## 2. 전지의 기전력과 내부저항\n\n전지는 전기에너지를 공급하는 장치이며, 실제 전지에는 내부저항이 존재한다.\n\n### 핵심 공식\n\nI = E / (R + r)\n\n- I: 전류(A)\n- E: 기전력(V)\n- R: 외부저항(Ω)\n- r: 내부저항(Ω)\n\n방전 중인 전지의 단자전압:\n\nV = E - Ir\n\n### 계산 예제\n\n기전력 12V, 내부저항 1Ω, 외부저항 5Ω\n\nI = 12 / (5+1) = 2A\n\n<b>핵심:</b> 전류 계산 시 외부저항과 내부저항을 모두 고려한다.\n\n---\n\n## 3. 전지의 직렬접속\n\n동일한 전지 n개를 같은 방향으로 직렬접속하면 기전력과 내부저항이 모두 증가한다.\n\n### 핵심 공식\n\n전체 기전력 = nE\n\n전체 내부저항 = nr\n\nI = nE / (R + nr)\n\n### 계산 예제\n\n기전력 1.5V, 내부저항 0.2Ω인 전지 4개를 직렬접속하고 외부저항 5.2Ω을 연결한다.\n\n전체 기전력 = 1.5 × 4 = 6V\n\n전체 내부저항 = 0.2 × 4 = 0.8Ω\n\n전체저항 = 5.2 + 0.8 = 6Ω\n\n전류 = 6/6 = 1A\n\n### 암기 사항\n\n- 직렬접속 → 기전력 증가\n- 직렬접속 → 내부저항 증가\n- 전류 계산 시 전체저항 사용\n\n---\n\n## 4. 전지의 병렬접속\n\n동일한 전지를 같은 극끼리 병렬접속하면 전체 기전력은 전지 1개와 같고 내부저항은 감소한다.\n\n### 핵심 공식\n\n전체 기전력 = E\n\n전체 내부저항 = r/n\n\nI = E / (R + r/n)\n\n### 계산 예제\n\n기전력 6V, 내부저항 2Ω인 전지 4개를 병렬접속하고 외부저항 5.5Ω을 연결한다.\n\n전체 기전력 = 6V\n\n합성 내부저항 = 2/4 = 0.5Ω\n\n전체저항 = 5.5+0.5 = 6Ω\n\n전류 = 6/6 = 1A\n\n### 직렬·병렬접속 비교\n\n| 구분 | 직렬접속 | 병렬접속 |\n| --- | --- | --- |\n| 전체 기전력 | nE | E |\n| 합성 내부저항 | nr | r/n |\n| 전류 공식 | nE/(R+nr) | E/(R+r/n) |\n| 특징 | 전압 증가 | 내부저항 감소 |\n\n<b>주의:</b> 병렬접속으로 내부저항이 감소하더라도 직렬접속보다 전류가 반드시 커지는 것은 아니다. 전체 기전력과 전체저항을 함께 고려해야 한다.\n\n---\n\n## 5. 전류계와 전압계\n\n### 전류계\n\n- 목적: 전류 측정\n- 접속: 직렬\n- 이상적인 내부저항: 0Ω\n\n### 전압계\n\n- 목적: 전압 측정\n- 접속: 병렬\n- 이상적인 내부저항: 무한대\n\n### 분류기\n\n전류계의 측정범위를 확대하는 장치이다.\n\n- 전류계와 병렬접속\n- 전류를 분배하는 원리\n\n### 배율기\n\n전압계의 측정범위를 확대하는 장치이다.\n\n- 전압계와 직렬접속\n- 전압을 분배하는 원리\n\n배율저항 공식:\n\nRm = (m-1)Rv\n\n- Rm: 추가 배율저항\n- m: 측정범위 확대 배수\n- Rv: 전압계 내부저항\n\n### 계산 예제\n\n내부저항 2,000Ω인 전압계의 측정범위를 3배로 확대한다.\n\nRm = (3-1) × 2,000\n\nRm = 4,000Ω\n\n<b>암기:</b> 전류계는 직렬, 전압계는 병렬, 분류기는 병렬, 배율기는 직렬.\n\n---\n\n## 6. 휘스톤 브리지\n\n휘스톤 브리지는 미지의 저항을 측정하기 위한 회로이다.\n\n평형 상태에서는 검류계 G에 전류가 흐르지 않는다.\n\n교재의 P, Q, R, X 배치 기준 평형 조건:\n\nP × R = Q × X\n\n미지저항 공식:\n\nX = P × R / Q\n\n### 계산 예제\n\nP = 5Ω\n\nQ = 10Ω\n\nR = 8Ω\n\nX = 5 × 8 / 10\n\nX = 4Ω\n\n<b>핵심:</b> 브리지 평형 조건과 저항의 위치를 함께 기억한다.\n\n---\n\n## 7. 누적 복습\n\n### 7.1 쿨롱의 법칙\n\nF = k × \\|Q1 × Q2\\| / r²\n\n- 두 전하량의 곱에 비례\n- 거리의 제곱에 반비례\n\n거리 3배 → 전기력 1/9배\n\n### 7.2 전계의 세기\n\nE = k × \\|Q\\| / r²\n\n- 원천전하에 비례\n- 거리의 제곱에 반비례\n\n원천전하 2배, 거리 2배 → 전계 1/2배\n\n### 7.3 전위와 위치에너지\n\nΔU = q × (V2-V1)\n\n음전하 -2C가 10V에서 30V로 이동한다.\n\nΔU = -2 × (30-10)\n\nΔU = -40J\n\n### 누적 복습 결과\n\n3문제 모두 정답.\n\n6일차에 기억하지 못했던 공식을 이번 회차에서 정확히 적용했다.\n\n---\n\n## 8. 최초 연습문제 채점 결과\n\n### 객관식\n\n| 문제 | 제출 | 정답 | 결과 |\n| --- | --- | \n\n추가 보충문제 불필요.\n\n---\n\n## 11. 시험 직전 암기 공식\n\n| 항목 | 공식 |  |  |\n| --- | --- | --- | --- |\n| 단일 전지 전류 | I = E/(R+r) |  |  |\n| 직렬접속 기전력 | E전체 = nE |  |  |\n| 직렬접속 내부저항 | r전체 = nr |  |  |\n| 직렬접속 전류 | I = nE/(R+nr) |  |  |\n| 병렬접속 기전력 | E전체 = E |  |  |\n| 병렬접속 내부저항 | r전체 = r/n |  |  |\n| 병렬접속 전류 | I = E/(R+r/n) |  |  |\n| 배율기 저항 | Rm = (m-1)Rv |  |  |\n| 브리지 평형 | PR = QX |  |  |\n| 미지저항 | X = PR/Q |  |  |\n| 쿨롱의 법칙 | F = k× | Q1Q2 | /r² |\n| 점전하의 전계 | E = k× | Q | /r² |\n| 위치에너지 변화 | ΔU = q(V2-V1) |  |  |\n\n※ 직렬·병렬 전지 공식은 동일한 전지, 같은 방향 또는 같은 극의 접속을 가정한다.\n\n---\n\n## 12. 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 최초 객관식 | 17/17 (100%) |\n| 최초 서술형 | 4/6 (66.7%) |\n| 최초 종합 | 21/23 (91.3%) |\n| 누적 복습 | 3/3 정답 |\n| 보충문제 | 7/7 (100%) |\n| 최초 오답 | 2개 |\n| 보완 완료 | 2개 |\n| 추가 보충 필요 | 없음 |\n| 최종 평가 | 학습 목표 달성 |\n\n### 잘 이해한 부분\n\n- 전지의 직렬·병렬접속 원리\n- 기전력 및 내부저항 계산\n- 전류계와 전압계의 접속\n- 분류기와 배율기의 용도\n- 휘스톤 브리지 평형 조건\n- 쿨롱의 법칙 및 전계 공식\n- 전위와 위치에너지 관계\n\n### 개선한 부분\n\n- 전지접속 시 전체저항 계산\n- 내부저항과 외부저항의 구분\n- 전체저항과 전류의 구분\n- 옴의 법칙을 이용한 최종 전류 계산\n- 직렬·병렬접속의 전류 차이에 관한 설명\n\n### 향후 주의사항\n\n1. 문제에서 요구하는 값이 전압, 저항, 전류 중 무엇인지 확인한다.\n2. 내부저항을 빠뜨리지 않는다.\n3. 병렬접속 시 기전력을 합산하지 않는다.\n4. 계산 마지막에 단위를 반드시 확인한다.\n5. 이전 단원의 공식을 누적 복습한다.\n\n---\n\n## 13. 다음 학습 계획\n\n### 7일차 2회차\n\n교재: 다산에듀 2026 속전속결 전기기능사 필기 이론서 1권\n\n과목: 전기이론\n\n단원: 제1장 직류회로 6절\n\n학습 주제: 전류의 화학작용과 열작용\n\n이론 페이지: 51\\~55쪽\n\n필수문제: 56쪽부터\n\n### 학습 예정 내용\n\n1. 전기분해\n2. 패러데이의 법칙\n3. 1차 전지와 2차 전지\n4. 전지의 분극작용과 감극제\n5. 제베크 효과\n6. 펠티에 효과\n7. 톰슨 효과\n8. 누적 복습 및 연습문제\n\n<b>7일차 1회차 최종 판정: 학습 목표 달성 / 계산 오류 보완 완료 / 회차 종료</b>\n\n<b>최종 목표: 2027년 1월 전기기능사 필기시험 합격</b>","counts":{"correct":21,"total":23,"kind":"최초","label":"노션 확인 최초 성적"},"supplement":{"correct":7,"total":7},"sourceChecked":"2026-11-12","historyImportVersion":"public-history-2026-11-12-v1"},{"id":"s7-2","day":7,"round":2,"date":"2026-11-11","title":"전력과 전력량, 전류의 화학작용과 열작용","status":"완료","unitIds":["u5","u6"],"concept":"전기기능사 필기 7일차 2회차 학습 정리\n\n학습일: 2026년 11월 11일\n목표 시험: 2027년 정기 기능사 제2회 전기기능사 필기\n학습 방향: 교재 순서에 따라 기초 개념을 충분히 이해하고 진행\n최종 평가: 학습 목표 달성 / 오답 보완 완료 / 회차 종료\n\n1. 교재 및 학습 범위\n\n교재: 다산에듀 2026 속전속결 전기기능사 필기 이론서 1권\n과목: 전기이론\n장: 제1장 직류회로\n\n① 제5절 전력과 전력량\n\n- 교재 인쇄 쪽수: 41~44쪽\n- 기존 내용 복습\n- 전열기 계산과 최대전력 전달 보완\n\n② 제6절 전류의 화학작용과 열작용\n\n- 교재 인쇄 쪽수: 51~55쪽\n- 전기분해와 패러데이의 법칙\n- 전지의 종류와 납축전지\n- 허용전류\n- 제베크·펠티에·톰슨 효과\n- 중간 금속의 법칙\n\n※ 이번 회차는 자체 연습문제로 확인함.\n※ 교재 필수문제 45~50쪽, 56~60쪽의 전수 풀이는 별도 미완료.\n\n1. 전력·전력량·줄열\n\n전력:\nP = VI = I²R = V²/R\n단위: W\n\n전력량:\n전력량 = 전력 × 시간\n전력 W × 시간 h → Wh\n전력 kW × 시간 h → kWh\n\n줄열:\nH = I²Rt\n시간을 초(s)로 넣으면 단위는 J\n\n단위 변환:\n1kWh = 1,000Wh\n1Wh = 3,600J\n1kWh = 3,600,000J ≒ 860kcal\n\n비례 관계:\n\n- 저항 일정, 전압 2배 → 소비전력 4배\n- 저항 일정, 전류 3배 → 발열 전력 9배\n\n1. 최대전력 전달\n\n전원의 기전력과 내부저항이 일정한 직류회로에서,\n부하저항이 전원 내부저항과 같을 때 부하전력이 최대이다.\n\n최대전력 전달 조건:\nR = r\n\n전류:\nI = E / (r + R)\n\n부하전력:\nP부하 = I²R\n\n내부저항 소비전력:\nP내부 = I²r\n\n예제:\n기전력 12V, 내부저항 3Ω, 부하저항 3Ω\n\n전체저항 = 3 + 3 = 6Ω\n전류 = 12 / 6 = 2A\n부하전력 = 2² × 3 = 12W\n내부저항 소비전력 = 2² × 3 = 12W\n전원 공급 전체전력 = 12 × 2 = 24W\n\n주의:\n전원 전체전력과 부하전력을 구분한다.\nP = VI를 사용할 때는 해당 부분의 전압과 전류를 사용한다.\n\n1. 물 가열에 필요한 전력\n\n계산 순서:\n\n① 필요한 열량(kcal)\n= 물의 질량(kg) × 비열 × 온도 상승(℃)\n\n② 필요한 전기에너지(kWh)\n= 필요한 열량 / (860 × 효율)\n\n③ 필요한 전력(kW)\n= 전기에너지 / 시간(h)\n\n물의 비열:\n1kcal/(kg·℃)\n\n효율:\n100% → 1\n50% → 0.5\n\n예제:\n물 10kg을 20℃에서 63℃까지 1시간 동안 가열한다.\n\n온도 상승 = 63 - 20 = 43℃\n필요한 열량 = 10 × 1 × 43 = 430kcal\n\n효율 100%:\n전기에너지 = 430 / 860 = 0.5kWh\n전력 = 0.5 / 1 = 0.5kW\n\n효율 50%:\n전기에너지 = 430 / (860 × 0.5) = 1kWh\n전력 = 1 / 1 = 1kW\n\n핵심:\n같은 양의 물을 같은 온도까지 가열할 때,\n효율이 낮으면 필요한 전기에너지가 커진다.\n\n1. 전기분해와 패러데이의 법칙\n\n전기분해:\n전해액에 전류를 흘려 화학변화를 일으키는 현상이다.\n\n황산구리 수용액의 구리 석출:\nCu²⁺ + 전자 2개 → Cu\n\n구리 양이온은 음극으로 이동하여 전자를 받고 구리로 석출된다.\n\n패러데이의 법칙:\nQ = It\nm = kQ = kIt\n\nQ: 전기량(C)\nI: 전류(A)\nt: 시간(s)\nm: 석출 질량(g)\nk: 전기화학당량(g/C)\n\n핵심:\n\n- 같은 물질의 석출량은 통과한 전기량에 비례한다.\n- 같은 전기량에서 석출량은 물질의 화학당량에 비례한다.\n- 화학당량 = 원자량 / 원자가\n- 시간은 초로 바꿔 계산한다.\n\n계산 예제 ①:\n3A를 20분간 흘린 경우\n\n20분 = 1,200초\nQ = 3 × 1,200 = 3,600C\n\n계산 예제 ②:\nk = 0.0003g/C, 전류 2A, 시간 5분\n\n5분 = 300초\nm = 0.0003 × 2 × 300 = 0.18g\n\n비례 관계:\n같은 물질에서 전류 3배, 시간 1/2배\n→ 석출량 = 3 × 1/2 = 1.5배\n\n1. 전지의 종류와 특성\n\n① 1차 전지\n\n- 재충전하여 반복 사용하는 용도가 아닌 전지\n- 예: 일반 망간·알칼리 건전지\n\n② 2차 전지\n\n- 충전하여 반복 사용할 수 있는 전지\n- 예: 납축전지, 리튬이온전지\n\n③ 분극작용\n\n- 전극 표면에 수소 기체 등이 쌓여 기전력이 저하되는 현상\n\n④ 감극제\n\n- 분극작용을 줄이는 물질\n- 망간 건전지의 대표적인 감극제: 이산화망간 MnO₂\n\n⑤ 국부작용\n\n- 전극의 불순물이 작은 전지를 이루어 전극을 소모시키는 현상\n\n1. 납축전지와 용량\n\n충전된 상태의 구성:\n\n- 양극 활물질: 이산화납 PbO₂\n- 음극 활물질: 납 Pb\n- 전해액: 묽은 황산 H₂SO₄ 수용액\n- 셀 1개의 공칭전압: 약 2V\n- 분류: 2차 전지\n\n방전 시 변화:\n\n- 양쪽 활물질이 황산납 PbSO₄으로 변한다.\n- 전해액의 황산 농도와 비중이 낮아진다.\n- 충전하면 반대 방향으로 진행된다.\n\n암기:\n양극 이산화납 / 음극 납 / 전해액 묽은 황산 / 한 셀 2V\n\n축전지 용량:\n용량(Ah) = 전류(A) × 시간(h)\n시간(h) = 용량(Ah) / 전류(A)\n\n예제:\n40Ah 축전지를 일정한 5A로 방전한다.\n\n시간 = 40 / 5 = 8시간\n\n※ 기본 계산문제의 단순 계산 결과이다.\n※ 실제 방전 시간은 사용 조건에 따라 달라질 수 있다.\n※ 1Ah = 3,600C\n\n1. 허용전류\n\n허용전류:\n정해진 사용 조건에서 허용 온도를 넘지 않고 흘릴 수 있는 전류이다.\n\n발열 전력:\nP = I²R\n\n저항 일정:\n전류 2배 → 발열 전력 4배\n전류 3배 → 발열 전력 9배\n\n허용전류는 전선 굵기, 절연물, 주위 온도, 설치 방식 등의 영향을 받는다.\n\n1. 열전 효과\n\n① 제베크 효과\n서로 다른 두 금속으로 만든 회로의 두 접점에 온도 차를 주면\n열기전력이 발생하는 현상이다.\n\n암기: 온도 차 → 전압\n연결 예: 열전대 온도 측정\n\n② 펠티에 효과\n서로 다른 물질의 접합부에 전류를 흘리면\n접합부에서 흡열 또는 발열이 일어나는 현상이다.\n\n암기: 전류 → 접합부 냉각·가열\n연결 예: 열전 냉각장치\n\n③ 톰슨 효과\n온도 차가 있는 한 도체에 전류를 흘리면\n줄열 외에 흡열 또는 발열이 일어나는 현상이다.\n\n암기: 한 도체의 온도 차 + 전류\n\n1. 중간 금속의 법칙\n\n열전대 회로에 제3의 금속을 넣더라도,\n추가된 두 접점의 온도가 같으면 전체 열기전력은 변하지 않는다.\n\n예제:\n원래 열기전력이 8mV이고 추가된 두 접점의 온도가 같다면,\n제3의 금속을 넣은 후에도 전체 열기전력은 8mV이다.\n\n주의:\n전체 열기전력이 0이 된다는 뜻이 아니다.\n\n1. 콘덴서 누적 복습\n\n전하량:\nQ = CV\n\n저장 에너지:\n에너지 = 1/2 × C × V²\n\n정전용량 C가 일정할 때:\n\n- 전하량은 전압에 비례한다.\n- 저장 에너지는 전압의 제곱에 비례한다.\n\n전압 2배:\n전하량 2배 / 저장 에너지 4배\n\n전압 3배:\n전하량 3배 / 저장 에너지 9배\n\n1. 제베크 효과 → 정답\n2. 펠티에 효과 → 정답\n\n최초 오답 및 미응답 항목:\n보완 완료\n\n최종 판정:\n7일차 2회차 학습 목표 달성 / 회차 종료\n\n다음 누적 복습:\n\n- 물 가열 계산\n- 납축전지 구성\n- 제베크·펠티에·톰슨 효과\n\n1. 앞으로의 학습 방향\n\n- 목표 시험은 2027년 정기 기능사 제2회 필기이다.\n- 기존 1월 시험 기준 압축 계획은 적용하지 않는다.\n- 교재 순서에 맞춰 기초를 충분히 이해하며 진행한다.\n- 개념 → 예제 → 직접 풀이 → 오답 보완 순서를 유지한다.\n- 평일 하루 2회, 각 50~70분을 기본으로 이해도에 따라 분량을 조절한다.\n- 주말에는 시간이 될 때 추가 진도 또는 취약 부분을 보완한다.\n- 공식을 선택하고 계산 이유를 설명할 수 있는지 확인한다.","examples":"계산 예제는 개념 학습 및 노션 원문에 함께 보존했습니다.","notes":"1. 오답노트\n\n① 부하전력과 전체전력 혼동\n\n- 최초 답: 40W\n- 정답: 해당 문제의 부하전력은 20W\n- 개선: 부하저항만 사용하여 I²R을 계산한다.\n- 최종: 보충문제에서 부하전력과 내부 소비전력을 정확히 구분함.\n\n② 물 가열 전력 계산\n\n- 최초 답: 8600\n- 정답: 효율 100% 조건에서 0.5kW\n- 개선: 열량 → 전기에너지 → 전력 순서로 계산한다.\n- 최종: 효율 50% 보충문제에서 430kcal, 1kWh, 1kW를 정확히 계산함.\n\n③ 구리 석출 전극\n\n- 최초 답: 양극\n- 정답: 음극\n- 최종: 음극으로 이동하여 전자를 받는다고 정확히 설명함.\n\n④ 납축전지 구성\n\n- 최초 양극 답: PbSO₄\n- 올바른 양극 활물질: 충전된 상태에서 PbO₂\n- 전해액: 묽은 황산 H₂SO₄ 수용액\n- 셀 전압: 약 2V\n- 방전 생성물: PbSO₄\n- 최종: 모든 항목 보완 완료.\n\n⑤ 열전 효과\n\n- 최초 펠티에 효과 미응답\n- 보충에서도 제베크·펠티에 미응답\n- 최종 확인에서 두 효과 모두 정답.\n\n⑥ 중간 금속의 법칙\n\n- 최초 미응답\n- 최종: 추가 두 접점의 온도가 같으면 전체 열기전력이 유지됨을 확인함.\n\n⑦ 콘덴서 저장 에너지\n\n- 최초 답: 전압 2배 → 에너지 2배\n- 정답: 에너지 4배\n- 최종: 전압 3배 → 전하량 3배, 에너지 9배로 정확히 구분함.\n\n1. 학습 결과 및 최종 평가\n\n세부 답항 기준:\n\n최초 연습문제:\n18/27 정답, 66.7%\n\n보충문제:\n16/18 정답, 88.9%\n\n최종 확인:\n2/2 정답, 100%\n\n최종 확인 답안:\n\n가져오기: 노션 확인 기록 전체를 보존했습니다. 문항별 제출 답안·정답은 원문 탭에서 볼 수 있습니다. 기록에 없는 성적·완료 범위는 추정하지 않았습니다.\n최초 18/27(66.7%), 보충 16/18(88.9%), 최종 확인 2/2(100%). 7일차 2회차 종료.\n교재 필수문제 45~50쪽, 56~60쪽 전수 풀이는 미완료.","questions":[],"source":"","sourceText":"전기기능사 필기 7일차 2회차 학습 정리\n\n학습일: 2026년 11월 11일<br />목표 시험: 2027년 정기 기능사 제2회 전기기능사 필기<br />학습 방향: 교재 순서에 따라 기초 개념을 충분히 이해하고 진행<br />최종 평가: 학습 목표 달성 / 오답 보완 완료 / 회차 종료\n\n1. 교재 및 학습 범위\n\n교재: 다산에듀 2026 속전속결 전기기능사 필기 이론서 1권<br />과목: 전기이론<br />장: 제1장 직류회로\n\n① 제5절 전력과 전력량\n\n- 교재 인쇄 쪽수: 41\\~44쪽\n- 기존 내용 복습\n- 전열기 계산과 최대전력 전달 보완\n\n② 제6절 전류의 화학작용과 열작용\n\n- 교재 인쇄 쪽수: 51\\~55쪽\n- 전기분해와 패러데이의 법칙\n- 전지의 종류와 납축전지\n- 허용전류\n- 제베크·펠티에·톰슨 효과\n- 중간 금속의 법칙\n\n※ 이번 회차는 자체 연습문제로 확인함.<br />※ 교재 필수문제 45\\~50쪽, 56\\~60쪽의 전수 풀이는 별도 미완료.\n\n1. 전력·전력량·줄열\n\n전력:<br />P = VI = I²R = V²/R<br />단위: W\n\n전력량:<br />전력량 = 전력 × 시간<br />전력 W × 시간 h → Wh<br />전력 kW × 시간 h → kWh\n\n줄열:<br />H = I²Rt<br />시간을 초(s)로 넣으면 단위는 J\n\n단위 변환:<br />1kWh = 1,000Wh<br />1Wh = 3,600J<br />1kWh = 3,600,000J ≒ 860kcal\n\n비례 관계:\n\n- 저항 일정, 전압 2배 → 소비전력 4배\n- 저항 일정, 전류 3배 → 발열 전력 9배\n\n1. 최대전력 전달\n\n전원의 기전력과 내부저항이 일정한 직류회로에서,<br />부하저항이 전원 내부저항과 같을 때 부하전력이 최대이다.\n\n최대전력 전달 조건:<br />R = r\n\n전류:<br />I = E / (r + R)\n\n부하전력:<br />P부하 = I²R\n\n내부저항 소비전력:<br />P내부 = I²r\n\n예제:<br />기전력 12V, 내부저항 3Ω, 부하저항 3Ω\n\n전체저항 = 3 + 3 = 6Ω<br />전류 = 12 / 6 = 2A<br />부하전력 = 2² × 3 = 12W<br />내부저항 소비전력 = 2² × 3 = 12W<br />전원 공급 전체전력 = 12 × 2 = 24W\n\n주의:<br />전원 전체전력과 부하전력을 구분한다.<br />P = VI를 사용할 때는 해당 부분의 전압과 전류를 사용한다.\n\n1. 물 가열에 필요한 전력\n\n계산 순서:\n\n① 필요한 열량(kcal)<br />= 물의 질량(kg) × 비열 × 온도 상승(℃)\n\n② 필요한 전기에너지(kWh)<br />= 필요한 열량 / (860 × 효율)\n\n③ 필요한 전력(kW)<br />= 전기에너지 / 시간(h)\n\n물의 비열:<br />1kcal/(kg·℃)\n\n효율:<br />100% → 1<br />50% → 0.5\n\n예제:<br />물 10kg을 20℃에서 63℃까지 1시간 동안 가열한다.\n\n온도 상승 = 63 - 20 = 43℃<br />필요한 열량 = 10 × 1 × 43 = 430kcal\n\n효율 100%:<br />전기에너지 = 430 / 860 = 0.5kWh<br />전력 = 0.5 / 1 = 0.5kW\n\n효율 50%:<br />전기에너지 = 430 / (860 × 0.5) = 1kWh<br />전력 = 1 / 1 = 1kW\n\n핵심:<br />같은 양의 물을 같은 온도까지 가열할 때,<br />효율이 낮으면 필요한 전기에너지가 커진다.\n\n1. 전기분해와 패러데이의 법칙\n\n전기분해:<br />전해액에 전류를 흘려 화학변화를 일으키는 현상이다.\n\n황산구리 수용액의 구리 석출:<br />Cu²⁺ + 전자 2개 → Cu\n\n구리 양이온은 음극으로 이동하여 전자를 받고 구리로 석출된다.\n\n패러데이의 법칙:<br />Q = It<br />m = kQ = kIt\n\nQ: 전기량(C)<br />I: 전류(A)<br />t: 시간(s)<br />m: 석출 질량(g)<br />k: 전기화학당량(g/C)\n\n핵심:\n\n- 같은 물질의 석출량은 통과한 전기량에 비례한다.\n- 같은 전기량에서 석출량은 물질의 화학당량에 비례한다.\n- 화학당량 = 원자량 / 원자가\n- 시간은 초로 바꿔 계산한다.\n\n계산 예제 ①:<br />3A를 20분간 흘린 경우\n\n20분 = 1,200초<br />Q = 3 × 1,200 = 3,600C\n\n계산 예제 ②:<br />k = 0.0003g/C, 전류 2A, 시간 5분\n\n5분 = 300초<br />m = 0.0003 × 2 × 300 = 0.18g\n\n비례 관계:<br />같은 물질에서 전류 3배, 시간 1/2배<br />→ 석출량 = 3 × 1/2 = 1.5배\n\n1. 전지의 종류와 특성\n\n① 1차 전지\n\n- 재충전하여 반복 사용하는 용도가 아닌 전지\n- 예: 일반 망간·알칼리 건전지\n\n② 2차 전지\n\n- 충전하여 반복 사용할 수 있는 전지\n- 예: 납축전지, 리튬이온전지\n\n③ 분극작용\n\n- 전극 표면에 수소 기체 등이 쌓여 기전력이 저하되는 현상\n\n④ 감극제\n\n- 분극작용을 줄이는 물질\n- 망간 건전지의 대표적인 감극제: 이산화망간 MnO₂\n\n⑤ 국부작용\n\n- 전극의 불순물이 작은 전지를 이루어 전극을 소모시키는 현상\n\n1. 납축전지와 용량\n\n충전된 상태의 구성:\n\n- 양극 활물질: 이산화납 PbO₂\n- 음극 활물질: 납 Pb\n- 전해액: 묽은 황산 H₂SO₄ 수용액\n- 셀 1개의 공칭전압: 약 2V\n- 분류: 2차 전지\n\n방전 시 변화:\n\n- 양쪽 활물질이 황산납 PbSO₄으로 변한다.\n- 전해액의 황산 농도와 비중이 낮아진다.\n- 충전하면 반대 방향으로 진행된다.\n\n암기:<br />양극 이산화납 / 음극 납 / 전해액 묽은 황산 / 한 셀 2V\n\n축전지 용량:<br />용량(Ah) = 전류(A) × 시간(h)<br />시간(h) = 용량(Ah) / 전류(A)\n\n예제:<br />40Ah 축전지를 일정한 5A로 방전한다.\n\n시간 = 40 / 5 = 8시간\n\n※ 기본 계산문제의 단순 계산 결과이다.<br />※ 실제 방전 시간은 사용 조건에 따라 달라질 수 있다.<br />※ 1Ah = 3,600C\n\n1. 허용전류\n\n허용전류:<br />정해진 사용 조건에서 허용 온도를 넘지 않고 흘릴 수 있는 전류이다.\n\n발열 전력:<br />P = I²R\n\n저항 일정:<br />전류 2배 → 발열 전력 4배<br />전류 3배 → 발열 전력 9배\n\n허용전류는 전선 굵기, 절연물, 주위 온도, 설치 방식 등의 영향을 받는다.\n\n1. 열전 효과\n\n① 제베크 효과<br />서로 다른 두 금속으로 만든 회로의 두 접점에 온도 차를 주면<br />열기전력이 발생하는 현상이다.\n\n암기: 온도 차 → 전압<br />연결 예: 열전대 온도 측정\n\n② 펠티에 효과<br />서로 다른 물질의 접합부에 전류를 흘리면<br />접합부에서 흡열 또는 발열이 일어나는 현상이다.\n\n암기: 전류 → 접합부 냉각·가열<br />연결 예: 열전 냉각장치\n\n③ 톰슨 효과<br />온도 차가 있는 한 도체에 전류를 흘리면<br />줄열 외에 흡열 또는 발열이 일어나는 현상이다.\n\n암기: 한 도체의 온도 차 + 전류\n\n1. 중간 금속의 법칙\n\n열전대 회로에 제3의 금속을 넣더라도,<br />추가된 두 접점의 온도가 같으면 전체 열기전력은 변하지 않는다.\n\n예제:<br />원래 열기전력이 8mV이고 추가된 두 접점의 온도가 같다면,<br />제3의 금속을 넣은 후에도 전체 열기전력은 8mV이다.\n\n주의:<br />전체 열기전력이 0이 된다는 뜻이 아니다.\n\n1. 콘덴서 누적 복습\n\n전하량:<br />Q = CV\n\n저장 에너지:<br />에너지 = 1/2 × C × V²\n\n정전용량 C가 일정할 때:\n\n- 전하량은 전압에 비례한다.\n- 저장 에너지는 전압의 제곱에 비례한다.\n\n전압 2배:<br />전하량 2배 / 저장 에너지 4배\n\n전압 3배:<br />전하량 3배 / 저장 에너지 9배\n\n1. 오답노트\n\n① 부하전력과 전체전력 혼동\n\n- 최초 답: 40W\n- 정답: 해당 문제의 부하전력은 20W\n- 개선: 부하저항만 사용하여 I²R을 계산한다.\n- 최종: 보충문제에서 부하전력과 내부 소비전력을 정확히 구분함.\n\n② 물 가열 전력 계산\n\n- 최초 답: 8600\n- 정답: 효율 100% 조건에서 0.5kW\n- 개선: 열량 → 전기에너지 → 전력 순서로 계산한다.\n- 최종: 효율 50% 보충문제에서 430kcal, 1kWh, 1kW를 정확히 계산함.\n\n③ 구리 석출 전극\n\n- 최초 답: 양극\n- 정답: 음극\n- 최종: 음극으로 이동하여 전자를 받는다고 정확히 설명함.\n\n④ 납축전지 구성\n\n- 최초 양극 답: PbSO₄\n- 올바른 양극 활물질: 충전된 상태에서 PbO₂\n- 전해액: 묽은 황산 H₂SO₄ 수용액\n- 셀 전압: 약 2V\n- 방전 생성물: PbSO₄\n- 최종: 모든 항목 보완 완료.\n\n⑤ 열전 효과\n\n- 최초 펠티에 효과 미응답\n- 보충에서도 제베크·펠티에 미응답\n- 최종 확인에서 두 효과 모두 정답.\n\n⑥ 중간 금속의 법칙\n\n- 최초 미응답\n- 최종: 추가 두 접점의 온도가 같으면 전체 열기전력이 유지됨을 확인함.\n\n⑦ 콘덴서 저장 에너지\n\n- 최초 답: 전압 2배 → 에너지 2배\n- 정답: 에너지 4배\n- 최종: 전압 3배 → 전하량 3배, 에너지 9배로 정확히 구분함.\n\n1. 학습 결과 및 최종 평가\n\n세부 답항 기준:\n\n최초 연습문제:<br />18/27 정답, 66.7%\n\n보충문제:<br />16/18 정답, 88.9%\n\n최종 확인:<br />2/2 정답, 100%\n\n최종 확인 답안:\n\n1. 제베크 효과 → 정답\n2. 펠티에 효과 → 정답\n\n최초 오답 및 미응답 항목:<br />보완 완료\n\n최종 판정:<br />7일차 2회차 학습 목표 달성 / 회차 종료\n\n다음 누적 복습:\n\n- 물 가열 계산\n- 납축전지 구성\n- 제베크·펠티에·톰슨 효과\n\n1. 앞으로의 학습 방향\n\n- 목표 시험은 2027년 정기 기능사 제2회 필기이다.\n- 기존 1월 시험 기준 압축 계획은 적용하지 않는다.\n- 교재 순서에 맞춰 기초를 충분히 이해하며 진행한다.\n- 개념 → 예제 → 직접 풀이 → 오답 보완 순서를 유지한다.\n- 평일 하루 2회, 각 50\\~70분을 기본으로 이해도에 따라 분량을 조절한다.\n- 주말에는 시간이 될 때 추가 진도 또는 취약 부분을 보완한다.\n- 공식을 선택하고 계산 이유를 설명할 수 있는지 확인한다.","sourceChecked":"2026-11-12","historyImportVersion":"public-history-2026-11-12-v1","counts":{"correct":18,"total":27,"kind":"최초","label":"노션 확인 최초 성적"},"supplement":{"correct":16,"total":18},"finalCheck":{"correct":2,"total":2}}],"reviews":[{"id":"r1","title":"전지접속과 측정 필수문제 전수 풀이","topic":"전지접속","priority":"높음","done":false,"due":"","note":"노션: 인쇄 37~40쪽 별도 전수 풀이 미실시","source":""},{"id":"r3","title":"쿨롱·전계·위치에너지 간격 복습","topic":"공식 기억","priority":"보통","done":false,"due":"","note":"6일차 공식을 기억하지 못했으나 7일차 누적복습 3/3 정답. 장기 기억 재확인 권장.","source":""},{"id":"review-history6-status","title":"6일차 2회차 보충 완료 기록 대조","topic":"원문 대조","priority":"낮음","done":false,"due":"","note":"사용자 대화에는 보충 답안 제출이 있으나 노션에는 미제출로 남아 있음. 성적은 새로 계산하지 않음.","source":""},{"id":"hist7-3","title":"전력·전력량 교재 필수문제 45~50쪽","topic":"전력 계산","priority":"보통","done":false,"due":"","note":"노션 7일차 2회차 다음 복습/미완료 필수문제 기록","source":""},{"id":"hist7-4","title":"화학작용·열작용 교재 필수문제 56~60쪽","topic":"화학작용·열작용","priority":"보통","done":false,"due":"","note":"노션 7일차 2회차 다음 복습/미완료 필수문제 기록","source":""},{"id":"hist7-5","title":"물 가열 계산 간격 복습","topic":"전력 계산","priority":"보통","done":false,"due":"","note":"노션 7일차 2회차 다음 복습/미완료 필수문제 기록","source":""},{"id":"hist7-6","title":"납축전지 구성 간격 복습","topic":"납축전지","priority":"보통","done":false,"due":"","note":"노션 7일차 2회차 다음 복습/미완료 필수문제 기록","source":""},{"id":"hist7-7","title":"제베크·펠티에·톰슨 효과 간격 복습","topic":"열전 효과","priority":"보통","done":false,"due":"","note":"노션 7일차 2회차 다음 복습/미완료 필수문제 기록","source":""}],"settings":{"target":"2027-round-2","examDate":"","daily":2,"minutes":60,"targetLabel":"2027년 정기 기능사 제2회 필기","routineLabel":"평일 하루 2회(50~70분), 주말 가능할 때 추가 진도·취약 복습"},"sourceChecked":"2026-11-12","notionRoot":"","historyImport":{"from":"노션 전기기능사 학습 폴더","checked":"2026-11-12","sessions":10,"through":"7일차 2회차","notes":"1·2일차 채점 성적 미확인. 최초·보충 구분이 불명확한 총점은 최초 정답률에 합산하지 않음."},"publicHistoryVersion":"public-history-2026-11-12-v1"};const saved=localStorage.getItem('electric-study-v1');if(saved){state=JSON.parse(saved);if(state.publicHistoryVersion!==published.publicHistoryVersion){state=mergeHistory(state,published).state;state.publicHistoryVersion=published.publicHistoryVersion;localStorage.setItem('electric-study-v1',JSON.stringify(state));}}else{state=structuredClone(published);localStorage.setItem('electric-study-v1',JSON.stringify(state));}revision=0;setStatus('● 이 브라우저에 저장됨');$('#clock').textContent=today();render()}catch(e){app.innerHTML='<div class="loading">학습 기록을 불러오지 못했습니다. 브라우저 저장 설정을 확인해주세요.</div>';}}init();
