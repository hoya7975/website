r);gap:10px;text-align:center;margin-top:20px}.day{padding:10px 4px;border:1px solid var(--line);border-radius:9px;font-size:12px}.day.today{border-color:var(--green);background:#eff5ec}.day strong{display:block;font-size:17px;margin:3px 0}.dots{font-size:15px;letter-spacing:3px;color:#c6cfc6}.dots .filled{color:var(--green)}.bar{height:6px;border-radius:5px;background:#e9eee7;overflow:hidden;margin-top:12px}.bar i{height:100%;background:#65a187;display:block}.subject{padding:15px 0;border-bottom:1px solid var(--line)}.subject:last-child{border-bottom:0}.empty{padding:30px 15px;text-align:center;color:var(--muted);font-size:13px;background:#f9faf6;border-radius:8px}.note{padding:13px 17px;background:#edf1e7;border-radius:8px;font-size:12px;color:#647564;margin-top:18px}.warning{background:#fff3e2;color:#8e602e}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}th{font-weight:500;color:var(--muted);background:#f6f8f3;white-space:nowrap}td,th{padding:13px 12px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}tr:hover td{background:#fafbf7}td select{min-width:90px;padding:5px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input{flex:1;min-width:160px}input,select,textarea{border:1px solid #d9e1d7;background:#fff;border-radius:7px;padding:9px 11px;color:var(--ink);max-width:100%}textarea{width:100%;min-height:110px;resize:vertical;line-height:1.7}label{font-size:13px;display:block;color:#53685b}label input,label select{width:100%;margin-top:5px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.form-grid.two{grid-template-columns:repeat(2,1fr)}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px;overflow:auto}.tabs button{white-space:nowrap}.tabs .active{background:var(--mint);border-color:#a7c4b1;color:var(--green)}.session-list{display:grid;gap:12px}.session-row{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px 21px;display:flex;gap:16px;align-items:center}.session-row .count{width:54px;color:var(--green);font-size:13px;background:var(--mint);padding:7px;border-radius:9px;text-align:center}.session-row>div:nth-child(2){flex:1}.session-row h3{margin:0 0 3px}.question{padding:20px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background:#fff}.question textarea{min-height:65px}.question .form-grid{margin-top:12px}.question .answer{font-size:13px;color:var(--muted);margin:8px 0}.question .row{align-items:flex-start}details{margin:12px 0}summary{cursor:pointer;color:var(--green);font-size:13px}.plain{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.8;max-height:500px;overflow:auto}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#183e32;color:#fff;padding:12px 23px;border-radius:9px;z-index:100;display:none;box-shadow:0 4px 20px #0002}.phase{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}.phase .bubble{width:33px;height:33px;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center;flex-shrink:0}.phase h3{margin-bottom:3px}.phase p{font-size:13px;color:var(--muted)}.summary-output{min-height:430px;background:#fafbf7;font-family:inherit}.right-tools{display:flex;gap:8px;align-items:center}.mobile-brand{display:none}dialog{border:0;border-radius:14px;width:540px;max-width:90vw;padding:27px;box-shadow:0 20px 100px #0003}dialog::backdrop{background:#102c2977}.danger-zone{margin-top:20px}button:disabled{opacity:.45;cursor:wait}footer{margin-top:25px;color:var(--muted);font-size:11px}.loading{padding:100px 20px;text-align:center}.accent{color:var(--green)}

.privacy-banner{background:#fff3e2;color:#825b30;padding:10px 18px;font-size:12px;border-radius:8px;margin:16px 0} </style></head><body>
<aside><div class="logo"><div class="mark">ϟ</div><div><b>전기기능사<br>합격하자</b></div></div><div class="eyebrow" style="margin:0 12px 10px">MY STUDY SPACE</div><nav class="nav" id="nav"></nav><div class="side-bottom"><div class="card" style="background:#f5f7ed;padding:13px"><b class="accent">2027년 1월을 향해</b><br>하루 두 번, 차근차근 쌓는 실력<br><span style="font-size:11px">시험일 미확정 · 개인 목표 일정</span></div><div class="avatar"><i>학</i><div><b style="color:var(--ink)">학습자</b><br>나만의 전기 학습실</div></div></div></aside>
<main><header><span>개인 학습실 <span style="padding:0 10px;color:#b4beb5">/</span> <span id="breadcrumb">오늘의 학습</span></span><div class="right-tools"><span id="clock"></span><span class="save-status" id="save-status">연결 중</span></div></header><div class="privacy-banner">공개 학습 이력: 1일차~7일차 2회차 · 새로 입력한 내용은 이 브라우저에 저장 · 기기 간 자동 동기화 없음</div><div id="app"><div class="loading">학습 기록을 불러오는 중입니다…</div></div><footer>다산에듀 2026 속전속결 · 개인 학습 기록 | 자동 요약은 일반 텍스트로 생성됩니다.</footer></main><div id="toast" role="status"></div>
<dialog id="new-dialog"><form id="new-form"><h2>새 학습 회차</h2><div class="form-grid two"><label>학습 일차<input name="day" type="number" min="1" value="8" required></label><label>회차<select name="round"><option>1</option><option>2</option></select></label></div><label class="section-space">학습할 교재 단원<select name="unit" id="new-unit"></select></label><label class="section-space">주제<input name="title" placeholder="선택한 단원의 이름으로 기록합니다"></label><div class="row section-space"><button type="button" onclick="document.querySelector('dialog').close()">취소</button><button class="primary">회차 만들기</button></div></form></dialog>
<script>
let state,revision=0,page='home',current='s7-2',tab='concept',saving=false,dirty=false,pending=false;let subjectFilter='전체',searchText='';const $=s=>document.querySelector(s);const app=$('#app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());const uid=()=>crypto.randomUUID();
const navs=[['home','◉','오늘의 학습'],['curriculum','▤','교재 진도'],['sessions','▣','학습 기록'],['reviews','↻','오답 · 복습'],['summary','≡','노션용 요약'],['plan','▦','학습 계획']];
const unit=id=>state.units.find(u=>u.id===id);const session=()=>state.sessions.find(s=>s.id===current);const tag=(text,cls='')=>`<span class="tag ${cls}">${esc(text)}</span>`;const countLabel=(a,b)=>b?`${(a/b*100).toFixed(1)}%`:'미확인';
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.to);window.to=setTimeout(()=>$('#toast').style.display='none',3500)}
function setStatus(t,bad=false){$('#save-status').textContent=t;$('#save-status').style.color=bad?'var(--red)':'var(--green)'}
async function persist(){try{localStorage.setItem('electric-study-v1',JSON.stringify(state));dirty=false;setStatus('● 이 브라우저에 저장됨')}catch(e){dirty=true;setStatus('저장 실패 · JSON 백업 필요',true);toast('브라우저 저장 공간을 확인하세요.')}}
window.addEventListener('beforeunload',e=>{if(dirty||saving){e.preventDefault();e.returnValue=''}});
function go(p){page=p;searchText='';render();window.scrollTo(0,0)}
function openSession(id){current=id;tab='concept';page='editor';render();window.scrollTo(0,0)}
function head(k,title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}
function render(){if(!state)return;const side=document.querySelector('.side-bottom .card');if(side)side.innerHTML='<b class="accent">'+esc(goalLabel())+'</b><br>'+esc(routineLabel())+'<br><span style="font-size:11px">공식 시험일 '+esc(state.settings.examDate||'미확정')+'</span>';$('#nav').innerHTML=navs.map(([p,i,t])=>`<button class="${page===p||page==='editor'&&p==='sessions'?'active':''}" onclick="go('${p}')"><span>${i}</span>${t}</button>`).join('');$('#breadcrumb').textContent=page==='editor'?'회차 기록':navs.find(n=>n[0]===page)?.[2];({home:home,curriculum:curriculum,sessions:sessions,reviews:reviews,summary:summary,plan:plan,editor:editor})[page]();}
function metrics(){let c=0,t=0,sc=0,st=0,graded=0;for(const s of state.sessions){if(s.counts?.kind==='최초'){c+=s.counts.correct;t+=s.counts.total}if(s.supplement){sc+=s.supplement.correct;st+=s.supplement.total}for(const q of s.questions){if(q.result==='미채점')continue;graded++;if(q.kind==='보충'){st++;if(q.result==='정답')sc++}else{t++;if(q.result==='정답')c++}}}return{c,t,sc,st,graded}}
function allReviews(){const list=state.reviews.map(r=>({...r,type:'manual'}));for(const s of state.sessions)for(const q of s.questions)if(q.result==='오답')list.push({id:q.id,title:q.text,topic:q.topic||'미분류',priority:'높음',done:q.reviewDone,note:q.cause||'오답 원인 미기록',sid:s.id,type:'question',due:''});return list}
function next(){return [...state.sessions].filter(s=>s.status!=='완료'&&!s.isMock).sort((a,b)=>a.day-b.day||a.round-b.round)[0]}
function home(){const m=metrics(),n=next(),r=allReviews().filter(x=>!x.done),completed=state.sessions.filter(s=>s.status==='완료').length;const sunday=new Date(today()+'T12:00:00Z').getUTCDay()===0;
app.innerHTML=head('A LITTLE EVERY DAY','오늘도, 한 걸음 더.','교재의 순서와 나의 기록을 연결해 합격에 가까워집니다.',`<button class="primary" onclick="${sunday?'makeMock()':n?`openSession('${n.id}')`:'newSession()'}">${sunday?'일요일 미니시험':n?'이어서 학습하기 ↗':'새 회차 기록'}</button>`)+
`<div class="grid cols"><section class="card hero"><div class="row"><span class="eyebrow">${sunday?'SUNDAY REVIEW':'NEXT SESSION'}</span>${tag(n?`${n.day}일차 · ${n.round}회차`:'다음 범위 설정')}</div><h2>${sunday?'이번 주 배운 내용을 내 것으로.':esc(n?.title||'다음 학습을 준비하세요')}</h2><p class="muted">${n?esc(n.unitIds.map(id=>{let u=unit(id);return u?`${u.subject} · ${u.chapter} · ${u.section}`:'미확인'}).join(', ')):'교재 진도에서 다음 단원을 선택해주세요.'}</p><div class="hero-bottom"><div class="tags">${tag(n?rangeLabel(unit(n.unitIds[0])):'범위 미확인')}${tag('50~70분')}${tag('개념 → 예제 → 문제')}</div><button class="primary" onclick="${n?`openSession('${n.id}')`:'newSession()'}">학습실 열기 →</button></div></section><section class="card"><div class="eyebrow">STUDY GOAL</div><h2 style="margin-top:12px">매일 두 번의 작은 성취</h2><p class="muted">${esc(routineLabel())}<br>${esc(goalLabel())} 목표</p><div class="row section-space"><span class="muted">공식 시험일</span>${tag(state.settings.examDate||'미확정','warn')}</div><div class="note">공개 학습 기록 10개 회차 반영<br>7일차 2회차까지 완료</div></section></div>
<div class="grid stats"><div class="card stat"><p class="muted">누적 최초 정답률</p><div class="number">${countLabel(m.c,m.t)}</div><p class="muted">확인된 ${m.c} / ${m.t}문항</p></div><div class="card stat"><p class="muted">보충 정답률</p><div class="number">${countLabel(m.sc,m.st)}</div><p class="muted">확인된 ${m.sc} / ${m.st}문항</p></div><div class="card stat"><p class="muted">기록된 완료 회차</p><div class="number">${completed}<small>회</small></div><p class="muted">누락 회차는 추정하지 않음</p></div><div class="card stat"><p class="muted">남은 복습</p><div class="number">${r.length}<small>항목</small></div><p class="muted">오늘 한 가지씩 확인하세요</p></div></div>
<div class="grid cols"><section class="card"><div class="row"><h2>우선 복습할 내용</h2><button class="small" onclick="go('reviews')">모두 보기 →</button></div>${reviewRows(r.slice(0,3))}<p class="muted" style="font-size:11px">우선순위: 기한 경과 → 높음 → 보통 → 낮음</p></section><section class="card"><h2>과목별 교재 진도</h2>${['전기이론','전기기기','전기설비'].map(sub=>{const us=state.units.filter(u=>u.subject===sub),done=us.filter(u=>u.concept==='완료').length;return `<div class="subject"><div class="row"><b>${sub}</b><span class="muted">개념 완료 ${done} / ${us.length}절</span></div><div class="bar"><i style="width:${done/us.length*100}%"></i></div></div>`}).join('')}<p class="muted" style="font-size:11px">회차 완료와 교재 절 전체 완료는 별도로 관리합니다.</p></section></div><section class="card section-space"><div class="row"><h2>이번 주의 학습 리듬</h2><span class="muted">하루 2회 · 일요일 복습</span></div>${weekView()}</section><div class="note">집계 기준: 복원한 백업의 확인된 최초 성적과 이 앱에서 채점한 문항. 보충 정답률은 별도 집계합니다. 미채점은 제외합니다.</div>`;}
function rangeLabel(u){return u?`인쇄 p.${u.start}${u.end?'~'+u.end:'부터 · 끝 미확인'}`:'페이지 미확인'}
function weekView(){const d=new Date(today()+'T12:00:00Z'),wd=d.getUTCDay(),mon=new Date(d);mon.setUTCDate(d.getUTCDate()-((wd+6)%7));return `<div class="week">${['월','화','수','목','금','토','일'].map((label,i)=>{const a=new Date(mon);a.setUTCDate(mon.getUTCDate()+i);const key=a.toISOString().slice(0,10),ss=state.sessions.filter(s=>s.date===key&&s.status==='완료'),n=ss.length;return `<div class="day ${key===today()?'today':''}">${label}<strong>${a.getUTCDate()}</strong>${i===6?'<span class="muted" style="font-size:10px">종합복습</span>':`<span class="dots"><span class="${n>0?'filled':''}">●</span><span class="${n>1?'filled':''}">●</span></span>`}</div>`}).join('')}</div>`}
function reviewRows(rs){const rank={높음:0,보통:1,낮음:2};rs.sort((a,b)=>(a.due&&a.due<today()?-1:0)-(b.due&&b.due<today()?-1:0)||(rank[a.priority]??1)-(rank[b.priority]??1));return rs.length?rs.map(r=>`<div class="review-item"><input aria-label="${esc(r.title)} 복습 완료" class="check" type="checkbox" ${r.done?'checked':''} onchange="reviewToggle('${r.id}',this.checked)"><div><div class="row">${tag(r.priority,r.priority==='높음'?'warn':'gray')}${r.due?`<span class="muted">${esc(r.due)}</span>`:''}</div><b>${esc(r.title)}</b><p>${esc(r.note)}</p>${r.source?`<a href="${esc(r.source)}" target="_blank" rel="noopener" style="font-size:11px">노션 근거 ↗</a>`:''}${r.sid?`<button class="small" onclick="openSession('${r.sid}')">해당 회차</button>`:''}</div></div>`).join(''):'<div class="empty">미완료 복습이 없습니다.</div>'}
function reviewToggle(id,val){const r=state.reviews.find(x=>x.id===id);if(r)r.done=val;else for(const s of state.sessions){const q=s.questions.find(x=>x.id===id);if(q)q.reviewDone=val}persist();render()}
function curriculum(){app.innerHTML=head('TEXTBOOK MAP','교재 진도','다산에듀 2026 속전속결 · 인쇄 페이지와 PDF 페이지를 구분합니다.')+`<div class="toolbar"><select onchange="subjectFilter=this.value;curriculum()">${['전체','전기이론','전기기기','전기설비'].map(x=>`<option ${x===subjectFilter?'selected':''}>${x}</option>`).join('')}</select><input placeholder="단원 검색" aria-label="단원 검색" value="${esc(searchText)}" oninput="searchText=this.value;unitTable()"></div><div class="card"><div id="unit-table"></div></div><div class="note">목차에서 확인한 시작 쪽만 표시합니다. 끝 쪽과 전수 풀이 여부는 근거가 없으면 ‘미확인’입니다. 교류회로 2·3절의 일부 글자는 PDF 텍스트 추출에서 확인되지 않아 ‘미확인’으로 보존했습니다.<br>교재1: 전기이론 / 교재2: 전기기기·전기설비. 출처 확인일 ${state.sourceChecked}.</div>`;unitTable();}
function unitTable(){const us=state.units.filter(u=>(subjectFilter==='전체'||u.subject===subjectFilter)&&[u.title,u.chapter].join(' ').includes(searchText));$('#unit-table').innerHTML=`<div class="table-wrap"><table><thead><tr><th>과목 / 장</th><th>절 · 단원</th><th>인쇄 페이지</th><th>개념 진도</th><th>필수문제</th><th>연결 기록</th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.subject)}<br><span class="muted">${esc(u.chapter)}</span></td><td>${esc(u.section)} ${esc(u.title)}<details><summary>대조 근거</summary><p class="muted">${esc(u.source)}</p><p class="muted">책 ${u.book} · 끝 페이지 ${u.end??'미확인'}<br>상태는 노션 대조 또는 사용자 직접 갱신</p></details></td><td>개념 ${u.start}쪽${u.end?'~'+u.end+'쪽':''}<br><span class="muted">문제 ${u.problem?u.problem+'쪽부터':'미확인'}</span></td><td><select aria-label="${esc(u.title)} 개념 진도" onchange="setUnit('${u.id}','concept',this.value)">${['미학습','부분학습','완료','미확인'].map(x=>`<option ${u.concept===x?'selected':''}>${x}</option>`).join('')}</select></td><td><select aria-label="${esc(u.title)} 필수문제 진도" onchange="setUnit('${u.id}','practice',this.value)">${['미확인','미완료','진행 중','완료'].map(x=>`<option ${u.practice===x?'selected':''}>${x}</option>`).join('')}</select></td><td>${state.sessions.filter(s=>s.unitIds.includes(u.id)).map(s=>`<button class="small" style="display:block;margin:4px 0" onclick="openSession('${s.id}')">${s.day}일차 ${s.round}회</button>`).join('')||'<span class="muted">없음</span>'}</td></tr>`).join('')}</tbody></table></div>`}
function setUnit(id,key,val){unit(id)[key]=val;persist();toast('교재 진도를 저장했습니다.')}
function sessions(){app.innerHTML=head('STUDY JOURNAL','학습 기록','개념부터 보충까지, 회차별로 쌓이는 나의 학습.',`<button class="primary" onclick="newSession()">+ 새 회차</button>`)+`<div class="session-list">${[...state.sessions].sort((a,b)=>b.day-a.day||b.round-a.round).map(s=>`<div class="session-row"><div class="count">${s.day}일차<br>${s.round}회차</div><div><h3>${esc(s.title)}</h3><span class="muted">${s.date||'날짜 미기록'} · 추가 입력 ${s.questions.length}개 문항 ${s.counts?`· 노션 최초 ${s.counts.correct}/${s.counts.total}`:''}</span></div>${tag(s.status,s.status==='예정'?'gray':'')}<button onclick="openSession('${s.id}')">열기 →</button></div>`).join('')}</div>`}
function newSession(){const d=$('#new-dialog');$('#new-unit').innerHTML=state.units.map(u=>`<option value="${u.id}">${esc(u.subject+' / '+u.title)}</option>`).join('');$('#new-form').day.value=Math.max(7,...state.sessions.map(s=>s.day));const n=next();if(n)$('#new-form').day.value=n.day+1;d.showModal()}
$('#new-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),day=Number(f.get('day')),round=Number(f.get('round'));if(state.sessions.some(s=>s.day===day&&s.round===round&&!s.isMock)){toast('같은 일차·회차 기록이 있습니다. 기존 기록을 열어주세요.');return}const u=unit(f.get('unit'));const s={id:uid(),day,round,date:'',title:String(f.get('title')).trim()||u.title,unitIds:[u.id],status:'예정',concept:'',examples:'',notes:'',questions:[]};state.sessions.push(s);persist();$('#new-dialog').close();e.target.reset();openSession(s.id)};
function sf(key,val){const s=session();s[key]=val;persist()}
function editor(){const s=session();if(!s){go('sessions');return}const tabs=[['concept','개념 · 예제'],['questions','문제 · 채점'],['notes','회차 메모'],['source','노션 원문']];app.innerHTML=head('SESSION WORKSPACE',`${s.day}일차 · ${s.round}회차`,`교재 범위: ${s.unitIds.map(id=>{const u=unit(id);return u?u.title+' / '+rangeLabel(u):'미확인'}).map(esc).join(', ')}`,`<button onclick="go('sessions')">← 기록 목록</button>`)+`<div class="card">${s.historyImportVersion?`<div class="note">노션 기록 가져옴 · 최초 ${s.counts?s.counts.correct+'/'+s.counts.total:'미확인'} · 보충 ${s.supplement?s.supplement.correct+'/'+s.supplement.total:'미확인'}${s.finalCheck?' · 최종 확인 '+s.finalCheck.correct+'/'+s.finalCheck.total:''}<br>문항별 기존 답안·해설은 노션 원문 탭에 보존했습니다.</div>`:''}<div class="form-grid"><label>주제<input value="${esc(s.title)}" onchange="sf('title',this.value)"></label><label>학습일<input type="date" value="${esc(s.date)}" onchange="sf('date',this.value)"></label><label>회차 상태<select onchange="changeStatus(this.value)">${['예정','진행 중','완료'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="note">회차 완료만으로 교재의 개념·필수문제 진도를 완료 처리하지 않습니다. ‘교재 진도’에서 실제 완료 범위를 확인해주세요.</div></div><div class="tabs section-space">${tabs.map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';editor()">${t}</button>`).join('')}</div><div id="editor-body"></div>`;
const body=$('#editor-body');if(tab==='concept')body.innerHTML=`<section class="card"><h2>개념 학습</h2><textarea style="min-height:240px" aria-label="개념 학습" onchange="sf('concept',this.value)">${esc(s.concept)}</textarea><h2 class="section-space">계산 예제 · 풀이 과정</h2><textarea style="min-height:170px" aria-label="계산 예제" onchange="sf('examples',this.value)">${esc(s.examples)}</textarea><p class="muted">공식은 I = V/R, W = I²Rt처럼 일반 텍스트로 기록합니다.</p><div class="row section-space"><span class="muted">입력 후 항목을 벗어나면 자동 저장</span><button class="primary" onclick="tab='questions';editor()">연습문제 풀기 →</button></div></section>`;
if(tab==='questions')body.innerHTML=`<div class="row wrap" style="margin-bottom:15px"><p class="muted">제출 답안과 기준 답안이 있는 문항만 자동 채점합니다.</p><div class="right-tools"><button onclick="addQuestion()">+ 문항 추가</button><button class="primary" onclick="grade()">답안 제출 · 채점</button></div></div><div class="note warning" style="margin-bottom:18px">자동 채점은 공백·대소문자·일부 표기만 정규화한 일치 비교입니다. 단위·동의어·서술형의 의미 판정은 문항별 결과를 직접 수정하세요. 빈 답안은 미채점으로 유지됩니다.</div>${s.counts?`<div class="card" style="margin-bottom:18px">가져온 노션 최초 성적: ${s.counts.correct}/${s.counts.total} (${countLabel(s.counts.correct,s.counts.total)}) · 중복 집계 방지를 위해 기존 문항을 다시 입력하지 마세요.</div>`:''}${s.questions.length?s.questions.map((q,i)=>questionHtml(q,i)).join(''):'<div class="empty">문항을 추가해 연습문제와 답안을 기록하세요.</div>'}`;
if(tab==='notes')body.innerHTML=`<div class="card"><h2>학습 메모 · 다음 범위</h2>${s.preservedLocal?`<details><summary>가져오기 전 기존 기록 보기 (보존됨)</summary><pre class="plain">${esc(JSON.stringify(s.preservedLocal,null,2))}</pre></details>`:''}<textarea aria-label="회차 메모" onchange="sf('notes',this.value)">${esc(s.notes)}</textarea><div class="row section-space"><button onclick="current='${s.id}';go('summary')">노션용 요약 만들기</button><button onclick="addReview('${s.id}')">+ 복습 항목 등록</button></div></div>`;
if(tab==='source')body.innerHTML=s.sourceText?`<div class="card"><div class="row"><h2>학습 기록 원문</h2>${s.source?`<a href="${esc(s.source)}" target="_blank" rel="noopener">원문 열기 ↗</a>`:tag('공개 학습 기록')}</div><p class="muted">${state.sourceChecked} 기준 스냅샷 · 실시간 동기화가 아닙니다.</p><pre class="plain">${esc(s.sourceText)}</pre></div>`:'<div class="empty">이 앱에서 새로 만든 회차입니다. 노션용 요약을 복사해 기록할 수 있습니다.</div>';
}
function changeStatus(v){const s=session();if(v==='완료'&&s.questions.some(q=>q.result==='미채점')){toast('미채점 문항이 남아 있습니다. 채점 후 완료해주세요.');editor();return}s.status=v;if(v!=='예정'&&!s.date)s.date=today();persist();editor()}
function questionHtml(q,i){return `<div class="question"><div class="row"><div>${tag(q.kind)} ${tag(q.result,q.result==='오답'?'red':q.result==='미채점'?'gray':'')}</div><button class="small danger" onclick="removeQuestion('${q.id}')">삭제</button></div><label class="section-space">${i+1}. 문제<textarea onchange="qf('${q.id}','text',this.value)">${esc(q.text)}</textarea></label><div class="form-grid"><label>개념 태그 (반복 오답 집계)<input value="${esc(q.topic)}" onchange="qf('${q.id}','topic',this.value)"></label><label>문항 유형<select onchange="qf('${q.id}','kind',this.value)">${['연습','보충','복습','미니시험'].map(x=>`<option ${q.kind===x?'selected':''}>${x}</option>`).join('')}</select></label><label>채점 결과 (수정 가능)<select onchange="qf('${q.id}','result',this.value);editor()">${['미채점','정답','오답'].map(x=>`<option ${q.result===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label class="section-space">제출 답안<input style="width:100%" value="${esc(q.submitted)}" onchange="qf('${q.id}','submitted',this.value)" placeholder="답안을 입력하세요"></label><details><summary>기준 답안 · 해설 보기 / 편집</summary><label>기준 답안<input value="${esc(q.answer)}" onchange="qf('${q.id}','answer',this.value)"></label><label>해설<textarea onchange="qf('${q.id}','explanation',this.value)">${esc(q.explanation)}</textarea></label></details><label>오답 원인 · 개선 방법<textarea onchange="qf('${q.id}','cause',this.value)" placeholder="공식 기억 / 단위 변환 / 개념 혼동 / 계산 실수 등">${esc(q.cause)}</textarea></label>${q.result==='오답'?`<label><input type="checkbox" style="width:auto" ${q.reviewDone?'checked':''} onchange="qf('${q.id}','reviewDone',this.checked)"> 보충·복습 완료</label><button class="small" onclick="addSupplement('${q.id}')">이 개념 보충문제 추가</button>`:''}</div>`}
function qf(id,k,v){const q=session().questions.find(q=>q.id===id);q[k]=v;if(k==='submitted'||k==='answer'){q.result='미채점';q.reviewDone=false}persist()}
function normalize(v){return String(v).toLowerCase().replace(/제벡/g,'제베크').replace(/효과/g,'').replace(/[\s,]/g,'').replace(/[₀₁₂₃₄₅₆₇₈₉]/g,c=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(c));}
function grade(){const s=session();let n=0;for(const q of s.questions){if(!q.submitted.trim()||!q.answer.trim()){q.result='미채점';continue}q.result=normalize(q.submitted)===normalize(q.answer)?'정답':'오답';n++}if(n&&s.status==='예정'){s.status='진행 중';s.date=s.date||today()}persist();editor();toast(`${n}문항 채점 완료. 결과와 오답 원인을 확인하세요.`)}
function blankQuestion(kind='연습',topic=''){return{id:uid(),text:'',topic,kind,answer:'',submitted:'',result:'미채점',cause:'',explanation:'',reviewDone:false}}
function addQuestion(){session().questions.push(blankQuestion());persist();editor()}
function addSupplement(id){let q=session().questions.find(q=>q.id===id);session().questions.push(blankQuestion('보충',q.topic));persist();editor();toast('같은 개념의 보충 문항을 추가했습니다.')}
function removeQuestion(id){if(!confirm('이 문항과 채점 기록을 삭제할까요?'))return;session().questions=session().questions.filter(q=>q.id!==id);persist();editor()}
function reviews(){const rs=allReviews(),freq={};for(const s of state.sessions)for(const q of s.questions)if(q.result==='오답'){const k=q.topic||'미분류';freq[k]=(freq[k]||0)+1}app.innerHTML=head('REVIEW & RETENTION','틀린 이유를, 다음 정답으로.','반복 오답은 같은 개념 태그에서 오답이 2회 이상 발생한 경우입니다.',`<button class="primary" onclick="addReview()">+ 복습 등록</button>`)+`<div class="grid cols"><section class="card"><h2>미완료 복습 <span class="muted">${rs.filter(r=>!r.done).length}항목</span></h2>${reviewRows(rs.filter(r=>!r.done))}</section><section class="card"><h2>반복 오답 개념</h2>${Object.entries(freq).filter(([k,n])=>n>=2).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="subject row"><b>${esc(k)}</b>${tag(n+'회 오답','warn')}</div>`).join('')||'<div class="empty">새 기록에서 확인된 반복 오답이 없습니다.</div>'}<div class="note">이전 노션 원문에만 있는 오답은 자동으로 문항화하지 않았습니다. 아래 근거를 확인해 복습으로 등록할 수 있습니다.</div></section></div><section class="card section-space"><h2>완료한 복습</h2>${reviewRows(rs.filter(r=>r.done))}</section><section class="card section-space"><h2>이전 기록 복원</h2><p class="muted">공개에 동의한 1일차~7일차 2회차 학습 이력을 기본 제공합니다. 이후 이 화면에서 입력한 기록은 해당 브라우저에만 저장되며 자동으로 공개되지 않습니다.</p></section>`}
function addReview(sid){const title=prompt('복습할 내용을 입력하세요.');if(!title?.trim())return;const priority=prompt('우선순위: 높음 / 보통 / 낮음','높음');const due=prompt('복습 예정일 (YYYY-MM-DD, 비우면 미지정)','')||'';if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due)){toast('날짜 형식을 확인해주세요.');return}state.reviews.push({id:uid(),title:title.trim(),topic:'직접 등록',priority:['높음','보통','낮음'].includes(priority)?priority:'보통',done:false,due,note:sid?`${session().day}일차 ${session().round}회차에서 등록`:''});persist();render()}
function makeSummary(s){const us=s.unitIds.map(unit).filter(Boolean);const qs=s.questions,c=qs.filter(q=>q.result==='정답').length,t=qs.filter(q=>q.result!=='미채점').length;return [`전기기능사 필기 ${s.day}일차 ${s.round}회차`, `학습일: ${s.date||'미기록'}`,`주제: ${s.title}`,`상태: ${s.status}`,`목표: ${goalLabel()} (공식 시험일 ${state.settings.examDate||'미확정'})`,'','교재 및 진도',...us.map(u=>`${u.subject} / ${u.chapter} / ${u.section} ${u.title}\n개념: ${rangeLabel(u)} / 필수문제: ${u.problem?u.problem+'쪽부터':'미확인'}\n교재 진도: 개념 ${u.concept}, 필수문제 ${u.practice}`),'','개념 학습',s.concept||'미기록','','계산 예제',s.examples||'미기록','','채점 결과',s.counts?`노션 확인 성적 (${s.counts.kind}): ${s.counts.correct}/${s.counts.total}`:'',`이 앱에 기록한 채점: ${c}/${t} (${countLabel(c,t)}) · 미채점 ${qs.length-t}개`,'',...qs.map((q,i)=>`${i+1}. [${q.kind}] ${q.text}\n개념: ${q.topic||'미분류'}\n제출: ${q.submitted||'미제출'} / 기준 답안: ${q.answer||'미확인'} / 결과: ${q.result}\n해설: ${q.explanation||'미기록'}\n오답 원인: ${q.cause||'미기록'}\n복습: ${q.reviewDone?'완료':'미완료 또는 해당 없음'}`),'','미완료 복습',...allReviews().filter(r=>!r.done).map(r=>`[${r.priority}] ${r.title}${r.due?' / '+r.due:''}`),'','메모 및 다음 학습',s.notes||'미기록','',s.source?`원문: ${s.source}`:'','확인되지 않은 범위는 미확인으로 유지합니다.'].filter(x=>x!==null).join('\n')}

function mergeHistory(existing,incoming){
 const out=structuredClone(existing),key=s=>s.isMock?'mock:'+s.id:`${s.day}:${s.round}`;
 let added=0,updated=0;
 for(const incomingSession of incoming.sessions){
  const i=out.sessions.findIndex(s=>key(s)===key(incomingSession));
  if(i<0){out.sessions.push(structuredClone(incomingSession));added++;continue}
  const prior=out.sessions[i];
  if(incomingSession.historyImportVersion&&prior.historyImportVersion===incomingSession.historyImportVersion)continue;
  const record=structuredClone(incomingSession);
  const meaningful=(prior.questions||[]).filter(q=>String(q.submitted||'').trim()||q.result!=='미채점'||String(q.cause||'').trim());
  const incomingIds=new Set(record.questions.map(q=>q.id));
  for(const q of meaningful)if(!incomingIds.has(q.id))record.questions.push(structuredClone(q));
  const template=!prior.source&&!prior.date&&prior.status==='예정'&&meaningful.length===0;
  if(!template){record.preservedLocal=structuredClone(prior);record.notes+='\n\n가져오기 전 기록은 아래 보존 기록에서 확인할 수 있습니다. 기존 제출 답안은 문항 목록에 유지했습니다.';}
  record.id=prior.id;out.sessions[i]=record;updated++;
 }
 for(const u of incoming.units){const i=out.units.findIndex(v=>v.id===u.id);if(i<0)out.units.push(structuredClone(u));else{const prev=out.units[i];out.units[i]={...u,concept:prev.concept==='완료'?'완료':u.concept,practice:prev.practice==='완료'?'완료':u.practice};}}
 for(const r of incoming.reviews){const prev=out.reviews.find(x=>x.id===r.id);if(!prev)out.reviews.push(structuredClone(r));}
 out.settings={...out.settings,...incoming.settings,examDate:out.settings.examDate||incoming.settings.examDate||''};
 out.sourceChecked=incoming.sourceChecked;out.notionRoot=incoming.notionRoot||out.notionRoot;out.historyImport=incoming.historyImport||out.historyImport;
 return {state:out,added,updated};
}
async function restore(file){if(!file)return;try{const s=JSON.parse(await file.text());if(s.schema!==1||!Array.isArray(s.units)||!Array.isArray(s.sessions)||!Array.isArray(s.reviews)||!s.settings||s.sessions.some(x=>!x.id||!Array.isArray(x.questions)||!Array.isArray(x.unitIds))||s.units.some(u=>!u.id||!u.subject))throw Error('호환되는 학습 백업이 아닙니다.');const result=mergeHistory(state,s);if(!confirm(`학습 기록 ${result.added}회차 추가, ${result.updated}회차 갱신 예정입니다. 기존 제출 답안과 가져오기 전 기록은 보존합니다. 병합할까요?`))return;const rollback=JSON.stringify(state);try{localStorage.setItem('electric-study-before-import',rollback)}catch{download('study-before-import.json',rollback,'application/json')}state=result.state;await persist();render();toast(`기록 가져오기 완료: ${result.added}회차 추가, ${result.updated}회차 갱신`)}catch(e){toast(e.message)}}

설비","section":"제4절","title":"배선기호","start":465,"problem":null,"end":null,"book":2,"verified":true,"concept":"미학습","practice":"미확인","source":"교재1 PDF 4~5쪽 전체 목차 (해당 내용은 교재2)"},{"id":"u47","subject":"전기설비","chapter":"제3장 배선설비","section":"제5절","title":"수변전설비","start":478,"problem":null,"end":null,"book":2,"verified":true,"concept":"미학습","practice":"미확인","source":"교재1 PDF 4~5쪽 전체 목차 (해당 내용은 교재2)"},{"id":"u48","subject":"전기설비","chapter":"제3장 배선설비","section":"제6절","title":"전기응용 (조명과 자동제어)","start":489,"problem":null,"end":null,"book":2,"verified":true,"concept":"미학습","practice":"미확인","source":"교재1 PDF 4~5쪽 전체 목차 (해당 내용은 교재2)"}],"sessions":[{"id":"past0","day":1,"round":1,"date":"2026-10-29","title":"전류, 전압, 저항, 옴의법칙","status":"완료","unitIds":["u2"],"concept":"# ⚡ 전기기능사 1일차 — 전기의 기초\n\n- 학습일: 2026년 10월 29일\n- 학습 주제: 전압(V), 전류(A), 저항(Ω), 옴의 법칙\n- 학습 목표: 전기의 기본 개념 이해 및 옴의 법칙 계산\n\n---\n\n## 1. 전기의 기본 개념\n\n전기는 전하와 관련된 물리적 현상이다.\n\n금속 도선에서는 자유전자의 이동으로 전류가 흐를 수 있다.\n\n전기회로는 수도관에 비유하면 쉽게 이해할 수 있다.\n\n| 전기 | 수도관 비유 | 설명 |\n| --- | --- | --- |\n| 전압(V) | 수압 차이 | 전하를 이동시키는 원인 |\n| 전류(I) | 물의 흐름 | 단위 시간당 이동하는 전하량 |\n| 저항(R) | 좁은 수도관 | 전류의 흐름을 방해하는 정도 |\n\n핵심: 전압이 일정할 때 저항이 커지면 전류는 감소한다.\n\n---\n\n## 2. 전압(Voltage)\n\n### 정의\n\n전압은 두 지점 사이의 전위차이다.\n\n전하를 이동시킬 수 있는 에너지 차이를 의미한다.\n\n- 물리량 기호: V\n- 단위: 볼트(V)\n\n### 전압의 예\n\n- AA 건전지: 1.5V\n- 자동차 배터리: 일반적으로 12V 계통\n- 가정용 콘센트: 220V\n\n암기: 전압 = 전위차 = 볼트(V)\n\n---\n\n## 3. 전류(Current)\n\n### 정의\n\n전류는 단위 시간 동안 이동하는 전하량이다.\n\n- 물리량 기호: I\n- 단위: 암페어(A)\n\n### 공식\n\nI = Q / t\n\n- I: 전류(A)\n- Q: 전하량(C, 쿨롬)\n- t: 시간(s, 초)\n\n### 계산 예제\n\n5초 동안 20C의 전하가 이동했다면?\n\nI = 20 / 5\n\n정답: 4A\n\n즉, 1초당 평균 4C의 전하가 이동한 것이다.\n\n---\n\n## 4. 저항(Resistance)\n\n### 정의\n\n저항은 전류의 흐름을 방해하는 정도이다.\n\n- 물리량 기호: R\n- 단위: 옴(Ω)\n\n### 특징\n\n전압이 일정할 때:\n\n- 저항 증가 → 전류 감소\n- 저항 감소 → 전류 증가\n\n암기: 저항과 전류는 반비례 관계이다. (전압 일정 조건)\n\n---\n\n## 5. 옴의 법칙(Ohm's Law) ⭐\n\n전기기능사 시험에서 반드시 알아야 하는 기본 공식이다.\n\n### 기본 공식\n\nV = I × R\n\n| 기호 | 의미 | 단위 |\n| --- | --- | --- |\n| V | 전압 | V(볼트) |\n| I | 전류 | A(암페어) |\n| R | 저항 | Ω(옴) |\n\n### 공식 변형\n\n① 전압 계산\n\nV = I × R\n\n② 전류 계산\n\nI = V / R\n\n③ 저항 계산\n\nR = V / I\n\n※ 저항이 일정한 옴성 저항 회로에 적용한다.\n\n### 계산 예제\n\n예제 1. 전류 구하기\n\n전압 12V, 저항 4Ω\n\nI = 12 / 4 = 3A\n\n정답: 3A\n\n예제 2. 전압 구하기\n\n전류 2A, 저항 5Ω\n\nV = 2 × 5 = 10V\n\n정답: 10V\n\n예제 3. 저항 구하기\n\n전압 24V, 전류 3A\n\nR = 24 / 3 = 8Ω\n\n정답: 8Ω\n\n---\n\n## 6. 비례와 반비례 관계 ⭐\n\n### ① 전압과 전류\n\n저항이 일정할 때 전압과 전류는 비례한다.\n\n- 전압 2배 증가 → 전류 2배 증가\n- 전압 3배 증가 → 전류 3배 증가\n\n### ② 저항과 전류\n\n전압이 일정할 때 저항과 전류는 반비례한다.\n\n- 저항 2배 증가 → 전류 1/2배\n- 저항 3배 증가 → 전류 1/3배\n- 저항 1/2배 감소 → 전류 2배\n\n### 계산 예제\n\n전압 12V로 일정한 회로\n\n| 구분 | 전압 | 저항 | 전류 |\n| --- | --- | --- | --- |\n| 변경 전 | 12V | 3Ω | 4A |\n| 변경 후 | 12V | 6Ω | 2A |\n\n결론: 저항이 2배 증가하면 전류는 절반으로 감소한다.\n\n---\n\n## 7. 시험 대비 필수 암기\n\n| 구분 | 핵심 내용 |\n| --- | --- |\n| 전압 | 전위차 |\n| 전압 단위 | V |\n| 전류 | 단위 시간당 전하량 |\n| 전류 단위 | A |\n| 저항 | 전류 흐름을 방해하는 정도 |\n| 저항 단위 | Ω |\n| 옴의 법칙 | V = IR |\n| 전류 계산 | I = V/R |\n| 저항 계산 | R = V/I |\n| 전류와 전압 | 저항 일정 시 비례 |\n| 전류와 저항 | 전압 일정 시 반비례 |\n\n### 암기 포인트\n\n1. 전압은 V, 전류는 I, 저항은 R로 표시한다.\n2. 전류의 단위는 A이다.\n3. 저항의 단위는 Ω이다.\n4. 전압은 전류와 저항의 곱이다.\n5. 전압이 일정하면 저항과 전류는 반비례한다.\n6. 저항이 일정하면 전압과 전류는 비례한다.\n\n---\n\n### ⚡ 2일차: 전력(W)과 전력량(Wh)\n\n주요 학습 내용\n\n- 전력이란 무엇인가?\n- 전력의 단위 W(와트)\n- 전력량의 단위 Wh(와트시)\n- 전력 공식 P = V × I\n- 전력량 계산\n- 전기제품 소비전력 계산\n\n다음 학습 목표: 전압과 전류를 이용하여 소비전력을 계산할 수 있다.","examples":"### 계산 예제\n\n5초 동안 20C의 전하가 이동했다면?\n\nI = 20 / 5\n\n정답: 4A\n\n즉, 1초당 평균 4C의 전하가 이동한 것이다.\n\n---\n\n### 계산 예제\n\n예제 1. 전류 구하기\n\n전압 12V, 저항 4Ω\n\nI = 12 / 4 = 3A\n\n정답: 3A\n\n예제 2. 전압 구하기\n\n전류 2A, 저항 5Ω\n\nV = 2 × 5 = 10V\n\n정답: 10V\n\n예제 3. 저항 구하기\n\n전압 24V, 전류 3A\n\nR = 24 / 3 = 8Ω\n\n정답: 8Ω\n\n---\n\n### 계산 예제\n\n전압 12V로 일정한 회로\n\n| 구분 | 전압 | 저항 | 전류 |\n| --- | --- | --- | --- |\n| 변경 전 | 12V | 3Ω | 4A |\n| 변경 후 | 12V | 6Ω | 2A |\n\n결론: 저항이 2배 증가하면 전류는 절반으로 감소한다.\n\n---","notes":"## 8. 다음 학습 예고\n\n가져오기: 노션 확인 기록 전체를 보존했습니다. 문항별 제출 답안·정답은 원문 탭에서 볼 수 있습니다. 기록에 없는 성적·완료 범위는 추정하지 않았습니다.","questions":[],"source":"","sourceText":"# ⚡ 전기기능사 1일차 — 전기의 기초\n\n- <b>학습일:</b> 2026년 10월 29일\n- <b>학습 주제:</b> 전압(V), 전류(A), 저항(Ω), 옴의 법칙\n- <b>학습 목표:</b> 전기의 기본 개념 이해 및 옴의 법칙 계산\n\n---\n\n## 1. 전기의 기본 개념\n\n전기는 전하와 관련된 물리적 현상이다.\n\n금속 도선에서는 자유전자의 이동으로 전류가 흐를 수 있다.\n\n전기회로는 수도관에 비유하면 쉽게 이해할 수 있다.\n\n| 전기 | 수도관 비유 | 설명 |\n| --- | --- | --- |\n| 전압(V) | 수압 차이 | 전하를 이동시키는 원인 |\n| 전류(I) | 물의 흐름 | 단위 시간당 이동하는 전하량 |\n| 저항(R) | 좁은 수도관 | 전류의 흐름을 방해하는 정도 |\n\n<b>핵심:</b> 전압이 일정할 때 저항이 커지면 전류는 감소한다.\n\n---\n\n## 2. 전압(Voltage)\n\n### 정의\n\n전압은 두 지점 사이의 <b>전위차</b>이다.\n\n전하를 이동시킬 수 있는 에너지 차이를 의미한다.\n\n- 물리량 기호: V\n- 단위: 볼트(V)\n\n### 전압의 예\n\n- AA 건전지: 1.5V\n- 자동차 배터리: 일반적으로 12V 계통\n- 가정용 콘센트: 220V\n\n<b>암기:</b> 전압 = 전위차 = 볼트(V)\n\n---\n\n## 3. 전류(Current)\n\n### 정의\n\n전류는 단위 시간 동안 이동하는 전하량이다.\n\n- 물리량 기호: I\n- 단위: 암페어(A)\n\n### 공식\n\n<b>I = Q / t</b>\n\n- I: 전류(A)\n- Q: 전하량(C, 쿨롬)\n- t: 시간(s, 초)\n\n### 계산 예제\n\n5초 동안 20C의 전하가 이동했다면?\n\nI = 20 / 5\n\n<b>정답: 4A</b>\n\n즉, 1초당 평균 4C의 전하가 이동한 것이다.\n\n---\n\n## 4. 저항(Resistance)\n\n### 정의\n\n저항은 전류의 흐름을 방해하는 정도이다.\n\n- 물리량 기호: R\n- 단위: 옴(Ω)\n\n### 특징\n\n전압이 일정할 때:\n\n- 저항 증가 → 전류 감소\n- 저항 감소 → 전류 증가\n\n<b>암기:</b> 저항과 전류는 반비례 관계이다. (전압 일정 조건)\n\n---\n\n## 5. 옴의 법칙(Ohm's Law) ⭐\n\n전기기능사 시험에서 반드시 알아야 하는 기본 공식이다.\n\n### 기본 공식\n\n<b>V = I × R</b>\n\n| 기호 | 의미 | 단위 |\n| --- | --- | --- |\n| V | 전압 | V(볼트) |\n| I | 전류 | A(암페어) |\n| R | 저항 | Ω(옴) |\n\n### 공식 변형\n\n① 전압 계산\n\n<b>V = I × R</b>\n\n② 전류 계산\n\n<b>I = V / R</b>\n\n③ 저항 계산\n\n<b>R = V / I</b>\n\n※ 저항이 일정한 옴성 저항 회로에 적용한다.\n\n### 계산 예제\n\n<b>예제 1. 전류 구하기</b>\n\n전압 12V, 저항 4Ω\n\nI = 12 / 4 = 3A\n\n정답: <b>3A</b>\n\n<b>예제 2. 전압 구하기</b>\n\n전류 2A, 저항 5Ω\n\nV = 2 × 5 = 10V\n\n정답: <b>10V</b>\n\n<b>예제 3. 저항 구하기</b>\n\n전압 24V, 전류 3A\n\nR = 24 / 3 = 8Ω\n\n정답: <b>8Ω</b>\n\n---\n\n## 6. 비례와 반비례 관계 ⭐\n\n### ① 전압과 전류\n\n저항이 일정할 때 전압과 전류는 비례한다.\n\n- 전압 2배 증가 → 전류 2배 증가\n- 전압 3배 증가 → 전류 3배 증가\n\n### ② 저항과 전류\n\n전압이 일정할 때 저항과 전류는 반비례한다.\n\n- 저항 2배 증가 → 전류 1/2배\n- 저항 3배 증가 → 전류 1/3배\n- 저항 1/2배 감소 → 전류 2배\n\n### 계산 예제\n\n전압 12V로 일정한 회로\n\n| 구분 | 전압 | 저항 | 전류 |\n| --- | --- | --- | --- |\n| 변경 전 | 12V | 3Ω | 4A |\n| 변경 후 | 12V | 6Ω | 2A |\n\n<b>결론:</b> 저항이 2배 증가하면 전류는 절반으로 감소한다.\n\n---\n\n## 7. 시험 대비 필수 암기\n\n| 구분 | 핵심 내용 |\n| --- | --- |\n| 전압 | 전위차 |\n| 전압 단위 | V |\n| 전류 | 단위 시간당 전하량 |\n| 전류 단위 | A |\n| 저항 | 전류 흐름을 방해하는 정도 |\n| 저항 단위 | Ω |\n| 옴의 법칙 | V = IR |\n| 전류 계산 | I = V/R |\n| 저항 계산 | R = V/I |\n| 전류와 전압 | 저항 일정 시 비례 |\n| 전류와 저항 | 전압 일정 시 반비례 |\n\n### 암기 포인트\n\n1. 전압은 V, 전류는 I, 저항은 R로 표시한다.\n2. 전류의 단위는 A이다.\n3. 저항의 단위는 Ω이다.\n4. 전압은 전류와 저항의 곱이다.\n5. 전압이 일정하면 저항과 전류는 반비례한다.\n6. 저항이 일정하면 전압과 전류는 비례한다.\n\n---\n\n## 8. 다음 학습 예고\n\n### ⚡ 2일차: 전력(W)과 전력량(Wh)\n\n<b>주요 학습 내용</b>\n\n- 전력이란 무엇인가?\n- 전력의 단위 W(와트)\n- 전력량의 단위 Wh(와트시)\n- 전력 공식 P = V × I\n- 전력량 계산\n- 전기제품 소비전력 계산\n\n<b>다음 학습 목표:</b> 전압과 전류를 이용하여 소비전력을 계산할 수 있다.\n\n<p />","counts":null,"supplement":null,"sourceChecked":"2026-11-12","historyImportVersion":"public-history-2026-11-12-v1"},{"id":"past1","day":2,"round":1,"date":"","title":"전력, 전력량, 직렬/병렬회로 합성저항","status":"완료","unitIds":["u3","u5"],"concept":"# 전기기능사 필기 2일차 학습\n\n학습 주제: 전력, 전력량, 직렬회로, 병렬회로\n\n---\n\n## 1. 핵심 이론 정리\n\n### 1.1 전력(P)\n\n\n전력은 단위 시간당 소비하거나 변환하는 전기 에너지를 의미한다.\n전기에너지를 사용하는 빠르기\n\n\n- 기호: P\n- 단위: W(와트)\n\n전력 공식 3가지\n\n① P = VI\n\n② P = I²R\n\n③ P = V²/R\n\n기호의 의미\n\n- P: 전력(W)\n- V: 전압(V)\n- I: 전류(A)\n- R: 저항(Ω)\n\n예제\n\n전압 220V, 전류 2A일 때 전력은?\n\nP = VI = 220 × 2 = 440W\n\n정답: 440W\n\n### 1.2 전력량(E)\n\n\n전력량은 일정 시간 동안 사용한 전기 에너지의 양이다.\n\n\n공식: E = Pt\n\n- E: 전력량(Wh)\n- P: 전력(W)\n- t: 시간(h)\n\n1kWh = 1,000Wh\n\n예제\n\n100W 전구를 5시간 사용하면?\n\nE = 100 × 5 = 500Wh = 0.5kWh\n\n정답: 0.5kWh\n\n### 1.3 직렬회로\n\n직렬회로는 저항을 한 줄로 연결한 회로이다.\n\n합성저항 공식:\n\nR = R₁ + R₂ + R₃ + …\n\n특징\n\n- 모든 저항에 흐르는 전류가 같다.\n- 전압은 각 저항에 나뉘어 걸린다.\n- 합성저항은 각 저항을 더한 값이다.\n\n### 1.4 병렬회로\n\n병렬회로는 전류가 여러 갈래로 나뉘어 흐르는 회로이다.\n\n저항이 2개일 때 합성저항 공식:\n\nR = (R₁ × R₂) / (R₁ + R₂)\n\n특징\n\n- 각 저항에 걸리는 전압이 같다.\n- 전체 전류는 각 가지 전류의 합이다.\n- 합성저항은 가장 작은 저항보다 작다.\n\n---\n\n## 1단원: 전력의 개념\n\n문제 1.1\n\n전력의 단위로 올바른 것은?\n\n① V\n\n② A\n\n③ W\n\n④ Ω\n\n문제 1.2\n\n전력의 공식으로 올바른 것은?\n\n① P = V/I\n\n② P = VI\n\n③ P = R/I\n\n④ P = I/R\n\n문제 1.3\n\n전압 100V, 전류 3A인 전기기구의 전력은?\n\n① 30W\n\n② 100W\n\n③ 300W\n\n④ 600W\n\n## 2단원: 전력 공식의 활용\n\n문제 2.1\n\n저항 5Ω에 전류 2A가 흐를 때 소비전력은?\n\n① 10W\n\n② 15W\n\n③ 20W\n\n④ 25W\n\n문제 2.2\n\n저항 10Ω에 전압 20V가 걸렸을 때 소비전력은?\n\n① 10W\n\n② 20W\n\n③ 40W\n\n④ 200W\n\n## 3단원: 전력량\n\n문제 3.1\n\n100W 전기기구를 4시간 사용했을 때 전력량은?\n\n① 0.04kWh\n\n② 0.1kWh\n\n③ 0.2kWh\n\n④ 0.4kWh\n\n문제 3.2\n\n1kWh는 몇 Wh인가?\n\n① 1,000Wh\n\n② 100Wh\n\n③ 10Wh\n\n④ 10,000Wh\n\n문제 3.3\n\n전력량의 계산 공식으로 올바른 것은?\n\n① E = P/t\n\n② E = Pt\n\n③ E = V/R\n\n④ E = I/R\n\n## 4단원: 직렬회로\n\n문제 4.1\n\n저항 3Ω과 5Ω을 직렬로 연결하면 합성저항은?\n\n① 2Ω\n\n② 8Ω\n\n③ 15Ω\n\n④ 1.875Ω\n\n문제 4.2\n\n직렬회로에서 모든 저항에 동일하게 흐르는 것은?\n\n① 전류\n\n② 전압\n\n③ 전력\n\n④ 저항\n\n문제 4.3\n\n저항 2Ω과 4Ω을 직렬로 연결하고 12V를 가하면 전체 전류는?\n\n① 1A\n\n② 1.5A\n\n③ 2A\n\n④ 6A\n\n## 5단원: 병렬회로\n\n문제 5.1\n\n저항 6Ω과 3Ω을 병렬로 연결했을 때 합성저항은?\n\n① 1Ω\n\n② 2Ω\n\n③ 3Ω\n\n④ 9Ω\n\n---\n\n# 3. 정답 및 해설\n\n## 문제 1.1\n\n정답: ③ W\n\n전력의 단위는 W(와트)이다.\n\n- V: 전압\n- A: 전류\n- W: 전력\n- Ω: 저항\n\n암기: 전압 V, 전류 A, 저항 Ω, 전력 W\n\n## 문제 1.2\n\n정답: ② P = VI\n\n전력은 전압과 전류를 곱하여 계산한다.\n\nP = VI\n\n예를 들어 10V에 2A가 흐르면 전력은 20W이다.\n\n## 문제 1.3\n\n정답: ③ 300W\n\n주어진 조건\n\n- 전압: 100V\n- 전류: 3A\n\n공식: P = VI\n\n계산: 100 × 3 = 300W\n\n## 문제 2.1\n\n정답: ③ 20W\n\n주어진 조건\n\n- 저항: 5Ω\n- 전류: 2A\n\n공식: P = I²R\n\n계산:\n\nP = 2² × 5\n\n= 4 × 5\n\n= 20W\n\n주의: 전류를 제곱해야 한다.\n\n## 문제 2.2\n\n정답: ③ 40W\n\n주어진 조건\n\n- 전압: 20V\n- 저항: 10Ω\n\n공식: P = V²/R\n\n계산:\n\nP = 20²/10\n\n= 400/10\n\n= 40W\n\n## 문제 3.1\n\n정답: ④ 0.4kWh\n\n주어진 조건\n\n- 전력: 100W\n- 시간: 4시간\n\n공식: E = Pt\n\n계산:\n\n100 × 4 = 400Wh\n\n400/1,000 = 0.4kWh\n\n주의: Wh를 kWh로 변환할 때는 1,000으로 나눈다.\n\n## 문제 3.2\n\n정답: ① 1,000Wh\n\n1kWh = 1,000Wh\n\nk(킬로)는 1,000배를 의미한다.\n\n## 문제 3.3\n\n정답: ② E = Pt\n\n전력량은 전력과 사용 시간을 곱하여 계산한다.\n\nE = Pt\n\n전력은 W, 전력량은 Wh로 구분한다.\n\n## 문제 4.1\n\n정답: ② 8Ω\n\n직렬회로의 합성저항은 각 저항을 더한다.\n\nR = R₁ + R₂\n\n= 3 + 5\n\n= 8Ω\n\n## 문제 4.2\n\n정답: ① 전류\n\n직렬회로에서는 모든 저항에 흐르는 전류가 같다.\n\n전압은 저항값에 따라 나뉘어 걸린다.\n\n핵심 암기:\n\n직렬 = 전류 동일\n\n병렬 = 전압 동일\n\n## 문제 4.3\n\n정답: ③ 2A\n\n주어진 조건\n\n- R₁ = 2Ω\n- R₂ = 4Ω\n- V = 12V\n\n1단계: 합성저항\n\nR = 2 + 4 = 6Ω\n\n2단계: 옴의 법칙\n\nI = V/R\n\nI = 12/6 = 2A\n\n## 문제 5.1\n\n정답: ② 2Ω\n\n주어진 조건\n\n- R₁ = 6Ω\n- R₂ = 3Ω\n\n병렬저항 공식:\n\nR = (R₁ × R₂)/(R₁ + R₂)\n\n계산:\n\nR = (6 × 3)/(6 + 3)\n\n= 18/9\n\n= 2Ω\n\n병렬회로의 합성저항은 가장 작은 저항인 3Ω보다 작으므로 계산 결과도 타당하다.\n\n---\n\n# 4. 시험 대비 필수 암기\n\n옴의 법칙\n\nV = IR\n\nI = V/R\n\nR = V/I\n\n전력\n\nP = VI\n\nP = I²R\n\nP = V²/R\n\n전력량\n\nE = Pt\n\n1kWh = 1,000Wh\n\n직렬회로\n\nR = R₁ + R₂\n\n전류가 같다.\n\n병렬회로\n\nR = (R₁ × R₂)/(R₁ + R₂)\n\n전압이 같다.","examples":"계산 예제는 개념 학습 및 노션 원문에 함께 보존했습니다.","notes":"# 2. 연습문제 (복습용 12문제)\n\n가져오기: 노션 확인 기록 전체를 보존했습니다. 문항별 제출 답안·정답은 원문 탭에서 볼 수 있습니다. 기록에 없는 성적·완료 범위는 추정하지 않았습니다.","questions":[],"source":"","sourceText":"# 전기기능사 필기 2일차 학습\n\n<b>학습 주제:</b> 전력, 전력량, 직렬회로, 병렬회로\n\n---\n\n## 1. 핵심 이론 정리\n\n### 1.1 전력(P)\n\n<h4 color=\"red\">\n전력은 단위 시간당 소비하거나 변환하는 전기 에너지를 의미한다.<br />전기에너지를 사용하는 빠르기\n</h4>\n\n- 기호: P\n- 단위: W(와트)\n\n<b>전력 공식 3가지</b>\n\n① P = VI\n\n② P = I²R\n\n③ P = V²/R\n\n기호의 의미\n\n- P: 전력(W)\n- V: 전압(V)\n- I: 전류(A)\n- R: 저항(Ω)\n\n<b>예제</b>\n\n전압 220V, 전류 2A일 때 전력은?\n\nP = VI = 220 × 2 = 440W\n\n정답: 440W\n\n### 1.2 전력량(E)\n\n<h4 color=\"red\">\n전력량은 일정 시간 동안 사용한 전기 에너지의 양이다.\n</h4>\n\n공식: E = Pt\n\n- E: 전력량(Wh)\n- P: 전력(W)\n- t: 시간(h)\n\n1kWh = 1,000Wh\n\n<b>예제</b>\n\n100W 전구를 5시간 사용하면?\n\nE = 100 × 5 = 500Wh = 0.5kWh\n\n정답: 0.5kWh\n\n### 1.3 직렬회로\n\n직렬회로는 저항을 한 줄로 연결한 회로이다.\n\n합성저항 공식:\n\nR = R₁ + R₂ + R₃ + …\n\n특징\n\n- 모든 저항에 흐르는 전류가 같다.\n- 전압은 각 저항에 나뉘어 걸린다.\n- 합성저항은 각 저항을 더한 값이다.\n\n### 1.4 병렬회로\n\n병렬회로는 전류가 여러 갈래로 나뉘어 흐르는 회로이다.\n\n저항이 2개일 때 합성저항 공식:\n\nR = (R₁ × R₂) / (R₁ + R₂)\n\n특징\n\n- 각 저항에 걸리는 전압이 같다.\n- 전체 전류는 각 가지 전류의 합이다.\n- 합성저항은 가장 작은 저항보다 작다.\n\n---\n\n# 2. 연습문제 (복습용 12문제)\n\n## 1단원: 전력의 개념\n\n<b>문제 1.1</b>\n\n전력의 단위로 올바른 것은?\n\n① V\n\n② A\n\n③ W\n\n④ Ω\n\n<b>문제 1.2</b>\n\n전력의 공식으로 올바른 것은?\n\n① P = V/I\n\n② P = VI\n\n③ P = R/I\n\n④ P = I/R\n\n<b>문제 1.3</b>\n\n전압 100V, 전류 3A인 전기기구의 전력은?\n\n① 30W\n\n② 100W\n\n③ 300W\n\n④ 600W\n\n## 2단원: 전력 공식의 활용\n\n<b>문제 2.1</b>\n\n저항 5Ω에 전류 2A가 흐를 때 소비전력은?\n\n① 10W\n\n② 15W\n\n③ 20W\n\n④ 25W\n\n<b>문제 2.2</b>\n\n저항 10Ω에 전압 20V가 걸렸을 때 소비전력은?\n\n① 10W\n\n② 20W\n\n③ 40W\n\n④ 200W\n\n## 3단원: 전력량\n\n<b>문제 3.1</b>\n\n100W 전기기구를 4시간 사용했을 때 전력량은?\n\n① 0.04kWh\n\n② 0.1kWh\n\n③ 0.2kWh\n\n④ 0.4kWh\n\n<b>문제 3.2</b>\n\n1kWh는 몇 Wh인가?\n\n① 1,000Wh\n\n② 100Wh\n\n③ 10Wh\n\n④ 10,000Wh\n\n<b>문제 3.3</b>\n\n전력량의 계산 공식으로 올바른 것은?\n\n① E = P/t\n\n② E = Pt\n\n③ E = V/R\n\n④ E = I/R\n\n## 4단원: 직렬회로\n\n<b>문제 4.1</b>\n\n저항 3Ω과 5Ω을 직렬로 연결하면 합성저항은?\n\n① 2Ω\n\n② 8Ω\n\n③ 15Ω\n\n④ 1.875Ω\n\n<b>문제 4.2</b>\n\n직렬회로에서 모든 저항에 동일하게 흐르는 것은?\n\n① 전류\n\n② 전압\n\n③ 전력\n\n④ 저항\n\n<b>문제 4.3</b>\n\n저항 2Ω과 4Ω을 직렬로 연결하고 12V를 가하면 전체 전류는?\n\n① 1A\n\n② 1.5A\n\n③ 2A\n\n④ 6A\n\n## 5단원: 병렬회로\n\n<b>문제 5.1</b>\n\n저항 6Ω과 3Ω을 병렬로 연결했을 때 합성저항은?\n\n① 1Ω\n\n② 2Ω\n\n③ 3Ω\n\n④ 9Ω\n\n---\n\n# 3. 정답 및 해설\n\n## 문제 1.1\n\n<b>정답: ③ W</b>\n\n전력의 단위는 W(와트)이다.\n\n- V: 전압\n- A: 전류\n- W: 전력\n- Ω: 저항\n\n암기: 전압 V, 전류 A, 저항 Ω, 전력 W\n\n## 문제 1.2\n\n<b>정답: ② P = VI</b>\n\n전력은 전압과 전류를 곱하여 계산한다.\n\nP = VI\n\n예를 들어 10V에 2A가 흐르면 전력은 20W이다.\n\n## 문제 1.3\n\n<b>정답: ③ 300W</b>\n\n주어진 조건\n\n- 전압: 100V\n- 전류: 3A\n\n공식: P = VI\n\n계산: 100 × 3 = 300W\n\n## 문제 2.1\n\n<b>정답: ③ 20W</b>\n\n주어진 조건\n\n- 저항: 5Ω\n- 전류: 2A\n\n공식: P = I²R\n\n계산:\n\nP = 2² × 5\n\n= 4 × 5\n\n= 20W\n\n주의: 전류를 제곱해야 한다.\n\n## 문제 2.2\n\n<b>정답: ③ 40W</b>\n\n주어진 조건\n\n- 전압: 20V\n- 저항: 10Ω\n\n공식: P = V²/R\n\n계산:\n\nP = 20²/10\n\n= 400/10\n\n= 40W\n\n## 문제 3.1\n\n<b>정답: ④ 0.4kWh</b>\n\n주어진 조건\n\n- 전력: 100W\n- 시간: 4시간\n\n공식: E = Pt\n\n계산:\n\n100 × 4 = 400Wh\n\n400/1,000 = 0.4kWh\n\n주의: Wh를 kWh로 변환할 때는 1,000으로 나눈다.\n\n## 문제 3.2\n\n<b>정답: ① 1,000Wh</b>\n\n1kWh = 1,000Wh\n\nk(킬로)는 1,000배를 의미한다.\n\n## 문제 3.3\n\n<b>정답: ② E = Pt</b>\n\n전력량은 전력과 사용 시간을 곱하여 계산한다.\n\nE = Pt\n\n전력은 W, 전력량은 Wh로 구분한다.\n\n## 문제 4.1\n\n<b>정답: ② 8Ω</b>\n\n직렬회로의 합성저항은 각 저항을 더한다.\n\nR = R₁ + R₂\n\n= 3 + 5\n\n= 8Ω\n\n## 문제 4.2\n\n<b>정답: ① 전류</b>\n\n직렬회로에서는 모든 저항에 흐르는 전류가 같다.\n\n전압은 저항값에 따라 나뉘어 걸린다.\n\n핵심 암기:\n\n직렬 = 전류 동일\n\n병렬 = 전압 동일\n\n## 문제 4.3\n\n<b>정답: ③ 2A</b>\n\n주어진 조건\n\n- R₁ = 2Ω\n- R₂ = 4Ω\n- V = 12V\n\n1단계: 합성저항\n\nR = 2 + 4 = 6Ω\n\n2단계: 옴의 법칙\n\nI = V/R\n\nI = 12/6 = 2A\n\n## 문제 5.1\n\n<b>정답: ② 2Ω</b>\n\n주어진 조건\n\n- R₁ = 6Ω\n- R₂ = 3Ω\n\n병렬저항 공식:\n\nR = (R₁ × R₂)/(R₁ + R₂)\n\n계산:\n\nR = (6 × 3)/(6 + 3)\n\n= 18/9\n\n= 2Ω\n\n병렬회로의 합성저항은 가장 작은 저항인 3Ω보다 작으므로 계산 결과도 타당하다.\n\n---\n\n# 4. 시험 대비 필수 암기\n\n<b>옴의 법칙</b>\n\nV = IR\n\nI = V/R\n\nR = V/I\n\n<b>전력</b>\n\nP = VI\n\nP = I²R\n\nP = V²/R\n\n<b>전력량</b>\n\nE = Pt\n\n1kWh = 1,000Wh\n\n<b>직렬회로</b>\n\nR = R₁ + R₂\n\n전류가 같다.\n\n<b>병렬회로</b>\n\nR = (R₁ × R₂)/(R₁ + R₂)\n\n전압이 같다.\n\n<p />","counts":null,"supplement":null,"sourceChecked":"2026-11-12","historyImportVersion":"public-history-2026-11-12-v1"},{"id":"past2","day":3,"round":1,"date":"","title":"전력, 전력량, 줄의 법칙","status":"완료","unitIds":["u5"],"concept":"# 전기기능사 필기 3일차 학습 정리\n\n학습 주제: 전력, 전력량, 줄의 법칙\n\n학습 결과: 기본문제 14/15, 보충문제 8/8\n\n최종 평가: 학습 목표 달성\n\n---\n\n## 1. 전력(P)의 개념\n\n전력이란 단위 시간당 사용하거나 전달하는 전기에너지의 양이다.\n\n- 기호: P\n- 단위: W(와트)\n- 기본 공식: P = V × I\n- 1W = 1J/s\n\n### 전력의 세 가지 공식\n\n① P = V × I\n\n② P = I² × R\n\n③ P = V² / R\n\n기호의 의미\n\n- P: 전력(W)\n- V: 전압(V)\n- I: 전류(A)\n- R: 저항(Ω)\n\n### 공식 선택 방법\n\n| 주어진 값 | 사용하는 공식 |\n| --- | --- |\n| 전압, 전류 | P = VI |\n| 전류, 저항 | P = I²R |\n| 전압, 저항 | P = V²/R |\n\n※ 위 공식은 직류회로 또는 교류의 순저항 부하에서 적용한다. 일반 교류회로의 유효전력은 역률을 고려해야 한다.\n\n### 계산 예제\n\n문제: 저항 10Ω에 전류 3A가 흐를 때 소비전력은?\n\nP = I²R\n\nP = 3² × 10\n\nP = 90W\n\n정답: 90W\n\n---\n\n## 2. 전력량(E)의 개념\n\n전력량은 일정 시간 동안 소비한 전기에너지의 총량이다.\n\n- 기호: E\n- 단위: Wh, kWh\n- 공식: E = P × t\n\n전력과 전력량의 차이\n\n| 구분 | 전력 | 전력량 |\n| --- | --- | --- |\n| 의미 | 에너지를 사용하는 속도 | 사용한 에너지의 총량 |\n| 단위 | W, kW | Wh, kWh |\n| 공식 | P = VI | E = Pt |\n\n### 단위 변환\n\n- 1kW = 1,000W\n- 1kWh = 1,000Wh\n- 1Wh = 3,600J\n- 1kWh = 3,600,000J\n\n※ 전력을 W로 나타내고 시간을 h로 계산하면 Wh가 된다. 시간을 초(s)로 계산하면 J이 된다.\n\n### 계산 예제\n\n문제: 2kW 전기히터를 하루 3시간씩 5일 동안 사용하면 전력량은?\n\n총 사용 시간 = 3 × 5 = 15시간\n\nE = P × t\n\nE = 2 × 15\n\nE = 30kWh\n\n정답: 30kWh\n\n---\n\n## 3. 줄의 법칙(Joule's Law)\n\n전류가 저항을 통과할 때 전기에너지가 열에너지로 변환되는 현상을 설명하는 법칙이다.\n\n### 기본 공식\n\nQ = I² × R × t\n\n- Q: 발생 열량(J)\n- I: 전류(A)\n- R: 저항(Ω)\n- t: 시간(s)\n\n### 핵심 특징\n\n저항과 시간이 일정한 경우 발생 열량은 전류의 제곱에 비례한다.\n\n| 전류 변화 | 발생 열량 |\n| --- | --- |\n| 2배 | 4배 |\n| 3배 | 9배 |\n| 4배 | 16배 |\n| 1/2배 | 1/4배 |\n\n### 계산 예제\n\n문제: 저항 5Ω에 전류 4A가 10초 동안 흐를 때 발생 열량은?\n\nQ = I²Rt\n\nQ = 4² × 5 × 10\n\nQ = 16 × 5 × 10\n\nQ = 800J\n\n정답: 800J\n\n### 전력과 열량의 관계\n\nQ = P × t\n\n전기에너지가 모두 열로 전환되는 경우에 적용한다.\n\n단, 시간은 초(s)로 계산한다.\n\n---\n\n## 4. 전압·전류·저항과 소비전력의 관계\n\n이번 학습에서 가장 중요한 부분이다.\n\n### 4.1 저항이 일정할 때\n\nP = V²/R\n\n소비전력은 전압의 제곱에 비례한다.\n\n| 전압 변화 | 소비전력 |\n| --- | --- |\n| 2배 | 4배 |\n| 3배 | 9배 |\n| 4배 | 16배 |\n| 1/2배 | 1/4배 |\n\n예제:\n\n저항 10Ω에 전압 10V를 가하면\n\nP = 10²/10 = 10W\n\n전압을 20V로 증가시키면\n\nP = 20²/10 = 40W\n\n전압이 2배가 되면 소비전력은 4배가 된다.\n\n### 4.2 전압이 일정할 때\n\nP = V²/R\n\n소비전력은 저항에 반비례한다.\n\n| 저항 변화 | 소비전력 |\n| --- | --- |\n| 2배 | 1/2배 |\n| 3배 | 1/3배 |\n| 1/2배 | 2배 |\n| 1/4배 | 4배 |\n\n### 4.3 전류가 일정할 때\n\nP = I²R\n\n소비전력은 저항에 비례한다.\n\n| 저항 변화 | 소비전력 |\n| --- | --- |\n| 2배 | 2배 |\n| 3배 | 3배 |\n| 1/2배 | 1/2배 |\n\n### 시험 핵심\n\n전력 변화 문제를 풀 때는 먼저 일정하게 유지되는 물리량이 무엇인지 확인해야 한다.\n\n- 저항 일정 → P = V²/R 또는 P = I²R\n- 전압 일정 → P = V²/R\n- 전류 일정 → P = I²R\n\n---\n\n## 1단계. 전력의 개념\n\n### 문제 1.1\n\n전력의 단위는 무엇인가?\n\n① V\n\n② A\n\n③ W\n\n④ Ω\n\n정답: ③ W (정답)\n\n해설: 전력의 단위는 W(와트)이다. V는 전압, A는 전류, Ω은 저항의 단위이다.\n\n### 문제 1.2\n\n전력의 기본 공식으로 옳은 것은?\n\n① P = V/I\n\n② P = VI\n\n③ P = R/I\n\n④ P = V + I\n\n정답: ② P = VI (정답)\n\n해설: 전력은 전압과 전류의 곱으로 계산한다.\n\n### 문제 1.3\n\n전압 100V, 전류 5A인 전기기기의 전력은?\n\n① 20W\n\n② 100W\n\n③ 250W\n\n④ 500W\n\n정답: ④ 500W (정답)\n\n계산:\n\nP = VI\n\nP = 100 × 5 = 500W\n\n---\n\n## 2단계. 전력 계산\n\n### 문제 2.1\n\n저항 20Ω에 전류 2A가 흐를 때 소비전력은?\n\n① 20W\n\n② 40W\n\n③ 80W\n\n④ 100W\n\n정답: ③ 80W (정답)\n\n계산:\n\nP = I²R\n\nP = 2² × 20 = 80W\n\n### 문제 2.2\n\n저항 10Ω에 100V를 가했을 때 소비전력은?\n\n① 100W\n\n② 500W\n\n③ 1,000W\n\n④ 2,000W\n\n정답: ③ 1,000W (정답)\n\n계산:\n\nP = V²/R\n\nP = 100²/10 = 1,000W\n\n### 문제 2.3\n\n저항이 일정한 상태에서 전압을 2배로 증가시키면 소비전력은 몇 배가 되는가?\n\n① 2배\n\n② 4배\n\n③ 6배\n\n④ 8배\n\n제출 답안: ④\n\n정답: ② 4배 (오답)\n\n해설:\n\nP = V²/R\n\n저항이 일정하면 소비전력은 전압의 제곱에 비례한다.\n\n2² = 4\n\n따라서 4배가 된다.\n\n※ 3일차의 유일한 오답으로, 이후 보충문제에서 해당 개념을 정확하게 적용했다.\n\n---\n\n## 3단계. 전력량 계산\n\n### 문제 3.1\n\n500W 전기기기를 2시간 사용했을 때 전력량은?\n\n① 0.5kWh\n\n② 1kWh\n\n③ 2kWh\n\n④ 5kWh\n\n정답: ② 1kWh (정답)\n\n계산:\n\n500W = 0.5kW\n\nE = 0.5 × 2 = 1kWh\n\n### 문제 3.2\n\n2kW 전기히터를 하루 3시간씩 5일 사용했을 때 전력량은?\n\n① 10kWh\n\n② 15kWh\n\n③ 20kWh\n\n④ 30kWh\n\n정답: ④ 30kWh (정답)\n\n계산:\n\n사용 시간 = 3 × 5 = 15시간\n\nE = 2 × 15 = 30kWh\n\n### 문제 3.3\n\n다음 중 전력량의 단위는?\n\n① W\n\n② V\n\n③ kWh\n\n④ A\n\n정답: ③ kWh (정답)\n\n해설: kWh는 일정 시간 동안 사용한 전기에너지의 양을 나타낸다.\n\n---\n\n## 4단계. 줄의 법칙\n\n### 문제 4.1\n\n줄의 법칙을 나타내는 공식은?\n\n① Q = IRt\n\n② Q = I²Rt\n\n③ Q = V/R\n\n④ Q = I/R\n\n정답: ② Q = I²Rt (정답)\n\n### 문제 4.2\n\n저항 10Ω에 전류 2A가 5초 동안 흐를 때 발생 열량은?\n\n① 50J\n\n② 100J\n\n③ 200J\n\n④ 400J\n\n정답: ③ 200J (정답)\n\n계산:\n\nQ = I²Rt\n\nQ = 2² × 10 × 5\n\nQ = 200J\n\n### 문제 4.3\n\n저항과 시간이 일정할 때 전류를 3배 증가시키면 발생 열량은 몇 배가 되는가?\n\n① 3배\n\n② 6배\n\n③ 9배\n\n④ 12배\n\n정답: ③ 9배 (정답)\n\n해설: 발생 열량은 전류의 제곱에 비례한다.\n\n3² = 9배\n\n---\n\n## 5단계. 실전 응용\n\n### 문제 5.1\n\n220V 전원에 연결된 1,100W 전기기기에 흐르는 전류는?\n\n① 2A\n\n② 5A\n\n③ 10A\n\n④ 20A\n\n정답: ② 5A (정답)\n\n계산:\n\nI = P/V\n\nI = 1,100/220 = 5A\n\n### 문제 5.2\n\n저항 5Ω에 전류 4A가 10초 동안 흐를 때 발생하는 열량은?\n\n① 200J\n\n② 400J\n\n③ 600J\n\n④ 800J\n\n정답: ④ 800J (정답)\n\n계산:\n\nQ = I²Rt\n\nQ = 4² × 5 × 10\n\nQ = 800J\n\n### 문제 5.3\n\n100W 전구 5개를 동시에 하루 4시간씩 10일 동안 사용했다. 전체 전력량은?\n\n① 5kWh\n\n② 10kWh\n\n③ 20kWh\n\n④ 40kWh\n\n정답: ③ 20kWh (정답)\n\n계산:\n\n전체 전력 = 100W × 5 = 500W = 0.5kW\n\n사용 시간 = 4 × 10 = 40시간\n\nE = 0.5 × 40 = 20kWh\n\n---\n\n### 보충 1\n\n저항이 일정할 때 전압을 3배 증가시키면 소비전력은?\n\n① 3배 ② 6배 ③ 9배 ④ 12배\n\n정답: ③ (정답)\n\n해설: P = V²/R이므로 3² = 9배\n\n### 보충 2\n\n저항이 일정할 때 전압을 절반으로 감소시키면 소비전력은?\n\n① 1/2배 ② 1/4배 ③ 2배 ④ 4배\n\n정답: ② (정답)\n\n해설: (1/2)² = 1/4배\n\n### 보충 3\n\n저항 20Ω에 100V를 가했을 때 소비전력은 500W이다. 전압을 200V로 증가시키면?\n\n① 500W ② 1,000W ③ 1,500W ④ 2,000W\n\n정답: ④ (정답)\n\n계산:\n\nP = 200²/20 = 2,000W\n\n### 보충 4\n\n저항과 시간이 일정할 때 전류를 4배 증가시키면 열량은?\n\n① 4배 ② 8배 ③ 12배 ④ 16배\n\n정답: ④ (정답)\n\n해설: 4² = 16배\n\n### 보충 5\n\n저항 5Ω에 전류 2A가 20초 동안 흐르면 발생 열량은?\n\n① 100J ② 200J ③ 400J ④ 800J\n\n정답: ③ (정답)\n\n계산:\n\nQ = 2² × 5 × 20 = 400J\n\n### 보충 6\n\n100V에서 소비전력이 200W인 저항에 200V를 가하면 소비전력은?\n\n① 400W ② 600W ③ 800W ④ 1,000W\n\n정답: ③ (정답)\n\n계산:\n\n200W × 2² = 800W\n\n### 보충 7\n\n전압이 일정할 때 저항을 2배 증가시키면 소비전력은?\n\n① 1/2배 ② 2배 ③ 4배 ④ 8배\n\n정답: ① (정답)\n\n해설: P = V²/R이므로 저항이 2배 증가하면 소비전력은 절반이 된다.\n\n### 보충 8 — 서술형\n\n문제:\n\nA. 저항이 일정할 때 전압을 2배 증가시킨다.\n\nB. 전압이 일정할 때 저항을 2배 증가시킨다.\n\n각각 소비전력은 어떻게 되는가? 이유도 설명하시오.\n\n제출 답안:\n\n- A: 4배\n- B: 1/2배\n- 이유: 소비전력 = 전압제곱/저항이기 때문이다.\n\n평가: 정답\n\n해설:\n\nA는 저항이 일정하므로 소비전력이 전압의 제곱에 비례한다.\n\nB는 전압이 일정하므로 소비전력이 저항에 반비례한다.\n\n---\n\n## 오답: 기본문제 2.3\n\n문제: 저항이 일정할 때 전압을 2배 증가시키면 소비전력은?\n\n- 제출 답안: 8배\n- 정답: 4배\n\n### 오답 원인\n\n전압 변화와 소비전력의 제곱 관계를 정확하게 적용하지 못했다.\n\n### 올바른 개념\n\nP = V²/R\n\n저항이 일정할 때 전압이 2배가 되면 소비전력은 2² = 4배가 된다.\n\n### 보충학습 결과\n\n- 전압 3배 → 전력 9배: 정답\n- 전압 1/2배 → 전력 1/4배: 정답\n- 전압 2배 → 전력 4배: 정답\n- 전압 일정, 저항 2배 → 전력 1/2배: 정답\n\n판정: 해당 개념을 보충문제에서 정확하게 적용함.\n\n---\n\n# 8. 시험 직전 암기 공식\n\n| 구분 | 공식 | 단위 |\n| --- | --- | --- |\n| 옴의 법칙 | V = IR | V |\n| 전류 | I = V/R | A |\n| 저항 | R = V/I | Ω |\n| 전력 ① | P = VI | W |\n| 전력 ② | P = I²R | W |\n| 전력 ③ | P = V²/R | W |\n| 전력량 | E = Pt | Wh 또는 J |\n| 줄열 | Q = I²Rt | J |\n\n※ 전력량 공식에서 시간 단위가 h이면 Wh, s이면 J이다.\n\n※ 줄열 공식의 시간은 초(s)로 계산한다.\n\n### 암기해야 할 다섯 가지\n\n1. 전력은 전압과 전류의 곱이다.\n2. 전력량은 전력과 사용 시간의 곱이다.\n3. 저항이 일정하면 전력은 전압의 제곱에 비례한다.\n4. 전압이 일정하면 전력은 저항에 반비례한다.\n5. 줄열은 전류의 제곱, 저항, 시간에 비례한다.\n\n---\n\n### 잘 이해한 내용\n\n- 전력의 개념과 단위\n- 전압·전류·저항을 이용한 전력 계산\n- 전력량 계산과 단위 변환\n- 줄의 법칙과 발생 열량\n- 전압·전류·저항의 변화에 따른 소비전력 계산\n\n### 다음 복습에서 확인할 내용\n\n- 전압이 일정할 때 저항 변화와 소비전력의 관계\n- 전류가 일정할 때 저항 변화와 소비전력의 관계\n- 직렬·병렬회로에 전력 공식을 적용하는 방법\n\n### 최종 학습 소감\n\n기본 연습문제에서 1문제를 틀렸으나 보충문제 8문제를 모두 맞혔다.\n\n특히 전압과 소비전력의 제곱 관계를 다시 학습했고, 서술형 문제에서도 공식을 활용하여 올바르게 설명했다.\n\n3일차 학습 목표를 달성했으며 다음 단계로 진행할 준비가 되었다.\n\n---\n\n## 4일차: 직렬·병렬회로 심화\n\n학습 예정 내용\n\n- 직렬회로의 합성저항\n- 병렬회로의 합성저항\n- 직렬회로의 전압 분배\n- 병렬회로의 전류 분배\n- 직렬·병렬회로의 소비전력\n- 전기기능사 계산형 응용문제\n\n학습 방향: 개념 이해 → 계산 예제 → 연습문제 → 채점 → 오답 보충 → 노션 정리","examples":"### 계산 예제\n\n문제: 저항 10Ω에 전류 3A가 흐를 때 소비전력은?\n\nP = I²R\n\nP = 3² × 10\n\nP = 90W\n\n정답: 90W\n\n---\n\n### 계산 예제\n\n문제: 2kW 전기히터를 하루 3시간씩 5일 동안 사용하면 전력량은?\n\n총 사용 시간 = 3 × 5 = 15시간\n\nE = P × t\n\nE = 2 × 15\n\nE = 30kWh\n\n정답: 30kWh\n\n---\n\n### 계산 예제\n\n문제: 저항 5Ω에 전류 4A가 10초 동안 흐를 때 발생 열량은?\n\nQ = I²Rt\n\nQ = 4² × 5 × 10\n\nQ = 16 × 5 × 10\n\nQ = 800J\n\n정답: 800J\n\n### 보충 8 — 서술형\n\n문제:\n\nA. 저항이 일정할 때 전압을 2배 증가시킨다.\n\nB. 전압이 일정할 때 저항을 2배 증가시킨다.\n\n각각 소비전력은 어떻게 되는가? 이유도 설명하시오.\n\n제출 답안:\n\n- A: 4배\n- B: 1/2배\n- 이유: 소비전력 = 전압제곱/저항이기 때문이다.\n\n평가: 정답\n\n해설:\n\nA는 저항이 일정하므로 소비전력이 전압의 제곱에 비례한다.\n\nB는 전압이 일정하므로 소비전력이 저항에 반비례한다.\n\n---","notes":"# 5. 기본 연습문제 및 정답·해설\n\n총 15문제 / 14문제 정답\n\n# 6. 보충문제 및 정답·해설\n\n총 8문제 / 8문제 정답\n\n# 7. 오답노트\n\n# 9. 3일차 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 기본문제 | 14/15 |\n| 기본 정답률 | 93.3% |\n| 보충문제 | 8/8 |\n| 보충 정답률 | 100% |\n| 오답 개념 보완 | 완료 |\n| 학습 목표 | 달성 |\n\n# 10. 다음 학습 계획\n\n가져오기: 노션 확인 기록 전체를 보존했습니다. 문항별 제출 답안·정답은 원문 탭에서 볼 수 있습니다. 기록에 없는 성적·완료 범위는 추정하지 않았습니다.","questions":[],"source":"","sourceText":"# 전기기능사 필기 3일차 학습 정리\n\n학습 주제: 전력, 전력량, 줄의 법칙\n\n학습 결과: 기본문제 14/15, 보충문제 8/8\n\n최종 평가: 학습 목표 달성\n\n---\n\n## 1. 전력(P)의 개념\n\n전력이란 단위 시간당 사용하거나 전달하는 전기에너지의 양이다.\n\n- 기호: P\n- 단위: W(와트)\n- 기본 공식: P = V × I\n- 1W = 1J/s\n\n### 전력의 세 가지 공식\n\n① P = V × I\n\n② P = I² × R\n\n③ P = V² / R\n\n기호의 의미\n\n- P: 전력(W)\n- V: 전압(V)\n- I: 전류(A)\n- R: 저항(Ω)\n\n### 공식 선택 방법\n\n| 주어진 값 | 사용하는 공식 |\n| --- | --- |\n| 전압, 전류 | P = VI |\n| 전류, 저항 | P = I²R |\n| 전압, 저항 | P = V²/R |\n\n※ 위 공식은 직류회로 또는 교류의 순저항 부하에서 적용한다. 일반 교류회로의 유효전력은 역률을 고려해야 한다.\n\n### 계산 예제\n\n문제: 저항 10Ω에 전류 3A가 흐를 때 소비전력은?\n\nP = I²R\n\nP = 3² × 10\n\nP = 90W\n\n정답: 90W\n\n---\n\n## 2. 전력량(E)의 개념\n\n전력량은 일정 시간 동안 소비한 전기에너지의 총량이다.\n\n- 기호: E\n- 단위: Wh, kWh\n- 공식: E = P × t\n\n전력과 전력량의 차이\n\n| 구분 | 전력 | 전력량 |\n| --- | --- | --- |\n| 의미 | 에너지를 사용하는 속도 | 사용한 에너지의 총량 |\n| 단위 | W, kW | Wh, kWh |\n| 공식 | P = VI | E = Pt |\n\n### 단위 변환\n\n- 1kW = 1,000W\n- 1kWh = 1,000Wh\n- 1Wh = 3,600J\n- 1kWh = 3,600,000J\n\n※ 전력을 W로 나타내고 시간을 h로 계산하면 Wh가 된다. 시간을 초(s)로 계산하면 J이 된다.\n\n### 계산 예제\n\n문제: 2kW 전기히터를 하루 3시간씩 5일 동안 사용하면 전력량은?\n\n총 사용 시간 = 3 × 5 = 15시간\n\nE = P × t\n\nE = 2 × 15\n\nE = 30kWh\n\n정답: 30kWh\n\n---\n\n## 3. 줄의 법칙(Joule's Law)\n\n전류가 저항을 통과할 때 전기에너지가 열에너지로 변환되는 현상을 설명하는 법칙이다.\n\n### 기본 공식\n\nQ = I² × R × t\n\n- Q: 발생 열량(J)\n- I: 전류(A)\n- R: 저항(Ω)\n- t: 시간(s)\n\n### 핵심 특징\n\n저항과 시간이 일정한 경우 발생 열량은 전류의 제곱에 비례한다.\n\n| 전류 변화 | 발생 열량 |\n| --- | --- |\n| 2배 | 4배 |\n| 3배 | 9배 |\n| 4배 | 16배 |\n| 1/2배 | 1/4배 |\n\n### 계산 예제\n\n문제: 저항 5Ω에 전류 4A가 10초 동안 흐를 때 발생 열량은?\n\nQ = I²Rt\n\nQ = 4² × 5 × 10\n\nQ = 16 × 5 × 10\n\nQ = 800J\n\n정답: 800J\n\n### 전력과 열량의 관계\n\nQ = P × t\n\n전기에너지가 모두 열로 전환되는 경우에 적용한다.\n\n단, 시간은 초(s)로 계산한다.\n\n---\n\n## 4. 전압·전류·저항과 소비전력의 관계\n\n이번 학습에서 가장 중요한 부분이다.\n\n### 4.1 저항이 일정할 때\n\nP = V²/R\n\n소비전력은 전압의 제곱에 비례한다.\n\n| 전압 변화 | 소비전력 |\n| --- | --- |\n| 2배 | 4배 |\n| 3배 | 9배 |\n| 4배 | 16배 |\n| 1/2배 | 1/4배 |\n\n예제:\n\n저항 10Ω에 전압 10V를 가하면\n\nP = 10²/10 = 10W\n\n전압을 20V로 증가시키면\n\nP = 20²/10 = 40W\n\n전압이 2배가 되면 소비전력은 4배가 된다.\n\n### 4.2 전압이 일정할 때\n\nP = V²/R\n\n소비전력은 저항에 반비례한다.\n\n| 저항 변화 | 소비전력 |\n| --- | --- |\n| 2배 | 1/2배 |\n| 3배 | 1/3배 |\n| 1/2배 | 2배 |\n| 1/4배 | 4배 |\n\n### 4.3 전류가 일정할 때\n\nP = I²R\n\n소비전력은 저항에 비례한다.\n\n| 저항 변화 | 소비전력 |\n| --- | --- |\n| 2배 | 2배 |\n| 3배 | 3배 |\n| 1/2배 | 1/2배 |\n\n### 시험 핵심\n\n전력 변화 문제를 풀 때는 먼저 일정하게 유지되는 물리량이 무엇인지 확인해야 한다.\n\n- 저항 일정 → P = V²/R 또는 P = I²R\n- 전압 일정 → P = V²/R\n- 전류 일정 → P = I²R\n\n---\n\n# 5. 기본 연습문제 및 정답·해설\n\n총 15문제 / 14문제 정답\n\n## 1단계. 전력의 개념\n\n### 문제 1.1\n\n전력의 단위는 무엇인가?\n\n① V\n\n② A\n\n③ W\n\n④ Ω\n\n정답: ③ W (정답)\n\n해설: 전력의 단위는 W(와트)이다. V는 전압, A는 전류, Ω은 저항의 단위이다.\n\n### 문제 1.2\n\n전력의 기본 공식으로 옳은 것은?\n\n① P = V/I\n\n② P = VI\n\n③ P = R/I\n\n④ P = V + I\n\n정답: ② P = VI (정답)\n\n해설: 전력은 전압과 전류의 곱으로 계산한다.\n\n### 문제 1.3\n\n전압 100V, 전류 5A인 전기기기의 전력은?\n\n① 20W\n\n② 100W\n\n③ 250W\n\n④ 500W\n\n정답: ④ 500W (정답)\n\n계산:\n\nP = VI\n\nP = 100 × 5 = 500W\n\n---\n\n## 2단계. 전력 계산\n\n### 문제 2.1\n\n저항 20Ω에 전류 2A가 흐를 때 소비전력은?\n\n① 20W\n\n② 40W\n\n③ 80W\n\n④ 100W\n\n정답: ③ 80W (정답)\n\n계산:\n\nP = I²R\n\nP = 2² × 20 = 80W\n\n### 문제 2.2\n\n저항 10Ω에 100V를 가했을 때 소비전력은?\n\n① 100W\n\n② 500W\n\n③ 1,000W\n\n④ 2,000W\n\n정답: ③ 1,000W (정답)\n\n계산:\n\nP = V²/R\n\nP = 100²/10 = 1,000W\n\n### 문제 2.3\n\n저항이 일정한 상태에서 전압을 2배로 증가시키면 소비전력은 몇 배가 되는가?\n\n① 2배\n\n② 4배\n\n③ 6배\n\n④ 8배\n\n제출 답안: ④\n\n정답: ② 4배 (오답)\n\n해설:\n\nP = V²/R\n\n저항이 일정하면 소비전력은 전압의 제곱에 비례한다.\n\n2² = 4\n\n따라서 4배가 된다.\n\n※ 3일차의 유일한 오답으로, 이후 보충문제에서 해당 개념을 정확하게 적용했다.\n\n---\n\n## 3단계. 전력량 계산\n\n### 문제 3.1\n\n500W 전기기기를 2시간 사용했을 때 전력량은?\n\n① 0.5kWh\n\n② 1kWh\n\n③ 2kWh\n\n④ 5kWh\n\n정답: ② 1kWh (정답)\n\n계산:\n\n500W = 0.5kW\n\nE = 0.5 × 2 = 1kWh\n\n### 문제 3.2\n\n2kW 전기히터를 하루 3시간씩 5일 사용했을 때 전력량은?\n\n① 10kWh\n\n② 15kWh\n\n③ 20kWh\n\n④ 30kWh\n\n정답: ④ 30kWh (정답)\n\n계산:\n\n사용 시간 = 3 × 5 = 15시간\n\nE = 2 × 15 = 30kWh\n\n### 문제 3.3\n\n다음 중 전력량의 단위는?\n\n① W\n\n② V\n\n③ kWh\n\n④ A\n\n정답: ③ kWh (정답)\n\n해설: kWh는 일정 시간 동안 사용한 전기에너지의 양을 나타낸다.\n\n---\n\n## 4단계. 줄의 법칙\n\n### 문제 4.1\n\n줄의 법칙을 나타내는 공식은?\n\n① Q = IRt\n\n② Q = I²Rt\n\n③ Q = V/R\n\n④ Q = I/R\n\n정답: ② Q = I²Rt (정답)\n\n### 문제 4.2\n\n저항 10Ω에 전류 2A가 5초 동안 흐를 때 발생 열량은?\n\n① 50J\n\n② 100J\n\n③ 200J\n\n④ 400J\n\n정답: ③ 200J (정답)\n\n계산:\n\nQ = I²Rt\n\nQ = 2² × 10 × 5\n\nQ = 200J\n\n### 문제 4.3\n\n저항과 시간이 일정할 때 전류를 3배 증가시키면 발생 열량은 몇 배가 되는가?\n\n① 3배\n\n② 6배\n\n③ 9배\n\n④ 12배\n\n정답: ③ 9배 (정답)\n\n해설: 발생 열량은 전류의 제곱에 비례한다.\n\n3² = 9배\n\n---\n\n## 5단계. 실전 응용\n\n### 문제 5.1\n\n220V 전원에 연결된 1,100W 전기기기에 흐르는 전류는?\n\n① 2A\n\n② 5A\n\n③ 10A\n\n④ 20A\n\n정답: ② 5A (정답)\n\n계산:\n\nI = P/V\n\nI = 1,100/220 = 5A\n\n### 문제 5.2\n\n저항 5Ω에 전류 4A가 10초 동안 흐를 때 발생하는 열량은?\n\n① 200J\n\n② 400J\n\n③ 600J\n\n④ 800J\n\n정답: ④ 800J (정답)\n\n계산:\n\nQ = I²Rt\n\nQ = 4² × 5 × 10\n\nQ = 800J\n\n### 문제 5.3\n\n100W 전구 5개를 동시에 하루 4시간씩 10일 동안 사용했다. 전체 전력량은?\n\n① 5kWh\n\n② 10kWh\n\n③ 20kWh\n\n④ 40kWh\n\n정답: ③ 20kWh (정답)\n\n계산:\n\n전체 전력 = 100W × 5 = 500W = 0.5kW\n\n사용 시간 = 4 × 10 = 40시간\n\nE = 0.5 × 40 = 20kWh\n\n---\n\n# 6. 보충문제 및 정답·해설\n\n총 8문제 / 8문제 정답\n\n### 보충 1\n\n저항이 일정할 때 전압을 3배 증가시키면 소비전력은?\n\n① 3배 ② 6배 ③ 9배 ④ 12배\n\n정답: ③ (정답)\n\n해설: P = V²/R이므로 3² = 9배\n\n### 보충 2\n\n저항이 일정할 때 전압을 절반으로 감소시키면 소비전력은?\n\n① 1/2배 ② 1/4배 ③ 2배 ④ 4배\n\n정답: ② (정답)\n\n해설: (1/2)² = 1/4배\n\n### 보충 3\n\n저항 20Ω에 100V를 가했을 때 소비전력은 500W이다. 전압을 200V로 증가시키면?\n\n① 500W ② 1,000W ③ 1,500W ④ 2,000W\n\n정답: ④ (정답)\n\n계산:\n\nP = 200²/20 = 2,000W\n\n### 보충 4\n\n저항과 시간이 일정할 때 전류를 4배 증가시키면 열량은?\n\n① 4배 ② 8배 ③ 12배 ④ 16배\n\n정답: ④ (정답)\n\n해설: 4² = 16배\n\n### 보충 5\n\n저항 5Ω에 전류 2A가 20초 동안 흐르면 발생 열량은?\n\n① 100J ② 200J ③ 400J ④ 800J\n\n정답: ③ (정답)\n\n계산:\n\nQ = 2² × 5 × 20 = 400J\n\n### 보충 6\n\n100V에서 소비전력이 200W인 저항에 200V를 가하면 소비전력은?\n\n① 400W ② 600W ③ 800W ④ 1,000W\n\n정답: ③ (정답)\n\n계산:\n\n200W × 2² = 800W\n\n### 보충 7\n\n전압이 일정할 때 저항을 2배 증가시키면 소비전력은?\n\n① 1/2배 ② 2배 ③ 4배 ④ 8배\n\n정답: ① (정답)\n\n해설: P = V²/R이므로 저항이 2배 증가하면 소비전력은 절반이 된다.\n\n### 보충 8 — 서술형\n\n문제:\n\nA. 저항이 일정할 때 전압을 2배 증가시킨다.\n\nB. 전압이 일정할 때 저항을 2배 증가시킨다.\n\n각각 소비전력은 어떻게 되는가? 이유도 설명하시오.\n\n제출 답안:\n\n- A: 4배\n- B: 1/2배\n- 이유: 소비전력 = 전압제곱/저항이기 때문이다.\n\n평가: 정답\n\n해설:\n\nA는 저항이 일정하므로 소비전력이 전압의 제곱에 비례한다.\n\nB는 전압이 일정하므로 소비전력이 저항에 반비례한다.\n\n---\n\n# 7. 오답노트\n\n## 오답: 기본문제 2.3\n\n문제: 저항이 일정할 때 전압을 2배 증가시키면 소비전력은?\n\n- 제출 답안: 8배\n- 정답: 4배\n\n### 오답 원인\n\n전압 변화와 소비전력의 제곱 관계를 정확하게 적용하지 못했다.\n\n### 올바른 개념\n\nP = V²/R\n\n저항이 일정할 때 전압이 2배가 되면 소비전력은 2² = 4배가 된다.\n\n### 보충학습 결과\n\n- 전압 3배 → 전력 9배: 정답\n- 전압 1/2배 → 전력 1/4배: 정답\n- 전압 2배 → 전력 4배: 정답\n- 전압 일정, 저항 2배 → 전력 1/2배: 정답\n\n판정: 해당 개념을 보충문제에서 정확하게 적용함.\n\n---\n\n# 8. 시험 직전 암기 공식\n\n| 구분 | 공식 | 단위 |\n| --- | --- | --- |\n| 옴의 법칙 | V = IR | V |\n| 전류 | I = V/R | A |\n| 저항 | R = V/I | Ω |\n| 전력 ① | P = VI | W |\n| 전력 ② | P = I²R | W |\n| 전력 ③ | P = V²/R | W |\n| 전력량 | E = Pt | Wh 또는 J |\n| 줄열 | Q = I²Rt | J |\n\n※ 전력량 공식에서 시간 단위가 h이면 Wh, s이면 J이다.\n\n※ 줄열 공식의 시간은 초(s)로 계산한다.\n\n### 암기해야 할 다섯 가지\n\n1. 전력은 전압과 전류의 곱이다.\n2. 전력량은 전력과 사용 시간의 곱이다.\n3. 저항이 일정하면 전력은 전압의 제곱에 비례한다.\n4. 전압이 일정하면 전력은 저항에 반비례한다.\n5. 줄열은 전류의 제곱, 저항, 시간에 비례한다.\n\n---\n\n# 9. 3일차 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 기본문제 | 14/15 |\n| 기본 정답률 | 93.3% |\n| 보충문제 | 8/8 |\n| 보충 정답률 | 100% |\n| 오답 개념 보완 | 완료 |\n| 학습 목표 | 달성 |\n\n### 잘 이해한 내용\n\n- 전력의 개념과 단위\n- 전압·전류·저항을 이용한 전력 계산\n- 전력량 계산과 단위 변환\n- 줄의 법칙과 발생 열량\n- 전압·전류·저항의 변화에 따른 소비전력 계산\n\n### 다음 복습에서 확인할 내용\n\n- 전압이 일정할 때 저항 변화와 소비전력의 관계\n- 전류가 일정할 때 저항 변화와 소비전력의 관계\n- 직렬·병렬회로에 전력 공식을 적용하는 방법\n\n### 최종 학습 소감\n\n기본 연습문제에서 1문제를 틀렸으나 보충문제 8문제를 모두 맞혔다.\n\n특히 전압과 소비전력의 제곱 관계를 다시 학습했고, 서술형 문제에서도 공식을 활용하여 올바르게 설명했다.\n\n3일차 학습 목표를 달성했으며 다음 단계로 진행할 준비가 되었다.\n\n---\n\n# 10. 다음 학습 계획\n\n## 4일차: 직렬·병렬회로 심화\n\n학습 예정 내용\n\n- 직렬회로의 합성저항\n- 병렬회로의 합성저항\n- 직렬회로의 전압 분배\n- 병렬회로의 전류 분배\n- 직렬·병렬회로의 소비전력\n- 전기기능사 계산형 응용문제\n\n학습 방향: 개념 이해 → 계산 예제 → 연습문제 → 채점 → 오답 보충 → 노션 정리","counts":{"correct":14,"total":15,"kind":"최초","label":"노션 확인 최초 성적"},"supplement":{"correct":8,"total":8},"sourceChecked":"2026-11-12","historyImportVersion":"public-history-2026-11-12-v1"},{"id":"past3","day":4,"round":1,"date":"2026-11-04","title":"직렬·병렬회로, 전압 분배, 전류 분배, 키르히호프의 법칙, 소비전력","status":"완료","unitIds":["u3","u5"],"concept":"# ⚡ 전기기능사 필기 4일차 학습 정리\n\n학습일: 2026년 11월 4일\n\n학습 주제: 직렬·병렬회로, 전압 분배, 전류 분배, 키르히호프의 법칙, 소비전력\n\n학습 결과: 기본문제 15/16, 보충문제 7/8, 최종 확인문제 2/2\n\n최종 성적: 24/26문제 정답 (92.3%)\n\n최종 평가: 학습 목표 달성\n\n---\n\n# 1. 직렬회로의 특징\n\n## 1.1 직렬회로란?\n\n직렬회로는 저항들이 하나의 경로로 연결된 회로이다.\n\n전류가 흐르는 길이 하나이므로 모든 저항에 동일한 전류가 흐른다.\n\n### 주요 특징\n\n- 모든 저항에 흐르는 전류가 같다.\n- 전체 전압은 각 저항에 분배된다.\n- 합성저항은 각 저항의 합이다.\n- 저항이 클수록 더 큰 전압이 걸린다.\n- 전류가 동일하므로 저항이 클수록 소비전력이 크다.\n\n## 1.2 합성저항\n\n공식:\n\nR = R1 + R2 + R3 + ...\n\n예제:\n\n4Ω과 8Ω을 직렬로 연결한 경우\n\nR = 4 + 8 = 12Ω\n\n정답: 12Ω\n\n## 1.3 전압 분배\n\n직렬회로에서는 저항의 크기에 비례하여 전압이 분배된다.\n\n공식:\n\n- V1 = V × R1 / (R1 + R2)\n- V2 = V × R2 / (R1 + R2)\n\n예제:\n\n- 4V 전원에 4Ω과 8Ω을 직렬로 연결하였다.\n\n① 합성저항\n\nR = 4 + 8 = 12Ω\n\n② 전체 전류\n\nI = 24 / 12 = 2A\n\n③ 4Ω에 걸리는 전압\n\nV1 = 2 × 4 = 8V\n\n④ 8Ω에 걸리는 전압\n\nV2 = 2 × 8 = 16V\n\n검산:\n\n8V + 16V = 24V\n\n### 핵심 암기\n\n직렬회로 = 전류 동일, 전압 분배\n\n---\n\n# . 병렬회로의 특징\n\n## .1 병렬회로란?\n\n병렬회로는 전류가 여러 갈래로 나뉘어 흐르는 회로이다.\n\n각 저항이 전원의 동일한 두 지점에 연결되므로 각 저항에 걸리는 전압이 같다.\n\n### 주요 특징\n\n- 모든 저항에 걸리는 전압이 같다.\n- 전체 전류는 각 가지 전류의 합이다.\n- 합성저항은 가장 작은 저항보다 작다.\n- 저항이 작을수록 더 많은 전류가 흐른다.\n- 전압이 일정하므로 저항이 작을수록 소비전력이 크다.\n\n## .2 합성저항\n\n저항 2개를 병렬 연결한 경우\n\nR = (R1 × R2) / (R1 + R2)\n\n예제:\n\n6Ω과 3Ω을 병렬로 연결하였다.\n\nR = (6 × 3) / (6 + 3)\n\nR = 18 / 9 = 2Ω\n\n정답: 2Ω\n\n## .3 전류 분배\n\n병렬회로에서는 저항이 작은 가지에 더 많은 전류가 흐른다.\n\n저항이 2개인 경우 전류 분배 공식:\n\n- I1 = I × R2 / (R1 + R2)\n- I2 = I × R1 / (R1 + R2)\n\n예제:\n\n12V 전원에 6Ω과 3Ω을 병렬 연결하였다.\n\n① 6Ω에 흐르는 전류\n\nI1 = 12 / 6 = 2A\n\n② 3Ω에 흐르는 전류\n\nI2 = 12 / 3 = 4A\n\n③ 전체 전류\n\nI = 2 + 4 = 6A\n\n### 핵심 암기\n\n병렬회로 = 전압 동일, 전류 분배\n\n---\n\n# 3. 키르히호프의 법칙\n\n## 3.1 키르히호프 제1법칙 — 전류 법칙(KCL)\n\n한 접속점으로 들어오는 전류의 합과 나가는 전류의 합은 같다.\n\n공식:\n\n유입 전류의 합 = 유출 전류의 합\n\n이 법칙은 전하 보존 법칙에 기초한다.\n\n### 계산 예제\n\n한 접속점으로 8A가 들어오고, 3A와 I가 나간다.\n\n8 = 3 + I\n\nI = 8 - 3\n\nI = 5A\n\n정답: 5A\n\n### 핵심 암기\n\n전류 법칙 = 들어오는 전류와 나가는 전류의 합이 같다.\n\n## 3.2 키르히호프 제2법칙 — 전압 법칙(KVL)\n\n폐회로를 한 바퀴 돌면서 전압의 상승과 하강을 부호까지 고려하여 합하면 0이 된다.\n\n단일 전원과 직렬 저항으로 이루어진 회로에서는 공급전압과 각 저항의 전압강하 합이 같다.\n\n공식:\n\n공급전압 = 각 저항의 전압강하 합\n\n### 계산 예제\n\n- 0V 전원에 직렬 연결된 저항 2개가 있다.\n\n한 저항에 7V가 걸린다면 나머지 저항의 전압은?\n\n- 0 = 7 + V\n\nV = 20 - 7\n\nV = 13V\n\n정답: 13V\n\n### 핵심 암기\n\n전압 법칙 = 폐회로에서 전압 상승과 하강의 대수합은 0이다.\n\n---\n\n# 4. 직렬·병렬회로 소비전력\n\n## 4.1 소비전력의 기본 공식\n\n전력의 기본 공식:\n\nP = VI\n\n옴의 법칙을 적용하면 다음과 같다.\n\n① P = VI\n\n② P = I²R\n\n③ P = V²/R\n\n- P: 소비전력(W)\n- V: 전압(V)\n- I: 전류(A)\n- R: 저항(Ω)\n\n## 4.2 직렬회로의 소비전력\n\n직렬회로는 각 저항에 흐르는 전류가 같다.\n\n따라서 다음 공식을 사용하면 편리하다.\n\nP = I²R\n\n### 계산 예제\n\n12V 전원에 2Ω과 4Ω을 직렬 연결하였다.\n\n① 합성저항\n\nR = 2 + 4 = 6Ω\n\n② 전체 전류\n\nI = 12 / 6 = 2A\n\n③ 2Ω 저항의 소비전력\n\nP1 = 2² × 2 = 8W\n\n④ 4Ω 저항의 소비전력\n\nP2 = 2² × 4 = 16W\n\n⑤ 전체 소비전력\n\nP = 8 + 16 = 24W\n\n검산:\n\nP = VI = 12 × 2 = 24W\n\n### 중요한 개념\n\n- Ω 저항의 소비전력: 8W\n- 4Ω 저항의 소비전력: 16W\n- 전체 소비전력: 24W\n\n전체 소비전력과 특정 저항의 소비전력을 구분해야 한다.\n\n## 4.3 병렬회로의 소비전력\n\n병렬회로는 각 저항에 걸리는 전압이 같다.\n\n따라서 다음 공식을 사용하면 편리하다.\n\nP = V²/R\n\n### 계산 예제\n\n12V 전원에 6Ω과 3Ω을 병렬 연결하였다.\n\n① 6Ω의 소비전력\n\nP1 = 12² / 6 = 24W\n\n② 3Ω의 소비전력\n\nP2 = 12² / 3 = 48W\n\n③ 전체 소비전력\n\nP = 24 + 48 = 72W\n\n### 중요한 개념\n\n동일한 전압에서는 소비전력이 저항에 반비례한다.\n\n저항이 작을수록 소비전력이 크다.\n\n---\n\n# 5. 직렬회로와 병렬회로 비교\n\n| 구분 | 직렬회로 | 병렬회로 |\n| --- | --- | --- |\n| 전류 | 동일 | 분배 |\n| 전압 | 분배 | 동일 |\n| 합성저항 | 각 저항의 합 | 가장 작은 저항보다 작음 |\n| 저항이 커지면 | 전압강하 증가 | 가지 전류 감소 |\n| 전력 계산에 편리한 공식 | P = I²R | P = V²/R |\n| 동일한 전류·전압 조건 | 저항이 클수록 전력 증가 | 저항이 작을수록 전력 증가 |\n\n※ 표에서 직렬회로의 저항과 전압강하 관계는 동일한 전류를 기준으로 비교한다. 병렬회로의 전류와 전력 관계는 동일한 전압을 기준으로 비교한다.\n\n---\n\n## 1단계. 직렬회로\n\n### 문제 1.1\n\n4Ω과 8Ω을 직렬 연결했을 때 합성저항은?\n\n① 2Ω ② 4Ω ③ 12Ω ④ 32Ω\n\n정답: ③\n\n계산:\n\nR = 4 + 8 = 12Ω\n\n결과: 정답\n\n### 문제 1.2\n\n- 4V 전원에 4Ω과 8Ω을 직렬 연결하면 전체 전류는?\n\n① 1A ② 2A ③ 3A ④ 6A\n\n정답: ②\n\n계산:\n\nR = 4 + 8 = 12Ω\n\nI = 24 / 12 = 2A\n\n결과: 정답\n\n### 문제 1.3\n\n위 1.2번 회로에서 8Ω 저항에 걸리는 전압은?\n\n① 4V ② 8V ③ 12V ④ 16V\n\n정답: ④\n\n계산:\n\nV = IR = 2 × 8 = 16V\n\n결과: 정답\n\n## 단계. 병렬회로\n\n### 문제 2.1\n\n6Ω과 3Ω을 병렬 연결했을 때 합성저항은?\n\n① 2Ω ② 3Ω ③ 6Ω ④ 9Ω\n\n정답: ①\n\n계산:\n\nR = (6 × 3) / (6 + 3) = 2Ω\n\n결과: 정답\n\n### 문제 2.2\n\n12V 전원에 6Ω과 3Ω을 병렬 연결했을 때 전체 전류는?\n\n① 2A ② 3A ③ 4A ④ 6A\n\n정답: ④\n\n계산:\n\n6Ω 전류 = 12/6 = 2A\n\n3Ω 전류 = 12/3 = 4A\n\n전체 전류 = 2 + 4 = 6A\n\n결과: 정답\n\n### 문제 2.3\n\n병렬회로에서 각 저항에 공통으로 걸리는 것은?\n\n① 전류 ② 전압 ③ 전력 ④ 저항\n\n정답: ② 전압\n\n해설: 병렬회로에서는 각 가지의 전압이 같다.\n\n결과: 정답\n\n## 3단계. 전압·전류 분배\n\n### 문제 3.1\n\n10Ω과 20Ω을 직렬로 연결하고 30V를 가하면 20Ω에 걸리는 전압은?\n\n① 10V ② 15V ③ 20V ④ 30V\n\n정답: ③\n\n계산:\n\nR = 10 + 20 = 30Ω\n\nI = 30/30 = 1A\n\nV = 1 × 20 = 20V\n\n결과: 정답\n\n### 문제 3.2\n\n4Ω과 12Ω을 병렬 연결하고 전체 전류가 8A일 때 4Ω에 흐르는 전류는?\n\n① 2A ② 4A ③ 6A ④ 8A\n\n정답: ③\n\n계산:\n\nI = 8 × 12 / (4 + 12)\n\nI = 96/16 = 6A\n\n결과: 정답\n\n### 문제 3.3\n\n병렬회로에서 각 저항에 걸리는 전압이 일정할 때, 한 가지의 저항이 2배가 되면 그 가지의 전류는?\n\n① 2배 ② 4배 ③ 1/2배 ④ 변화 없음\n\n정답: ③\n\n해설:\n\nI = V/R\n\n전압이 일정하면 전류는 저항에 반비례한다.\n\n결과: 정답\n\n## 4단계. 키르히호프의 법칙\n\n### 문제 4.1\n\n한 접속점으로 8A가 들어오고, 3A와 I가 나간다. I는?\n\n① 3A ② 5A ③ 8A ④ 11A\n\n정답: ②\n\n계산:\n\n8 = 3 + I\n\nI = 5A\n\n결과: 정답\n\n### 문제 4.2\n\n전원 20V의 단일 폐회로에서 한 저항에 7V가 걸린다. 나머지 한 저항의 전압은?\n\n① 7V ② 10V ③ 13V ④ 27V\n\n정답: ③\n\n계산:\n\nV = 20 - 7 = 13V\n\n결과: 정답\n\n### 문제 4.3\n\n키르히호프 제1법칙을 가장 잘 설명한 것은?\n\n① 전압의 합은 항상 0이다.\n\n② 저항은 전류에 비례한다.\n\n③ 전력은 전압의 제곱에 비례한다.\n\n④ 접속점의 유입 전류 합과 유출 전류 합은 같다.\n\n정답: ④\n\n해설: 키르히호프 제1법칙은 전류 법칙이다.\n\n결과: 정답\n\n## 5단계. 소비전력\n\n### 문제 5.1\n\n- Ω과 4Ω을 직렬 연결하고 12V를 가하면 4Ω 저항의 소비전력은?\n\n① 4W ② 8W ③ 16W ④ 24W\n\n제출 답안: ④\n\n정답: ③ 16W\n\n결과: 오답\n\n계산:\n\n합성저항 = 2 + 4 = 6Ω\n\n전체 전류 = 12/6 = 2A\n\n4Ω 소비전력 = 2² × 4 = 16W\n\n전체 소비전력은 24W이다.\n\n오답 원인: 전체 소비전력과 개별 저항의 소비전력을 혼동하였다.\n\n### 문제 5.2\n\n6Ω과 3Ω을 병렬 연결하고 12V를 가하면 전체 소비전력은?\n\n① 24W ② 36W ③ 48W ④ 72W\n\n정답: ④\n\n계산:\n\n6Ω 전력 = 12²/6 = 24W\n\n3Ω 전력 = 12²/3 = 48W\n\n전체 전력 = 24 + 48 = 72W\n\n결과: 정답\n\n### 문제 5.3\n\n저항 4Ω과 12Ω을 병렬 연결했다. 두 저항의 소비전력 비율 P(4Ω) : P(12Ω)은?\n\n① 1:3 ② 3:1 ③ 1:1 ④ 9:1\n\n정답: ②\n\n해설:\n\nP = V²/R\n\n병렬회로는 전압이 동일하므로 소비전력은 저항에 반비례한다.\n\n소비전력 비율 = 3:1\n\n결과: 정답\n\n## 서술형 추가 문제\n\n문제:\n\n12V 전원에 2Ω과 4Ω을 직렬로 연결하였다. 4Ω 저항에서 소비하는 전력을 구하고 계산 과정을 설명하시오.\n\n제출 답안:\n\n- 소비전력: 16W\n- 4Ω에 걸리는 전압: 8V\n- P = V²/R\n- P = 64/4 = 16W\n\n평가: 정답\n\n해설:\n\n합성저항 = 6Ω\n\n전류 = 12/6 = 2A\n\n4Ω에 걸리는 전압 = 2 × 4 = 8V\n\n소비전력 = 8²/4 = 16W\n\n---\n\n### 보충 1\n\n12V 전원에 3Ω과 9Ω을 직렬 연결했다. 3Ω에 걸리는 전압은?\n\n① 2V ② 3V ③ 6V ④ 9V\n\n정답: ②\n\n계산:\n\nR = 3 + 9 = 12Ω\n\nI = 12/12 = 1A\n\nV = 1 × 3 = 3V\n\n결과: 정답\n\n### 보충 2\n\n- 4V 전원에 6Ω과 12Ω을 병렬 연결했다. 전체 전류는?\n\n① 2A ② 4A ③ 6A ④ 8A\n\n정답: ③\n\n계산:\n\nI = 24/6 + 24/12\n\nI = 4 + 2 = 6A\n\n결과: 정답\n\n### 보충 3\n\n6Ω과 3Ω을 병렬로 연결했을 때 합성저항은?\n\n① 1Ω ② 2Ω ③ 3Ω ④ 9Ω\n\n정답: ②\n\n계산:\n\nR = (6 × 3)/(6 + 3) = 2Ω\n\n결과: 정답\n\n### 보충 4\n\n- 0V 전원에 2Ω과 8Ω을 직렬로 연결했다. 8Ω에 걸리는 전압은?\n\n① 4V ② 8V ③ 12V ④ 16V\n\n정답: ④\n\n계산:\n\nI = 20/(2 + 8) = 2A\n\nV = 2 × 8 = 16V\n\n결과: 정답\n\n### 보충 5\n\n한 접속점으로 10A가 들어오고, 3A와 4A가 나간다. 나머지 전류는?\n\n① 2A ② 3A ③ 4A ④ 7A\n\n정답: ②\n\n계산:\n\nI = 10 - 3 - 4 = 3A\n\n결과: 정답\n\n### 보충 6\n\n12V 전원에 2Ω과 4Ω을 직렬로 연결했다. 2Ω의 소비전력은?\n\n① 4W ② 8W ③ 12W ④ 16W\n\n정답: ②\n\n계산:\n\nI = 12/(2 + 4) = 2A\n\nP = 2² × 2 = 8W\n\n결과: 정답\n\n### 보충 7\n\n다음 설명 중 옳은 것은?\n\n① 직렬회로에서는 모든 저항에 동일한 전압이 걸린다.\n\n② 병렬회로에서는 모든 저항에 동일한 전류가 흐른다.\n\n③ 직렬회로에서는 같은 전류가 흐를 때 저항이 클수록 소비전력이 커진다.\n\n④ 병렬회로에서는 같은 전압이 걸릴 때 저항이 클수록 소비전력이 커진다.\n\n정답: ③\n\n해설:\n\n직렬회로는 전류가 같으므로 P = I²R에 따라 저항이 클수록 소비전력이 크다.\n\n결과: 정답\n\n### 보충 8 — 서술형\n\n12V 전원에 2Ω과 4Ω을 연결한다.\n\n- A회로: 직렬 연결\n- B회로: 병렬 연결\n\nA. 직렬회로의 전체 소비전력은?\n\n제출 답안: 24W\n\n정답: 24W\n\n계산:\n\nR = 2 + 4 = 6Ω\n\nP = 12²/6 = 24W\n\n결과: 정답\n\nB. 병렬회로의 전체 소비전력은?\n\n제출 답안: 105W\n\n정답: 108W\n\n계산:\n\n- Ω 전력 = 12²/2 = 72W\n\n4Ω 전력 = 12²/4 = 36W\n\n전체 전력 = 72 + 36 = 108W\n\n결과: 오답\n\nC. 어느 회로의 소비전력이 큰가?\n\n제출 답안: B회로\n\n정답: B회로\n\n결과: 정답\n\nD. 두 회로의 소비전력이 다른 이유는?\n\n제출 답안:\n\nA회로는 각 저항에 흐르는 전류가 동일하고, B회로는 각 저항에 걸리는 전압이 동일하기 때문이다.\n\n평가: 정답\n\n보충 설명:\n\n동일한 전압에서 합성저항이 작을수록 전체 소비전력이 커진다.\n\nA회로 합성저항 = 6Ω\n\nB회로 합성저항 = 4/3Ω\n\n따라서 B회로의 소비전력이 더 크다.\n\n※ 보충 8번은 A~D를 묶어 한 문제로 채점하였다.\n\n---\n\n# 8. 최종 확인문제\n\n총 2문제 / 2문제 정답\n\n### 확인 1\n\n12V 전원에 3Ω과 6Ω을 병렬 연결했다. 전체 소비전력은?\n\n① 24W ② 48W ③ 72W ④ 96W\n\n제출 답안: ③\n\n정답: ③ 72W\n\n계산:\n\n합성저항 = (3 × 6)/(3 + 6) = 2Ω\n\nP = 12²/2 = 72W\n\n결과: 정답\n\n### 확인 2\n\n12V 전원에 3Ω과 6Ω을 직렬 연결했다. 전체 소비전력은?\n\n① 8W ② 12W ③ 16W ④ 24W\n\n제출 답안: ③\n\n정답: ③ 16W\n\n계산:\n\n합성저항 = 3 + 6 = 9Ω\n\nP = 12²/9 = 16W\n\n결과: 정답\n\n---\n\n## 오답 1. 기본문제 5.1\n\n문제:\n\n- Ω과 4Ω을 직렬 연결하고 12V를 가할 때 4Ω의 소비전력은?\n- 제출 답안: 24W\n- 정답: 16W\n\n### 오답 원인\n\n전체 소비전력과 특정 저항의 소비전력을 혼동하였다.\n\n### 올바른 개념\n\n전체 전류 = 12/(2 + 4) = 2A\n\n- Ω 소비전력 = 2² × 2 = 8W\n\n4Ω 소비전력 = 2² × 4 = 16W\n\n전체 소비전력 = 8 + 16 = 24W\n\n### 보충 결과\n\n보충 6번에서 개별 저항의 소비전력을 정확하게 계산하였다.\n\n판정: 개념 보완\n\n### 오답 원인\n\n개별 저항의 소비전력 합산 과정에서 계산 오류가 발생한 것으로 보인다.\n\n### 올바른 계산\n\nP1 = 12²/2 = 72W\n\nP2 = 12²/4 = 36W\n\n전체 소비전력 = 72 + 36 = 108W\n\n### 보충 결과\n\n최종 확인문제에서 병렬회로의 전체 소비전력을 정확하게 계산하였다.\n\n판정: 계산 정확도 보완\n\n---\n\n# 10. 시험 직전 암기 공식\n\n| 구분 | 공식 |\n| --- | --- |\n| 옴의 법칙 | V = IR |\n| 전류 | I = V/R |\n| 저항 | R = V/I |\n| 직렬 합성저항 | R = R1 + R2 |\n| 병렬 합성저항(2개) | R = R1R2/(R1+R2) |\n| 전압 분배 | V1 = V × R1/(R1+R2) |\n| 전류 분배 | I1 = I × R2/(R1+R2) |\n| 전력 | P = VI |\n| 전력 | P = I²R |\n| 전력 | P = V²/R |\n| 전체 소비전력 | P전체 = P1 + P2 + ... |\n\n### 반드시 암기할 7가지\n\n1. 직렬회로는 전류가 동일하다.\n2. 병렬회로는 전압이 동일하다.\n3. 직렬회로는 저항이 클수록 더 큰 전압이 걸린다.\n4. 병렬회로는 저항이 작을수록 더 큰 전류가 흐른다.\n5. 키르히호프 제1법칙은 전류 법칙이다.\n6. 키르히호프 제2법칙은 전압 법칙이다.\n7. 전체 소비전력은 개별 저항의 소비전력 합과 같다.\n\n---\n\n### 잘 이해한 내용\n\n- 직렬회로와 병렬회로의 구조\n- 합성저항 계산\n- 전압 분배와 전류 분배\n- 키르히호프 제1법칙과 제2법칙\n- 소비전력 공식의 선택\n- 전체 소비전력 계산\n- 직렬·병렬회로의 전력 차이\n\n### 개선할 부분\n\n1. 전체 소비전력과 개별 저항의 소비전력 구분\n2. 여러 저항의 소비전력을 합산할 때 계산 검산\n3. 문제에서 요구하는 물리량을 정확하게 확인\n\n# 12. 5일차 학습 계획\n\n## 주제: 전기저항과 도체의 특성\n\n### 학습 예정 내용\n\n1. 저항률과 도전율\n2. 도선의 길이와 저항의 관계\n3. 도선의 단면적과 저항의 관계\n4. 저항 공식 R = ρL/A\n5. 온도 변화에 따른 저항 변화\n6. 전기기능사 필기 응용문제","examples":"### 계산 예제\n\n한 접속점으로 8A가 들어오고, 3A와 I가 나간다.\n\n8 = 3 + I\n\nI = 8 - 3\n\nI = 5A\n\n정답: 5A\n\n### 계산 예제\n\n- 0V 전원에 직렬 연결된 저항 2개가 있다.\n\n한 저항에 7V가 걸린다면 나머지 저항의 전압은?\n\n- 0 = 7 + V\n\nV = 20 - 7\n\nV = 13V\n\n정답: 13V\n\n### 계산 예제\n\n12V 전원에 2Ω과 4Ω을 직렬 연결하였다.\n\n① 합성저항\n\nR = 2 + 4 = 6Ω\n\n② 전체 전류\n\nI = 12 / 6 = 2A\n\n③ 2Ω 저항의 소비전력\n\nP1 = 2² × 2 = 8W\n\n④ 4Ω 저항의 소비전력\n\nP2 = 2² × 4 = 16W\n\n⑤ 전체 소비전력\n\nP = 8 + 16 = 24W\n\n검산:\n\nP = VI = 12 × 2 = 24W\n\n### 계산 예제\n\n12V 전원에 6Ω과 3Ω을 병렬 연결하였다.\n\n① 6Ω의 소비전력\n\nP1 = 12² / 6 = 24W\n\n② 3Ω의 소비전력\n\nP2 = 12² / 3 = 48W\n\n③ 전체 소비전력\n\nP = 24 + 48 = 72W\n\n## 서술형 추가 문제\n\n문제:\n\n12V 전원에 2Ω과 4Ω을 직렬로 연결하였다. 4Ω 저항에서 소비하는 전력을 구하고 계산 과정을 설명하시오.\n\n제출 답안:\n\n- 소비전력: 16W\n- 4Ω에 걸리는 전압: 8V\n- P = V²/R\n- P = 64/4 = 16W\n\n평가: 정답\n\n해설:\n\n합성저항 = 6Ω\n\n전류 = 12/6 = 2A\n\n4Ω에 걸리는 전압 = 2 × 4 = 8V\n\n소비전력 = 8²/4 = 16W\n\n---\n\n### 보충 8 — 서술형\n\n12V 전원에 2Ω과 4Ω을 연결한다.\n\n- A회로: 직렬 연결\n- B회로: 병렬 연결\n\nA. 직렬회로의 전체 소비전력은?\n\n제출 답안: 24W\n\n정답: 24W\n\n계산:\n\nR = 2 + 4 = 6Ω\n\nP = 12²/6 = 24W\n\n결과: 정답\n\nB. 병렬회로의 전체 소비전력은?\n\n제출 답안: 105W\n\n정답: 108W\n\n계산:\n\n- Ω 전력 = 12²/2 = 72W\n\n4Ω 전력 = 12²/4 = 36W\n\n전체 전력 = 72 + 36 = 108W\n\n결과: 오답\n\nC. 어느 회로의 소비전력이 큰가?\n\n제출 답안: B회로\n\n정답: B회로\n\n결과: 정답\n\nD. 두 회로의 소비전력이 다른 이유는?\n\n제출 답안:\n\nA회로는 각 저항에 흐르는 전류가 동일하고, B회로는 각 저항에 걸리는 전압이 동일하기 때문이다.\n\n평가: 정답\n\n보충 설명:\n\n동일한 전압에서 합성저항이 작을수록 전체 소비전력이 커진다.\n\nA회로 합성저항 = 6Ω\n\nB회로 합성저항 = 4/3Ω\n\n따라서 B회로의 소비전력이 더 크다.\n\n※ 보충 8번은 A~D를 묶어 한 문제로 채점하였다.\n\n---","notes":"# 6. 기본 연습문제 및 정답·해설\n\n총 16문제 중 15문제 정답\n\n# 7. 보충문제 및 정답·해설\n\n총 8문제 중 7문제 정답\n\n# 9. 오답노트\n\n## 오답 2. 보충문제 8-B\n\n문제:\n\n12V 전원에 2Ω과 4Ω을 병렬로 연결했을 때 전체 소비전력은?\n\n- 제출 답안: 105W\n- 정답: 108W\n\n# 11. 4일차 최종 학습 평가\n\n| 평가 항목 | 결과 |\n| --- | --- |\n| 기본 객관식 | 14/15 |\n| 기본 서술형 | 1/1 |\n| 보충문제 | 7/8 |\n| 최종 확인문제 | 2/2 |\n| 전체 정답 | 24/26 |\n| 정답률 | 92.3% |\n| 학습 목표 | 달성 |\n\n### 최종 평가\n\n4일차 기본문제와 보충문제에서 각각 1문제씩 오답이 발생하였다.\n\n그러나 최종 확인문제 2개를 모두 맞혀 주요 개념을 보완하였다.\n\n직렬·병렬회로의 계산 원리와 키르히호프의 법칙을 이해하고 있으며, 계산형 문제에 적용할 수 있다.\n\n최종 판정: 4일차 학습 목표 달성\n\n---\n\n### 다음 학습 목표\n\n도선의 길이, 단면적, 재료, 온도가 저항에 미치는 영향을 이해하고 계산할 수 있다.\n\n가져오기: 노션 확인 기록 전체를 보존했습니다. 문항별 제출 답안·정답은 원문 탭에서 볼 수 있습니다. 기록에 없는 성적·완료 범위는 추정하지 않았습니다.","questions":[],"source":"","sourceText":"# ⚡ 전기기능사 필기 4일차 학습 정리\n\n학습일: 2026년 11월 4일\n\n학습 주제: 직렬·병렬회로, 전압 분배, 전류 분배, 키르히호프의 법칙, 소비전력\n\n학습 결과: 기본문제 15/16, 보충문제 7/8, 최종 확인문제 2/2\n\n<b>최종 성적: 24/26문제 정답 (92.3%)</b>\n\n<b>최종 평가: 학습 목표 달성</b>\n\n---\n\n# 1. 직렬회로의 특징\n\n## 1.1 직렬회로란?\n\n직렬회로는 저항들이 하나의 경로로 연결된 회로이다.\n\n전류가 흐르는 길이 하나이므로 모든 저항에 동일한 전류가 흐른다.\n\n### 주요 특징\n\n- 모든 저항에 흐르는 전류가 같다.\n- 전체 전압은 각 저항에 분배된다.\n- 합성저항은 각 저항의 합이다.\n- 저항이 클수록 더 큰 전압이 걸린다.\n- 전류가 동일하므로 저항이 클수록 소비전력이 크다.\n\n## 1.2 합성저항\n\n공식:\n\nR = R1 + R2 + R3 + ...\n\n예제:\n\n4Ω과 8Ω을 직렬로 연결한 경우\n\nR = 4 + 8 = 12Ω\n\n정답: 12Ω\n\n## 1.3 전압 분배\n\n직렬회로에서는 저항의 크기에 비례하여 전압이 분배된다.\n\n공식:\n\n- V1 = V × R1 / (R1 + R2)\n- V2 = V × R2 / (R1 + R2)\n\n예제:\n\n- 4V 전원에 4Ω과 8Ω을 직렬로 연결하였다.\n\n① 합성저항\n\nR = 4 + 8 = 12Ω\n\n② 전체 전류\n\nI = 24 / 12 = 2A\n\n③ 4Ω에 걸리는 전압\n\nV1 = 2 × 4 = 8V\n\n④ 8Ω에 걸리는 전압\n\nV2 = 2 × 8 = 16V\n\n검산:\n\n8V + 16V = 24V\n\n### 핵심 암기\n\n<b>직렬회로 = 전류 동일, 전압 분배</b>\n\n---\n\n# . 병렬회로의 특징\n\n## .1 병렬회로란?\n\n병렬회로는 전류가 여러 갈래로 나뉘어 흐르는 회로이다.\n\n각 저항이 전원의 동일한 두 지점에 연결되므로 각 저항에 걸리는 전압이 같다.\n\n### 주요 특징\n\n- 모든 저항에 걸리는 전압이 같다.\n- 전체 전류는 각 가지 전류의 합이다.\n- 합성저항은 가장 작은 저항보다 작다.\n- 저항이 작을수록 더 많은 전류가 흐른다.\n- 전압이 일정하므로 저항이 작을수록 소비전력이 크다.\n\n## .2 합성저항\n\n저항 2개를 병렬 연결한 경우\n\nR = (R1 × R2) / (R1 + R2)\n\n예제:\n\n6Ω과 3Ω을 병렬로 연결하였다.\n\nR = (6 × 3) / (6 + 3)\n\nR = 18 / 9 = 2Ω\n\n정답: 2Ω\n\n## .3 전류 분배\n\n병렬회로에서는 저항이 작은 가지에 더 많은 전류가 흐른다.\n\n저항이 2개인 경우 전류 분배 공식:\n\n- I1 = I × R2 / (R1 + R2)\n- I2 = I × R1 / (R1 + R2)\n\n예제:\n\n12V 전원에 6Ω과 3Ω을 병렬 연결하였다.\n\n① 6Ω에 흐르는 전류\n\nI1 = 12 / 6 = 2A\n\n② 3Ω에 흐르는 전류\n\nI2 = 12 / 3 = 4A\n\n③ 전체 전류\n\nI = 2 + 4 = 6A\n\n### 핵심 암기\n\n<b>병렬회로 = 전압 동일, 전류 분배</b>\n\n---\n\n# 3. 키르히호프의 법칙\n\n## 3.1 키르히호프 제1법칙 — 전류 법칙(KCL)\n\n한 접속점으로 들어오는 전류의 합과 나가는 전류의 합은 같다.\n\n공식:\n\n유입 전류의 합 = 유출 전류의 합\n\n이 법칙은 전하 보존 법칙에 기초한다.\n\n### 계산 예제\n\n한 접속점으로 8A가 들어오고, 3A와 I가 나간다.\n\n8 = 3 + I\n\nI = 8 - 3\n\nI = 5A\n\n정답: 5A\n\n### 핵심 암기\n\n<b>전류 법칙 = 들어오는 전류와 나가는 전류의 합이 같다.</b>\n\n## 3.2 키르히호프 제2법칙 — 전압 법칙(KVL)\n\n폐회로를 한 바퀴 돌면서 전압의 상승과 하강을 부호까지 고려하여 합하면 0이 된다.\n\n단일 전원과 직렬 저항으로 이루어진 회로에서는 공급전압과 각 저항의 전압강하 합이 같다.\n\n공식:\n\n공급전압 = 각 저항의 전압강하 합\n\n### 계산 예제\n\n- 0V 전원에 직렬 연결된 저항 2개가 있다.\n\n한 저항에 7V가 걸린다면 나머지 저항의 전압은?\n\n- 0 = 7 + V\n\nV = 20 - 7\n\nV = 13V\n\n정답: 13V\n\n### 핵심 암기\n\n<b>전압 법칙 = 폐회로에서 전압 상승과 하강의 대수합은 0이다.</b>\n\n---\n\n# 4. 직렬·병렬회로 소비전력\n\n## 4.1 소비전력의 기본 공식\n\n전력의 기본 공식:\n\nP = VI\n\n옴의 법칙을 적용하면 다음과 같다.\n\n① P = VI\n\n② P = I²R\n\n③ P = V²/R\n\n- P: 소비전력(W)\n- V: 전압(V)\n- I: 전류(A)\n- R: 저항(Ω)\n\n## 4.2 직렬회로의 소비전력\n\n직렬회로는 각 저항에 흐르는 전류가 같다.\n\n따라서 다음 공식을 사용하면 편리하다.\n\nP = I²R\n\n### 계산 예제\n\n12V 전원에 2Ω과 4Ω을 직렬 연결하였다.\n\n① 합성저항\n\nR = 2 + 4 = 6Ω\n\n② 전체 전류\n\nI = 12 / 6 = 2A\n\n③ 2Ω 저항의 소비전력\n\nP1 = 2² × 2 = 8W\n\n④ 4Ω 저항의 소비전력\n\nP2 = 2² × 4 = 16W\n\n⑤ 전체 소비전력\n\nP = 8 + 16 = 24W\n\n검산:\n\nP = VI = 12 × 2 = 24W\n\n### 중요한 개념\n\n- Ω 저항의 소비전력: 8W\n- 4Ω 저항의 소비전력: 16W\n- 전체 소비전력: 24W\n\n<b>전체 소비전력과 특정 저항의 소비전력을 구분해야 한다.</b>\n\n## 4.3 병렬회로의 소비전력\n\n병렬회로는 각 저항에 걸리는 전압이 같다.\n\n따라서 다음 공식을 사용하면 편리하다.\n\nP = V²/R\n\n### 계산 예제\n\n12V 전원에 6Ω과 3Ω을 병렬 연결하였다.\n\n① 6Ω의 소비전력\n\nP1 = 12² / 6 = 24W\n\n② 3Ω의 소비전력\n\nP2 = 12² / 3 = 48W\n\n③ 전체 소비전력\n\nP = 24 + 48 = 72W\n\n### 중요한 개념\n\n동일한 전압에서는 소비전력이 저항에 반비례한다.\n\n저항이 작을수록 소비전력이 크다.\n\n---\n\n# 5. 직렬회로와 병렬회로 비교\n\n| 구분 | 직렬회로 | 병렬회로 |\n| --- | --- | --- |\n| 전류 | 동일 | 분배 |\n| 전압 | 분배 | 동일 |\n| 합성저항 | 각 저항의 합 | 가장 작은 저항보다 작음 |\n| 저항이 커지면 | 전압강하 증가 | 가지 전류 감소 |\n| 전력 계산에 편리한 공식 | P = I²R | P = V²/R |\n| 동일한 전류·전압 조건 | 저항이 클수록 전력 증가 | 저항이 작을수록 전력 증가 |\n\n※ 표에서 직렬회로의 저항과 전압강하 관계는 동일한 전류를 기준으로 비교한다. 병렬회로의 전류와 전력 관계는 동일한 전압을 기준으로 비교한다.\n\n---\n\n# 6. 기본 연습문제 및 정답·해설\n\n총 16문제 중 15문제 정답\n\n## 1단계. 직렬회로\n\n### 문제 1.1\n\n4Ω과 8Ω을 직렬 연결했을 때 합성저항은?\n\n① 2Ω ② 4Ω ③ 12Ω ④ 32Ω\n\n정답: ③\n\n계산:\n\nR = 4 + 8 = 12Ω\n\n결과: 정답\n\n### 문제 1.2\n\n- 4V 전원에 4Ω과 8Ω을 직렬 연결하면 전체 전류는?\n\n① 1A ② 2A ③ 3A ④ 6A\n\n정답: ②\n\n계산:\n\nR = 4 + 8 = 12Ω\n\nI = 24 / 12 = 2A\n\n결과: 정답\n\n### 문제 1.3\n\n위 1.2번 회로에서 8Ω 저항에 걸리는 전압은?\n\n① 4V ② 8V ③ 12V ④ 16V\n\n정답: ④\n\n계산:\n\nV = IR = 2 × 8 = 16V\n\n결과: 정답\n\n## 단계. 병렬회로\n\n### 문제 2.1\n\n6Ω과 3Ω을 병렬 연결했을 때 합성저항은?\n\n① 2Ω ② 3Ω ③ 6Ω ④ 9Ω\n\n정답: ①\n\n계산:\n\nR = (6 × 3) / (6 + 3) = 2Ω\n\n결과: 정답\n\n### 문제 2.2\n\n12V 전원에 6Ω과 3Ω을 병렬 연결했을 때 전체 전류는?\n\n① 2A ② 3A ③ 4A ④ 6A\n\n정답: ④\n\n계산:\n\n6Ω 전류 = 12/6 = 2A\n\n3Ω 전류 = 12/3 = 4A\n\n전체 전류 = 2 + 4 = 6A\n\n결과: 정답\n\n### 문제 2.3\n\n병렬회로에서 각 저항에 공통으로 걸리는 것은?\n\n① 전류 ② 전압 ③ 전력 ④ 저항\n\n정답: ② 전압\n\n해설: 병렬회로에서는 각 가지의 전압이 같다.\n\n결과: 정답\n\n## 3단계. 전압·전류 분배\n\n### 문제 3.1\n\n10Ω과 20Ω을 직렬로 연결하고 30V를 가하면 20Ω에 걸리는 전압은?\n\n① 10V ② 15V ③ 20V ④ 30V\n\n정답: ③\n\n계산:\n\nR = 10 + 20 = 30Ω\n\nI = 30/30 = 1A\n\nV = 1 × 20 = 20V\n\n결과: 정답\n\n### 문제 3.2\n\n4Ω과 12Ω을 병렬 연결하고 전체 전류가 8A일 때 4Ω에 흐르는 전류는?\n\n① 2A ② 4A ③ 6A ④ 8A\n\n정답: ③\n\n계산:\n\nI = 8 × 12 / (4 + 12)\n\nI = 96/16 = 6A\n\n결과: 정답\n\n### 문제 3.3\n\n병렬회로에서 각 저항에 걸리는 전압이 일정할 때, 한 가지의 저항이 2배가 되면 그 가지의 전류는?\n\n① 2배 ② 4배 ③ 1/2배 ④ 변화 없음\n\n정답: ③\n\n해설:\n\nI = V/R\n\n전압이 일정하면 전류는 저항에 반비례한다.\n\n결과: 정답\n\n## 4단계. 키르히호프의 법칙\n\n### 문제 4.1\n\n한 접속점으로 8A가 들어오고, 3A와 I가 나간다. I는?\n\n① 3A ② 5A ③ 8A ④ 11A\n\n정답: ②\n\n계산:\n\n8 = 3 + I\n\nI = 5A\n\n결과: 정답\n\n### 문제 4.2\n\n전원 20V의 단일 폐회로에서 한 저항에 7V가 걸린다. 나머지 한 저항의 전압은?\n\n① 7V ② 10V ③ 13V ④ 27V\n\n정답: ③\n\n계산:\n\nV = 20 - 7 = 13V\n\n결과: 정답\n\n### 문제 4.3\n\n키르히호프 제1법칙을 가장 잘 설명한 것은?\n\n① 전압의 합은 항상 0이다.\n\n② 저항은 전류에 비례한다.\n\n③ 전력은 전압의 제곱에 비례한다.\n\n④ 접속점의 유입 전류 합과 유출 전류 합은 같다.\n\n정답: ④\n\n해설: 키르히호프 제1법칙은 전류 법칙이다.\n\n결과: 정답\n\n## 5단계. 소비전력\n\n### 문제 5.1\n\n- Ω과 4Ω을 직렬 연결하고 12V를 가하면 4Ω 저항의 소비전력은?\n\n① 4W ② 8W ③ 16W ④ 24W\n\n제출 답안: ④\n\n정답: ③ 16W\n\n결과: 오답\n\n계산:\n\n합성저항 = 2 + 4 = 6Ω\n\n전체 전류 = 12/6 = 2A\n\n4Ω 소비전력 = 2² × 4 = 16W\n\n전체 소비전력은 24W이다.\n\n오답 원인: 전체 소비전력과 개별 저항의 소비전력을 혼동하였다.\n\n### 문제 5.2\n\n6Ω과 3Ω을 병렬 연결하고 12V를 가하면 전체 소비전력은?\n\n① 24W ② 36W ③ 48W ④ 72W\n\n정답: ④\n\n계산:\n\n6Ω 전력 = 12²/6 = 24W\n\n3Ω 전력 = 12²/3 = 48W\n\n전체 전력 = 24 + 48 = 72W\n\n결과: 정답\n\n### 문제 5.3\n\n저항 4Ω과 12Ω을 병렬 연결했다. 두 저항의 소비전력 비율 P(4Ω) : P(12Ω)은?\n\n① 1:3 ② 3:1 ③ 1:1 ④ 9:1\n\n정답: ②\n\n해설:\n\nP = V²/R\n\n병렬회로는 전압이 동일하므로 소비전력은 저항에 반비례한다.\n\n소비전력 비율 = 3:1\n\n결과: 정답\n\n## 서술형 추가 문제\n\n문제:\n\n12V 전원에 2Ω과 4Ω을 직렬로 연결하였다. 4Ω 저항에서 소비하는 전력을 구하고 계산 과정을 설명하시오.\n\n제출 답안:\n\n- 소비전력: 16W\n- 4Ω에 걸리는 전압: 8V\n- P = V²/R\n- P = 64/4 = 16W\n\n평가: 정답\n\n해설:\n\n합성저항 = 6Ω\n\n전류 = 12/6 = 2A\n\n4Ω에 걸리는 전압 = 2 × 4 = 8V\n\n소비전력 = 8²/4 = 16W\n\n---\n\n# 7. 보충문제 및 정답·해설\n\n총 8문제 중 7문제 정답\n\n### 보충 1\n\n12V 전원에 3Ω과 9Ω을 직렬 연결했다. 3Ω에 걸리는 전압은?\n\n① 2V ② 3V ③ 6V ④ 9V\n\n정답: ②\n\n계산:\n\nR = 3 + 9 = 12Ω\n\nI = 12/12 = 1A\n\nV = 1 × 3 = 3V\n\n결과: 정답\n\n### 보충 2\n\n- 4V 전원에 6Ω과 12Ω을 병렬 연결했다. 전체 전류는?\n\n① 2A ② 4A ③ 6A ④ 8A\n\n정답: ③\n\n계산:\
